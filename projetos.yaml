- title: 'Brasil fictício: Propriedade de terra autodeclarada excede área do país
    em um Pará'
  project_url: https://oglobo.globo.com/brasil/especial/brasil-ficticio-propriedade-de-terra-autodeclarada-excede-area-do-pais-em-um-para.ghtml?giftId=13abe6cc6435bdf&utm_source=Copiarlink&utm_medium=Social&utm_campaign=compartilharmateria
  veiculo: O GLOBO
  autoria: Eduardo Gonçalves (repórter) e Thiago Faria (editor)
  data: 4/27/2025
  resumo: "A reportagem revela que há um Brasil fictício registrado dentro do Cadastro\
    \ Ambiental Rural (CAR), um sistema oficial do governo e autodeclaratório utilizado\
    \ para mapear as propriedades rurais e monitorar o desmatamento no Brasil, principalmente\
    \ na Amazônia. \n\nEntre os achados da reportagem, estão a constatação de que\
    \ existe uma sobreposição de imóveis na ordem de 139 milhões de hectares. Isso\
    \ é equivalente ao território do estado do Pará inteiro ou quatro Alemanhas.\n\
    \nEssa sobreposição de propriedades - ou seja, uma fazenda registrada em cima\
    \ da outra - é uma das formas que os desmatadores utilizam para driblar a fiscalização\
    \ ambiental e esconder os reais proprietários e beneficiários da devastação da\
    \ floresta amazônica. \n\nAlém dos \"prédios de fazendas\", há casos em que o\
    \ tamanho do imóvel foi reduzido para excluir as áreas onde a vegetação foi derrubada,\
    \ cadastros feitos em nome de laranjas, uso de CPFs falsos e até a mudança para\
    \ dentro de rios, a quilômetros de onde o terreno verdadeiramente está. \n\nA\
    \ reportagem cita exemplos inéditos de todas essas fraudes."
  relevância: "A grande problemática que a matéria traz à tona é que o Cadastro Ambiental\
    \ Rural (CAR) foi criado pelo governo e o Congresso há mais de dez anos com o\
    \ objetivo de conter o desmatamento na Amazônia. A primeira etapa, de fazer os\
    \ fazendeiros cadastrarem as suas propriedades no sistema, foi cumprida, mas a\
    \ segunda, de verificação dos registros, ainda caminha a passos lentos - o que\
    \ abre brechas para que o Cadastro seja usado para \"esconder\" e \"apagar\" o\
    \ desmatamento. \n\nLogo após a publicação da reportagem, os problemas no CAR\
    \ passaram a ser debatidos no Supremo Tribunal Federal do Brasil. No fim de abril\
    \ de 2025, o ministro do Supremo  Flávio Dino marcou uma uma reunião com representantes\
    \ dos governadores estaduais e do governo federal para a elaborar um plano para\
    \ fazer uma \"limpa\" no CAR e debater a possibilidade de desapropriar fazendas\
    \ sancionadas por incêndio e desmatamento ilegal."
  originalidade: Já era de conhecimento público que o Cadastro Ambiental Rural possui
    diversos gargalos e sobreposições de imóveis, mas ninguém havia feito o cálculo
    a nível de Brasil com base georreferenciada - o que permitiu chegar a este dado
    que o país tem um Pará a mais de território no Cadastro. O levantamento foi feito
    depois de muita insistência por técnicos do Serviço Florestal Brasileiro (SFB),
    que depois de uma decisão do Congresso Nacional perdeu a prerrogativa de fiscalizar
    o sistema, mas continuam com acesso às informações. Outra parte dos dados são
    abertos, o que nos permitiu identificar as fazendas registradas em cima de lagos
    e rios. O Center for Climate Crime Analysis havia baixado o banco de dados do
    CAR em anos anteriores, o que os levou a detectar as mais de 9 mil edições feitas
    por proprietários para "esconder" e "apagar" áreas com alertas de desmatamento
    ou embargo do Ibama.
  metodologia: "A investigação foi feita a partir de dois levantamentos de dados -\
    \ um inédito feito por técnicos do Serviço Florestal Brasileiro (SFB) e outro\
    \ realizado por engenheiros ambientais do Center for Climate Crime Analysis (CCCA),\
    \ uma ONG especializada em rastrear crimes ambientais - ambos a pedidos da reportagem.\
    \ \n\nCom a descoberta desses números, fomos atrás de investigações da Polícia\
    \ Federal e processos na Justiça que tratavam sobre fraudes no Cadastro Ambiental\
    \ Rural (CAR). Em um dos casos, interceptações telefônicos revelaram a filha de\
    \ um fazendeiro apontado como um dos maiores devastadores da Amazônia discutindo\
    \ estratégias para \"limpar\" uma área embargada por desmatamento. A \"limpeza\"\
    \ seria feita por meio de edições no cadastro. \n\nAs fazendas citadas na reportagem,\
    \ sobretudo as que se encontram demarcadas em cima de rios e lagos, foram localizadas\
    \ por meio de mapas de georeferenciamento e dados abertos disponibilizados pelo\
    \ Sistema do CAR do Pará e do governo federal."
  uf: DF
