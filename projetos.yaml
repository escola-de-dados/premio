  ano: '2024'
- title: Quais as bancadas mais à esquerda e mais à direita na Câmara dos Deputados
  project_url: https://www1.folha.uol.com.br/poder/2024/09/quais-as-bancadas-mais-a-esquerda-e-mais-a-direita-na-camara-dos-deputados.shtml
  veiculo: Folha de S.Paulo
  autoria: Daniel Mariani, Géssica Brandino, Nicholas Pretto
  data: 9/4/2024
  resumo: 'O GPS Partidário, desenvolvido pelo DeltaFolha (núcleo de jornalismo de
    dados da Folha de S.Paulo), foi atualizado para as eleições de 2024, utilizando
    quatro métricas: migração partidária, frentes parlamentares, coligações eleitorais
    e votações na câmara. A partir disso, foi desenvolvido um material dissecando
    especificamente as frentes parlamentares. A reportagem, regada a visualizações
    com forte uso das cores do GPS Partidário (que apareceriam em toda a cobertura
    eleitoral do jornal), verificou tanto a composição das frentes parlamentares quanto
    quais congressistas estão mais à esquerda e à direita.'
  relevância: O GPS Partidário em si propõe uma alternativa numérica à difícil tarefa
    de avaliar pragmaticamente a ideologia em um congressista, avaliação que serve
    como base para diversas análises eleitorais. A reportagem específica, sobre frentes
    parlamentares, já traz uma primeira pincelada de possível uso para esse tipo de
    índice.
  originalidade: A metodologia da "versão 2024" do GPS Partidário adota variáveis
    mais facilmente aplicáveis a diversos contextos, se baseando exclusivamente em
    dados públicos no site da Câmara e do TSE - ou seja, sem depender de redes sociais
    como o Twitter, que deixou de ter uma base de dados de fácil consulta. As visualizações
    de dados da reportagem são concisas, porém funcionais, e favorecem o entendimento
    do novo sistema.
  metodologia: 'O código está diponível aqui: https://github.com/deltafolha/proximidade-partidaria-2024


    Para analisar os dados sobre migrações partidárias, frente parlamentares e coligações
    eleitorais foi aplicada a técnica de Análise de Correspondência para extrair as
    principais tendências dos partidos. O posicionamento nas votações da Câmara foi
    obtido por meio do método estatístico da Teoria de Resposta ao Item em conjunto
    com o método de Monte Carlo, técnica matemática para lidar com dados faltantes,
    como no caso de deputados ausentes em votações. Para cada medida, os partidos
    foram classificados com base em sua posição relativa. Esses rankings são então
    normalizados para uma escala de 1 a 100, onde 1 representa a posição mais à esquerda
    e 100 a posição mais à direita no espectro político. O posicionamento final de
    cada partido é determinado pela média aritmética simples dos quatro rankings normalizados.
    Os partidos são então ordenados com base nessa média e categorizados em grupos
    no espectro político.


    Fontes para a análise:

    Migração partidária: padrões de mudança de partido entre os políticos a partir
    de dados de candidatura registrados pelo TSE até 2 de setembro;

    Frentes parlamentares: participação dos partidos em diferentes frentes temáticas
    na Câmara dos Deputados neste ano a partir de dados coletados no site da Casa
    em 29 de agosto;

    Coligações eleitorais: alianças formadas entre partidos nas eleições de 2024 municipais
    com dados de candidatura registrados pelo TSE até 2 de setembro;

    Votações na Câmara: padrão das votações dos deputados de acordo com o partido
    desde 2023 até 15 de agosto.'
  uf: SP
