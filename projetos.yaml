- title: Maiores estatais federais ampliam patrocínios, e verba explode sob Lula
  project_url: https://www1.folha.uol.com.br/poder/2025/05/maiores-estatais-federais-ampliam-patrocinios-e-verba-explode-sob-lula.shtml
  veiculo: Folha de S.Paulo
  autoria: Caio Spechoto
  data: 5/24/2025
  resumo: A reportagem revela que o governo Lula fez disparar a verba destinada pelas
    principais empresas estatais federais para patrocínios culturais, esportivos e
    de eventos. O texto recorre a declarações dadas pelo presidente no passado, recortes
    específicos de dados e apurações em off para mostrar que há interferências políticas
    na concessão de patrocínios por essas companhias.
  relevância: A reportagem é relevante porque mostra os valores destinados a patrocínios
    quase triplicando e sob influência política. Parte dessas empresas têm ações listadas
    em bolsa, e todas elas têm impacto estrutural na economia nacional ou regional.
    A apuração também rendeu uma suíte, mostrando que tanto estatais quanto Sistema
    S patrocinaram eventos que promoveram o presidente da República enquanto agente
    político.
  originalidade: Havia notas dispersas na imprensa sobre o aumento da verba de publicidade
    dos Correios. A originalidade dessa reportagem foi expandir essa constatação para
    as seis maiores empresas estatais federais, de forma a mostrar que não se tratava
    de uma questão pontual dos Correios, mas de um movimento consistente e direcionado
    pelo governo federal. Esse quadro só pôde ser pintado com a combinação de sete
    fontes de dados diferentes.
  metodologia: 'Foram usadas sete fontes de dados diferentes. Primeiro, a reportagem
    tabulou os faturamentos de todas as empresas estatais em 2023 compilados em relatório
    do Ministério da Gestão e Inovação para traçar uma linha de corte que viabilizasse
    a produção da matéria. O relatório mencionado pode ser lido no link a seguir:


    https://www.gov.br/gestao/pt-br/central-de-conteudo/relatorios-das-estatais/relatorio_empresas_estatais_federais_2024.pdf


    Depois, foi constatado que seis empresas estatais federais tinham faturamento
    maior que R$ 10 bilhões, guiando a busca pelos dados de patrocínio propriamente
    ditos. As informações sobre patrocínios foram baixadas das páginas de dados abertos
    das empresas:


    Petrobras: https://transparencia.petrobras.com.br/patroc%C3%ADnio


    Banco do Brasil: https://www.bb.com.br/pbb/pagina-inicial/compras,-contratacao-e-venda-de-imoveis/compras-e-contratacoes/servicos-de-publicidade#/


    Caixa Econômica Federal: https://www.caixa.gov.br/patrocinios/Paginas/default.aspx


    BNDES: https://dadosabertos.bndes.gov.br/dataset/patrocinios/resource/6fbed3ec-0a3f-4cce-b58b-36d70810cc5a


    Correios: https://www.correios.com.br/acesso-a-informacao/receitas-e-despesas/patrocinios


    Banco do Nordeste: https://www.bnb.gov.br/acesso-a-informacao/licitacoes-e-contratos/patrocinios


    As informações foram colocadas todas em uma tabela só e analisadas a partir de
    tabelas dinâmicas para traçar o quadro geral de aumento dos patrocínios. Depois,
    houve uma análise qualitativa de patrocínio por patrocínio para buscar indícios
    de interferência política. Daí surgiu um recorte mostrando que a Caixa havia passado
    a patrocinar mais festas de São João depois de ter o presidente indicado por um
    consórcio de políticos do Nordeste, onde esse tipo de comemoração tem muito apelo
    popular. Também a constatação de que o Banco do Nordeste estava patrocinando eventos
    fora de sua área geográfica de atuação.


    Dessa análise qualitativa surgiram, além disso, informações para uma suíte mostrando
    que estatais haviam patrocinado eventos que promoveram e deram palanque para o
    presidente da República, alguns deles promovidos por entidades com notórias e
    históricas relações políticas com o PT.


    O último passo da apuração da reportagem foi buscar fontes que dessem pistas sobre
    como e onde a interferência política acontece. Foi nesta etapa que surgiu a informação
    de que o Banco do Brasil informou ao Palácio do Planalto que precisaria rejeitar
    parte dos pedidos políticos de patrocínio em 2024 para poder priorizar os patrocínios
    relacionados à Olimpíada daquele ano.'
