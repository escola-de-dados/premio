- title: 'BBB 25 em dados: Cobertura do Estadão mostra o reality como você nunca viu'
  project_url: https://www.estadao.com.br/emais/tv/bbb-25-em-dados-cobertura-do-estadao-mostra-o-reality-como-voce-nunca-viu/
  veiculo: Estado de S. Paulo
  autoria: Bruno Ponceano, Cindy Damasceno, Lucas Thaynan e Guilherme Guerreiro
  data: 4/22/2025
  resumo: 'Resumo: Ao longo de quatro meses de programa, o Estadão, com auxílio da
    Dados Insights, monitorou os principais assuntos e participantes do BBB 25 com
    ajuda de Inteligência Artificial (IA). A equipe da Dados Insights utilizou Open
    Computer Vision (OpenCV) para extrair minutagem de tela, seguidores e textos mais
    falados da edição, enquanto o núcleo visual do Estadão focou em traduzir este
    apanhado em materiais visuais interativos. O resultado é uma cobertura dinâmica
    semanal inédita, com 14 reportagens que exploram tendências, temas e personagens
    através de visualização de dados.'
  relevância: "O projeto se destaca por explorar um braço de apuração ainda pouco\
    \ trilhado: a extração, análise e visualização de dados não estruturados em larga\
    \ escala. Ao aplicar Inteligência Artificial (IA) durante o BBB 25, a cobertura\
    \ transforma o “ruído digital” que circundam as redes sociais e os programas em\
    \ informação visual. \n\nÉ um caminho concreto de que dados não estruturados —\
    \ como comentários, áudios e textos livres — podem ser traduzidos de maneira fluida,\
    \ estética e clareza editorial – sem perder o caráter descontraído da cobertura\
    \ entretenimento."
  originalidade: A série partiu da premissa de transformar semanalmente grandes volumes
    de dados não estruturados em visualizações claras, interativas e relevantes. Com
    temas “mutantes” em cada semana — desde redes de afinidade até oscilações de popularidade
    e sentimentos —, o projeto exigiu abordagens visuais distintas e adaptadas ao
    conteúdo de cada pauta. Foi necessário um trabalho de planejamento, curadoria
    e antecipação de possíveis caminhos narrativos para garantir que as visualizações
    fossem pensadas, desenvolvidas e entregues a tempo.
  metodologia: A extração e organização dos dados brutos foi conduzida pela consultoria
    Dados Insights, que desenvolveu robôs personalizados para captar informações diretamente
    dos vídeos do programa e de fontes abertas na internet. Com o uso de OpenCV, foi
    possível identificar automaticamente os participantes em cena por meio de reconhecimento
    facial e de voz, combinando análise de imagem e áudio. Esses sistemas foram executados
    diariamente, permitindo o monitoramento contínuo das interações dentro da casa.
    As bases geradas eram disponibilizadas em tempo real para a equipe de reportagem,
    viabilizando a produção de visualizações ágeis, alinhadas aos acontecimentos mais
    recentes do programa.
  uf: SP
  tipo_inscricao: Visualização
  formato: Online
  category: Visualização
  image: images/edicoes/2024/coberturabbb.jpg
  ano: '2024'
- title: Eles foram presos, cumpriram pena e encontraram no empreendedorismo a chave
    para uma nova vida
  project_url: https://www.estadao.com.br/brasil/eles-foram-presos-cumpriram-pena-e-encontraram-no-empreendedorismo-a-chave-para-uma-nova-vida/
  veiculo: Jornal O Estado de São Paulo
  autoria: Lucas Thaynan, Cindy Damasceno, Bruno Ponceano e Marcos Müller
  data: 6/8/2025
  resumo: A reportagem aborda os desafios enfrentados por egressos do sistema prisional
    brasileiro na tentativa de se reinserir na sociedade e no mercado de trabalho,
    com destaque para o empreendedorismo como caminho possível para essa reconstrução.
    De acordo com dados do SISDEPEN, apenas 8% dos detentos têm acesso a cursos profissionalizantes
    nas penitenciárias do país, o que agrava ainda mais as dificuldades no pós-cárcere.
  relevância: Em um país com altos índices de reincidência criminal, discutir alternativas
    de reintegração social é urgente. O empreendedorismo surge como uma ferramenta
    potente de transformação individual e coletiva, capaz de romper ciclos de exclusão
    e oferecer novas perspectivas a quem sai do sistema prisional.
  originalidade: A narrativa se destaca pelo uso de visualizações interativas que
    se transformam em waffle charts e gráficos de barras ao longo da leitura, ajudando
    o leitor a compreender melhor os dados apresentados. A proposta estética e narrativa
    foi inspirada em projetos do The Pudding, referência em jornalismo de dados interativo.
  metodologia: 'A reportagem foi construída a partir da base de dados do SISDEPEN,
    que reúne informações detalhadas sobre todas as unidades prisionais do Brasil,
    incluindo infraestrutura, gestão, perfil da população carcerária e oferta de atividades
    de reintegração.


    Foram filtrados dados específicos sobre o número de presos em regime fechado e
    a capacidade das unidades de oferecer cursos profissionalizantes. A partir dessas
    informações, foram desenvolvidas as visualizações que acompanham e enriquecem
    a reportagem.'
