- title: Incidentes com IAs explodiram desde 2016
  project_url: https://nucleo.jor.br/especiais/2025-03-20-incidentes-ia/
  veiculo: Núcleo Jornalismo
  autoria: Sofia Schurig, Rodolfo Almeida e Alexandre Orrico
  data: 3/20/2025
  resumo: "O Núcleo analisou uma série histórica de incidentes e falhas envolvendo\
    \ inteligência artificial no mundo em busca dos principais padrões. O repositório\
    \ aberto é da AIAAIC (sigla para AI, Algorithmic and Automation Incidents and\
    \ Controversies), uma iniciativa que monitora falhas e promove transparência em\
    \ sistemas de IA, algoritmos e automação. Essa é a primeira base de dados aberta\
    \ dedicada ao tema. \n\nA reportagem mostra que o volume de ocorrências envolvendo\
    \ inteligência artificial disparou em 10 vezes em menos de uma década desde 2016,\
    \ após a checada dos novos grandes modelos de linguagem e suas ferramentas digitais,\
    \ de acordo com dados de um monitoramento independente. OpenAI, Tesla, Google\
    \ e Meta acumulam o maior número de incidentes ligados a IA.\n\nA AIAAIC classifica\
    \ as ocorrências como problemas ou incidentes. Problemas são preocupações públicas\
    \ sobre um sistema de IA, mesmo sem evidências de danos. Eles podem envolver ética,\
    \ impacto ambiental ou governança inadequada e, se não gerenciados, levar a incidentes.\
    \ Incidentes são eventos súbitos e públicos que causam interrupção, perda ou crise,\
    \ como falhas de IA, vazamentos de dados ou conduta antiética de desenvolvedores.\
    \ A maioria dos registros da AIAAIC se enquadra nessa categoria.\n\nEm 2024, embora\
    \ os incidentes tenham recuado para 187 em relação ao ano anterior, os problemas\
    \ dispararam para 188, o maior número registrado – somando 375 ocorrências, 10\
    \ vezes mais do que em 2016.\n\nEsse aumento coincidiu com o crescimento no número\
    \ de lançamentos de novos modelos de inteligência artificial por empresas, pesquisadores\
    \ e outros grupos, e que teve um pico em 2023.\n\nA maioria desses incidentes\
    \ ocorreu nos Estados Unidos. A AIAAIC leva em conta a origem geográfica do sistema,\
    \ incidente, problema ou dado. Até 20.fev.2025, o Brasil tinha aparecido em 24\
    \ instâncias. O primeiro foi em 2018, quando a ViaQuatro, uma das concessionárias\
    \ do metrô de São Paulo, foi obrigada judicialmente a parar de usar tecnologias\
    \ de reconhecimento facial para análise de emoções.\n\nNo contexto geral, a maioria\
    \ dos incidentes e problemas envolve o setor de mídia e entretenimento, com 288\
    \ registros até 20.fev.2025. A maioria desses casos trata de questões de direitos\
    \ autorais, como um incidente registrado em 2024, quando a Netflix usou IA para\
    \ recriar a voz de Gabi Petito, vítima de assassinato, em uma série documental\
    \ sobre sua morte.\n\nA AIAAIC já registrou mais de mil sistemas de IA envolvidos\
    \ em incidentes ou problemas em sua base de dados. Os mais conhecidos, como os\
    \ produzidos por big techs como Google, Meta e OpenAI, lideram os casos registrados\
    \ como incidentes. No entanto, há 826 outros sistemas individuais ou menos conhecidos\
    \ catalogados, incluindo modelos próprios e distribuídos localmente."
  relevância: A inteligência artificial está cada vez mais conectada ao dia a dia
    da sociedade e incidentes relacionados a ela têm impacto direto em diversos aspectos
    da vida, desde a nossa segurança e bem estar, até a manutenção da democracia.
    A base de dados aberta é um importante histórico dessa era e a visualização dos
    dados apresentada pela reportagem facilita a compreensão das informações, levanta
    pontos de destaque e permite a absorção do contexto atual de incidentes com as
    ferramentas de IA. Essa compreensão nos ajuda a direcionar as coberturas para
    os temas mais relevantes e dá munição para a criação de políticas públicas mais
    efetivas para a mitigação dos principais problemas encontrados.
  originalidade: Apesar da base ser pública e extremamente pertinente, os dados da
    AIAAIC não eram explorados pela imprensa brasileira.
  metodologia: Acessamos o repositório público de incidentes da AIAAIC (https://docs.google.com/spreadsheets/d/1Bn55B4xz21-_Rgdr8BBb2lt0n_4rzLGxFADMlVW0PYI/edit?ref=nucleo.jor.br&gid=1051812323#gid=1051812323)  e
    utilizamos este script de R (https://gist.github.com/rodolfoalmeida01/560d9d5d6a04650c92f5a7dd8552cc6e?ref=nucleo.jor.br)
    para analisar os dados, que foram então visualizados em gráficos interativos usando
    a ferramenta Flourish. O modelo GPT4, da OpenAI, foi utilizado para auxiliar na
    tradução de nomes de categorias e na sintaxe do código da análise.
  uf: SP
  tipo_inscricao: Visualização
  formato: Online
  category: Visualização
