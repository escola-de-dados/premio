- title: 'Os filmes que não passaram no Cinema São Luiz (parte I): qual o impacto
    do fechamento de salas de exibição de rua na cadeia produtiva audiovisual?'
  project_url: https://www.manguetownrevista.com/post/os-filmes-que-n%C3%A3o-passaram-no-cinema-s%C3%A3o-luiz-parte-i-qual-o-impacto-do-fechamento-de-salas-de-ex
  veiculo: Manguetown Revista
  autoria: Letícia Barbosa
  data: 11/16/2024
  resumo: Com quase 73 anos de existência, o Cinema São Luiz é um dos principais cinemas
    de rua de Recife, capital pernambucana. O futuro do equipamento parecia ameaçado
    quando passou cerca de dois anos fechado para obras. Em homenagem ao seu retorno,
    ainda que de forma reduzida, foi produzida uma reportagem a partir da indagação
    sobre a distribuição dos filmes que não passaram no São Luiz durante o período
    de inatividade.  Discute-se, assim, o impacto desse tipo de espaço na economia
    criativa e na produção audiovisual, principalmente, independente, que por vezes,
    encontra apenas nesses lugares espaço de difusão.
  relevância: O trabalho se propõe a pensar o São Luiz dentro de uma perspectiva mais
    ampla, enquanto um formato de equipamento cultural cada vez mais escasso no país
    e, mais especificamente em Pernambuco. Diante disso, traz aprofundamento para
    o debate, por vezes, rasos acerca da importância de preservar os cinemas de rua.
    Portanto, trata-se de uma reportagem com potencial de contribuir para engajamento
    e mobilização em defesa desses espaços.
  originalidade: A princípio, a reportagem usa dados para o jornalismo cultural, o
    que infelizmente não é uma prática comum, visto que esse campo vem cada vez mais
    sendo encoberto pelo conteúdo de entretenimento ou de agenda de eventos. Além
    disso, aborda a produção em audiovisual na perspectiva de economia criativa, enquanto
    segmento que emprega trabalhadores e trabalhadoras.
  metodologia: "A partir dos dados disponíveis no Informe Anual da Agência Nacional\
    \ de Cinema (Ancine) de 2024, busquei identificar quais filmes conseguiram ter\
    \ maior alcance, por meio dos números de salas em que conseguiram ser exibidos\
    \ e o público que comprou ingressos. \n\nPor meio do levantamento, também comparei\
    \ quais produtoras são as que mais conseguem difusão no país, bem como a origem\
    \ dos filmes mais e menos distribuídos, constando, assim, a desigualdade de acesso."
