- title: Papa Francisco em números
  project_url: https://mais.opovo.com.br/flip/edicao/impressa/7896/27-04-2025.html?all=1
  veiculo: O POVO+
  autoria: Wanderson Trindade, Irna Cavalcante e Luciana Pimenta
  data: 4/21/2025
  resumo: 'A reportagem "Papa Francisco em números" , publicada nos formatos impresso
    e digital, apresenta um balanço do pontificado de Papa Francisco, que durou de
    2013 a 2025. Primeiro papa latino-americano e não europeu em mais de 1.200 anos,
    Francisco ficou marcado por sua liderança humilde, voltada ao diálogo, à justiça
    social e ao cuidado com o meio ambiente.


    Durante seu papado, a população católica cresceu de 1,25 bilhão para 1,39 bilhão,
    com destaque para a expansão na África e nas Américas. Ele também realizou 48
    viagens internacionais e publicou quatro encíclicas, abordando temas como fé,
    ecologia, fraternidade e reconciliação. As reportagens destacam seu legado como
    o “papa da esperança”, uma figura que buscou aproximar a Igreja das pessoas e
    responder aos desafios contemporâneos com compaixão e firmeza.


    Acesso o formato digital aqui: https://mais.opovo.com.br/reportagens-especiais/papa-francisco/2025/04/21/mais-fieis-viagens-e-enciclicas-papa-francisco-em-numeros.html'
  relevância: 'A reportagem "Papa Francisco em números" é relevante por apresentar
    um panorama detalhado e fundamentado do pontificado de Jorge Mario Bergoglio,
    destacando seu impacto por meio de dados concretos. O texto documenta seu legado
    transformador, marcado pela humildade, pelo crescimento do número de fiéis e por
    uma liderança voltada às questões sociais, ambientais e espirituais.


    Mostra o aumento da população católica mundial, especialmente na África e nas
    Américas, o alcance global de suas 48 viagens internacionais e a importância de
    suas quatro encíclicas, que abordam fé, ecologia, justiça social e reconciliação.
    Também contextualiza seu papado inédito como o primeiro papa não europeu em mais
    de 1.200 anos, reforçando sua postura progressista e engajada. Baseada em fontes
    oficiais do Vaticano, a reportagem oferece um retrato confiável de um papa que
    marcou a história como símbolo de esperança, proximidade e firmeza diante dos
    desafios contemporâneos.'
  originalidade: 'A originalidade da reportagem "Papa Francisco em números" está na
    sua abordagem inovadora e baseada em dados para analisar o pontificado. Em vez
    de uma simples retrospectiva, ela oferece uma leitura quantificada do legado de
    Francisco, com indicadores objetivos como o crescimento no número de fiéis (de
    1,25 bilhão para 1,39 bilhão), o aumento percentual de católicos no mundo, as
    48 viagens internacionais e os temas abordados em suas quatro encíclicas.


    A reportagem também se destaca pela transparência metodológica, utilizando fontes
    oficiais do Vaticano e tornando os dados acessíveis ao público. Além disso, contextualiza
    esses números dentro de um pontificado histórico e inédito, marcado por humildade,
    liderança ativa e enfrentamento de desafios globais. Com isso, adota uma abordagem
    de jornalismo de dados que alia profundidade analítica, credibilidade e clareza,
    oferecendo uma nova forma de compreender o impacto de Francisco.'
  metodologia: 'Para a produção desta reportagem, a Central de Dados O POVO+ adotou
    uma abordagem baseada em dados, com foco na transparência, na precisão e na contextualização
    das informações sobre o pontificado de Papa Francisco.


    Foram consultadas fontes oficiais e reconhecidas pela Igreja, incluindo o site
    oficial do Vaticano, o Anuário Pontifício 2024, o Anuário Estatístico da Igreja
    2022 e o relatório Catholic Church Statistics 2024 (Estatísticas da Igreja Católica
    de 2024, em tradução livre). A partir desses documentos, foram extraídos dados
    quantitativos sobre:


    - Viagens apostólicas fora da Itália, incluindo motivo, origem, destino, datas
    e coordenadas geográficas (latitude e longitude);


    - Evolução da população católica mundial, com recorte por continentes e variações
    percentuais ao longo do pontificado;


    - Encíclicas papais, com ano de publicação, número de capítulos, pontos doutrinários,
    estrutura final (oração ou mensagem) e principais temas abordados.


    Esses dados serviram de base para a elaboração de gráficos, tabelas comparativas
    e mapas interativos que acompanham a reportagem, permitindo uma análise visual
    do impacto e da abrangência do pontificado de Francisco.


    Para garantir transparência e reprodutibilidade, todos os dados utilizados estão
    disponíveis em acesso aberto no Google Planilhas (clique aqui para acessar). A
    disponibilização visa incentivar a verificação, o uso em pesquisas e a ampliação
    do debate sobre o legado do pontífice.'
