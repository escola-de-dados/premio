- title: Presídios fazem revista vexatória mesmo com scanners corporais
  project_url: https://www.generonumero.media/reportagens/revista-vexatoria-em-presidios/
  veiculo: Gênero e Número
  autoria: Bruna Caetano, Victória Sacagami, Bruna de Lara, Vitória Régia da Silva
    e Diego Nunes
  data: 6/4/2025
  resumo: 'Apesar da decisão deste ano do STF que declarou inconstitucional a revista
    íntima vexatória, com desnudamento e procedimentos invasivos, essa prática continua
    ocorrendo em unidades prisionais brasileiras, inclusive onde há scanners corporais.
    A justificativa geralmente se baseia em falhas nos equipamentos ou má interpretação
    das imagens pelos agentes penitenciários, revelando a falta de capacitação dos
    operadores e a persistência de práticas abusivas.

    Levantamentos da Conectas Direitos Humanos apontam que, mesmo em estados onde
    a prática é proibida por lei, como Espírito Santo, Minas Gerais e Piauí, mulheres
    continuam sendo obrigadas a se despir e ter seus corpos apalpados, sob a alegação
    de inconsistência nos exames por scanner ou ausência do equipamento. A maioria
    das vítimas são mulheres e pessoas negras, reforçando um padrão seletivo e racista
    da prática.

    O relatório “Revista vexatória: uma prática constante” revela que 98% das vítimas
    são mulheres e 70% são negras. Mesmo com scanners presentes em 94% das unidades
    prisionais, 41% dos visitantes ainda são submetidos à revista íntima.

    Além da humilhação, a Defensoria Pública da União equipara a prática a uma forma
    de tortura sexual, apontando sua ilegalidade e ineficácia. Defensoras públicas
    e a Conectas reforçam que a revista vexatória viola princípios constitucionais
    como o da dignidade humana e da intranscendência da pena, punindo familiares em
    vez dos presos.

    Embora o STF tenha estabelecido um prazo de 24 meses para que os presídios se
    equipem com scanners e outros dispositivos não invasivos, a aquisição dos equipamentos
    ainda é insuficiente e enfrenta entraves, como a suspensão de processos licitatórios.

    A matéria conclui que o fim da revista vexatória exige não apenas tecnologia,
    mas formação adequada de agentes, protocolos claros, monitoramento contínuo, e
    compromisso do Estado com os direitos humanos, especialmente das mulheres visitantes,
    as mais afetadas por essa prática violenta, seletiva e ilegal.'
  relevância: 'Essa reportagem é relevante porque denuncia a persistência de uma prática
    ilegal e violadora de direitos humanos dentro do sistema prisional brasileiro:
    a revista íntima vexatória. Apesar de proibida por leis estaduais e por uma decisão
    recente do Supremo Tribunal Federal, que considerou essa prática inadmissível,
    a matéria mostra que ela ainda ocorre rotineiramente em presídios de diferentes
    estados. Isso evidencia uma desconexão profunda entre o que está estabelecido
    na legislação e a realidade enfrentada por visitantes, especialmente mulheres
    e pessoas negras, que são as principais vítimas. A reportagem expõe como a ausência
    de fiscalização e a má formação de agentes penitenciários para o uso de equipamentos
    como scanners corporais contribuem para a continuidade dessas violências.

    Além disso, o texto traz dados que comprovam o caráter seletivo, racista e sexista
    da revista vexatória, atingindo majoritariamente mulheres e pessoas negras, o
    que reforça a lógica de criminalização e controle dos corpos já marginalizados.
    A matéria também questiona a eficácia da revista como medida de segurança e mostra
    que, mesmo com a presença de tecnologia adequada, faltam protocolos claros e capacitação
    profissional para garantir o respeito à dignidade humana. Ao dar voz a mulheres
    que vivenciaram essas violações e apresentar análises de defensoras públicas e
    organizações de direitos humanos, a reportagem cumpre um papel essencial de visibilização
    e denúncia, fortalecendo o controle social e a pressão por mudanças concretas.
    Em um país com um sistema penal marcado pela superlotação, seletividade e violência
    institucional, essa reportagem é uma ferramenta importante para o debate público
    e para a construção de políticas mais justas e humanas.'
  originalidade: 'Esta reportagem inova ao combinar diferentes fontes de dados e abordagens
    qualitativas para investigar a permanência da revista íntima vexatória em presídios
    brasileiros, mesmo diante da proibição legal e da existência de tecnologias alternativas.
    A originalidade está, sobretudo, em como o trabalho articula o levantamento inédito
    de dados nacionais sobre o número de scanners corporais disponibilizado com informações
    detalhadas de violações sistemáticas coletadas a partir de relatórios e denúncias
    de organizações da sociedade civil.


    Além disso, a reportagem evidencia a seletividade da prática ao expor dados raciais
    e de gênero das vítimas, revelando que a maior parte delas são mulheres e pessoas
    negras. Outro diferencial está na centralidade dada às vozes de mulheres que sofreram
    a violência, articulando dados e relatos de forma sensível e precisa. Ao integrar
    aspectos técnicos, jurídicos e humanos, o trabalho rompe com a abordagem meramente
    descritiva e propõe uma análise crítica, interseccional e orientada pela perspectiva
    dos direitos humanos.'
  metodologia: "O número de scanners e de unidades prisionais espalhados pelo país\
    \ foi adquirido via contato da repórter com a assessoria de imprensa da Secretaria\
    \ Nacional de Políticas Penais, do Ministério da Justiça e da Segurança Pública.\
    \ \n\nOs dados relativos aos estados que já haviam proibido a revista vexatória,\
    \ ao perfil das pessoas afetadas pela prática e à presença ou não de scanners\
    \ nas unidades prisionais foram retirados de relatórios da Conectas Direitos Humanos."
