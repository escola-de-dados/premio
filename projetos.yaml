- title: Cruzes na Estrada
  project_url: https://cruzesnaestrada.com.br/
  veiculo: Portal LeiaJá
  autoria: Jorge Cosme da Silva Neto, Marilia Cardoso Parente de Melo, Júlio César
    de Souza Gomes e Thiago Azurem Couto Maia e Silva
  data: 11/17/2024
  resumo: 'O especial de jornalismo Cruzes na Estrada é resultado de um esforço de
    reportagem de seis dias de trabalho intenso pelas rodovias PE-177 e PE-090, em
    que nossa equipe cruzou 14 cidades do interior de Pernambuco registrando 195 cruzes
    e capelas que pontuam locais onde vidas foram interrompidas em sinistros nas estradas.
    Erguidos para lembrar as vítimas dessas ocorrências, tais marcos vão além da função
    de produzir memória para tragédias individuais, refletindo uma realidade que conecta
    memória, religiosidade popular e desigualdade social.


    Este trabalho busca entender como a morte se torna visível ou invisível no cotidiano
    das comunidades interioranas do estado. Inspirada em uma abordagem etnográfica,
    nossa equipe entrevistou conhecidos e familiares das vítimas, além de testemunhas
    dos sinistros e pessoas que convivem com as cruzes, a partir das quais são produzidas
    narrativas que evidenciam o imaginário popular em torno desses símbolos, da morte
    e da estrada.


    As cruzes que margeiam as rodovias vão além de simples memoriais para os mortos,
    funcionando também para elaboração do processo de luto e como um modo de honrar
    e salvar simbolicamente as almas dessas vítimas, sob uma dimensão do catolicismo
    popular.


    O especial conta com um mapa interativo, que registra cada uma das cruzes encontradas,
    evidenciando o trágico cenário construído ao longo de décadas nas nossas rodovias'
  relevância: "O especial conta com um mapa interativo, que registra cada uma das\
    \ cruzes encontradas, evidenciando o trágico cenário construído ao longo de décadas\
    \ nas nossas rodovias. Ao apresentar cada um desses símbolos e suas histórias,\
    \ o mapa opera também como uma forma de questionar um direcionamento ideológico\
    \ que ignora a insegurança das estradas e a ausência de políticas públicas que\
    \ poderiam ter evitado muitas dessas mortes. \n\nEsta reportagem foi lançada no\
    \ Dia Mundial em Memória das Vítimas de Sinistros de Trânsito, data adotada pela\
    \ Organização das Nações Unidas (ONU) em 1995 como forma de homenagear esses mortos\
    \ e feridos, de destacar a dor das perdas de familiares e amigos e de conscientizar\
    \ sobre uma mobilidade mais segura. Cruzes na Estrada se propõe a aprofundar e\
    \ a despertar novas percepções sobre as rodovias. \n\nNas cruzes, enxergamos formas\
    \ de lembrar, protestar e despertar ações\nque garantam a não-repetição das mortes\
    \ por elas representadas.\n\nDurante a apuração da reportagem, identificamos que\
    \ o estado de Pernambuco tem graves deficiências em organizar as estatísticas\
    \ de quem morre nas estradas. O departamento que trata de temas relacionados às\
    \ estradas informou que não tem esse levantamento. \n\nEvidenciou-se, portanto,\
    \ como Pernambuco não tem dados que possam servir para o desenvolvimento de políticas\
    \ de segurança no trânsito. A reportagem\nserviu para cobrar o governo com relação\
    \ à importância de um protocolo de registro de mortes. A reportagem também destacou\
    \ uma cultura histórica, religiosa, mas, ao mesmo tempo, marginalizada, principalmente\
    \ por envolver vítimas de um recorte econômico mais pobre. Nesse sentido, acreditamos\
    \ que a reportagem foi uma valorização dessa manifestação simbólica e cultural\
    \ que é colocar cruz em homenagem a um familiar. \n\nPor fim, destacamos que a\
    \ reportagem, em muitos casos, deu rosto, história e contexto a cruzes que muitas\
    \ vezes parecem compor o cenário natural de nossas estradas. Contribuímos aquela\
    \ demonstração de fé e afeto que esconde uma questão social. Como resposta ao\
    \ trabalho, ouvimos muito como o leitor passaria a ter uma nova percepção, um\
    \ novo olhar, ao se deparar com as cruzes."
  originalidade: 'O trabalho inova em contar o jornalismo a partir de um olhar cartográfico.
    As histórias são contadas conforme a localização das cruzes nas estradas visitadas,
    oferecendo ao leitor interagir com o conteúdo de uma forma mais imersiva e referenciada
    na geografia.


    A partir de interação com as cruzes no mapa, o internauta tem acesso a informações
    da vítima, do local onde ela foi encontrada e da história por trás daquele monumento.'
  metodologia: 'A primeira parte da metodologia foi a ida a campo, pois não foi localizado
    um levantamento semelhante ao que a reportagem fez.


    A ida a campo consistiu em registrar em foto e anotar a coordenada geográfica
    de cada cruz encontrada nas estradas selecionadas - além de apurar a história
    por trás daquele símbolo em cada uma das ocasiões possíveis.


    O material foi compilado em um arquivo .json, de objetos javascript. Nele, temos
    as coordenadas de cada cruz. A partir disso, integramos com um serviço de mapas
    online, em que pudemos associar cada cruz a seu exato ponto do mapa.'
  uf: PE
  tipo_inscricao: Visualização
  formato: Online
  category: Visualização
  image: images/edicoes/2024/cruzes-nas-estradas-capa.jpg
  ano: '2024'
- title: Mapa interativo mostra praias de SP com mais roubos e furtos
  project_url: https://www.estadao.com.br/sao-paulo/quais-sao-as-praias-mais-perigosas-de-sp-veja-no-novo-radar-da-criminalidade-do-litoral
  veiculo: Estadão
  autoria: Lucas Thaynan, Cindy Damasceno, Bruno Ponceano, Ítalo Lo Re e Renan Cavalcante
  data: 12/23/2024
  resumo: A ferramenta interativa desenvolvida pelo núcleo de Arte do Estadão revela
    a extensão da criminalidade nas praias do litoral paulista. O mapa traz dados
    do último ano sobre roubos e furtos de veículos e celulares, além de casos de
    latrocínio e sequestro, permitindo ao leitor visualizar as regiões mais afetadas.
  relevância: A criminalidade é hoje a principal preocupação dos brasileiros, segundo
    pesquisa recente da Genial/Quaest. No total, 29% dos entrevistados apontam o tema
    como o mais urgente no país. Em um dos destinos turísticos mais populares do Estado,
    o levantamento oferece um panorama inédito da violência, contribuindo para informar
    moradores, turistas e autoridades.
  originalidade: A reportagem se destaca por reunir e tratar dados oficiais com precisão,
    oferecendo ao público uma experiência visual e interativa. O mapa permite explorar
    os dados por localização e tipo de crime, com destaque para áreas de maior concentração
    de ocorrências. O diferencial está na forma como os dados foram filtrados e geolocalizados,
    colocando o leitor no centro da história.
  metodologia: 'A ferramenta tem como base os registros dos crimes reportados ao Sistema
    de Registro Digital de Ocorrência (RDO), plataforma utilizada pela SSP-SP para
    armazenar informações de boletins de ocorrência. Estas informações são atualizadas
    mensalmente pela pasta e disponibilizadas no site da instituição.


    Desta forma, somente ocorrências reportadas à Polícia Civil e com endereço completo
    (geolocalizadas com latitude e longitude) entram no contador do Radar e são espelhados
    no mapa.


    Para evitar identificação de detalhes sensíveis de vítimas a partir da localização
    das ocorrências, foram desconsiderados para esta ferramenta os casos registrados
    em endereços residenciais e comerciais. Por isso, o Radar traz em sua visualização
    apenas os crimes em vias públicas, como avenidas e ruas.


    As datas mostradas pela ferramenta correspondem à data de comunicação do acontecido
    às autoridades policiais. Uma localização pode, simultaneamente, registrar mais
    de um tipo de indicador criminal. Ocorrências em que um celular e um veículo foram
    roubados no mesmo crime são visualizadas como pontos distintos.


    A contagem de ocorrências é calculada no raio de 500 metros a partir da localização
    apontada pelo usuário.'
  uf: AL
  tipo_inscricao: Visualização
  formato: Online
  category: Visualização
  image: images/edicoes/2024/radarrouboslitoral.jpg
  ano: '2024'
- title: Onde mais pega fogo no Brasil? Mapas mostram rastro da alta de incêndios
  project_url: https://www.estadao.com.br/sustentabilidade/onde-mais-pega-fogo-no-brasil-mapas-mostram-rastro-da-alta-de-incendios/
  veiculo: Estadão
  autoria: Juliana Domingos, Lucas Thaynan, Bruno Ponceano e Cindy Damasceno
  data: 3/17/2025
  resumo: A reportagem apresenta um panorama detalhado da destruição causada pelas
    queimadas em todo o território nacional, com foco nos diferentes biomas brasileiros.
    De acordo com dados do MapBiomas os focos de incêndio em áreas florestais somaram
    30,9 milhões de hectares em 2024, o que representa um salto de 151% em relação
    a 2023.
  relevância: Em um ano emblemático para o Brasil, que será sede da 30ª Cúpula do
    Clima das Nações Unidas (COP-30), discutir os impactos ambientais torna-se ainda
    mais urgente. O crescimento expressivo nos focos de incêndio compromete a preservação
    dos biomas, destrói vegetação nativa e ameaça a biodiversidade brasileira. A reportagem
    contribui para ampliar o debate sobre as consequências dessa devastação.
  originalidade: A matéria se destaca pelo uso de mapas interativos que permitem ao
    leitor visualizar com clareza o avanço das queimadas em diferentes regiões do
    país. É possível filtrar as informações por ano e bioma, facilitando a compreensão
    dos dados e oferecendo uma experiência imersiva e informativa sobre a extensão
    do problema.
  metodologia: Os dados utilizados foram extraídos da plataforma do MapBiomas, com
    aplicação de filtros como ano e bioma para organizar as informações exibidas.
    Os mapas interativos foram desenvolvidos com a biblioteca Javascript Mapbox, alimentados
    por meio da API do próprio MapBiomas, o que permitiu representar visualmente o
    impacto das queimadas de forma dinâmica e precisa.
