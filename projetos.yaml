- title: 'Inédito: OP+ mapeia as 16 áreas verdes excluídas de zonas ambientais em
    Fortaleza'
  project_url: https://mais.opovo.com.br/reportagens-especiais/areas-verdes-em-fortaleza/2025/01/16/inedito-op-mapeia-as-16-areas-verdes-excluidas-de-zonas-ambientais-em-fortaleza.html
  veiculo: O POVO+
  autoria: Karyne Lane e Ludmyla Barros
  data: 1/16/2025
  resumo: A reportagem investigativa do O POVO+ revela, com exclusividade, que 16
    áreas verdes de Fortaleza foram excluídas de zonas ambientais no fim de 2024,
    comprometendo a proteção de ecossistemas urbanos em pelo menos 13 bairros. Por
    meio de um levantamento inédito baseado em dados legislativos, mapas e publicações
    oficiais, o trabalho identificou o impacto direto das alterações aprovadas pela
    Câmara Municipal, muitas sob baixa transparência e com justificativas frágeis.
    Através do cruzamento de fontes diversas e tradução de dados técnicos em linguagem
    acessível, a reportagem expôs a fragilidade da legislação ambiental da capital
    cearense, provocando reação do novo prefeito e reacendendo o debate sobre a revisão
    do Plano Diretor (atrasada desde 2019). Trata-se de uma apuração que combina rigor
    analítico, inovação na coleta de dados e compromisso com o interesse público.
  relevância: 'Em meio à crise climática e à expansão urbana desordenada, a reportagem
    do O POVO+ lança luz sobre um tema de altíssimo impacto social: a exclusão de
    áreas verdes da proteção ambiental em Fortaleza, cidade que já perdeu mais de
    80% de sua cobertura vegetal. Ao revelar que 16 zonas verdes foram alvo de alterações
    no zoneamento, em um processo pouco transparente e acelerado, o trabalho informa,
    alerta, questiona e provoca reação do poder público. Em um momento decisivo para
    o futuro urbanístico e ambiental da capital cearense, a reportagem se desdobra
    em uma série que alia dados, pesquisa, investigação e informação para fornecer
    um instrumento essencial de fiscalização e de defesa do interesse coletivo.'
  originalidade: A investigação é fruto de uma metodologia inédita, que combinou análises
    de dados legislativos, checagem no Diário Oficial, cruzamento com reportagens
    próprias e levantamento cartográfico detalhado, resultando em um mapeamento exclusivo
    das áreas verdes retiradas da proteção ambiental em Fortaleza. O trabalho expôs,
    com precisão geográfica e rigor investigativo, os impactos reais de decisões tomadas
    nos bastidores da Câmara Municipal — muitas delas no apagar das luzes do ano legislativo.
    A originalidade está tanto na forma de coleta e sistematização dos dados quanto
    na revelação de um processo deliberado e fragmentado que vinha passando despercebido
    da população e da cobertura jornalística tradicional.
  metodologia: 'Para a produção desta reportagem, O POVO+ realizou um levantamento
    de dados e trabalho investigativo com base em matérias d’O POVO e pesquisas no
    Sistema de Apoio ao Processo Legislativo (SAPL) da Câmara Municipal de Fortaleza
    (abas “Atividade legislativa” > Matérias legislativas), além de consultas ao Diário
    Oficial do município.


    Depois de localizar e compilar na ferramenta Pinpoint os documentos que mostravam
    as áreas afetadas (na forma de coordenadas geográficas, endereços, mapas e/ou
    imagens digitalizadas), os dados foram planilhados para facilitar a visualização
    de cada projeto de lei (PLC) e seus detalhes — proponente, justificativas, quais
    as legislações alteradas, se foi sancionado, dentre outros. Para garantir a precisão
    da coleta, houve um trabalho de conferência e apuração.


    Após a identificação desses locais, a ferramenta Google Earth foi utilizada para
    desenhar a geometria de cada um deles. Os desenhos gerados foram exportados em
    KML, convertidos para GeoJSON e carregados na plataforma de visualização de dados
    Flourish, onde o mapa foi criado e as demais informações a respeito de cada terreno
    foram adicionadas.'
  uf: CE
  tipo_inscricao: Investigação
