- title: 'Listras do clima: Veja evolução das mudanças climáticas em linhas de crochê'
  project_url: https://www1.folha.uol.com.br/ambiente/2025/01/listras-do-clima-veja-evolucao-das-mudancas-climaticas-em-linhas-de-croche.shtml
  veiculo: Folha de S.Paulo
  autoria: Marina Pinhoni e Nicholas Pretto
  data: 1/10/2025
  resumo: A reportagem em vídeo e texto traz os dados anuais atualizados do aumento
    da temperatura do planeta com uma nova proposta de visualização, que mistura o
    "analógico" do crochê com a infografia digital. As Climate Stripes trazem para
    o leitor a dimensão da mudança climática das últimas décadas.
  relevância: A mudança climática e seus impactos é um tema de discussão urgente,
    mas muitas vezes abstrato e de difícil compreensão. O objetivo do trabalho é captar
    visualmente a atenção e o interesse do leitor.
  originalidade: A originalidade se dá ao combinar o processo artesanal de produção
    de um cachecol de crochê, que é o próprio meio de visualização dos dados da reportagem.
    O vídeo dialoga com o processo que deu origem ao consagrado modelo de Climate
    Stripes e traz com didatismo o impacto da mudança climática dos últimos anos.
  metodologia: A análise usada pela reportagem considera os dados de temperatura média
    anual do planeta calculados pelo Copernicus desde 1940, comparados à média observada
    de 1850 a 1900. O modelo de visualização é o Climate Stripes, tipo de Heatmap
    utilizado para variações de temperatura.
