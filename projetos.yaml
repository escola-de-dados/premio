- title: Se o clima mudou, a política também precisa mudar?
  project_url: https://www.instagram.com/reel/DJxUOtKJ_xX/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==
  veiculo: TRÓPICOZ
  autoria: Caio Profiro, Letícia Rolim, Thiago Delfino e Walter Franco
  data: 5/17/2025
  resumo: A proposta busca fomentar o debate sobre os impactos da crise climática
    na saúde das populações amazônicas, reunindo especialistas em saúde pública e
    mudanças climáticas, com base em dados públicos pouco explorados pela mídia tradicional
    local. As nuvens de fumaça que cobrem a Amazônia ano após ano, as estimativas
    alarmantes e os eventos extremos não são simples fatalidades. São, possivelmente,
    sintomas de lacunas estruturais. Ausência de políticas públicas? Falta de planos
    de contingência? Investimentos mal direcionados? Defasagem na revisão dos planos
    diretores de cidades e comunidades rurais? Buscamos responder essas perguntas
    em um minidocumentário com formato inédito na mídia independente local.
  relevância: Queremos mostrar que a crise climática na Amazônia não está restrita
    aos boletins de saúde ou às planilhas de orçamento. Partições de dados públicos
    pouco exploradas para revelar, com base em evidências, a relação direta entre
    queimadas, poluição e o aumento de internações por doenças respiratórias na região.
    Sabíamos, no entanto, que dados isolados e fora de contexto não poderiam sensibilizar
    parte do público. Por isso, o minidocumentário coloca essas informações em narrativas
    visuais. Utilizamos infográficos animados, mapas em movimento e locuções para
    dirigir o espectador pela rota do dinheiro público direcionado — ou negligenciado
    — no controle ambiental, em um momento crítico que antecede a realização da primeira
    conferência climática do mundo na vizinha Belém do Pará.
  originalidade: 'Este trabalho representa uma novidade importante por ser um dos
    primeiros, se não o primeiro, minidocumentário independente dedicado à crise climática
    e seus impactos na saúde das populações amazônicas, produzido sem qualquer apoio
    da mídia hegemônica local. Sabemos que essa mídia tradicional, muitas vezes ligada
    diretamente aos governos por meio dos dados que investigamos, dificulta a produção
    de conteúdos críticos sobre qualquer tema que conflite com intere$$es maiores.
    Nosso minidocumentário também funciona como um documento do tempo, já que todo
    o processo, desde a pré-produção do roteiro, passando pela gravação até a edição
    final, foi realizado cerca de seis meses antes da realização da COP 30, evento
    que ainda guarda muitas incertezas quanto aos seus resultados.


    Um ponto fundamental do nosso trabalho é questionar como, no jornalismo sobre
    a Amazônia, as histórias muitas vezes são contadas por pessoas do Sul e Sudeste.
    Isso cria um olhar distante e neocolonial, como se só valesse o “jornalismo de
    verdade” quando vem de fora, de grandes cidades que nem vivem essa realidade na
    ponta como nós. Por fim, o formato do nosso minidocumentário se inspira em narrativas
    audiovisuais da VOX e da VICE Brasil, que usam um jornalismo comunitário e jovem
    para abordar temas importantes, trazendo as perspectivas que realmente importam
    nessa forma de contar histórias.'
  metodologia: "Com uma equipe reduzida, concentramos as atividades em pontos focais\
    \ para otimizar o processo. Eu, Caio, fui responsável pela pesquisa de macrodados,\
    \ pelas credenciais, pelo contato com os principais especialistas do assunto,\
    \ além de escrever o roteiro de perguntas e acompanhar o desenvolvimento geral.\
    \ Letícia contribuiu com uma pesquisa específica desses dados públicos, acessados\
    \ ​​via portais de transparência do Governo do Amazonas, do município de Manaus\
    \ e do Governo Federal. E Walter cuidou do refinamento e da análise desses números.\n\
    \nOrganizamos nossa rotina de gravação, que durou três semanas, com o apoio de\
    \ uma planilha que colocarei abaixo, na qual sistematizamos informações sobre\
    \ possíveis entrevistados e locais para as filmagens. Nossa intenção sempre foi\
    \ fazer com que os dados encontrados não ficassem como uma nota de rodapé, como\
    \ costuma acontecer, mas sim fossem protagonistas do momento decisivo da narrativa.\
    \ Quando o primeiro entrevistado abre espaço para a apresentação dessas informações,\
    \ entramos com o motion design para dar destaque aos números, reforçando a conscientização\
    \ de que esses valores, de alguma forma, estão sendo mal alocados ou não levados\
    \ a sério como deveriam. \n\nPlanilha: https://docs.google.com/spreadsheets/d/1XV_WUcHxPm0c2jGOd_jgNZBoNZOX5VOJ-GVBP_4YFjk/edit?usp=sharing"
