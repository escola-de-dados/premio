- title: Despoluição da Baía de Guanabara agora é promessa para trazer o Pan 2031
  project_url: https://www.rampasuerj.com.br/post/despolui%C3%A7%C3%A3o-da-ba%C3%ADa-de-guanabara-agora-%C3%A9-promessa-para-trazer-o-pan-2031
  veiculo: RAMPAS Uerj
  autoria: Everton Victor
  data: 6/2/2025
  resumo: Fiz uma reportagem sobre a poluição na Baía de Guanabara. Através dos altos
    números, já disponíveis sobre a poluição no mar, optei por explorar eles dando
    rosto a esses números. Através de diferentes personagens tentei destrinchar esses
    números, com suas experiências e demonstrando como o tamanho da devastação não
    está distante dos cariocas, mas presente em seu cotidiano.
  relevância: A polução da baía que beira quase toda a cidade afeta diretamente a
    saúde dos cariocas. E, é histórica prometida a despoluição, ligadas muitas vezes
    a possiblidade de receber grandes eventos, como as Olimpíadas de 2016 e, mais
    recentemente, a tentativa de trazer o Pan para o Rio e Niterói. Eu abordo como
    esta iniciativa surge não por conta de dados que reforçam a urgência desta despoluição,
    mas com a chances de a cidade receber eventos internacionais.
  originalidade: A apuração é toda minha. Os personagens que encontrei no Piscinão
    de Ramos, o Plano de Governo do atual Governador que prometeu a despoluição da
    Baía, a explicação da dimensão da sujeira. A pauta é interessante por não ser
    um release e, direta ou indiretamente, está relacionada com o cotidiano de todo
    carioca que convive próximo da Baía de Guanabara.
  metodologia: Foram apurações, ida a diferentes pontos da cidade e sobretudo pesquisas
    de dados e planos de governo.
