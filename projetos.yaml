  autoria: Valdete Calheiros e Lucas França
  data: 4/10/2025
  resumo: 'Alagoas tem 3.127.683 habitantes, segundo a mais recente contagem do Instituto
    Brasileiro de Geografia e Estatística (IBGE), realizada em 2022. Desse total,
    apenas 21 pessoas são oficialmente reconhecidas como portadoras de altas habilidades,
    ou seja, consideradas superdotadas. Dentre elas, 12 são crianças e nove, adultas.


    A estimativa é da Mensa, uma associação sem fins lucrativos fundada em 1946, em
    Oxford, na Inglaterra, que chegou ao Brasil em 2002. Hoje, a Mensa reúne 150 mil
    membros em 90 países, sendo 4.800 deles brasileiros.


    A Mensa mobiliza esforços em torno da pauta dos superdotados em três frentes:
    identificando pessoas com superdotação; proporcionando um ambiente social e intelectualmente
    estimulante para seus membros; e contribuindo com pesquisas científicas sobre
    inteligência.'
