- title: A Bolsa do Agro
  project_url: https://ojoioeotrigo.com.br/2025/03/a-bolsa-do-agro/
  veiculo: O Joio e O Trigo
  autoria: Bruna Bronoski
  data: 10/17/2024
  resumo: 'O projeto A Bolsa do Agro revela o uso do crédito privado concedido por
    meio de instrumentos financeiros do mercado de capitais e da bolsa de valores
    brasileira para atividades agropecuárias em áreas que violam a legislação socioambiental
    vigente na Amazônia. Entre os instrumentos que forjam a captação deste recurso
    estão o Fundo de Investimentos das Cadeias Produtivas Agroindustriais (Fiagro)
    e seu principal ativo financeiro, o Certificado de Recebíveis do Agronegócio (CRA).


    A série de reportagens em texto, podcast e mini-documentário conecta investidores
    individuais destes instrumentos, isto é, pessoas físicas distantes das áreas impactadas,
    às irregularidades socioambientais cometidas por corporações agroexportadoras
    e fazendeiros em territórios protegidos que acessam esses recursos em terras indígenas
    e áreas de preservação ambiental. A investigação ainda expõe a longa cadeia de
    securitização de dívidas, que concede crédito para investimento e custeio de atividades
    agropecuárias sem escrutínio dos riscos sociais e climáticos no momento da contratação,
    tampouco durante a aplicação de recursos.'
  relevância: "A série de reportagens é relevante ao apontar a participação de políticos\
    \ brasileiros com cargos eleitos e de empresas transnacionais de cadeias de suprimento\
    \ de commodities globais como pontas finais do destino das economias aplicadas\
    \ por investidores individuais na bolsa de valores, com a finalidade de obtenção\
    \ de lucro, mesmo possuindo histórico de irregularidades socioambientais.\n\n\
    Entre esses atores estão um senador da República, dois prefeitos-empresários de\
    \ municípios da Amazônia Legal e multinacionais brasileiras como a JBS, a Minerva\
    \ e a FS Fueling Sustainability. A partir de dados financeiros, ambientais e fundiários,\
    \ as reportagens evidenciam como eles obteram vantagem dos longos prazos de vencimento\
    \ de títulos de dívida, da isenção de impostos sobre tais instrumentos e da isenção\
    \ de protocolos de devida diligência socioambiental, como a filtragem e exclusão\
    \ de pessoas e empresas envolvidas com desmatamento ilegal, grilagem de terras\
    \ públicas e violação de direitos indígenas.\n\nFundos de investimento e títulos\
    \ de dívida “diluíram” o rosto dos responsáveis por infrações socioambientais,\
    \ uma vez que não mais o nome do fazendeiro ou empresa ficam claros no momento\
    \ de responsabilização dos impactos nos territórios. Assim, o trabalho se faz\
    \ relevante por “mostrar a cara” dos responsáveis pelo processo de financeirização\
    \ de terras no Brasil, em especial na Amazônia, em um contexto em que sistemas\
    \ de aplicação de recursos bilionários ficam invisíveis em longos relatórios e\
    \ complexas bases de dados financeiras. \n\nDa mesma forma como a exposição jornalística\
    \ sistemática do mau uso do crédito rural contribuiu para as mudanças de regramento\
    \ do acesso aos recursos públicos em bancos, por meio de novas normas no Banco\
    \ Central do Brasil (BCB), a série de reportagens busca reforçar a necessidade\
    \ de extensão da regulação mais rígida para a destinação de recursos também em\
    \ instrumentos financeiros privados captados em Bolsa, estes regulados pela Comissão\
    \ de Valores Mobiliários (CVM)."
  originalidade: O trabalho é original ao incorporar análises de dados do crédito
    agropecuário privado via mercado de capitais à ampla e histórica cobertura jornalística
    realizada para o destino final do crédito rural público via instituições financeiras,
    como os bancos. Ao longo dos anos, os trabalhos que cruzaram dados financeiros,
    ambientais e fundiários têm exposto o mau uso de recursos subvencionados pelo
    governo pelo crédito rural (Plano Safra, Seguro Rural, entre outros), o que colaborou
    sobremaneira para o ajuste das regras do Banco Central sobre esta fonte de incentivo
    à produção agropecuária. Dados públicos da Matriz de Dados do Crédito Rural são
    a principal fonte de informação e análise. No entanto, o mesmo raio-X não havia
    sido feito com os instrumentos financeiros de crédito agropecuário negociados
    na Bolsa de Valores do Brasil (B3) e no mercado de capitais, o que foi possível
    a partir desta investigação. Neste caso, os dados não estão disponíveis em bases
    de dados públicas mas, embora publicamente disponíveis, estão esparsos em diversos
    websites de domínio privado, como na página de empresas securitizadoras de dívidas
    e do BM&FBovespa. Identificar sites, baixar e reunir dados e pinçar casos relevantes,
    confirmados posteriormente com pesquisa jornalística e trabalho de campo, foram
    os pontos originais deste trabalho.
  metodologia: "A primeira fonte de consulta foi a base de dados de fundos de investimento\
    \ do agronegócio no site mantido pelo BM&FBovespa (<https://fnet.bmfbovespa.com.br/fnet/publico/abrirGerenciadorDocumentosCVM>),\
    \ de onde foram raspados documentos em formato PDF nas categorias “relatórios”\
    \ e “fatos relevantes” de fundos contendo o termo “FIAGRO” na identificação. Esta\
    \ base de dados permitiu a leitura e pesquisa do conteúdo dos PDFs, onde foram\
    \ identificadas listas de ativos (CRAs) nos relatórios periódicos. Listas de CRAs,\
    \ por sua vez, apontam códigos identificadores destes títulos, o que permitiu\
    \ listar quais empresas securitizadoras foram responsáveis pelas emissões de títulos.\n\
    \nEsta informação apontou o próximo passo: com a lista de empresas securitizadoras\
    \ em mãos, raspamos documentos em PDF de seus sites e que poderiam conter informações\
    \ sobre a destinação final de recursos de CRAs. Fontes do mercado financeiro apontaram\
    \ ser o “Termo de Securitização” (TS) o documento obrigatório para a emissão de\
    \ CRAs e, portanto, comum para todas as emissões. \n\nCom foco na cadeia de suprimentos\
    \ da carne e de grãos como soja e milho, usamos a plataforma Aleph do OCCRP para\
    \ pinçar TS de empresas com altos valores de emissões de CRAs. Tabulamos as emissões,\
    \ a fim de ter o total de emissões por empresa.\n\nA partir da leitura individual\
    \ destes TS, identificamos alguns deles contendo a discriminação da destinação\
    \ dos recursos por meio de listas de “produtores rurais” com identificadores como\
    \ CPFs e CNPJs. Utilizamos o software Tabula para criar dados estruturados em\
    \ formado CSV, oriundos de centenas de páginas dos PDFs. Cruzamos estas planilhas\
    \ com bases de dados fundiárias e ambientais, como embargos e infrações do Ibama\
    \ e ICMBio e Sigef/INCRA. A identificação geoespacial de propriedades rurais a\
    \ partir dos cadastros nacionais de pessoa física e jurídica possibilitou também\
    \ o cruzamento com shapefiles de terras indígenas e unidades de conservação, o\
    \ que nos levou aos principais casos relatados nas reportagens.\n\nBase de dados\
    \ final dos CRAs: <https://drive.google.com/drive/folders/1Q9p5NjMVECZZJiA2lJG2HPOAWPO9nOh4?usp=sharing\
    \ >"
