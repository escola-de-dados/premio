- title: Restinga, Lomba do Pinheiro e Mário Quintana são os bairros com mais estabelecimentos
    religiosos em Porto Alegre
  project_url: https://labjornalismo.pucrs.br/conteudo/restinga-lomba-do-pinheiro-e-mario-quintana-sao-os-bairros-com-mais-estabelecimentos-religiosos-em-porto-alegre-2/
  veiculo: Laboratório de Jornalismo Integrado da Famecos
  autoria: David Ferreira, Pedro Pereira, Rudá Portanova e Fernanda Nascimento (Supervisora)
  data: 1/20/2025
  resumo: "A reportagem “Restinga, Lomba do Pinheiro e Mário Quintana são os bairros\
    \ com mais estabelecimentos religiosos em Porto Alegre” proporciona uma análise,\
    \ com base nos dados do Censo de 2022 do IBGE, da presença de templos religiosos\
    \ na capital gaúcha. O levantamento identifica 1951 estabelecimentos distribuídos\
    \ por todo o território da cidade, superando a soma de escolas, e unidades de\
    \ saúde, e revela uma concentração especialmente elevada em regiões periféricas.\
    \  A produção é do Laboratório de Jornalismo Integrado da Famecos, jornal-laboratório\
    \ da Pontifícia Universidade Católica do Rio Grande do Sul (PUCRS), feita exclusivamente\
    \ por estudantes de jornalismo do segundo semestre do curso, orientados pela Profa.\
    \ Dra. Fernanda Nascimento, experiente jornalista gaúcha.\n\nO conteúdo é estruturado\
    \ a partir de metodologias de jornalismo de dados, com a construção de mapas interativos\
    \ e gráficos que permitem ao público entender a densidade e distribuição desses\
    \ espaços. Bairros como Restinga, Lomba do Pinheiro e Mário Quintana, apresentam\
    \ o maior volume dos templos nos territórios, enquanto outros, como Extrema e\
    \ Agronomia, possuem as maiores proporções por habitante.  \n\t\nA reportagem\
    \ parte da hipótese de que a expressiva presença religiosa está associada à fragilidade\
    \ da presença estatal em territórios vulneráveis. Nessas localidades, os templos\
    \ frequentemente assumem funções de acolhimento, assistência social e mediação\
    \ comunitária. O trabalho também insere o cenário porto-alegrense em um contexto\
    \ nacional mais amplo, destacando que o Brasil possui mais templos religiosos\
    \ registrados do que instituições de ensino e saúde somadas, o que reforça a relevância\
    \ do fenômeno.\nAlém da análise quantitativa, o material jornalístico é enriquecido\
    \ por entrevistas com especialistas em religião e política, articulando dados\
    \ públicos com experiências locais. Trata-se de um produto multimídia que conjuga\
    \ investigação baseada em evidências, abordagem territorial e sensibilidade social.\
    \ O material faz parte de uma série que prevê desdobramentos futuros, com aprofundamento\
    \ sobre o impacto político da atuação religiosa em âmbitos legislativos.\nA apuração\
    \ rigorosa, a transparência metodológica e a relevância pública do tema conferem\
    \ à reportagem valor significativo como exemplo de jornalismo investigativo orientado\
    \ por dados, contribuindo para o debate sobre fé, desigualdade e ausência de políticas\
    \ públicas nas periferias urbanas brasileiras."
  relevância: 'O trabalho apresenta dados públicos disponibilizados pelo Instituto
    Brasileiro de Geografia e Estatística (IBGE) sobre religião e seus estabelecimentos
    na capital do Rio Grande do Sul. Para comparação, foi realizado um levantamento
    da quantidade de estabelecimentos para outros fins (como praças, parques, estabelecimentos
    de ensino e estabelecimentos de saúde), mostrando como o espaço religioso se caracteriza
    em Porto Alegre. Dentro do tema, os bairros da cidade são classificados, traçando
    uma relação entre a quantidade de habitantes, as características periféricas (ou
    não) do bairro e as hipóteses para a presença expressiva da religião nesses locais.


    Nesse sentido, não apenas revelamos em quais bairros há maior quantidade de estabelecimentos
    religiosos, como também apresentamos as proporções de habitantes por estabelecimento,
    indicando se há uma quantidade significativa de templos por bairro.'
  originalidade: 'A reportagem apresenta um mapa interativo exclusivo dos locais exatos
    em que se encontram os estabelecimentos religiosos de Porto Alegre, produções
    cartográficas que ilustram os bairros de Porto Alegre com maior número de estabelecimentos
    religiosos e menor proporção de pessoas por templo, revela dados públicos através
    de comparações para dimensionar o efeito dos números, explicita a explicação do
    Instituto Brasileiro de Geografia e Estatística (IBGE) sobre o que eles consideram
    para classificar cada tipo de estabelecimento e revela quais bairros de Porto
    Alegre agrupam os maiores números de estabelecimentos religiosos.


    Cabe também indicar o tempo de produção, de apenas uma semana, além de ter sido
    um trabalho feito exclusivamente por jovens estudantes de jornalismo do segundo
    semestre do curso na Pontifícia Universidade Católica do Rio Grande do Sul.'
  metodologia: 'No primeiro momento, entramos em contato com o IBGE através do e-mail
    comunica@ibge.gov.br. Através do correio eletrônico, recebemos os links e dados
    brutos, em planilhas. Nesse momento, passamos a analisar os dados e entendemos
    que não eram apresentados endereços dos estabelecimentos, mas apenas suas coordenadas,
    em latitude e longitude. No intuito de transformar os dados em endereço, utilizados
    de uma planilha de geocodificação baseada na API do Google de conversão de latitude
    e longitude para endereço (https://www.youtube.com/watch?v=nI-n-ctcgxQ). Com a
    lista de endereços em mãos, trabalhamos em uma planilha (disponível neste link
    https://brpucrs-my.sharepoint.com/:x:/g/personal/pedro_pereira03_edu_pucrs_br/EQ9nNeICh8BJrneabp0nyaIBSESpu9JgP3JQTIGu4A0R6g),
    onde utilizamos a lista de bairros disponibilizada no site da Prefeitura de Porto
    Alegre que indica também o número de habitantes de cada bairro. Para extrair o
    nome de cada bairro de cada endereço indicado na conversão de latitude e longitude,
    utilizamos a fórmula “=MID(A2;FIND("- ";A2)+2;FIND(",";A2;FIND("- ";A2))-FIND("-
    ";A2)-2)”, onde transformamos “R. Vig. José Inácio, 399 - Centro Histórico, Porto
    Alegre - RS, 90020-110, Brazil” em apenas “Centro Histórico”.


    Com esses dados, utilizamos a fórmula “=COUNTIF(D:D; E2)”, onde D representa a
    lista dos bairros de cada endereço e E confere se deve acrescentar um número à
    contagem.


    Por fim, utilizamos a coluna H para calcular F2/G2, onde F indica a população
    por bairro e G2 recebe a contagem da fórmula “=COUNTIF(D:D; E2”. Ou seja, calculamos
    exatamente a proporção de pessoas por estabelecimento religioso de cada bairro
    da capital gaúcha.


    Em alguns casos, o bairro não era detectado pela conversão da API do Google. Nessas
    situações, classificamos individualmente o endereço baseado no bairro em que ele
    se encontrava no mapa de Porto Alegre disponibilizado pela prefeitura. Esses casos
    foram raros e não demandaram muito tempo dos jornalistas.


    Com os dados em mãos, produzimos os mapas no QGIS, inserimos os endereços nas
    bases de dados do MyMaps (https://www.google.com/maps/d/viewer?mid=1WhSci8UyiJjt_EB0MPfETfmsmJ7ikxE&femb=1&ll=-30.10439913146562%2C-51.143257999999996&z=11)
    para gerar o mapa interativo e apresentamos os resultados aos entrevistados e
    ao IBGE, com foco no cenário socioeconômico de cada bairro.


    Para desenvolvimento da reportagem, foram usados recursos da Google Cloud, do
    Google MyMaps, do Microsoft Excel, do QGIS para desenvolvimento cartográfico do
    mapa de Porto Alegre. A imagem de destaque foi produzida utilizando QGIS, em um
    processo que inseriu todos estabelecimentos religiosos no mapa produzido pelos
    estudantes.'
