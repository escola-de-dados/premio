- title: Transparência Brasil aponta repasses de R$ 8,5 bilhões em emendas parlamentares
    'paralelas'
  project_url: https://g1.globo.com/politica/noticia/2025/05/31/transparencia-brasil-aponta-repasses-de-r-85-bilhoes-em-emendas-parlamentares-secretas.ghtml
  veiculo: g1 / TV Globo
  autoria: Vinícius Cassela e Vladmir Netto
  data: 5/31/2025
  resumo: Em um trabalho de análise conjunta entre nossa equipe e a Transparência
    Brasil, analisamos e detectamos a existência de R$ 11,5 bilhões em emendas parlamentares
    "ocultas" à listagem de emendas divulgadas pelo Congresso Nacional.
  relevância: O tema é relevante por ser de amplo interesse da população. Há anos
    as emendas parlamentares têm sua existência discutida pelo Supremo Tribunal Federal
    e, após promessa do presidente Lula de acabar com o orçamento secreto, ter surgido
    uma nova estrutura oculta de emendas escancara possíveis irregularidades por parte
    do Congresso Nacional e com o apoio do Poder Executivo.
  originalidade: O grande ponto da proposta é a análise de informações que estavam
    ocultas no Orçamento da União que foi aprovado em março de 2025.
  metodologia: A partir dos dados divulgados no Orçamento da União aprovado no final
    de março de 2025, limpamos o arquivo em pdf e jogamos para o excel para analisar
    os dados. Então, a partir dos dados que restaram, analisamos cada uma das emendas
    elencadas, com a ajuda da Transparência Brasil.
