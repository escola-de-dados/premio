- title: 'Muito além das esquinas: trans e travestis trabalhadoras sexuais no Rio
    de Janeiro'
  project_url: https://adiadorim.org/reportagens/2025/03/muito-alem-das-esquinas-trans-e-travestis-trabalhadoras-sexuais-no-rio-de-janeiro/
  veiculo: Agência Diadorim
  autoria: Francielly Barbosa
  data: 3/13/2025
  resumo: A reportagem aborda a dificuldade de acesso ao emprego formal por mulheres
    trans e travestis no Rio de Janeiro. Como consequência da discriminação e da falta
    de oportunidades, muitas acabam se submetendo à prostituição como alternativa
    de trabalho, sendo expostas a diversos tipos de violência.
  relevância: A reportagem contribui com a cobertura de gênero no Brasil, ainda com
    pouco espaço, sobretudo na mídia tradicional, e aborda a realidade de mulheres
    trans e travestis trabalhadoras sexuais a partir de relatos de pessoas inseridas
    no contexto da prostituição. Além disso, a reportagem traz que os motivos para
    uma mulher trans ou travesti optar pelo trabalho sexual são múltiplos e diversos,
    assim como as violências que enfrentam.
  originalidade: A investigação mostra que o Brasil não produz dados sobre mulheres
    trans e travestis que exercem o trabalho sexual. Ao questionar, via Lei de Acesso
    à Informação (LAI), os ministérios do Trabalho e Emprego (MTE), dos Direitos Humanos
    e da Cidadania (MDHC) e da Saúde, e a Secretaria de Estado de Desenvolvimento
    Social e Direitos Humanos (SEDSODH) do Rio de Janeiro, a reportagem revelou que
    até mesmo os órgãos oficiais contam com a sociedade civil para produção de estatísticas
    sobre população trans e travesti no país.
  metodologia: 'Além de entrevistas, a reportagem contou com pedidos por meio da Lei
    de Acesso à Informação (LAI) e com análise de dados do Sistema de Informação de
    Agravos de Notificação (Sinan), do Ministério da Saúde (MS). As informações apuradas
    foram disponibilizadas nesse link: https://drive.google.com/drive/folders/1j8jL60N6-fINks88ucTcYBbkvxe07PM6.'
