- title: Corretores de emendas
  project_url: https://oglobo.globo.com/politica/noticia/2024/10/31/corretores-de-emendas-prefeituras-contratam-empresas-de-assessores-parlamentares-para-terem-recursos-liberados.ghtml
  veiculo: Jornal O GLOBO
  autoria: Patrik Camporez
  data: 11/1/2024
  resumo: A série Corretores de Emendas, publicada por O GLOBO em outubro de 2024,
    revelou a existência de um mercado informal de intermediação de recursos públicos
    federais operado por assessores parlamentares em atividade. O trabalho expôs como
    servidores com cargos em gabinetes da Câmara e do Senado fundaram empresas para
    prestar consultoria a prefeituras em troca de facilitação no acesso a emendas
    parlamentares — um grave conflito de interesses. A apuração teve como base a raspagem
    de dados de contratos municipais nos portais da transparência de centenas de prefeituras
    e dos tribunais de contas estaduais, que foram cruzados com o banco de dados funcional
    de servidores do Congresso Nacional. A partir disso, foram identificados mais
    de R$ 17,5 milhões em contratos com empresas ligadas a pelo menos dez assessores
    legislativos, contratadas por mais de 200 municípios. Após a publicação, a Polícia
    Federal e o Ministério Público abriram investigações sobre tráfico de influência,
    enriquecimento ilícito e corrupção. A série escancarou o papel oculto de operadores
    que atuam nos bastidores do orçamento público brasileiro.
  relevância: 'As emendas parlamentares se tornaram, na última década, o principal
    instrumento de barganha política no Brasil. A descoberta de que assessores legislativos
    — com vínculo funcional ativo em gabinetes — criaram empresas para vender acesso
    privilegiado a prefeitos, revela uma engrenagem invisível de privatização do orçamento
    público. O trabalho tornou visível um elo pouco explorado entre a estrutura estatal
    e interesses privados, ampliando o debate sobre integridade pública, conflito
    de interesses e falta de transparência na execução orçamentária. O impacto foi
    imediato: a série gerou investigações oficiais, mobilização de órgãos de controle
    e uso do material por organizações da sociedade civil como base para proposições
    legislativas e recomendações de boas práticas.'
  originalidade: 'A investigação revelou um fenômeno inédito no jornalismo brasileiro:
    a transformação de assessores parlamentares em “corretores de emendas” — operadores
    informais de recursos públicos. Nunca antes havia sido mapeada, com base em dados
    oficiais, a existência de um mercado paralelo de intermediação institucionalizado
    por meio de empresas registradas por servidores em exercício. O trabalho destacou-se
    por seu caráter preventivo, ao antecipar os órgãos de controle, e por iluminar
    um ponto cego da fiscalização pública: a dupla atuação de servidores públicos
    como empresários de influência. A originalidade está tanto na descoberta quanto
    na forma de construção, inteiramente baseada em dados primários e análises próprias,
    sem vazamentos ou colaborações externas.'
  metodologia: 'A investigação partiu de raspagens manuais e automatizadas de contratos
    municipais publicados nos portais da transparência de prefeituras de todos os
    estados do país, bem como nos sites dos Tribunais de Contas estaduais. Os dados
    foram sistematizados e organizados em planilhas. A partir dos nomes dos sócios
    das empresas contratadas, procedeu-se ao cruzamento com o banco de dados de servidores
    ativos do Congresso Nacional, disponível em formato aberto. Foram identificados
    vínculos simultâneos entre os proprietários das empresas e cargos comissionados
    em gabinetes parlamentares.


    Além disso, foram utilizadas bases de dados eleitorais e registros fiscais (Receita
    Federal) para reconstruir as redes de interesse. Foram feitas dezenas de entrevistas
    com prefeitos, ex-assessores, parlamentares, técnicos do Congresso e especialistas.
    Todos os personagens citados foram ouvidos. A série ainda se valeu de pedidos
    via Lei de Acesso à Informação, para confirmar vínculos e obter documentos que
    não estavam disponíveis nos portais.'
