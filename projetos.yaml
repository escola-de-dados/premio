- title: Dossiê 20 maiores bens declarados de candidatos nas eleições municipais de
    Sergipe
  project_url: https://manguejornalismo.org/dossie-20-maiores-bens-declarados-de-candidatos-nas-eleicoes-municipais-de-sergipe/
  veiculo: Mangue Jornalismo
  autoria: Ana Paula Rocha, LADATA, Antônio Laranjeira e Paulo Marques
  data: 10/1/2024
  resumo: "Como parte da cobertura especial das eleições municipais de 2024 em Sergipe,\
    \ a parceria entre a Mangue Jornalismo, a Liga Acadêmica de Ciência de Dados da\
    \ Universidade Federal de Sergipe (LADATA) e o jornalista Antônio Laranjeira lançou\
    \ em outubro de 2024 um dossiê sobre os 20 candidatos a cargos municipais no estado\
    \ que informaram ao Tribunal Superior Eleitoral (TSE) as maiores declarações de\
    \ bens.\n\nO levantamento dos dados, realizado pela LADATA a pedido da Mangue,\
    \ foi feito a partir das informações reportadas pelos candidatos ao site do TSE,\
    \ todas de caráter público. Vale ressaltar que todos os 20 candidatos são homens,\
    \ a maioria declarou-se branca e a média de idade fica acima dos 50 anos. Os oito\
    \ primeiros nomes da lista são do interior do estado e a maior declaração de bens\
    \ supera os R$ 19 milhões. \n\nIndo além dos números, a reportagem contextualizou\
    \ as fortunas nas realidades políticas e financeiras dos candidatos prévias ao\
    \ pleito de 2024, em um esforço coordenado de levantamento e checagem de informações."
  relevância: "Menor estado do Brasil, Sergipe sofre com uma realidade política dominada\
    \ pelo nepotismo e com a quase nula cobertura jornalística crítica dos poderes\
    \ executivo e legislativo. A raiz primeira desses problemas é a força que o poder\
    \ econômico de poucos indivíduos exerce sobre a realidade geral do estado. E esse\
    \ poder é em grande parte mais efetivo no nível municipal. \n\nCom isso em mente,\
    \ o dossiê da Mangue que descobriu e investigou os 20 candidatos das eleições\
    \ municipais de 2024 em Sergipe com as maiores declarações de bens inovou ao articular\
    \ diferentes esferas de poder em um mesmo quadro, desvelando e tornando de fácil\
    \ entendimento essas relações para um público pouco familiarizado com investigações\
    \ locais.\n\nFomos o primeiro veículo de Sergipe a inovar com o jornalismo baseado\
    \ em dados na cobertura de eleições municipais. Para isso, fizemos parceria com\
    \ uma liga de pesquisa em dados da Universidade Federal de Sergipe, dando oportunidade\
    \ aos estudantes de ciência da computação para aplicarem seus conhecimentos em\
    \ outra espaço que não o meio acadêmico."
  originalidade: 'A premissa do dossiê é o clássico jornalístico “follow the money”.
    Contudo, nossa releitura dessa abordagem – a originalidade do que produzimos –
    reside no fato de que nós não apenas descobrimos os 20 nomes por trás das maiores
    declarações de bens (todos homens, diga-se de passagem), como cavamos até descobrir
    a origem dessas fortunas e sua relação com a trajetória dos milionários na política
    profissional. Todo o nosso levantamento foi feito com Ciência de Dados e técnicas
    de OSINT, combinando habilidades de profissionais em formação na área de dados
    e jornalistas profissionais.


    Além do exposto acima, a forma como essas informações foram apresentadas permite
    ao leitor ter uma visão resumida dessas informações ou se aprofundar na leitura
    sobre cada um dos nomes do dossiê num layout limpo e intuitivo. Vale ressaltar
    também a combinação com informações visuais, a mais importante delas o mapa que
    orienta o leitor sobre a distribuição dos milionários candidatos pelo estado,
    permitindo insights interessantes sobre a preponderância de fortunas de candidatos
    do interior do estado na lista.'
  metodologia: "A pergunta que guiou nossa investigação foi \"Qual o perfil dos candidatos\
    \ e candidatas mais ricos das eleições municipais de Sergipe em 2024 e onde eles\
    \ estão?\".\n\nO primeiro passo para a elaboração do dossiê foi a extração da\
    \ lista de todos os candidatos das eleições municipais de 2024 em Sergipe, contendo\
    \ as informações básicas dos postulantes como constam no site do TSE. Essas informações\
    \ foram extraídas em planilha no formato .csv. Posteriormente, uma nova planilha\
    \ foi gerada contendo apenas os nomes dos candidatos e candidatas e suas declarações\
    \ de bens. \n\nEm seguida, extraiu-se os 20 primeiros com o maior valor total\
    \ de bens declarados. Essa última lista foi detalhadamente checada pela coordenadora\
    \ de reportagem e os integrantes do LADATA, momento no qual identificou-se que\
    \ o primeiro nome da lista, cuja declaração superava R$ 69 milhões, havia cometido\
    \ um erro na inserção das informações, acrescentando um 0 (zero) a mais no preço\
    \ dos seus dois únicos bens declarados: um Ford Ka 2014/2015 e uma conta poupança\
    \ no Banco do Brasil. \n\nRetirado o candidato pseudomilionário, começou o trabalho\
    \ mais longo de levantamento de informações sobre a vida política e financeira\
    \ pregressa dos componentes da lista. Tudo foi, então, organizado de tal forma\
    \ no site da Mangue Jornalismo que contemplasse tanto os leitores mais apressados\
    \ como os que quisessem mergulhar na história de cada um dos 20 nomes. Também\
    \ foi elaborado um mapa pelo Datawrapper especialmente para o dossiê, apresentando\
    \ a distribuição das fortunas pelo estado de Sergipe. \n\nOrganizamos o repositório\
    \ final com todos os códigos e deixamos tudo disponibilizado publicamente no GitHub:\
    \ https://github.com/ladata-ufs/mangue-de-checagens/tree/main/dados/tse"
  uf: SE
  tipo_inscricao: Investigação
  formato: Online
  category: Investigação
  image: images/edicoes/2024/Capa dossiê 20 maiores declarações de bens SE em 2024.png
  ano: '2024'
- title: 'Taxa do Lixo em Fortaleza: com ‘nome sujo’, 70 mil pessoas entram na dívida
    ativa por não pagar tributo'
  project_url: https://diariodonordeste.verdesmares.com.br/ceara/taxa-do-lixo-em-fortaleza-com-nome-sujo-70-mil-pessoas-entram-na-divida-ativa-por-nao-pagarem-tributo-1.3598968
  veiculo: Diário do Nordeste
  autoria: Nícolas Paulino e Thatiany Nascimento
  data: 12/30/2024
  resumo: A Taxa do Lixo em Fortaleza, implantada em 2023, gerou polêmica na cidade.
    Dados inéditos obtidos pelo Diário do Nordeste via LAI mostraram que, ao fim de
    2024, cerca de 70 mil pessoas foram inscritas na Dívida Ativa por não pagarem
    o tributo, acumulando quase R$ 85 milhões em débitos com o Município. Apesar da
    isenção para 70% das residências da capital cearense, os dados mostraram que o
    tributo teve grande resistência em sua implementação.
  relevância: A Prefeitura de Fortaleza justificou que a criação da Taxa do Lixo era
    uma obrigação prevista no Marco Regulatório do Saneamento Básico, mas nunca apresentou
    balanços sobre a adesão dos contribuintes ao novo tributo. Como os valores seriam
    empregados no aprimoramento da coleta de lixo, a reportagem quis investigar o
    montante que deixaria de ser investido diante da inadimplência, já que sempre
    houve muitas reclamações desde a criação do tributo. Até a publicação do material,
    esses dados eram desconhecidos e revelaram a resistência dos fortalezenses ao
    pagamento da taxa.
  originalidade: A reportagem foi o primeiro levantamento sobre a inadimplência da
    Taxa do Lixo em Fortaleza, hoje a quarta cidade mais populosa do Brasil. Os dados
    expuseram a resistência da população no pagamento do tributo, tanto porque era
    um ônus a mais no orçamento familiar quanto porque foi envolto em um processo
    judicial, e havia dúvidas sobre sua vigência. Mesmo prevista no Marco do Saneamento
    Básico, a Taxa tem refletido na popularidade de gestões municipais no Brasil,
    e levantamentos do tipo podem contribuir na discussão sobre a carga tributária
    aplicada no país.
  metodologia: A Secretaria Municipal de Finanças de Fortaleza foi demandada via LAI
    para fornecer os dados, até dezembro de 2024, sobre o pagamento da Taxa do Lixo
    na cidade. A Pasta retornou via E-SIC com uma planilha .xlsx com os dados solicitados,
    mostrando os contribuintes pagantes e não pagantes em cada bairro, além de um
    texto resumindo a situação dos pagamentos e os valores devidos. Como Fortaleza
    tem apenas 121 bairros e o tributo só foi cobrado em dois anos, não foi necessário
    usar outros aplicativos para triagem de dados. A checagem foi feita utilizando
    recursos do próprio Excel.
  uf: CE
  tipo_inscricao: Investigação
  formato: Online
  category: Investigação
  image: images/edicoes/2024/Taxa do Lixo em Fortaleza_Fabiane de Paula.jpg
  ano: '2024'
- title: Ceará registra mais de 3.100 homicídios no ano de 2024 e volta a ter aumento
    de mortes violentas após três anos
  project_url: https://diariodonordeste.verdesmares.com.br/seguranca/ceara-registra-mais-de-3100-homicidios-no-ano-de-2024-e-volta-a-ter-aumento-de-mortes-violentas-apos-tres-anos-1.3601362
  veiculo: Diário do Nordeste
  autoria: Messias Borges
  data: 1/3/2025
  resumo: O ano de 2024 terminou com aumento de homicídios no Ceará, na comparação
    com 2023. Conforme dados parciais disponibilizados no site da Secretaria da Segurança
    Pública e Defesa Social do Ceará (SSPDS), o Estado registrou pelo menos 3.151
    mortes violentas no ano passado, até o dia 20 de dezembro (números dos últimos
    11 dias do ano ainda não foram divulgados). Os anos de 2023 e 2022 terminaram
    com 2.970 homicídios, cada.
  relevância: A matéria fez uma comparação entre os últimos índices anuais de homicídios
    no Ceará, destacando o aumento de mortes violentas no Estado em 2024, conforme
    levantamentos feitos pela reportagem antes da divulgação oficial do Governo. A
    variação da estatística apresenta uma preocupação para a Segurança Pública do
    Estado e o fracasso das estratégias aplicadas naquele ano.
  originalidade: A reportagem fez um histórico de homicídios de 2015 a 2024, no Ceará,
    antes da divulgação oficial da Secretaria da Segurança Pública e Defesa Social
    do Ceará (SSPDS) dos dados do último ano. O aumento de homicídios foi uma informação
    exclusiva no Estado.
  metodologia: 'A reportagem coletou dados completos de homicídios de 2015 a 2023
    e somos os dados mensais de homicídios de 2024, para chegar à conclusão que o
    último ano teve mais de 3.100 mortes violentas, o que representou um aumento do
    índice no Estado, após três anos sem aumento. Os dados estão dispostos no site
    da SSPDS, em abas diferentes: https://www.sspds.ce.gov.br/estatisticas/'
