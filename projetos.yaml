- title: Por que o agro está interessado no mercado de produtos biológicos?
  project_url: https://ojoioeotrigo.com.br/2024/09/por-que-o-agro-esta-interessado-no-mercado-de-produtos-biologicos/
  veiculo: O Joio e O Trigo
  autoria: Flávia Schiochet
  data: 9/30/2024
  resumo: 'A reportagem revela os interesses da indústria química no mercado de bioinsumos
    e traça um panorama completo do setor: explica o que são esses produtos, o que
    preveem os projetos de lei para sua regulamentação, como diferentes perfis de
    agricultores os utilizam, além de críticas do setor produtivo e dos próprios usuários.
    Os dados, ainda incipientes, apontam tendência de crescimento — e a reportagem
    saiu na frente ao expor riscos potenciais nos projetos de lei em tramitação e
    as propostas de substitutivo articuladas pelo setor privado.


    Mostramos como, sem regras próprias, os bioinsumos acabam enquadrados em categorias
    restritivas de agrotóxicos e fertilizantes químicos. A apuração reuniu dados abertos,
    entrevistas e análise de documentos públicos. Constatamos que um em cada quatro
    pedidos de registro parte de gigantes do mercado de agrotóxicos, interessadas
    em ampliar portfólio a um custo menor do que o necessário para lançar novas moléculas
    químicas.


    Durante o debate dos projetos de lei, houve racha na bancada ruralista, e entidades
    do setor agropecuário elaboraram um substitutivo, revelando contradições internas.'
  relevância: 'Acompanhar o lobby da indústria química é imprescindível em um país
    onde o agronegócio figura entre as maiores atividades econômicas. A influência
    do setor agropecuário se soma à do setor químico no debate regulatório de agrotóxicos
    e fertilizantes. Nesse contexto, os bioinsumos surgem como oportunidade para empresas
    ampliarem portfólio e adotarem discurso de “agricultura regenerativa”, promovendo
    greenwashing e capturando narrativas ambientais.


    Ao antecipar a discussão sobre os riscos na regulamentação e expor os conflitos
    entre grandes produtores e agricultores familiares, agroecológicos e de povos
    e comunidades tradicionais, a reportagem cumpre papel essencial de esclarecimento
    público. Ela contribui para ampliar o debate social sobre como as políticas agrícolas
    devem equilibrar inovação tecnológica, proteção ambiental e interesses de grupos
    historicamente vulneráveis.'
  originalidade: 'A reportagem discutiu, de forma inédita, os possíveis impactos dos
    projetos de lei parados na Câmara sobre agricultores familiares, agroecológicos
    e povos e comunidades tradicionais. Mapeou os interesses comerciais por trás do
    lobby e mostrou como esses atores influenciaram a formulação de propostas.


    A partir de relatórios e documentos, identificamos a narrativa da indústria química
    que apresenta os biológicos como complemento aos agrotóxicos, em vez de alternativa.
    Além disso, a matéria organizou dados dispersos e trouxe explicações didáticas
    sobre o funcionamento do setor, aproximando o tema de públicos que normalmente
    não acompanham o debate regulatório.'
  metodologia: "Durante a apuração de uma série de reportagens sobre agrotóxicos,\
    \ identificamos registros de reuniões de lobistas do setor agropecuário e químico\
    \ na Esplanada dos Ministérios para tratar de bioinsumos. Com a aprovação da nova\
    \ lei de agrotóxicos em 2023, tornou-se urgente debater a regulamentação dos bioinsumos,\
    \ que ainda são cadastrados no Ministério da Agricultura e Pecuária (Mapa) como\
    \ “agrotóxicos biológicos”. Havia duas propostas de regulamentação de bioinsumos\
    \ paradas na Câmara dos Deputados – a reportagem relata como a bancada ruralista\
    \ rachou durante a elaboração e discussão de ambas. \n\nUsamos dados do Mapa,\
    \ Embrapa e das consultorias privadas McKinsey e Kynetec para dar a dimensão do\
    \ mercado no Brasil, mostrando uma tendência de crescimento no uso desses produtos\
    \ e a movimentação da indústria química para somar aos biológicos ao seu portfólio.\
    \ \n\nFila de registros de agrotóxicos (Mapa): https://www.gov.br/agricultura/pt-br/assuntos/insumos-agropecuarios/insumos-agricolas/agrotoxicos/filas-de-registro-de-agrotoxicos\
    \ \nBase de dados do app Bioinsumos, da Embrapa:  https://www.embrapa.br/busca-de-solucoes-tecnologicas/-/produto-servico/7227/aplicativo-bioinsumos\
    \ \nRegistros de agrotóxicos e biológicos (Mapa): https://docs.google.com/spreadsheets/u/0/d/1OpG05xR6Y36zl1QBTi3p75cwaasdlzEG/htmlview#"
