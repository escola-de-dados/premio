- title: Conheça Itacaré
  project_url: https://institutotijuipe.wixsite.com/institutotijuipe/conheca-itacare
  veiculo: Instituto Tijuípe
  autoria: Márcio Leal Gonçalves
  data: 10/20/2024
  resumo: Plataforma digital que consolida dados e informações diversas que permitem
    conhecer Itacaré, município de menos de 30 mil habitantes do litoral sul da Bahia,
    e são importantes ferramentas para qualificar as políticas públicas locais.
  relevância: Em quase sua totalidade, municípios de pequeno porte não têm condições
    financeiras e tecnológicas e nem possuem equipe técnica qualificada para trabalhar
    com dados e informações que permitam conhecer sua realidade e assim aprimorar
    suas políticas públicas. Nessa realidade, a organização da sociedade civil Instituto
    Tijuípe decidiu criar a plataforma, utilizando dados de diversas fontes públicas,
    inclusive gerando informações geoprocessadas que a gestão nunca possuiu e a própria
    população da cidade nunca conheceu.
  originalidade: O trabalho tem como inovador, principalmente, gerar dados e informações,
    inclusive geoprocessadas, inéditas no município. Outro ponto original é utilizar
    diferentes fontes de dados para a consolidação, inclusive com elaboração de notas
    técnicas que detalham o trabalho metodológico, quando se faz necessário, permitindo
    assim a replicação por outras pessoas e entidades.
  metodologia: Todos os dados são obtidos de fontes públicas, como o Censo 2022 do
    IBGE, e algumas obtidas por meio de Lei de Acesso à Informação junto a outros
    entes da federação. A partir disso, eles trabalhados por software para permitir
    tanto sua seleção para as especificidades do município como para a elaboração
    de gráficos visuais que facilitam o entendimento. Quando necessário, principalmente
    nas informações geoprocessadas, é gerada uma nota técnica, anexada junto ao conteúdo,
    que detalha a metodologia utilizada para a geração dos resultados apresentados.
    Além disso, cada resultado gerado também tem como divulgação matéria publicada
    no site e compartilhada em redes sociais e em grupos de WhatsApp da cidade.
