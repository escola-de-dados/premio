- title: '“Casos Isolados”: levantamento exclusivo aponta que Policiais Militares
    cometem ao menos um ato de violência desnecessária a cada 2 dias em 2024'
  project_url: https://labjornalismo.pucrs.br/conteudo/casos-isolados-levantamento-exclusivo-aponta-que-policiais-militares-cometem-ao-menos-um-ato-de-violencia-desnecessaria-a-cada-2-dias-em-2024/
  veiculo: Laboratório de Jornalismo da PUCRS
  autoria: Lucas Polidori Azeredo
  data: 4/23/2025
  resumo: '"Casos Isolados" é uma reportagem investigativa sobre a violência da Polícia
    Militar brasileira posta em dados. A matéria mostra, a partir de um levantamento
    exclusivo feito da coleta de casos relatados via matérias em portais de notícia
    e sites de veículos jornalísticos, que agressões, abusos de poder, ameaças, tortura
    e até assassinatos fazem parte do repertório da PM em todo o Brasil. Ao todo,
    foram encontrados 183 "Casos Isolados" de violência desnecessária sendo aplicada
    por policiais militares, que foram mais de 400 membros da força participando de
    tais eventos, que vitimaram mais de 270 pessoas, fossem homens, mulheres, crianças,
    idosos ou até mesmo grávidas.


    A reportagem faz parte do projeto especial do Lab J “50 anos de ROTA 66: A Polícia
    que mata (e fala)”, que contém outras duas reportagens e um podcast narrativo
    especial sobre os 50 anos do caso ROTA 66.'
  relevância: "A relevância do trabalho se dá pela luz que joga na violência policial\
    \ e no uso excessivo de força, que é cultura da Polícia Militar. Os 183 casos\
    \ levantados, como bem diz o sociólogo e especialista em Segurança Pública Marcos\
    \ Rolim, \"são a ponta do iceberg. É aquilo que foi flagrado por alguém que filmou\
    \ ou denunciou o que estava acontecendo. Tem uma quantidade muito maior de cenas\
    \ de violência e de arbitrariedade que não são filmadas, que fazem parte do cotidiano\
    \ e que a gente nunca vai ficar sabendo”. \n\nPortanto, a reportagem se coloca\
    \ na posição de trazer à tona essa realidade, especialmente saindo dos números\
    \ e das tabelas e trazendo para a vida real, com histórias reais, com os nomes\
    \ de vítimas reais, os métodos de violência aplicada desnecessariamente e, em\
    \ todos os exemplos, a falta de punição aos PMs responsáveis"
  originalidade: Ainda que a violência policial, em especial da Polícia/Brigada Militar,
    seja um tema aplamente discutido na mídia, não existem muitos trabalhos de coleta
    de dados de violência policial disponíveis, atualizados ou confiáveis, uma vez
    que são informações de difícil coleta pela falta de transparência da corporação
    responsável pelos atos. Sendo assim, a reportagem propõe uma forma diferente de
    coleta de dados, reunindo informações de abusos de poder, agressões, assassinatos
    e tortura por PMs a partir de matérias divulgadas on-line em portais de notícia
    ou sites de veículos de comunicação. O levantamento, que é exclusivo do Lab J
    e do autor, contabilizou que cerca de 400 PMs participaram ativamente dos atos
    que vitimaram mais de 270 pessoas em todo o Brasil em 2024.
  metodologia: "Tabela disponível em: https://docs.google.com/spreadsheets/d/1rkAhvAkMY6tn8mmcQKnI0UB8BNn_F-hPUSs-otHR_2E/edit?usp=sharing\n\
    \nComo fora supracitado em outras respostas, é muito difícil conseguir dados \"\
    oficiais\" das Polícias Militares do Brasil e Brigada Militar do RS sobre casos\
    \ de uso excessivo de força ou abuso policial. Portanto, foi decido por uma query\
    \ com termos relacionados à temática buscando por notícias e matérias veiculadas\
    \ na Internet e disponíveis via sistema de procura do Google sobre casos de violência\
    \ desnecessária usada por PMs. O texto da query foi:\n\n\"Policial Militar\" OR\
    \ \"PM\" OR \"PMs\" OR \"Policiais Militares\" OR \"Brigadiano\" OR \"BM\" OR\
    \ \"BMs\" OR \"Brigadianos\" OR “Brigadiano Militar” OR “Brigadianos Militares”\
    \ AND \"agride\" OR \"mata\" OR \"bate\" OR \"tortura\" OR \"soca\" OR \"chuta\"\
    \ OR \"ataca\" OR “tapa” OR \"espanca\" OR “agressão” OR “pontapé”\n\n(Deve-se\
    \ notar que \"brigadiano\" e \"Brigada Militar\" são termos do Rio Grande do Sul\
    \ para seus policiais e sua força de policiamento militar do estado)\n\nAssim,\
    \ com mais de 200 exemplos coletados e catalogados a partir de suas manchetes\
    \ correspondentes, os casos foram postos em tabela com informações sobre o local,\
    \ número de vítimas e seus perfis (homem, mulher, idade, raça e outras tantas\
    \ variantes demográficas) e o número de PMs envolvidos, o procedimento seguinte\
    \ foi começar a cortar os casos que não entrassem dentro de três regras delimitadoras:\n\
    \n- Apenas casos em que a ação da Polícia não é justificável \n- Tem que ser relacionado\
    \ ao seu ofício ou à cultura de violência/abuso de poder\n- Casos envolvendo surtos\
    \ psicológicos ou esquizofrênicos deve envolver uma aplicação desnecessária de\
    \ força\n\nPor fim, os mais de 200 casos foram limitados a \"apenas\" 183, que\
    \ chamamos de \"Casos Isolados\". Dessa forma, a PM brasileira comete um \"caso\
    \ isolado\" de violência policial a cada dois dias."
  uf: RS
  tipo_inscricao: Investigação
  formato: Online
  category: Investigação
