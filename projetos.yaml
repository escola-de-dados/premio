- title: 'Conclave: os números que contam a história da maior eleição da Igreja Católica'
  project_url: https://mais.opovo.com.br/reportagens-especiais/2025/05/06/conclave-os-numeros-que-contam-a-historia-da-maior-eleicao-da-igreja-catolica.html
  veiculo: O POVO+
  autoria: Wanderson Trindade e Fátima Sudário
  data: 5/6/2025
  resumo: À sombra da Capela Sistina, a Central de Dados do O POVO+ vasculhou as catacumbas
    virtuais do Vaticano para lançar um olhar analítico sobre o histórico e o presente
    da eleição mais importante da Igreja Católica. Nesta reportagem, conheça o perfil
    dos cardeais, suas origens e a linhagem de sua nomeação para tentar entender o
    cenário de escolha do próximo papa
  relevância: A reportagem sobre os números do conclave do Vaticano oferece uma análise
    profunda sobre um dos eventos mais sigilosos do mundo. A partir de dados oficiais
    da Santa Sé, registros históricos e fontes jornalísticas, o trabalho traça o perfil
    completo dos cardeais eleitores, revelando como o Papa Francisco moldou o colégio
    eleitoral atual (80% dos eleitores). Também mostra os diferentes comportamentos
    da votação ao longo da história da Igreja Católica.
  originalidade: A reportagem aplica jornalismo de dados a um tema altamente sigiloso,
    revelando o perfil dos cardeais votantes no conclave e tendências inéditas, como
    o impacto das nomeações do Papa Francisco e o crescimento da presença de países
    como Brasil, Ásia e África. Com dados oficiais, contexto histórico e bastidores
    recentes, o trabalho transforma um processo opaco em uma análise acessível e transparente.
    As bases foram publicadas, reforçando o compromisso com o jornalismo de dados
    aberto e reprodutível.
  metodologia: "Esta reportagem foi elaborada pela Central de Dados O POVO+ a partir\
    \ de uma investigação aprofundada sobre os conclaves da Igreja Católica e a composição\
    \ atual do Colégio de Cardeais. O trabalho se baseou em fontes oficiais, registros\
    \ históricos e publicações jornalísticas, seguindo práticas de análise de dados\
    \ com foco em precisão, reprodutibilidade e contextualização histórica.\n\n1.\
    \ Fontes de dados\n\nA coleta de dados envolveu duas frentes principais:\n\n \
    \         a) Conclaves históricos e recentes\n\n- Foram consultados registros\
    \ da Santa Sé, disponíveis no site oficial do Vaticano, para compilar uma linha\
    \ histórica dos conclaves desde o ano de 1404 até o presente.\n\n- Os dados coletados\
    \ incluem: ano da eleição, edição do conclave, nome do papa eleito, período de\
    \ votação, número de dias de duração, total de votações realizadas e quantidade\
    \ de cardeais participantes – sempre que tais informações estavam disponíveis\
    \ em fontes oficiais ou históricas verificáveis.\n\n- Para os conclaves mais recentes\
    \ (2005 e 2013), foram incluídos supostos detalhes das votações internas com base\
    \ em relatos divulgados por cardeais participantes e cobertura jornalística internacional\
    \ da época. OBS: A reportagem utiliza o termo \"suposto\" pois a própria Igreja\
    \ Católica não confirma tais informações.\n\n          b) Composição atual do\
    \ Colégio de Cardeais\n\n- A Central de Dados O POVO+ utilizou a lista oficial\
    \ de cardeais publicada pelo Vaticano para compilar informações sobre os membros\
    \ que puderam participar do Conclave de 2025.\n\n- As variáveis analisadas para\
    \ cada cardeal foram:\n\n     - Nome completo\n\n  - Data de nascimento\n\n  -\
    \ Idade projetada durante o Conclave de 2025\n\n  - Status de eleitor (com menos\
    \ de 80 anos) ou não eleitor\n\n  - País de origem\n\n  - Continente correspondente\n\
    \n  - Papa que o nomeou cardeal\n\n  - Data de seu consistório (cerimônia formal\
    \ de nomeação)\n\n2. Processamento e análises\n\nApós a coleta, os dados passaram\
    \ pelas seguintes etapas:\n\n- Normalização e organização em planilhas digitais,\
    \ com padronização de datas, países e nomenclaturas religiosas;\n\n- Categorização\
    \ geográfica, agrupando os cardeais por continente e por regiões do mundo (como\
    \ Europa Ocidental, América, África);\n\n- Segmentação temporal, para análise\
    \ por períodos papais (João Paulo II, Bento XVI e Francisco);\n\n- Cruzamento\
    \ de variáveis como idade, status eleitoral e origem nacional para avaliar a diversidade\
    \ e o perfil do colégio que escolheria o próximo papa;\n\n- Análise estatística\
    \ descritiva, incluindo contagem de eleitores por país e continente, proporção\
    \ de cardeais nomeados por cada papa e tendências históricas nos conclaves (como\
    \ tempo médio de duração e número médio de votações).\n\n3. Casos especiais: votações\
    \ de 2005 e 2013\n\nUm foco especial foi dado aos conclaves que elegeram Bento\
    \ XVI (2005) e Francisco (2013). Para esses dois episódios, O POVO+ analisou relatos\
    \ detalhados sobre as sucessivas rodadas de votação, com base em:\n\n- Supostos\
    \ depoimentos divulgados na imprensa de cardeais que participaram das eleições;\n\
    \n- Cobertura aprofundada de grandes veículos de imprensa especializados;\n\n\
    - Conferência cruzada com fontes secundárias (como Wikipedia), posteriormente\
    \ validadas por meio de links arquivados e páginas oficiais.\n\nForam identificados\
    \ os nomes mais votados em cada rodada e os movimentos internos de apoio que levaram\
    \ à eleição dos papas, com a finalidade de oferecer ao leitor uma visão mais transparente\
    \ sobre os bastidores de uma das eleições mais fechadas do mundo.\n\n4. Disponibilização\
    \ e reprodutibilidade\n\nEm compromisso com os princípios do jornalismo de dados\
    \ aberto, O POVO+ disponibilizou publicamente as bases de dados utilizadas na\
    \ apuração por meio de tabelas no Google Planilhas. O objetivo é permitir que\
    \ leitores, pesquisadores e jornalistas possam acessar, explorar, replicar ou\
    \ expandir as análises desenvolvidas.\n\nLink: https://docs.google.com/spreadsheets/d/1w42o0o6pfvcdOYzyuhhCCM4gBhIDL-fx6t7nJBcMl9g/edit?gid=0#gid=0"
