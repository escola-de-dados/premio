- title: Como a Coca-Cola acabou com a água de 800 famílias em Minas Gerais
  project_url: https://ojoioeotrigo.com.br/2024/12/como-a-coca-cola-acabou-com-a-agua-de-800-familias-em-minas-gerais/
  veiculo: O Joio e O Trigo
  autoria: Flávia Schiochet
  data: 12/4/2024
  resumo: 'A reportagem revela como a Coca-Cola FEMSA se instalou em Itabirito (MG)
    em 2015 e, desde então, vem comprometendo o abastecimento de água de mais de 800
    famílias em Brumadinho, cidade vizinha. A indústria usa 12 milhões de litros diários,
    enquanto a comunidade, 160 mil litros/dia.


    Reconstruímos a cronologia dos fatos, acessamos dados inéditos do inquérito civil,
    mostramos falhas e omissões no licenciamento ambiental e traduzimos conceitos
    técnicos em linguagem acessível, em que os infográficos foram cruciais. A partir
    deles, explicamos o funcionamento do aquífero vertical que abastecia a comunidade
    e a fábrica, apontando a desigualdade de acesso à água. A reportagem se destacou
    ao articular dados, relatos de moradores e estudos acadêmicos, gerando repercussão
    internacional e fomentando o debate sobre a gestão de recursos hídricos e a responsabilidade
    de grandes corporações.'
  relevância: "O trabalho deu visibilidade a uma injustiça socioambiental negligenciada\
    \ há quase uma década e expôs a conivência do poder público diante do esgotamento\
    \ hídrico causado pela Coca-Cola FEMSA. Ao traduzir dados técnicos e evidenciar\
    \ o consumo desproporcional de água pela fábrica, a reportagem revelou falhas\
    \ estruturais de fiscalização e transparência ambiental. \n\nCom alto engajamento\
    \ do público – a reportagem é uma das mais lidas da história do Joio –, a pauta\
    \ reforça a urgência de rever políticas de uso de recursos hídricos e a necessidade\
    \ de responsabilizar autoridades e empresas por prejuízos socioambientais que\
    \ afetam a saúde coletiva e os direitos humanos."
  originalidade: A reportagem trouxe à tona informações inéditas do inquérito civil
    e conectou dados técnicos com os relatos das comunidades impactadas. Também inovou
    ao trazer infográficos que permitem a visualização de dados geográficos e geológicos,
    permitindo ao público compreender o funcionamento do aquífero vertical que abastece
    a região e a dimensão da desigualdade hídrica. Foi a primeira cobertura a sistematizar,
    em uma única linha do tempo, as decisões do licenciamento, a omissão do poder
    público e os impactos diretos da fábrica sobre Brumadinho. Esse recorte revelou
    como a geologia da região, aliada à atuação permissiva do Estado, tornou possível
    que uma grande empresa comprometesse o direito à água de centenas de famílias.
  metodologia: "A investigação partiu de uma denúncia feita pelas comunidades ao Ministério\
    \ Público. Entrevistamos moradores das comunidades atingidas, autoridades, ambientalistas\
    \ e pesquisadores. A Coca-Cola não respondeu diretamente aos questionamentos enviados\
    \ pela reportagem. \n\nPara entender a dinâmica hídrica local, foram analisados\
    \ relatórios hidrogeológicos e contratos de monitoramento de vazão. Geólogos especializados\
    \ foram consultados para garantir a precisão das informações, tanto no texto quanto\
    \ nos infográficos. A combinação de análise documental, dados técnicos, entrevistas\
    \ e cruzamento de registros públicos estruturou a narrativa de forma clara e consistente,\
    \ permitindo dar visibilidade a um problema socioambiental negligenciado."
  uf: PR
  tipo_inscricao: Investigação
