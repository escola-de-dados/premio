- title: Lei da laqueadura impacta o número de procedimentos em Pernambuco, mas mantém
    desigualdade no acesso
  project_url: https://marcozero.org/lei-da-laqueadura-impacta-o-numero-de-procedimentos-em-pernambuco-mas-mantem-desigualdade-no-acesso/
  veiculo: Marco Zero Conteúdo
  autoria: Letícia Maria Barbosa
  data: 3/11/2025
  resumo: A Lei 14.443/2022 alterou as regras para a realização de laqueaduras, permitindo
    que o procedimento seja acessível para  pessoas capazes de gestar a partir de
    21 anos de idade, sem necessidade de consentimento de cônjuges ou de ter dado
    a luz a duas crianças vivas. O marco legislativo autoriza ainda a realização da
    cirurgia logo depois do parto. Em Pernambuco, de acordo com dados do SIH-SUS,
    o número de esterilizações voluntárias femininas teve um aumento de 200% entre
    2019 e 2024. Entretanto, fatores como a inflexibilidade do modelo de planejamento
    reprodutivo, a superlotação de hospitais e a falta de informação são obstáculos
    para pessoas que querem acessar o serviço. A reportagem investiga a aplicação
    da lei no estado de Pernambuco e a concentração de procedimentos na Região Metropolitana
    do Recife. Além disso, ao se somar com problemas como a limitação dos direitos
    reprodutivos, a mudança teve como resultado negativo o aumento de cesarianas.
  relevância: O trabalho põe em questão como a atualização da lei, apesar da retirada
    de condições como a necessidade de autorização do cônjuge e a de já ter filhos,
    não corresponde ao que pesquisadores, profissionais de medicina e ativistas defendem
    no que diz respeito aos direitos reprodutivos e autonomia na decisão. O aumento
    de cesarianas, por exemplo, é um desafio para o enfrentamento da mortalidade materna.
    Além disso, aponta a dificuldade de mulheres e pessoas que gestam que não residem
    na capital e cidades vizinhas de acessar o serviço, fornecendo informações relevantes
    para que a sociedade reivindique melhor acesso ao serviço. Por fim, a reportagem
    coloca em evidência fatores como falta de informação e o atravessamento de classe
    e raça para realizar a cirurgia.
  originalidade: A reportagem é a primeira a analisar os dados de laqueaduras em Pernambuco,
    após a mudança da legislação. Dessa forma, apresenta um retrato do impacto da
    mudança, apontando dificuldades de acesso ao serviço, mesmo com a maior flexibilização
    das regras. Ao mesmo tempo, o trabalho não se limita a expor os dados, mas põe
    em questão como a atualização da lei não foi totalmente eficaz em relação ao avanço
    dos direitos reprodutivos, apesar de medidas populares como a retirada da obrigatoriedade
    da permissão do cônjuge para realizar o procedimento.
  metodologia: "A partir dos microdados do Sistema de Informações Hospitalares do\
    \ SUS (SIH-SUS), disponível em : https://docs.google.com/spreadsheets/d/1TKvjHOZufk3krXp5MFHRVIvOngwoavTp8hCEt8UC6GU/edit?gid=1669985953#gid=1669985953,\
    \ elaborei tabelas dinâmicas que cruzassem dados como idade, número de filhos\
    \ e raça das pacientes. A partir dos números, foi possível identificar o aumento\
    \ com a mudança da lei.\n\nComparando proporcionalmente com os dados do IBGE foi\
    \ possível identificar como são as mulheres negras as que mais realizam o procedimento,\
    \ ao mesmo tempo em que são a maioria na dificuldade de serviços básicos, como\
    \ saúde, educação, segurança e moradia. \n\nAlém disso, contabilizei separadamente\
    \ os procedimentos de laqueaduras divididos entre as realizadas após o parto normal,\
    \ após o parto cesáreo e como cirurgia isolada, constatando, inclusive por meio\
    \ das entrevistas, que a esterilização no primeiro caso não vinha sendo tão difundida,\
    \ por vezes, por problema de informação das próprias unidades. Outro ponto, o\
    \ aumento do número de cesáreas.\n\nPor fim, cruzei os dados de municípios em\
    \ que laqueadura era realizada e os municípios de residência das pacientes para\
    \ verificar a carência na distribuição do serviço."
