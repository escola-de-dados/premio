- title: Agregador de Pesquisas 2024
  project_url: https://mais.opovo.com.br/interativos/agregador/agregador-pesquisas-2024.php
  veiculo: O POVO+
  autoria: Alexandre Cajazeira, Ana Naddaf, André Filipe, Brenda Câmara, Érico Firmo,
    Erick Guimarães, Fátima Sudário, Ítalo Coriolano, João Marcelo Sena, Matheus Sales,
    Michele Medeiros, Miguel Pontes, Regina Ribeiro, Roberto Araújo e Wanderson Trindade.
  data: 9/20/2025
  resumo: O Agregador de Pesquisas 2024 surge como oportunidade de solucionar a dificuldade
    dos eleitores em acompanhar e comparar os resultados de diferentes institutos
    de pesquisa durante um processo eleitoral. A ferramenta coleta, padroniza e analisa
    dados eleitorais com rigor estatístico, usando médias ponderadas e móveis para
    identificar tendências de forma clara e acessível. Com visualizações interativas
    e dados abertos, o sistema alia tecnologia e transparência ao jornalismo de dados.
  relevância: 'O Agregador de Pesquisas 2024, desenvolvido por O POVO+, teve papel
    essencial durante o processo eleitoral ao oferecer uma fonte confiável, unificada
    e transparente de acompanhamento das intenções de voto. Em um cenário marcado
    por disputas acirradas e alta desinformação, a ferramenta possibilitou que eleitores,
    jornalistas, analistas e campanhas tivessem acesso a dados consolidados com rigor
    estatístico, por meio de médias móveis e ponderadas que refletiam tendências reais,
    e não apenas recortes isolados.


    Ao padronizar e analisar dados de diferentes institutos, o agregador eliminou
    ruídos, facilitou a comparação entre pesquisas e fortaleceu o consumo crítico
    de informação eleitoral. Sua relevância também se dá pelo compromisso com a transparência:
    os dados foram disponibilizados em formato aberto e o código-fonte publicado,
    permitindo reprodutibilidade e auditabilidade por qualquer interessado.


    O impacto do projeto ficou evidente no segundo turno em Fortaleza, quando o agregador
    antecipou com precisão a tendência de virada de Evandro Leitão (PT) sobre André
    Fernandes (PL), informação que foi confirmada nas urnas. O projeto exemplifica
    como o jornalismo de dados pode aliar tecnologia, credibilidade e serviço público,
    promovendo uma cobertura eleitoral mais clara, confiável e democrática.'
  originalidade: 'A originalidade do Agregador de Pesquisas 2024 está na combinação
    inédita entre tecnologia, rigor estatístico e transparência aplicada à cobertura
    eleitoral. O projeto não apenas reuniu e padronizou os dados de diferentes institutos
    de pesquisa, mas os analisou com metodologias avançadas, como médias móveis e
    ponderadas, normalmente restritas ao meio acadêmico e a consultorias especializadas.
    A ferramenta oferece uma visualização interativa e acessível que permite ao cidadão
    comum acompanhar, com clareza, as tendências eleitorais em 18 cidades do País
    – incluindo aí capitais brasileiras e grandes cidades do Ceará.


    Outro ponto inovador é a abertura dos dados e do código-fonte, prática ainda rara
    em veículos de comunicação brasileiros. Isso garante reprodutibilidade, fiscalização
    e confiança pública no processo analítico. Além disso, o agregador se conecta
    diretamente à produção editorial: os dados alimentaram reportagens no portal,
    jornal impresso e redes sociais, ampliando o alcance do conteúdo e integrando
    a ferramenta a uma estratégia de distribuição e sustentabilidade digital. Ao antecipar
    tendências reais, como a virada no segundo turno em Fortaleza, o agregador mostrou
    que jornalismo de dados pode ser, ao mesmo tempo, preciso, útil e acessível.'
  metodologia: 'O Agregador de Pesquisas O POVO 2024 é uma ferramenta que monitora
    e analisa as tendências eleitorais nas principais cidades brasileiras durante
    as eleições municipais deste ano. Nossa metodologia tem como compromisso a transparência,
    precisão e reprodutibilidade e visa a garantir um olhar claro e consistente das
    intenções de voto, utilizando dados coletados de todas as pesquisas registradas
    nos seguintes locais:


    - Todas as capitais do Nordeste

    - São Paulo, Rio de Janeiro, Belo Horizonte, Porto Alegre e Belém

    - Caucaia, Juazeiro do Norte, Maracanaú e Sobral


    Nossa abordagem vai além da simples compilação de dados; buscamos oferecer uma
    visualização das tendências eleitorais que seja detalhada e confiável. Levamos
    em consideração a credibilidade dos institutos de pesquisa, priorizando institutos
    com base em seu histórico de resultados, e utilizamos diferentes técnicas estatísticas
    para proporcionar aos leitores uma análise profunda e transparente do panorama
    eleitoral.


    A seguir estão descritas todas as etapas e processos relacionados à obtenção de
    dados e ao cálculo de tendências.


    *Cálculos de Tendências*


    Os cálculos de tendências no Agregador de Pesquisas O POVO 2024 seguem um processo
    minucioso e padronizado para assegurar que os dados refletidos sejam precisos
    e confiáveis.


    Não colocamos todos os institutos de pesquisa em pé de igualdade porque é fundamental
    priorizar aqueles com maior credibilidade e histórico comprovado de resultados.
    Desta maneira, o cálculo de tendências se divide em duas etapas principais:


    1. Pesos e Médias Diárias


    O objetivo desta etapa é representar o desempenho de um candidato em um dia com
    uma ou mais pesquisas. Para cada dia em que uma pesquisa é divulgada, calculamos
    uma média ponderada dos resultados diários. Esta média leva em consideração tanto
    o número de pesquisas divulgadas naquele dia quanto os pesos atribuídos aos resultados
    de cada instituto.


    Os institutos de pesquisa foram classificados em quatro grupos distintos, com
    base em sua credibilidade e histórico de resultados:


    - Grupo A: Peso de 1,4 (ou seja, possuem 40% extra de influência sobre a média
    diária)

    - Grupo B: Peso de 1,2

    - Grupo C: Peso de 1

    - Grupo D: Institutos menos conhecidos ou com menor credibilidade, com peso de
    0,8 (ou seja, possuem 20% menos influência sobre a média diária)


    Nossa equipe especializada em cobertura política e eleitoral classificou institutos
    de destaque nos 3 primeiros grupos (A, B e C). Todos os demais institutos são
    classificados no grupo D.


    Instituto – Categoria

    - AtlasIntel Tecnologia de Dados Ltda – Categoria A

    - Datafolha Instituto de Pesquisas Ltda – Categoria A

    - Instituto Paraná de Pesquisas e Análise de Consumidor Ltda – Categoria A

    - Instituto Veritá Ltda – EPP – Categoria C

    - Ipespe – Instituto de Pesquisas Sociais, Políticas e Econômicas – Categoria
    B

    - MDA – Pesquisa de Opinião Pública e Consultoria Estatística Ltda – EPP – Categoria
    A

    - Quaest Pesquisas, Consultoria e Projetos Ltda – Categoria A

    - Real Time Mídia Ltda – Categoria A


    Ao final desta etapa, teremos o desempenho diário (média ponderada) de cada candidato
    em dias com pelo menos uma pesquisa registrada e o respectivo peso do dia (somatório
    dos pesos de cada resultado) a ser considerado na próxima etapa.


    É importante pontuar que o Grupo de Comunicação O POVO também contrata pesquisas
    eleitorais, que estão incluídas no agregador como todas as demais. Neste ano,
    O POVO contratou o instituto DataFolha para Fortaleza e AtlasIntel para as cidades
    de Caucaia, Juazeiro do Norte e Crato.


    2. Média Móvel Ponderada


    Para proporcionar uma visão contínua e suavizada das tendências eleitorais, aplicamos
    uma média móvel ponderada. Esta técnica permite que as variações diárias sejam
    niveladas, oferecendo uma tendência mais clara ao longo do tempo. A média móvel
    é influenciada diretamente pelos pesos dos institutos e a quantidade de pesquisas
    realizadas em cada dia, assegurando que as flutuações momentâneas não distorçam
    a percepção geral das intenções de voto.


    Inicialmente a média móvel é calculada com um tamanho de 10 dias, para suavizar
    as variações diárias nas intenções de voto e no volume de pesquisas publicadas.
    À medida que nos aproximamos dos últimos 10 dias antes da eleição, o tamanho da
    média móvel é reduzido para 5 dias. Essa mudança é feita para refletir mais rapidamente
    as alterações nas intenções de voto que tendem a ocorrer nesse período final.


    *Coleta de Dados*


    A coleta de dados no Agregador de Pesquisas O POVO 2024 é realizada pela equipe
    do OPOVODOC e se divide em três etapas principais:


    Identificação das Pesquisas: Um script automatizado (https://colab.research.google.com/drive/1FY684WKnkw6GRfViT2yymi5QvVoudvnj?usp=sharing)
    verifica diariamente as pesquisas registradas na base de dados aberta do Tribunal
    Superior Eleitoral (TSE), acessível aqui. Este script identifica todas as pesquisas
    registradas para as cidades selecionadas, junto com suas respectivas datas de
    divulgação.


    Compilação dos Resultados: Com base nas datas de divulgação identificadas, nossa
    equipe localiza em portais de notícias e sites dos institutos de pesquisa os resultados
    divulgados desde 01/05/2024, em todos os cenários estipulados para o cargo de
    prefeito.


    Padronização e pré-processamento dos dados: Nesta etapa aplicamos alguns filtros
    e processos para padronização dos nomes dos candidatos, bem como as diferentes
    denominações para opções de Nulos, Brancos ou Indecisos. Como cada instituto trata
    de maneira diversa estes termos, esta etapa é fundamental para a ferramenta.


    *Disponibilização de Dados*


    Na própria ferramenta, além de visualizar graficamente os dados ao simular cenários
    em diversas cidades, o leitor pode baixar os arquivos gerados a partir da coleta
    realizada por nossas equipes. Os dados estão disponíveis — com atualização frequente
    — em formato aberto (.csv), em duas bases: Médias móveis (tendências do Agregador)
    e Resultados Coletados (toda a base de pesquisas coletadas por nossa equipe).


    Para garantir transparência e reprodutibilidade, uma versão pública dos códigos
    utilizados está disponível em: https://observablehq.com/@cajazeiraramos/agregador-o-povo-2024#'
