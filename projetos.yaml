- title: O filme da CIA que preparou o golpe de 64 no Brasil
  project_url: https://vermelho.org.br/coluna/o-filme-da-cia-que-preparou-o-golpe-de-64-no-brasil/
  veiculo: Portal Vermelho
  autoria: Urariano Mota
  data: 3/20/2025
  resumo: 'O filme documentário “Brazil: The Troubled Land”. Ele interpretava a luta
    pela terra em Pernambuco, e foi realizado para a rede de televisão norte-americana
    ABC, com imagens de 1961. The Troubled Land havia sido visto nos Estados Unidos,
    onde alcançara grande repercussão, mas nunca passou nos cinemas ou na televisão
    brasileira.'
  relevância: 'O documentário “Brazil: The Troubled Land” nunca foi visto no Brasil.
    Depois de loocalizá-lo, em pesquisa descobri que Helen Jean Rogers, a diretora
    do documentário, era uma competente cineasta da CIA, ao lado do marido, o produtor
    do filme John Hermes Secondari, também da CIA.'
  originalidade: Na reportagem, pode ser visto o insubstituível valor de uma pesquisa
    coletiva, que revela não só a divulgação das imagens de um filme divulgado costa-a-costa
    dos Estados Unidos, assim como se prova o vínculo da diretora e produtor com a
    CIA.
