name: Atualizar YAML com dados do CSV

on:
  push:
    branches:
      - main

jobs:
  update_yaml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Rodar script para gerar YAML
        run: python atualizar_yaml.py

      - name: Commit e Push se houver mudanças
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add projetos.yaml
          git diff --quiet || (
            git commit -m "Atualiza projetos.yaml com dados do CSV"
            git push
          )
