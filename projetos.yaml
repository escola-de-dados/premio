- title: 'Guardas municipais mataram estas pessoas em SP: foram 197 vítimas em sete
    anos'
  project_url: https://ponte.org/guardas-municipais-mataram-estas-pessoas-em-sp-foram-197-vitimas-em-sete-anos/
  veiculo: Ponte Jornalismo
  autoria: Jeniffer Mendonça
  data: 9/13/2024
  resumo: A reportagem é a segunda publicação de uma série de três matérias que aborda
    como a militarização das guardas municipais tem desconstruído a ideia de uma corporação
    que atue de maneira mais preventiva do que repressiva. O presente material traz
    dados até então não trabalhados e inéditos sobre as mortes praticadas por guardas
    municipais no estado de São Paulo e discute como a falta de fiscalização tem sido
    terreno fértil para uma atuação sem controle.
  relevância: A reportagem foi produzida durante as eleições municipais de 2020, momento
    em que o tema da segurança pública municipal foi e continua sendo a principal
    bandeira de ações de candidatos e prefeituras. Não é à toa que o tema escalou
    para tentativas de mudança dos nomes das guardas após decisão do STF a respeito
    delas. Considerando que dados a nível municipal na área de segurança são escassos,
    inclusive com relação às guardas, trazer dados de letalidade é uma forma de mensurar
    e questionar o quanto essa corporação tem tido aval para descumprir prerrogativas
    constitucionais, já que trazemos dados de vítimas produzidas pelo próprio Estado.
    A reportagem, inclusive, foi utilizada por movimentos sociais no Rio de Janeiro
    a fim de frear o projeto que arma a guarda da cidade por se entender que não há
    monitoramento e controle externo efetivo que possa permitir o armamento dessa
    corporação num município que já é violento e detém de uma complexa rede criminal
    que envolve facções e milícias e que capta agentes da segurança (https://www.instagram.com/p/DIOt1pnAXMV/).
  originalidade: Apesar de termos levantamentos de referência como o Anuário Brasileiro
    de Segurança Pública e Atlas da Violência, essas publicações e o próprio Estado
    brasileiro não têm se debruçado sobre a letalidade produzida pelas guardas municipais.
    Essa corporação tem cada vez mais recebido destaque e sido alvo de projetos políticos
    que carecem de produção de evidências. Por isso, ao trazer à tona dados sobre
    os municípios paulistanos, a reportagem busca também contribuir para a qualificação
    do debate visto que a produção de dados nessa seara é escassa. Essa é uma abordagem
    que ainda não tinha sido vista nem trabalhada em profundidade como a reportagem
    buscou realizar.
  metodologia: Solicitei via Lei de Acesso à Informação a base dados de PowerBi que
    o Ministério Público do Estado de São Paulo divulga sobre letalidade policial
    e que não é possível baixar nem manusear com facilidade (https://abrir.link/HipPz).
    A partir disso, fiz uma limpeza no Google Sheets pois os registros sobre as corporações
    não estava padronizado. Depois, pude filtrar e analisar as ocorrências de mortes
    praticadas por guardas municipais no estado de São Paulo e fazer achados quanto
    aos municípios de registro, se as mortes ocorreram quando o agente estava de serviço
    ou de folga, se as ações tiveram participação da Polícia Militar e/ou da Polícia
    Civil, além de, no caso da cidade de São Paulo, pelos endereços, identificar os
    distritos com o maior número de vítimas. Utilizei a plataforma Flourish para a
    visualização dos dados e, a partir de tutoriais da Escola de Dados, consegui construir
    os templates que formam os mapas do estado e da cidade de São Paulo, já que esses
    mapas não estão disponíveis no site.
