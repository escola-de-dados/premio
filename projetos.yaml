- title: Como lobby do agro emplacou redução de impostos para uso de agrotóxico na
    reforma tributária
  project_url: https://www.bbc.com/portuguese/articles/cn4xwg5jy3po
  veiculo: BBC News Brasil
  autoria: Leandro Prazeres
  data: 12/20/2024
  resumo: A reportagem investiga como a atuação de lobistas ligados ao agronegócio,
    combustíveis fósseis e a montadoras de veículos influenciou diretamente a inclusão
    de benefícios fiscais na reforma tributária aprovada pelo Congresso Nacional.
    A partir da análise de mais de 3 mil emendas parlamentares, a apuração revelou
    que ao menos cinco emendas idênticas, apresentadas por deputados diferentes, foram
    redigidas pela mesma pessoa vinculada ao Instituto Pensar Agro, entidade financiada
    por setores do agro. O trabalho expõe, por meio de análise de metadados e cruzamento
    de dados públicos, como interesses privados moldaram trechos estratégicos da nova
    legislação tributária brasileira.
  relevância: 'O trabalho joga luz sobre um aspecto fundamental da democracia brasileira:
    a transparência na elaboração das leis. Ao revelar que trechos da reforma tributária
    foram influenciados por atores externos ao Congresso, o trabalho contribui para
    o debate sobre a regulamentação do lobby no Brasil e o acesso desigual à formulação
    de políticas públicas. Além disso, ao tratar de benefícios fiscais para agrotóxicos,
    o tema afeta diretamente a saúde pública, o meio ambiente e a arrecadação do Estado.'
  originalidade: A reportagem se destaca por aplicar técnicas de jornalismo de dados
    — em especial a análise de metadados — a documentos legislativos. Essa abordagem
    revelou autoria invisível em emendas parlamentares, algo inédito até então em
    coberturas sobre o tema no Brasil. A metodologia possibilitou identificar o envolvimento
    direto de um lobista do setor do agronegócio na redação de múltiplas propostas
    legislativas, prática que não estava documentada de forma pública nem institucional.
  metodologia: A reportagem se destaca por aplicar técnicas de jornalismo de dados
    — em especial a extração e análise de metadados de grande volume de documentos.
    A metodologia possibilitou identificar o envolvimento direto de um lobista do
    setor do agronegócio na redação de múltiplas propostas legislativas, prática que
    não estava documentada de forma pública nem institucional.
