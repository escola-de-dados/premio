  resumo: A reportagem analisa os dados do Painel de Dados da Ouvidoria Nacional de
    Direitos Humanos, no que diz respeito às violações de direitos humanos na Bahia
    em 2024, tendo como gancho o Dia Mundial da Justiça Social.
  relevância: O trabalho expõe de forma elaborada e minuciosa um recorte da vivência
    dos grupos marginalizados da sociedade baiana. A reportagem destaca e dá visibilidade
    aos grupos sociais vulneráveis, usa fontes confiáveis e traz contexto social dos
    dados.
  originalidade: A reportagem, apesar de estar focada na discriminação de dados abertos,
    correlaciona as informações "frias e condensadas" dos números ao debate de justiça
    social e garantia dos direitos humanos. Além disso, traz a tona uma problema pouco
    explorado pelo jornalismo e jornalismo de dados.
  metodologia: Foram utilizados os dados do Painel de Dados da Ouvidoria Nacional
    de Direitos Humanos (https://www.gov.br/mdh/pt-br/ondh/painel-de-dados), com filtros
    para a Bahia e depois para cada grupo vulnerável analisado, sendo eles, idosos,
    crianças e mulheres.
