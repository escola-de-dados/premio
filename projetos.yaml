- title: PIB de municípios pobres do Piauí sobe até 615% após chegada de usinas de
    energias renováveis
  project_url: https://pinegocios.com.br/noticia/2346-pib-de-municipios-pobres-do-piaui-sobe-ate-615-apos-chegada-de-usinas-de-energias-renovaveis
  veiculo: Piauí Negócios
  autoria: Robert Pedrosa, João Victor Peixe e Emelly Caroline Alves
  data: 7/31/2024
  resumo: Nos últimos dez anos, municípios com os piores indicadores socioeconômicos
    do Piauí têm tido impactos econômicos surpreendentes, graças à instalação de grandes
    complexos de energia renovável. A chegada dos investimentos levou renda, emprego
    e influenciou o surgimento de outras empresas. Por meio de dados e gráficos, a
    reportagem mostra a diferença do PIB e arrecadação dos municípios antes e depois
    da instalação dos complexos.
  relevância: Com a reportagem, foi possível ver visualmente de que forma tais investimentos
    trouxeram oportunidades de emprego e crescimento econômico em município que dificilmente
    atrairiam indústrias por estarem longe de grandes centros e do mercado consumidor.
  originalidade: O trabalho é inédito porque nem o Governo do Estado nem os municípios
    tinham nenhum estudo medindo, por meio de dados, o impacto dos complexos na economia
    dos municípios.
  metodologia: 'Foi feita a comparação do PIB e da arrecadação de impostos municipais
    antes e depois da instalação dos parques.

    Fizemos ainda a mesma comparação do PIB e arrecadação de municípios com as mesmas
    características econômicas, geográficas e populacionais para que o leitor percebesse
    que os municípios que abrigam os complexos cresceram muito mais.'
