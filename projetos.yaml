  ano: '2024'
- title: Territórios indígenas têm, em média, um médico para cada 1.183 habitantes
  project_url: https://noticias.r7.com/cidades/territorios-indigenas-tem-em-media-um-medico-para-cada-1183-habitantes-14092024/
  veiculo: Portal R7
  autoria: Edis Henrique Peres
  data: 9/14/2024
  resumo: 'A reportagem compara o número de médicos presentes nos DSEIS (Distritos
    Sanitários Indígenas) com o número disponível na média brasileira, para identificar
    quais os desafios de se levar atendimento médico para as populações indígenas.
    Nessa análise descobrimos que alguns dos 34 DSEIs chegam a ter um médico para
    mais de 2.000 indígenas.


    É o caso do DSEI Alto Rio Solimões (AM), que tem 30 médicos para uma população
    de 72,5 mil indígenas — o equivalente a um médico para cada 2.400 indígenas —;
    do DSEI de Parintins (AM), 2.400 indígenas por médico; e do DSEI Kaiapó do Mato
    Grosso (MT), com 2.300 indígenas a cada médico.


    Enquanto isso, a média brasileira é de 342 pessoas por médico.'
  relevância: A reportagem mostra os desafios e a desassistência dos povos originários.
    Mesmo com o envio de médicos e programas que tentam incentivar a presença dos
    profissionais nessas regiões, os indígenas ainda enfrentam com a falta de profissionais
    de saúde.
  originalidade: O trabalho faz uma análise diferente das outras que geralmente analisam
    apenas a presença de médicos nas capitais e para a população em geral. O recorte
    de indígenas, especificamente nos DSEIS, costuma ser esquecido. Para conseguir
    fazer essa análise, por exemplo, tivemos que comparar o número estimado da população
    em cada DSEI, o número de médicos enviados para esses locais (dados obtidos via
    LAI), e saber qual a média de médicos no Brasil.
  metodologia: "Para conseguir levantar esses dados, tivemos que fazer um pedido via\
    \ LAI sobre a população estimada em cada DSEI e também o número de médicos que\
    \ atuam em cada um deles. Em seguida, com base nos dados do CFM, comparamos o\
    \ número de médicos previstos em cada estado brasileiro e na média nacional. \n\
    \nTambém fizemos a divisão para saber, na prática, quantos indígenas um único\
    \ médico precisava atender. Com isso, chegamos ao número de um médico para cada\
    \ 2.000 mil indígenas em diversos Dseis do país."
