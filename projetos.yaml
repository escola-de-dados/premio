- title: MonitorA expõe misoginia e transfobia contra candidatas em 2024
  project_url: https://azmina.com.br/reportagens/monitora-expoe-misoginia-e-transfobia-contra-candidatas-em-2024/
  veiculo: Revista AzMina
  autoria: Gabi Coelho, Ana Carolina Araújo, Giulia Santos, Kath Xapi Puri, Ana Carol
    Branco, Bárbara Libório, Clarice Tavares, Catharina Vilela, Fernanda Martins,
    Sergio Spagnuolo, Michel gomes, Henrique Rieger, Sofia Schurig
  data: 9/13/2024
  resumo: A matéria “MonitorA expõe misoginia e transfobia contra candidatas em 2024”
    analisa mais de 4.700 comentários em transmissões ao vivo de debates municipais
    da TV Band, em seis capitais brasileiras – Natal (RN), Goiânia (GO), Belo Horizonte
    (MG), São Paulo (SP), Curitiba (PR) e Porto Alegre (RS). Identificou-se que candidatas
    representam um terço dos participantes, mas receberam 51,1% dos ataques, distribuídos
    entre insultos (24,3%) e ataques diretos (11%), classificados de forma diferenciada
    pelo MonitorA . Os dados expõem violência política de gênero online voltada a
    mulheres cis e trans.
  relevância: A reportagem mostra que as candidatas femininas recebem a maioria dos
    ataques (51,1%), evidenciando um padrão estrutural de misoginia, e detalha os
    ataques transfóbicos com contexto. O levantamento serve como base para práticas
    e políticas públicas que enfrentem a violência política de gênero no ambiente
    digital, sendo um subsídio essencial para ferramentas de denúncia, moderação de
    plataformas digitais e legislação a esse respeito.
  originalidade: "A reportagem traz enfoque inédito em debates eleitorais oficiais\
    \ transmitidos em canais no YouTube de emissoras de TV, integrando registro ao\
    \ vivo e análise dos comentários do público, hábito que se convencionou chamar\
    \ de duas telas. \nO trabalho também faz uma distinção refinada entre insultos\
    \ e ataques, sob critérios como misoginia, transfobia e etarismo, construída a\
    \ partir de uma taxonomia sociopolítica inovadora  desenvolvida por profissional\
    \ linguista especializada em questões de gênero."
  metodologia: Foram monitorados os vídeos de seis debates entre candidatas e candidatos
    a prefeituras de capitais brasileiras promovidos na TV Band, transmitidos pelo
    YouTube. Entre os dias 8 de agosto, quando aconteceu o confronto, e o dia 21 de
    agosto, coletamos 154.754 comentários feitos na transmissão ao vivo e nos comentários
    fixos do YouTube. A partir de um léxico composto de palavras potencialmente ofensivas,
    misóginas, sexistas, racistas, lesbo, trans e homofóbicas, coletamos 10.521 comentários
    neste mesmo intervalo, que passaram por um olhar humano e contextualizado para
    selecionar o que de fato eram ataques e insultos. Excluindo linhas repetidas desta
    amostra inicial, além de alguns termos que geraram altas taxas de falsos positivos,
    fizemos uma análise qualitativa de 4.759 comentários. Todos foram lidos individualmente
    por um grupo de 6 analistas, a fim de identificar se o conteúdo era ou não um
    ataque, ou insulto direcionado a candidatas, candidatos, jornalistas, políticos
    que não são candidatos, veículos de mídia, grupos políticos ou eleitores. Realizamos
    análises quantitativas após a codificação manual. As porcentagens apresentadas
    na matéria podem se referir ao total de comentários analisados ou ao total de
    ofensas identificadas, o que será sempre descrito ao longo do texto e infográficos.
