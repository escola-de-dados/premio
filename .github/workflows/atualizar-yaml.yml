name: Atualizar YAML com dados do CSV

on:
  push:
    branches:
      - main

jobs:
  update_yaml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Verificar diretório atual (PWD)
        run: pwd  # Isso vai imprimir o diretório onde o script está sendo executado

      - name: Listar arquivos no diretório
        run: ls -l  # Isso vai listar todos os arquivos do diretório para ver se o 'projetos.yaml' está presente

      - name: Rodar script para gerar YAML
        run: python atualizar_yaml.py

      - name: Verificar se o arquivo foi criado após o script
        run: ls -l projetos.yaml  # Isso vai listar 'projetos.yaml' se ele foi criado corretamente

      - name: Adicionar projetos.yaml ao Git
        run: |
          git status  # Verifique se o arquivo projetos.yaml foi detectado pelo Git
          git add projetos.yaml
          git status  # Verifique novamente após o git add

      - name: Commit e Push se houver mudanças
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add projetos.yaml  # Adiciona o arquivo ao índice
          git status  # Verifique o status para garantir que o arquivo está no índice
          git diff --quiet || (  # Só faz commit se houver diferença
          git commit -m "Atualiza projetos.yaml com dados do CSV" && git push
          )
