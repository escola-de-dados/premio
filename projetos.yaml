  ano: '2024'
- title: O Cerrado e a incrível jornada das águas
  project_url: https://ambiental.media/cerrado-jornada-das-aguas
  veiculo: Ambiental Media
  autoria: 'Reportagem: Letícia Klein — leticiamklein@gmail.com; Arte: Luiz Iria —
    contato@luiziriainfographics.com e Miguel Vilela – miguel@ambiental.media; Edição:
    Ronaldo Ribeiro — ronaldo.ribeiro100@gmail.com; Design:  Sofia Beiras — sof.beiras@gmail.com
    e Rodolfo Almeida — rodolfoalmd@gmail.com; Desenvolvimento web: Lucas Alves —
    lucas@ambiental.media; Coordenação: Miguel Vilela — miguel@ambiental.media; Direção:
    Thiago Medaglia — thiago@ambiental.media'
  data: 9/11/2025
  resumo: "“O Cerrado e a incrível jornada das águas” é uma reportagem ilustrada e\
    \ interativa que revela, por meio de dados, ciência e arte visual, o papel fundamental\
    \ do Cerrado no ciclo hidrológico que abastece boa parte do Brasil e do continente.\
    \ A narrativa leva o leitor a uma jornada pelas rotas invisíveis da água que brota\
    \ das profundezas do solo, percorre as raízes da vegetação nativa e se conecta\
    \ com a atmosfera, influenciando as chuvas que irrigam os campos, enchem os rios\
    \ e sustentam a vida em diferentes biomas. O que conseguimos criar é, na verdade,\
    \ uma arte interativa baseada em dados que retrata o ciclo hidrológico do Brasil\
    \ e a relação entre a floresta invertida no Cerrado, onde as árvores baixas têm\
    \ raízes profundas, e os rios voadores da Amazônia, criados pela evapotranspiração\
    \ da maior floresta tropical do planeta. \n\nA reportagem integra o projeto especial\
    \ Cerrado — O elo sagrado das águas do Brasil e tem como objetivo conscientizar\
    \ o público sobre a importância do bioma e os riscos que sua destruição representa\
    \ para o abastecimento de água em escala nacional – . O trabalho combina apuração\
    \ jornalística rigorosa, pesquisa em dados e estudos científicos, design gráfico,\
    \ ilustração, dataviz e desenvolvimento web para traduzir uma dinâmica ambiental\
    \ complexa em uma experiência visual acessível, sensível e mobilizadora, capaz\
    \ de influenciar tomadores de decisão."
  relevância: 'Conhecido como o "coração das águas do Brasil", o Cerrado ocupa 25%
    do território nacional e abastece 8 das 12 regiões hidrográficas brasileiras.
    Situado, em grande parte, em altitudes elevadas, seu relevo favorece o fluxo de
    rios e aquíferos subterrâneos. É responsável por 90% da vazão do rio São Francisco
    e por praticamente toda a água que mantém vivo o Pantanal. Sustenta, inclusive,
    rios gigantes da Amazônia, como o Xingu e o Tapajós, uma intrincada e interdependente
    rede hídrica que é revelada ao público, de forma didática e sensível, por meio
    de um infográfico ilustrado e interativo criado para a reportagem “A Incrível
    Jornada das Águas”.


    Apesar de sua importância estratégica, o Cerrado tornou-se o epicentro da expansão
    do agronegócio voltado à exportação de commodities, que já ocupa quase metade
    da área do bioma, segundo o MapBiomas. A situação se agrava diante da crise climática
    e da legislação ambiental menos protetiva que a da Amazônia, o que levou especialistas
    a chamá-lo de “bioma do sacrifício”.


    Em um momento em que o bioma sofre taxas de desmatamento superiores às da Amazônia
    e carece de políticas de proteção efetivas, a reportagem preenche uma lacuna crítica
    na cobertura jornalística brasileira. A estratégia de disseminação do conteúdo,
    com versões adaptadas para redes sociais, foi pensada para ampliar seu alcance
    e potencial de impacto, fortalecendo o debate público e municiando a sociedade
    com dados confiáveis sobre a crise hídrica no coração do Brasil.'
  originalidade: "A originalidade da reportagem reside na forma como ela combina ciência,\
    \ arte e tecnologia para tornar compreensível uma dinâmica ambiental de alta complexidade.\
    \ A escolha por uma narrativa visual — conduzida por ilustrações digitais inspiradas\
    \ em storyboards manuais — permitiu criar um produto jornalístico ao mesmo tempo\
    \ informativo e visualmente impactante.\n\nPara além da linguagem tradicional\
    \ do jornalismo de dados, a equipe apostou numa abordagem imersiva, didática e\
    \ sensível. A utilização de inteligência artificial para acelerar a produção de\
    \ elementos gráficos, posteriormente refinados manualmente, é outro diferencial\
    \ que combina inovação tecnológica com controle editorial. \n\nAlém disso, o projeto\
    \ inaugura uma abordagem que trata a água não como um recurso isolado, mas como\
    \ um elo entre ecossistemas, culturas e políticas públicas. Essa perspectiva interbioma\
    \ ajuda a lançar luz sobre dinâmicas invisíveis que sustentam a vida em grande\
    \ parte do território brasileiro."
  metodologia: "O projeto combinou diferentes etapas: apuração científica, pesquisa\
    \ iconográfica, desenvolvimento artístico e construção interativa. \n\nA primeira\
    \ fase envolveu a leitura crítica de estudos científicos sobre o ciclo hidrológico\
    \ nos biomas brasileiros, especialmente a relação entre vegetação nativa, infiltração\
    \ de água no solo e formação de aquíferos e rios. Foram realizadas entrevistas\
    \ com especialistas nas áreas de climatologia, ecologia e hidrologia, que ajudaram\
    \ a construir o roteiro da narrativa. \n\nA segunda fase consistiu na criação\
    \ de um storyboard desenhado à mão, que guiou a construção das ilustrações digitais.\
    \ O ilustrador Luiz Iria utilizou o Photoshop e contou com o auxílio de uma IA\
    \ generativa para a criação de modelos base da paisagem, que foram posteriormente\
    \ ajustados com elementos específicos da fauna, flora e geografia do Cerrado.\
    \ O design foi realizado em colaboração com especialistas em UX/UI, e a versão\
    \ final foi desenvolvida em plataforma web responsiva, permitindo a interação\
    \ com o conteúdo. \n\nA equipe multidisciplinar incluiu jornalistas, designers,\
    \ programadores e editores, e o produto foi concebido para ser acessível tanto\
    \ em desktop quanto em dispositivos móveis. Por fim, o projeto foi acompanhado\
    \ por uma estratégia de distribuição que incluiu parcerias com organizações socioambientais,\
    \ produção de materiais derivados (como gifs e cards ilustrados) e integração\
    \ com a plataforma de dados sobre o Cerrado da Ambiental Media, recém lançada."
  uf: SP
