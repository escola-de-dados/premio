- title: Como ocorrem os deslizamentos. E como reduzir riscos
  project_url: https://www.nexojornal.com.br/grafico/2025/02/14/deslizamento-de-terra-por-que-acontece-e-o-que-fazer
  veiculo: Nexo Jornal
  autoria: Giovanna Hemerly, Mariana Vick e Gabriel Zanlorenssi
  data: 2/14/2025
  resumo: 'O material explica os fatores naturais e humanos que provocam movimentos
    de massa no Brasil, os famosos deslizamentos de terra. Esses eventos são mais
    comuns nos períodos de chuva e são uma das principais causas de fatalidades relacionadas
    a eventos climáticos no país.


    O conteúdo combina explicações científicas acessíveis com gráficos didáticos e
    mapas interativos que identificam as áreas de maior risco no país. Dados oficiais
    foram utilizados para mostrar a extensão da vulnerabilidade geológica nacional,
    com destaque para os municípios mais atingidos.'
  relevância: "O Brasil enfrenta tragédias recorrentes com deslizamentos em épocas\
    \ de chuvas, causando mortes evitáveis e perdas materiais significativas. Populações\
    \ vulneráveis são mais afetas por essas tragédias. \n\nEste trabalho cumpre uma\
    \ função pública ao informar com clareza como esses desastres se formam, onde\
    \ ocorrem e como podem ser mitigados. O material também orienta os leitores sobre\
    \ como verificar se vivem em áreas de risco.\n\nO artigo apresenta dados técnicos\
    \ e informações geológicas em conteúdo de fácil compreensão para o público geral,\
    \ que serve até como referência educacional. Há potencial direto de impacto na\
    \ prevenção de riscos e no debate sobre políticas de urbanização e meio ambiente."
  originalidade: O material se diferencia ao unir linguagem acessível, infografia
    e dados em uma abordagem que combina ciência e serviço público. A narrativa evita
    usar um noticioso ou alarmista e propõe uma explicação estruturada do fenômeno,
    sem deixar de apresentar informações práticas. Amplia o alcance e a utilidade
    do conteúdo.
  metodologia: As ilustrações foram produzidas a partir de referências acadêmicas
    sobre o tema. As visualizações de dados utilizam informações do Serviço Geológico
    do Brasil (SGB/CPRM), disponíveis por estado e município. Os dados foram tratados
    e cruzados em R e finalizados no Adobe Illustrator.
