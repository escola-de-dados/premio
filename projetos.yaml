- title: 'IDEB 2023: o Pará aprendeu a ganhar boa nota na avaliação tal qual um aluno
    que não estuda e escancara limitações do indicador'
  project_url: https://www.amazonialatitude.com/2024/10/15/ideb-2023-para-boa-nota-aluno-nao-estuda-escancara-limitacoes-indicador/
  veiculo: Amazônia Latitude
  autoria: Felipe Garcia Passos
  data: 10/15/2024
  resumo: A investigação buscou entender quais foram as ações empreendidas pela Secretaria
    de Educação do Estado do Pará (SEDUC-PA) que geraram um salto no Índice de Desenvolvimento
    da Educação Básica (IDEB) do ensino médio do estado do Pará da 26ª posição em
    2021 para a 7ª posição em 2023. A nota IDEB é composta pela multiplicação da nota
    média obtida na Prova Brasil vezes o percentual de aprovação dos estudantes (fluxo
    escolar). A investigação mostrou que o salto foi produzido pela taxa de fluxo
    escolar atingida, a maior do Brasil e jamais conquistada antes por nenhum estado
    na história do indicador. O progresso dos estudantes na prova não foi significativo.
    O fluxo escolar expressivo foi produzido pela aprovação automática de absolutamente
    todos os estudantes dos primeiros e segundos anos da etapa em todas as escolas
    da SEDUC-PA. Isso só foi possível porque não houve contabilização da frequência
    de presença/ausência dos estudantes, desviando assim do problema crônico da evasão
    escolar que, na etapa média, tem sido desafiador em todo o Brasil e especialmente
    em territórios da Amazônia, onde as barreiras sociais se somam geográficas e ambientais.
    O mecanismo adotado, além de colocar em risco a formação dos jovens, é ilegal,
    pois a LDBEN (Lei nº 9.394/1996) determina que aqueles com menos de 75% de presença
    devem ser reprovados por falta. O salto no IDEB foi, essencialmente, manipulado
    ilegalmente pelo governo do estado.
  relevância: Esclarecer e divulgar para a sociedade de uma forma acessível quais
    foram os mecanismos adotados pela SEDUC-PA que manipularam o salto do ensino médio
    no principal indicador da educação básica no Pará - IDEB - entre 2021 e 2023.
  originalidade: Em tempos de forte divulgação e credibilização do IDEB como indicador
    de avaliação da qualidade da educação básica pública, o texto da investigação
    traz uma série de dados e uma análise de contexto que explicam para a sociedade
    como tal recurso tem sido manipulado pelo governo, que não dá a transparência
    necessária a suas ações, e usa dos resultados questionáveis do IDEB para enaltecer
    uma melhoria da educação que não corresponde de fato a progressos nos processos
    de ensino e de aprendizagem das escolas.
  metodologia: A investigação fez o uso de base de dados públicas, notadamente do
    IDEB e do ENEM, que estão disponível no site do Instituto Nacional de Estudos
    e Pesquisas Educacionais Anísio Teixeira (INEP) vinculado ao Ministério da Educação
    (MEC), de leis e bibliografia da área e, indiretamente, de entrevistas de nossa
    pesquisa de doutorado desenvolvida no Programa de Pós-Graduação em Geografia Humana
    realizado na Universidade de São Paulo.
