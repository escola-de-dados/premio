  ano: '2024'
- title: Estado e maiores municípios de SC descartaram mais de 1 milhão de doses de
    vacinas em 3 anos
  project_url: https://g1.globo.com/sc/santa-catarina/noticia/2025/06/02/estado-maiores-municipios-de-sc-descartaram-vacinas.ghtml
  veiculo: G1 Santa Catarina
  autoria: André Lux, Camilla Martins e John Pacheco
  data: 6/2/2025
  resumo: A reportagem traz um levantamento exclusivo junto à Secretaria de Saúde
    de Santa Catarina e às Secretarias de Saúde dos 10 maiores municípios do estado.
    Os dados levantados revelam que nos últimos três anos - 2022 a 2024, pelo menos
    1,2 milhão de vacinas, contra diversas doenças, foram jogadas fora no estado.
    A reportagem traz em detalhes o que cada município alegou como justificativa para
    os descartes, o prejuízo financeiro que os descartes representam e busca apontar
    o que pode ser feito - pela sociedade e pelas autoridades públicas em saúde -
    para que estes números sejam reduzidos.
  relevância: Além da quantidade de doses, o levantamento buscou também trazer o prejuízo
    financeiro aos cofres públicos causado pelos descartes de vacina. Alguns municípios
    não enviaram esta informação, mesmo assim foi possível revelar um prejuízo de
    pelo menos R$8,7 milhões. Um dos principais motivos apontados pelos municípios
    e pelo estado para os descartes foi a baixa adesão às campanhas de imunização,
    o que reforçou e trouxe mais um motivo para a população catarinense buscar às
    vacinas. Para além disso, a reportagem ouviu especialistas que trouxeram questões
    técnicas pontuais, de responsabilidade dos gestores em saúde, que podem ajudar
    a melhorar esta realidade de desperdício de vacinas.
  originalidade: 'O levantamento foi feito de forma inédita em Santa Catarina, revelando
    uma realidade até então desconhecida e levantando um debate público sobre o assunto.
    Além de duas grandes reportagens de TV, que estão inclusas na matéria do G1, a
    apuração rendeu também um conteúdo em formato de áudio, que foi ao ar na programação
    da Rádio CBN Floripa: https://soundcloud.com/cbnfloripa/materia-especial-andre-lux-mais-de-1-milhao-de-doses-de-vacina-foram-descartadas-em-sc-nos-ultimos-tres-anos-03-06-25.'
  metodologia: Foram mais de quatro meses de apuração. Para ter acesso aos dados,
    que não são abertos ao público, utilizamos a Lei de Acesso à Informação. Foram
    feitos pedidos individuais à Secretaria de Saúde de SC e às Secretarias de Saúde
    dos dez maiores municípios do estado. Algumas das prefeituras relutaram em entregar
    os dados, o que demandou esforços em cobranças e recursos via LAI. Ainda assim,
    algumas prefeituras enviaram os dados apenas de forma parcial e, uma delas, de
    forma inconclusiva. Estes detalhes, relevantes ao leitor por revelarem como as
    autoridades públicas lidam com os pedidos de informação, também foram incluídos
    na reportagem.
