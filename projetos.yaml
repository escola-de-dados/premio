- title: A morte de Soledad Barrett, um dos mais perversos crimes da ditadura brasileira
  project_url: https://vermelho.org.br/coluna/a-morte-de-soledad-barrett-um-dos-mais-perversos-crimes-da-ditadura-brasileira/
  veiculo: Portal Vermelho
  autoria: Urariano Mota
  data: 2/7/2025
  resumo: 'No STF, o Ministro Flávio Dino esclareceu: não existe anistia para o crime
    de ocultação de cadáver, porque é um crime permanente, que continua a se consumar
    no presente, quando não devidamente esclarecido. Este é o caso do corpo da paraguaia,
    guerreira internacional, internacionalista   Soledad Barrett Viedma, assassinada
    no Recife em 1973.'
  relevância: A história não chegou a seu fim. Para Soledad Barrett, os dados continuam
    a rolar, como cantava Cazuza. A brava guerrilheira, poliglota, poeta, atraiçoada
    pelo marido, o agente duplo José Anselmo dos Santos, Cabo Anselmo, que a entregou
    grávida para a morte, ainda clama justiça. Musa do poeta Mario Benedetti, narrada
    em meu livro “Soledad no Recife”, Soledad merece urgente um esclarecimento do
    crime que deixou seus restos mortais insepultos.
  originalidade: Se além de Fleury e Cabo Anselmo, não temos os nomes dos seus torturadores,
    caberia uma responsabilização dos peritos legistas que no Recife assinaram a FARSA
    da perícia tanatoscópica. Pesquisei com calma e paciência nos arquivos da Comissão
    Estadual da Memória e Verdade Dom Helder Câmara e pude ver. Os peritos João Bosco
    Rolim Araruna e Agrício Salgado Calheiros, mais a testemunha policial Maria da
    Penha Procópio de Almeida assinam o documento.
  metodologia: Já antes da publicação do meu livro "Soledad no Recife" em 2009, pesquiso
    sobre o massacre da Granja São Bento de 1973. Para isso, escuto pessoas que a
    conheceram, documentos, arquivos e tudo o que se relacione à sua pessoa e demais
    assassinados.
  uf: GO
  tipo_inscricao: Dados Abertos
  formato: Online
  category: Dados Abertos
