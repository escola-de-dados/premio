- title: Xarta
  project_url: https://nucleo.jor.br/institucional/2024-11-25-nucleo-lanca-xarta-ferramenta-para-incluir-contextos-em-reportagens/
  veiculo: Núcleo Jornalismo
  autoria: Felippe Mercurio, Henrique Rieger, Michel Gomes, Rafael Calpena, Sérgio
    Spagnuolo, Jade Drummond, Heloisa Botelho, Milena Giacomini, Rodolfo Almeida e
    Aleksandra Ramos
  data: 11/25/2024
  resumo: 'O Xarta é um mini-CMS de código aberto para manter o conteúdo e contextos
    de reportagens sempre atualizados.


    A ferramenta inovadora facilita o processo de criação, inserção e atualização
    de contextos ao mesmo tempo em múltiplas reportagens. Assim, as redações podem
    publicar reportagens com contextos mais completos e sempre atualizados sem a necessidade
    de retrabalho.


    Na prática, o Xarta permite a criação e publicação de cards de texto que podem
    ser embedados em diversas reportagens. Basta a atualização de um único card para
    que todas as publicações em que ele foi utilizado tenham o texto atualizado.

    Assim, você não precisa reescrever ou copiar e colar diversas vezes o contexto
    de um mesmo tema, facilitando que as novas apurações tenham contextos mais precisos.
    Também não tem necessidade de voltar em reportagens antigas manualmente para incluir
    informações importantes de contexto, mantendo os textos atualizados por mais tempo.


    Um exemplo real do Núcleo: o bloqueio da rede social X no Brasil teve diversos
    desdobramentos ao longo de um mês. Em vez de criar e atualizar os contextos de
    cada uma das reportagens sobre o assunto, a gente utilizou o Xarta. Assim, garantimos
    que os textos novos tivessem o contexto mais preciso e atual sobre o assunto,
    e que mesmo as reportagens antigas estivessem sempre atualizadas.


    A ideia é que veículos e organizações possam, com permissão, usar contextos uns
    dos outros, criando um ecossistema dentro do jornalismo brasileiro.


    A ferramenta foi projetada para ser simples de implementar e fácil de usar.  As
    redações podem combiná-lo com WordPress ou qualquer outro sistema de gerenciamento
    de conteúdo que permita incorporar código HTML.


    Esse projeto foi desenvolvido com apoio do Codesinfo (Fundo de Inovação contra
    a Desinformação), uma realização do Projor e da Google News Initiative.

    O Xarte é uma ferramenta de código aberto e o acesso à solução está disponível
    no site do Codesinfo (https://codesinfo.com.br/solucoes/nucleo-jornalismo-2/?ref=nucleo.jor.br),
    com documentação completa de uso e repositório aberto no Github (https://github.com/voltdatalab/xarta/?ref=nucleo.jor.br).


    Desde o lançamento, a ferramenta foi aprimorada e agora tem versões em inglês
    e espanhol, além do desenvolvimento do One-click-app, com o Caprover, que permite
    que até mesmo quem não é desenvolvedor crie as próprias plataformas de Xartas.
    (https://codesinfo.com.br/novos-aprimoramentos-do-xarta-incluem-versoes-em-ingles-e-espanhol-e-aplicativo-para-facilitar-adocao-dos-cartoes-de-contexto/)'
  relevância: 'A ferramenta foi criada para ajudar a combater a desinformação e mitigar
    dois problemas: o uso de reportagens antigas de forma maliciosa e a falta de contexto
    de qualidade nas publicações atuais, o que pode facilitar a manipulação de informações.'
  originalidade: A ferramenta é experimental e única no mercado, não existe nenhuma
    outra solução similar no jornalismo brasileiro. Ela foi criada para solucionar
    uma dor do próprio Núcleo no processo de produção jornalística, especialmente
    em coberturas longas sobre um mesmo assunto, em que se tornava necessário voltar
    constantemente em conteúdos antigos em busca de contextos e se gastava um tempo
    extra de retrabalho, reescrevendo o contexto de um mesmo cenário repetidas vezes.
    Enquanto isso, notamos que nem sempre o conteúdo mais recente de uma cobertura
    é o mais acessado, o que pode dificultar o acesso à informação mais atual e precisa
    e aumenta o potencial de uso desse conteúdo para desinformação.
  metodologia: 'Desenvolvemos o Xarta utilizando Ghost.js, um CMS (sistema de gerenciamento
    de conteúdo) open-source muito popular. Com isso, reduzimos a superfície de ataque
    do nosso aplicativo ao utilizar as APIs de autenticação (login) e publicação já
    consolidadas pelo Ghost.


    Utilizando Next.js, criamos um painel de gerenciamento de cards disponível em
    3 idiomas: português, inglês e espanhol. É possível visualizar o card, salvá-lo
    como rascunho e também obter o código embedável (iframe) ao publicar o card.


    O projeto é de código aberto, então você pode verificar o código no GitHub (https://github.com/voltdatalab/xarta/).


    O Xarta é dockerizável por padrão e também possui um script para facilitar a sua
    instalação presente no repositório (é um "setup helper"). Outra opção de instalação
    automatizada é via 1-Click-App no CapRover.'
