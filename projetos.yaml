- title: 'Microplásticos: poluição toma conta dos rios e igarapés em Manaus'
  project_url: https://agenciajamaxi.com.br/microplasticos-poluicao-toma-conta-dos-rios-e-igarapes-em-manaus/
  veiculo: Agência Jamaxí
  autoria: Ana Kelly Franco
  data: 9/19/2024
  resumo: 'A matéria jornalística mostra como a poluição plástica em Manaus, com destaque
    para a presença de microplásticos em rios e igarapés do Amazonas. A pesquisa analisada
    na reportagem é coordenada pela ecotoxicologista Dra. Andrea Waichman revelou
    que os microplásticos encontrados em Manaus são similares aos de rios altamente
    poluídos, como o Yangtze, na China. Entre as principais fontes de microplásticos
    estão o desgaste de pneus, a fragmentação de plásticos urbanos, efluentes de estações
    de tratamento de esgoto, lavagem de roupas sintéticas, resíduos de construção,
    produtos de higiene, e o descarte inadequado de lixo.


    Manaus, segundo o Panorama dos Resíduos Sólidos 2021, é uma das cidades brasileiras
    com maior vazamento de plásticos para o meio ambiente. A falta de saneamento básico
    e tratamento de resíduos é apontada como uma das principais causas. Outro destaque
    da matéria, é que a presença de microplásticos já foi encontrado dentro dos estômagos
    de em espécies de peixes consumidas pelos amazonenses.'
  relevância: A relevância da matéria está no alerta que faz sobre a grave contaminação
    plástica em Manaus e na Amazônia. O leitor confere na matéria dados científicos
    recentes, mapas e dados sobre poluição plásticas e reciclagem.
  originalidade: A originalidade da matéria é o tema microplásticos em Manaus e na
    Região Amazônica, que é uma tema importante e muitas vezes esquecidos na mídia.
    A matéria tem fontes locais, quais as fontes de microplásticos mais comum, o perigo
    desses microplásticos, principalmente em relação no perigo de consumir peixes
    contaminados.
  metodologia: Análise de dados de poluição plástica, do Atlas da Reciclagem., e do
    Panorama dos Resíduos Sólidos 2021, divulgado pela Abrelpe,
