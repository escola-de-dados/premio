- title: Bahia registra mais de 1.600 casos de estupro contra crianças e jovens em
    2024; polícia reporta apenas 30% das denúncias
  project_url: https://www.bahianoticias.com.br/noticia/304850-bahia-registra-mais-de-1600-casos-de-estupro-contra-criancas-e-jovens-em-2024-policia-reporta-apenas-30-das-denuncias
  veiculo: Bahia Notícias
  autoria: Eduarda Pinto
  data: 5/20/2025
  resumo: A presente reportagem explora os dados do Painel da Ouvidoria Nacional de
    Direitos Humanos, sobre a violação de direitos sexuais contra crianças e jovens
    e compara os números com os registros formais de denúncias na Secretária de Segurança
    Pública da Bahia (SSP-BA). É por meio da notável subnotificação dos dados comparados
    que a reportagem se desdobra para falar sobre educação sexual e o papel das escolas
    no combate a exploração sexual infantojuvenil.
  relevância: A relevância do tema está especialmente no seu tema central, que é a
    exploração sexual infantojuvenil na Bahia e em todo o país. No entanto, a notícia
    se destaca pelo uso de dados de duas fontes oficiais, sendo elas a SSP-BA e o
    Ministério dos Direitos Humanos, além de ter um enfoque educativo sobre o tema.
  originalidade: A explora o contraste entre a realidade social e os dados computados
    pelo poder público e por meio dos detalhamento dos dados disponíveis publicamente,
    busca contextualizar os números com a realidade local. Além disso, por meio da
    entrevista com um educador, traz o foco para o combate da exploração sexual e
    o incentivo a educação sexual nas escolas
  metodologia: Foram utilizados dados do Painel Nacional dos Direitos Humanos (https://www.gov.br/mdh/pt-br/ondh/painel-de-dados)
    e dados da Secretarai de Segurança Pública da Bahia via Lei de Acesso a Informação
    (LAI).
