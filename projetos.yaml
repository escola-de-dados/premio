- title: 10 cidades têm mais inscritos no Bolsa Família do que casas
  project_url: https://www.poder360.com.br/poder-economia/10-cidades-tem-mais-inscritos-no-bolsa-familia-do-que-casas/
  veiculo: Poder360
  autoria: Rafael Barbosa e Paulo Silva Pinto
  data: 2/12/2025
  resumo: Compilamos informações sobre beneficiários do Bolsa Família e cruzamos com
    o total de casas em todas as cidades do Brasil para identificar possíveis discrepâncias
    ou desvios no programa social, um dos mais relevantes do mundo. Foram encontradas
    10 cidades com fortes indícios de fraudes. E outras com um percentual muito elevado
    de residências dependentes do programa social. Pesquisadores consultados pela
    reportagem alertaram para problemas de fiscalização.
  relevância: O trabalho realizado pela reportagem põe luz a um problema e sugere
    cruzamentos que podem aumentar a segurança e evitar fraudes no Bolsa Família.
    Também visa a incentivar um debate sobre fiscalização mais rigorosa, para assegurar
    que os recursos pagos pelo governo federal cheguem às famílias que realmente precisam,
    aquelas que estão em situação de vulnerabilidade social.
  originalidade: A reportagem inova ao trazer à tona com mais força um debate sobre
    a eficiência do Estado e as possibilidades de economia e realocação de recursos
    com simples cruzamento de dados e fiscalização de inúmeros programas governamentais,
    não só os sociais. A utilização de dados abertos também incentiva a mídia e pesquisadores
    a buscarem outros destaques que possam ser interessantes para o aperfeiçoamento
    do Bolsa Família e de outras iniciativas.
  metodologia: 'Foram usadas duas bases de dados: uma do Bolsa Família, do Ministério
    do Desenvolvimento Social; e outra do IBGE, referente ao Censo de 2022. Os links,
    respectivamente, são esses: https://dados.gov.br/dados/conjuntos-dados/bolsa-familia
    e https://sidra.ibge.gov.br/pesquisa/censo-demografico/demografico-2022/universo-tipos-de-domicilios


    Depois de compiladas essas informações, foi feito um cruzamento e aplicado um
    filtro para checar em quais cidades poderia haver problemas. Antes da publicação,
    vários pesquisadores foram consultados para ajudar os repórteres a entender o
    que se passava e possíveis problemáticas nessa análise. Todos os poréns foram
    citados no texto.'
