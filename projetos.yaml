- title: 'Muito além das esquinas: trans e travestis trabalhadoras sexuais no Rio
    de Janeiro'
  project_url: https://adiadorim.org/reportagens/2025/03/muito-alem-das-esquinas-trans-e-travestis-trabalhadoras-sexuais-no-rio-de-janeiro/
  veiculo: Agência Diadorim
  autoria: Francielly Barbosa
  data: 3/13/2025
  resumo: A reportagem aborda a dificuldade de acesso ao emprego formal e as violências
    às quais estão submetidas mulheres trans e travestis trabalhadoras sexuais no
    estado do Rio de Janeiro, além de mostrar que o Estado brasileiro não produz dados
    sobre essas populações nessa ocupação.
  relevância: O trabalho explora dados - e a ausência de dados - sobre a população
    trans e travesti no trabalho sexual. Nesse sentido, a reportagem tem relevância
    por mostrar a ausência de dados sobre o assunto, mesmo diante da violência física
    e psicológica enfrentada por essas mulheres. Ao longo da apuração, foi possível
    descobrir que até mesmo os órgãos oficiais contam com a sociedade civil para produção
    de estatísticas sobre população trans e travesti no Brasil.
  originalidade: O trabalho se destaca por utilizar depoimentos pessoais associados
    a dados levantados a partir do Sistema de Informação de Agravos de Notificação
    (Sinan), do Ministério da Saúde (MS), e pedidos de Lei de Acesso à Informação
    (LAI) para explorar um assunto ainda pouco debatido, a segurança, o acesso ao
    mercado de trabalho e a saúde de mulheres trans e travestis trabalhadoras sexuais
    no Rio de Janeiro.
  metodologia: Para a construção da reportagem, foram feitas entrevistas com trabalhadoras
    sexuais e especialistas cis e transgêneros com estudos voltados para a violência
    contra a população trans e travestis e para o acesso aos serviços públicos de
    saúde por esses grupos. Também foram questionados, via Lei de Acesso à Informação
    (LAI), os ministérios do Trabalho e Emprego (MTE), dos Direitos Humanos e da Cidadania
    (MDHC) e da Saúde, e a Secretaria de Estado de Desenvolvimento Social e Direitos
    Humanos (SEDSODH) do Rio de Janeiro. Por fim, foram analisados dados do Sistema
    de Informação de Agravos de Notificação (Sinan) sobre violência contra a população
    trans e travesti.
