- title: Candidatos disputam eleição com mandados de prisão em aberto
  project_url: https://g1.globo.com/politica/eleicoes/2024/eleicao-em-numeros/noticia/2024/09/18/exclusivo-eleicoes-2024-candidatos-alvos-de-mandados-de-prisao-em-aberto.ghtml
  veiculo: Portal g1
  autoria: Judite Cypreste e Camila da Silva
  data: 9/18/2024
  resumo: "Um cruzamento inédito feito pelo g1 revelou que ao menos 61 candidatos\
    \ nas eleições municipais de 2024 eram alvos de mandados de prisão em aberto.\
    \ Entre os casos revelados estavam candidatos com acusações de crimes como homicídio,\
    \ estupro de vulnerável, estelionato e associação criminosa. Três destes candidatos\
    \ eram procurados pelo STF pelos ataques golpistas de 8 de janeiro de 2023 (a\
    \ reportagem sobre esses casos foi publicada aqui: (https://g1.globo.com/politica/eleicoes/2024/eleicao-em-numeros/noticia/2024/09/14/procurados-da-justica-pelo-8-de-janeiro-se-lancam-candidatos-e-fazem-campanha-sem-ser-presos.ghtml).\n\
    \nTodos os candidatos foram contatados exaustivamente para comprovação dos casos,\
    \ e suas informações foram publicadas em uma matéria a parte: https://g1.globo.com/politica/eleicoes/2024/noticia/2024/09/18/quem-sao-os-candidatos-alvos-de-mandados-de-prisao-em-aberto-e-o-que-eles-dizem.ghtml.\n\
    \nPara fazer a reportagem, o g1 analisou 302.509 mandados de prisão disponíveis\
    \ publicamente no Banco Nacional de Mandados de Prisão (BNMP), e também a base\
    \ de dados de registros de candidatura do TSE, com um total de 461.564 registros.\
    \ \n\nPara realizar o levantamento, foi necessário aplicar técnicas de programação\
    \ para analisar as grandes bases de dados, além de uma checagem manual de cada\
    \ caso encontrado para a verificação de que o candidato estava mesmo foragido.\
    \ A metodologia foi publicada em um material à parte, com transparência para o\
    \ público leitor.\n\nApós a publicação, a Polícia Federal fez uma operação que\
    \ prendeu ao menos 36 candidatos em operações por todo o Brasil. Além disso, o\
    \ CNJ liberou para download a base de mandados de prisão existentes no estado\
    \ de São Paulo, antes restritos por um problema de armazenamento do próprio sistema\
    \ do BNMP. \n\nA apuração gerou uma série de reportagens, incluindo uma reportagem\
    \ publicada após o pleito eleitoral, que mostrou que dois destes procurados foram\
    \ eleitos vereadores e 18 se tornaram suplentes, publicada após o primeiro turno:\
    \ https://g1.globo.com/politica/eleicoes/2024/eleicao-em-numeros/noticia/2024/10/12/exclusivo-2-procurados-pela-justica-foram-eleitos-vereadores-e-18-viraram-suplentes-no-1o-turno-das-eleicoes-2024.ghtml"
  relevância: 'A reportagem revelou uma falha de comunicação entre o sistema eleitoral
    e o Judiciário brasileiro, que permitiu que pessoas procuradas por crimes de diferentes
    gravidades disputassem as eleições municipais de 2024.


    A investigação também expôs um vácuo de responsabilização entre instituições públicas,
    que não somente autorizaram essas candidaturas, como permitiram que foragidos
    da Justiça fizessem campanha nas ruas, fato comprovado durante a apuração. Ao
    identificar casos que as próprias autoridades desconheciam, a reportagem mostrou
    as limitações do Estado em acompanhar suas bases de dados e agir preventivamente
    para o comprimento da legislação. O trabalho também colocou em xeque o papel dos
    partidos na verificação da ficha de seus candidatos.'
  originalidade: "O trabalho expôs algo que até então parecia improvável: que foragidos\
    \ da Justiça estavam se candidatando a cargos públicos. O trabalhoé inédito ao\
    \ analisar, em escala nacional, os dados de mais de 300 mil mandados de prisão\
    \ e 460 mil registros de candidatura, revelando falhas estruturais na fiscalização\
    \ do processo eleitoral. \n\nA apuração também se destacou pela metodologia inovadora\
    \ criada para contornar barreiras institucionais, como a remoção de CPFs das bases\
    \ do TSE, o que inviabilizava cruzamentos diretos. A equipe desenvolveu um processo\
    \ próprio, combinando linguagem de programação com validações manuais baseadas\
    \ em documentos públicos e certidões com QR Code. Esse esforço resultou na identificação\
    \ de casos que o próprio Estado desconhecia"
  metodologia: 'Durante cerca de dois meses, o g1 coletou e analisou os dados de duas
    grandes bases públicas: o Banco Nacional de Mandados de Prisão (BNMP), mantido
    pelo Conselho Nacional de Justiça (CNJ), e o DivulgaCand, sistema do Tribunal
    Superior Eleitoral (TSE) que reúne informações sobre todas as candidaturas registradas
    no país.


    No BNMP, foram extraídos 302.509 registros de mandados em aberto, com informações
    como nome, data de nascimento, nome dos pais, número do processo e tipo de mandado.
    Já no DivulgaCand, foram coletados dados sobre 461.564 candidaturas nas eleições
    municipais de 2024. A ausência de campos-chave como o número de CPF, removido
    pelo TSE nas eleições passadas, dificultou ainda mais a investigação e o cruzamentos
    diretos entre as bases.


    Diante dessa limitação, a equipe desenvolveu um cruzamento com base em nome completo
    e data de nascimento, usando a linguagem de programação Python. O código desenvolvido
    está disponível publicamente, permitindo que qualquer pessoa possa replicar o
    processo: https://github.com/juditecypreste/eleicoes-2024/blob/main/Procurados%20pela%20Justi%C3%A7a/candidatos_procurados.ipynb.


    O processo identificou 108 coincidências, que foram então submetidas a uma verificação
    manual. Para confirmar se tratava-se da mesma pessoa, os jornalistas consultaram
    certidões de antecedentes criminais, documentos públicos com QR Code, decisões
    judiciais disponíveis e os próprios registros de candidatura.


    A checagem manual, feita caso a caso, reduziu o universo a 61 candidatos que estavam
    com mandados de prisão válidos e ativos no momento da candidatura. Parte desses
    mandados era por crimes graves, como homicídio, estupro de vulnerável e associação
    criminosa. Três dos nomes identificados também constavam como foragidos do STF
    por envolvimento nos ataques golpistas de 8 de janeiro.


    O estado de São Paulo, que representa cerca de 20% dos mandados em aberto do país,
    inicialmente impunha uma limitação técnica que inviabilizava o download completo
    da base. A equipe solicitou acesso ao CNJ, que atendeu ao pedido e liberou os
    dados restantes. Após isso, esse acesso passou a ser publico também para a sociedade
    (https://g1.globo.com/politica/noticia/2024/12/02/cnj-facilita-acesso-a-lista-de-mandados-de-prisao-de-sao-paulo.ghtml).


    A metodologia, passo a passo, foi publicada em uma reportagem complementar:

    https://g1.globo.com/politica/eleicoes/2024/eleicao-em-numeros/noticia/2024/09/20/como-o-g1-fez-a-reportagem-sobre-os-61-candidatos-das-eleicoes-2024-alvos-de-mandados-de-prisao-em-aberto.ghtml.'
