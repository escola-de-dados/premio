- title: Os jardins que podem aumentar a resiliência climática e reduzir alagamentos
    em São Paulo
  project_url: https://oeco.org.br/reportagens/os-jardins-que-podem-aumentar-a-resiliencia-climatica-e-reduzir-alagamentos-em-sao-paulo/
  veiculo: ((o))eco
  autoria: Tainah Ramos
  data: 1/21/2025
  resumo: O trabalho investiga como os jardins de chuva – solução baseada na natureza
    (SBN) para drenagem urbana – vêm sendo aplicados em São Paulo e qual seu potencial
    para aumentar a resiliência climática da cidade, desde sua implementação a partir
    da participação popular no Alto de Pinheiros, zona oeste da capital paulista,
    até o uso como política pública. A reportagem obteve uma lista de localização
    das estruturas existentes até 2022 e solicitou os dados atualizados – o que foi
    negado pela Secretaria Municipal das Subprefeituras. Com os dados de 2022, foi
    possível observar desigualdades na distribuição desses dispositivos, com concentração
    nas regiões centrais e poucas estruturas nas periferias – onde atualmente estão
    os maiores casos de alagamentos e inundações registrados pelo poder público.
  relevância: A reportagem mostra sobre como políticas públicas de adaptação climática
    são eficazes para a resiliência climática em centros urbanos e amplia o debate
    sobre justiça ambiental, acessibilidade de dados públicos e o uso de infraestrutura
    verde no enfrentamento das mudanças climáticas. Apesar de sua eficácia, os jardins
    de chuva estão distribuídos de forma desigual e os dados sobre o tema não são
    transparentes, uma vez que a Secretaria Municipal das Subprefeituras se negou
    a fornecer dados geolocalizados atualizados e afirmou que não há essas informações
    específicas para o projeto.
  originalidade: O trabalho é o primeiro a abordar a desigualdade na distribuição
    de soluções baseadas na  natureza, combinando dados geoespaciais e análise territorial,
    e o primeiro a geolocalizar as estruturas de jardins de chuva em São Paulo, com
    sobreposição às ocorrências de alagamentos e inundações.
  metodologia: A reportagem usou entrevistas e dados geoespaciais para abordar a presença
    de jardins de chuva na cidade de São Paulo e seu potencial de resiliência climática.
    A localização das estruturas foi obtida a partir de uma lista de 2022 publicada
    no site da Prefeitura de São Paulo. Esse documento traz a área das estruturas
    e o endereço, cujas coordenadas geográficas fizeram parte do processo de apuração.
    Já os dados geoespaciais da ocorrência de alagamentos e inundações foram extraídos
    da plataforma GeoSampa. As informações de obras concluídas até dezembro de 2024
    foram fornecidas pela Secretaria Municipal das Subprefeituras.
  uf: SP
