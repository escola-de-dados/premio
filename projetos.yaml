- title: Mulheres recebem 68,2% das ofensas no 2° turno
  project_url: https://azmina.com.br/reportagens/mulheres-receberam-682-dos-comentarios-ofensivos-em-debates-no-2o-turno/
  veiculo: Revista AzMina
  autoria: Gabi Coelho, Ana Carolina Araújo, Giulia Santos, Kath Xapi Puri, Ana Carol
    Branco, Bárbara Libório, Clarice Tavares, Catharina Vilela, Fernanda Martins,
    Sergio Spagnuolo, Michel gomes, Henrique Rieger, Sofia Schurig, Leonardo Nascimento,
    Rosane Moore, Juciane Pereira
  data: 10/25/2024
  resumo: A reportagem revela como a violência política de gênero se intensifica no
    ambiente digital durante os momentos decisivos da democracia brasileira. A partir
    do monitoramento de comentários feitos em transmissões ao vivo dos debates do
    segundo turno das eleições municipais de 2024, o levantamento mostra que 68,2%
    das mensagens ofensivas foram dirigidas a mulheres. Os ataques incluem ofensas
    por aparência, desqualificação profissional e misoginia explícita. O conteúdo
    integra uma série de análises do projeto MonitorA - iniciativa do Instituto AzMina,
    em parceria com o InternetLab e o Laboratório de Humanidades Digitais da UFBA
    - e joga luz sobre como o discurso de ódio direcionado a candidatas compromete
    a liberdade de expressão política e a participação plena das mulheres na vida
    pública.
  relevância: O trabalho é relevante porque denuncia, com base em evidências concretas,
    a desigualdade enfrentada por mulheres candidatas no ambiente digital durante
    as eleições. A porcentagem de comentários ofensivos revela que, mesmo sendo minoria
    entre os debatedores, as mulheres continuam sendo alvo preferencial de discursos
    de ódio e deslegitimação política. A reportagem fornece subsídios importantes
    para a criação de políticas públicas de enfrentamento à violência política de
    gênero, além de contribuir com o debate sobre responsabilidade das plataformas
    e os limites da liberdade de expressão quando ela se torna instrumento de opressão.
    Trazemos um alerta necessário sobre o risco de silenciamento político e retração
    democrática provocado por ambientes online hostis.
  originalidade: Enfrentando o apagão de dados de redes sociais gerado pelas atitudes
    empresariais da Meta (Instagram e Facebook) e Twitter/X, a equipe do MonitorA
    redesenhou o monitoramento da violência política online durante as eleições ao
    avaliar comentários de transmissões no Youtube. A reportagem se concentra no segundo
    turno das eleições, fase estratégica da disputa eleitoral, geralmente marcada
    por menor atenção das análises de monitoramento. Além disso, ao quantificar o
    direcionamento de ataques a partir do gênero das pessoas envolvidas nos debates,
    o trabalho oferece uma visão nítida do impacto desproporcional sobre mulheres,
    revelando uma dinâmica de opressão muitas vezes normalizada. O uso da metodologia
    desenvolvida pelo MonitorA, diferenciando insultos genéricos de ataques motivados
    por marcadores sociais, permite uma leitura aprofundada do fenômeno e contribui
    com um modelo replicável de análise crítica do discurso online em contextos eleitorais.
  metodologia: 'A terceira etapa do MonitorA 2024 analisou a repercussão nos canais
    de YouTube de seis debates entre candidatas e candidatos às prefeituras brasileiras:
    Campo Grande (MS), Curitiba (PR), Londrina (PR), Natal (RN), Porto Alegre (RS)
    e Porto Velho (RO). Foram mais de 6700 comentários potencialmente ofensivos durante
    as transmissões ao vivo e nos comentários fixos do YouTube, entre os dias 10 e
    21 de outubro de 2024 nos canais: Band PR, Band RN, SIC TV, GZH/Rádio Gaúcha,
    Jornal Midiamax e Tarobá Londrina. Excluindo linhas repetidas dessa amostra inicial,
    além de alguns termos que geraram altas taxas de falsos positivos, foram feitas
    análises quantitativas, após a codificação manual. Todos foram lidos individualmente
    por um grupo de 6 analistas e classificados a partir de um léxico composto de
    palavras potencialmente ofensivas, com um recorte direcionado a homens e a mulheres
    de forma específica.'
