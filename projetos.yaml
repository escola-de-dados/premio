- title: 'Mpox: apenas 4 estados aplicaram todas as doses da vacina contra a doença,
    aponta levantamento'
  project_url: https://g1.globo.com/saude/noticia/2024/09/02/mpox-levantamento-vacinas.ghtml
  veiculo: g1 / Globo
  autoria: Roberto Peixoto e Júlia Carvalho
  data: 9/2/2024
  resumo: "Essa nossa reportagem faz parte de uma série sobre mpox que publicamos\
    \ no g1. Com ela queríamos entender a sistemática ESTADUAL de aplicação da vacina\
    \ contra a doença no Brasil, já que os dados oficiais não davam essa resposta.\
    \ Nenhum painel, planilha ou boletim informava quantas doses haviam sido aplicadas\
    \ por estado de um imunizante tão importante para controlar a transmissão da doença\
    \ no país.\n\nPor causa disso partimos para um trabalho um pouco tedioso: elaboramos\
    \ um questionário direto e mandamos para todas as 27 secretarias estaduais de\
    \ Saúde. As perguntas eram bem objetivas: quantas doses chegaram? quantas foram\
    \ aplicadas? qual a previsão para o resto? E etc...\n\nO processo foi longo e\
    \ exigiu acompanhamento constante. Ligamos, mandamos e-mails e mensagens por WhatsApp.\
    \ Algumas secretarias responderam em poucos dias, outras levaram semanas para\
    \ dar retorno. Algumas forneceram dados completos logo de cara, outras exigiram\
    \ múltiplos contatos e esclarecimentos adicionais como sempre...\n\nFoi um processo\
    \ intenso de apuração ativa e só depois dele conseguimos montar um levantamento\
    \ completamente INÉDITO no país: apenas 4 estados brasileiros aplicaram 100% das\
    \ vacinas recebidas contra mpox. Pará, Pernambuco, Sergipe e Tocantins. Todos\
    \ os outros ficaram com doses paradas, algumas há meses (!).\n\nAcreditamos que\
    \ esse dado (que estava invisível) mostrou um problema estrutural de execução\
    \ bem no meio de uma crise sanitária e acabou abrindo uma nova agenda de discussão\
    \ sobre transparência e eficiência no sistema de vacinação brasileiro. \n\nTanto\
    \ é que, meses depois e após muita pressão de entidades da área, novas doses da\
    \ vacina contra mpox chegaram ao Brasil para compor o estoque estratégico do MS.\
    \ Foram 25 mil unidades, número contudo considerado insuficiente por muitos especialistas,\
    \ que inclusive pedem uma ampliação dessa vacinação para proteger melhor os grupos\
    \ de risco."
  relevância: "O Brasil comprou 49 mil doses dessa vacina com recursos públicos. Até\
    \ meados de 2024, apenas 62% haviam sido efetivamente aplicadas na população.\
    \ Ninguém tinha acesso a essa informação consolidada, nem epidemiologistas, nem\
    \ o MS (!), nem gestores de outras esferas, nem organizações da sociedade civil\
    \ especializadas em saúde pública.\n\nPor isso, entendemos que nossa reportagem\
    \ é de grande relevância. Ela trouxe visibilidade para dados críticos sobre uma\
    \ doença que continua sendo subestimada mundialmente. \n\nA mpox afeta desproporcionalmente\
    \ populações já vulnerabilizadas, especialmente homens que fazem sexo com homens\
    \ (HSH). E sabemos que, quando informações sobre cobertura vacinal ficam indisponíveis,\
    \ os riscos se multiplicam. Decisões passam a ser tomadas com base em achismos,\
    \ atrasos que poderiam ser evitados se tornam rotina, recursos são desperdiçados\
    \ enquanto pessoas permanecem desprotegidas.\n\nQuantificar essa lacuna com precisão\
    \ foi fundamental para dimensionar o problema real da vacinação no país. E o impacto\
    \ foi imediato. Após a publicação, o tema voltou ao centro do debate público.\
    \ Secretarias que antes não divulgavam dados passaram a ser mais transparentes\
    \ assim como o próprio MS. A pressão por informações claras sobre políticas de\
    \ vacinação aumentou consideravelmente.\n\nFora isso, algumas praças (afiliadas\
    \ locais da Globo) chegaram a nos procurar para entender os números em seus próprios\
    \ estados e começaram a cobrar diretamente suas secretarias de Saúde de forma\
    \ mais ativa."
  originalidade: 'O trabalho traz de novo informações consolidadas de forma inédita
    sobre a imunização contra a mpox no Brasil, um dado fundamental que simplesmente
    não existia em lugar nenhum.


    Zero fontes oficiais, nenhum painel governamental, relatório técnico... nada mostrava
    o panorama nacional da aplicação das vacinas por estado. Tivemos que construir
    essa informação literalmente do zero, correndo atrás de cada secretaria, uma por
    uma.'
  metodologia: 'Desenvolvemos um questionário específico enviado para todas as 27
    secretarias estaduais de Saúde com perguntas diretas: quantas doses receberam,
    quantas aplicaram, qual a previsão para o restante...


    O acompanhamento foi sistemático e ativo por e-mails, ligações telefônicas e mensagens
    via WhatsApp. Organizamos todas as respostas em planilha própria, registrando
    datas de contato, nomes dos responsáveis e processo de verificação cruzada. Paralelamente,
    checamos dados complementares em portais governamentais e informes epidemiológicos.

    E mesmo assim, na hora de padronizar os dados, vimos que cada estado tinha enviado
    informações em formatos completamente diferentes: alguns mandaram planilhas detalhadas
    por PDF; outros responderam apenas por e-mail com números soltos; teve secretaria
    que enviou percentuais em vez de números absolutos; uma recusou informar completamente
    (Bahia); Mato Grosso do Sul disse que as doses não foram "computadas"; Rondônia
    simplesmente não respondeu...


    Fora isso, tivemos que lidar com respostas em formatos diversos: arquivos Excel,
    PDFs escaneados, e-mails com números no corpo do texto, ofícios, notas técnicas...
    cada estado arrumou seu próprio jeito de organizar (ou não) essas informações.
    Alguns até incluíram observações detalhadas sobre perdas técnicas e prazos de
    validade (rs); outros deram números redondos sem explicação.


    Por isso, na hora de criar as visualizações no Flourish, tivemos que tomar algumas
    decisões. A principal foi como lidar com os três estados que não forneceram dados
    utilizáveis: Bahia (recusou informar), Mato Grosso do Sul ("doses não computadas")
    e Rondônia (sem resposta). Optamos então por incluir uma nota explicativa no rodapé
    da tabela, deixando claro que o percentual de imunização desses estados não pôde
    ser calculado, e deixando mais transparente essa informação sobre as limitações
    dos dados.


    Por fim, organizamos a tabela priorizando o percentual de aplicação como coluna
    principal, em ordem decrescente. Assim ficou imediatamente visível quais estados
    conseguiram usar todo o estoque e quais ficaram para trás. E as barras vermelhas
    ajudam na leitura rápida, especialmente para destacar os quatro estados que chegaram
    aos 100%.'
