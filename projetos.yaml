- title: Mortes em ações policiais em Florianópolis crescem 165% após extinção das
    câmeras corporais da PMSC
  project_url: https://www.desterro.org/2025/05/09/mortes-em-acoes-policiais-em-florianopolis-crescem-165-apos-extincao-das-cameras-corporais-da-pmsc/
  veiculo: Desterro - Observatório de Violência em Florianópolis
  autoria: Rodrigo Barbosa
  data: 5/9/2025
  resumo: A reportagem traz, com exclusividade, dados sobre o impacto da retirada
    das câmeras corporais da PM de Santa Catarina para as periferias de Florianópolis.
    Nos primeiros 6 meses sem o equipamento, a média de mortes em ações policiais
    subiu 165% - com a morte de uma pessoa a cada dez dias na capital.
  relevância: As câmeras corporais estão em alta no debate da Segurança Pública. O
    estado de São Paulo é o mais observado quando se diz respeito a este tipo de mecanismo,
    mas Santa Catarina havia sido o primeiro estado a adotá-lo, em julho de 2019.
    Deste momento até a extinção do sistema, em setembro de 2024, pouco se produziu
    de informações e, sobretudo, dados, a respeito do mecanismo em solo catarinense.
    Nosso trabalho, para além de demonstrar que as câmeras tendem a reduzir os impactos
    negativos da violência da polícia em territórios periféricos, também mostra que,
    mesmo com as câmeras corporais, a Polícia Militar ainda é altamente violenta -
    sendo estes dispositivos e seus funcionamentos ainda bastante cabíveis de aprimoramento.
    Trata-se de uma reportagem que tem capacidade de basear tomadores de decisão na
    proposição e na revisão de políticas públicas de Segurança Pública a nível local
    e nacional.
  originalidade: Trata-se de um levantamento inédito em nosso território. Nunca antes
    foi produzido um material que contemplasse dados acerca da violência policial
    relacionando-a com o uso das câmeras corporais em solo catarinense. Além disso,
    parte dos dados de nosso trabalho tratam-se de investigações para além do que
    é descrito em dados oficiais, pois há subnotificação de mortes. Nestes casos,
    o levantamento é feito diretamente nas comunidades.
  metodologia: 'Este trabalho é o primeiro produto de uma base de dados sobre violência
    policial em Florianópolis que nosso jornal vem construindo ao longo do último
    ano. Cruzamos dados de Lei de Acesso À Informação a respeito de mortes decorrentes
    de ações policiais em Florianópolis com dados/informações levantadas por nossos
    repórteres e lideranças comunitárias parceiras em território. Tratando-se de uma
    base de dados que abrange o período de uma década, obtivemos dados referentes
    aos três períodos que pretendíamos analisar: pré-câmeras corporais (2016 a 2019),
    o período das câmeras (2019 a 2024) e o período pós-câmeras (2024-2025). Logo,
    foi possível calcular a média de cada um destes períodos e compará-las, evidenciando
    que o primeiro recorte da ação da polícia em nossa cidade sem as câmeras é altamente
    violento. Para esta matéria, a frente de apuração que envolve diretamente trabalhos
    de campo foi crucial, tendo em vista que há vítimas dos períodos analisados que
    não constam nos dados oficiais do Estado.'
  uf: SC
