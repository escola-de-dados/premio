- title: Emergências do SUS recebem, em média, 22 vítimas de trânsito por hora desde
    2019 no Brasil
  project_url: https://noticias.r7.com/brasilia/emergencias-do-sus-receberam-em-media-22-vitimas-de-transito-por-hora-desde-2019-no-brasil-26122024/
  veiculo: Portal R7
  autoria: Edis Henrique Peres
  data: 12/26/2024
  resumo: A reportagem analisou o número de atendimento nas emergências do SUS de
    vítimas do trânsito e qual o impacto que isso gera na rede. Buscamos analisar,
    especificamente, os casos de emergência. Ou seja, os pacientes que são prioridade
    no antedimento e podem sobrecarregar o sistema, considerando que os sinistros
    de trânsito podem ser evitados.
  relevância: Além de aponta a sobrecarga que essas vítimas causam no SUS e os gastos
    que representam, ouvimos especialistas para conversar sobre mobilidade e segurança.
    Para além do controle de velocidade, os especialistas listaram vários mecanismos
    que podem inibir os sinistros, o que requer que toda a estrutura da via seja pensada
    com o viés de prevenção dos sinistros.
  originalidade: O trabalho compara dados obtidos via Lei de Acesso à Informação e
    analisa também dados que correlacionam a velocidade com a letalidade do trânsito.
    A inovação é analisar esses dados no recorte das emergências do SUS e destacar
    que os sinistros sobrecarregam o sistema único, considerando que eles são, em
    sua maioria, evitáveis com estratégias do governo e responsabilidade do motorista.
  metodologia: Os dados foram solicitados via Lei de Acesso à Informação e a partir
    das informações recebidas, foram analisados quais os recortes que funcionavam
    para a reportagem. Por exemplo, decidimos analisar os dados apenas das emergências
    do SUS, que são os atendimentos que sobrecarregam o sistema porque exigem prioridade.
