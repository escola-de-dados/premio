- title: 'Empreendedorismo sustentável: startups transformam resíduos florestais e
    orgânicos em produtos inovadores no interior do Amazonas'
  project_url: https://agenciajamaxi.com.br/startups-am-produtos-residuos-sustentaveis/
  veiculo: Agência Jamaxí
  autoria: Ana Kelly Franco
  data: 8/4/2025
  resumo: Transformar os resíduos orgânicos e florestais, antes ignorados ou descartados,
    em produtos de valor no mercado, e que contribuem para manter a floresta em pé,
    são os propósitos do ecossistema de inovação das startups Manoa Bio e Coroa Bio.
    Criadas no município de Itacoatiara (distante a 176 km de Manaus), o terceiro
    maior polo de pequenos negócios no Amazonas, segundo dados do Sebrae, com 5.920
    empreendimentos ativos, ficando atrás de Manaus e Parintins, as empresas se destacam
    por serem modelos inovadores de negócio voltado para bioeconomia e por unirem
    os conceitos de sustentabilidade, inovação e criatividade.
  relevância: A matéria mostra como o interior do Amazonas está crescendo no ecossistema
    de inovação com startaups voltadas para bioeconomia, que gera emprego e renda
    no município.
  originalidade: Trás duas pequenas empresas que inovam ao utilizar resíduos orgânicos
    e florestais, no meio da Amazônia. A matéria trás entrevistas, dados, mapas e
    números 'animados' com dados de empreendedorismo no Amazonas.
  metodologia: Foi utilizado dados do Sebrae Amazonas e do data Sebrae https://datasebraeindicadores.sebrae.com.br/hub/
    sobre o empreendedorismo no Amazonas.
