- title: A marca que criou um império ilegal de comércio de “bombas” nas redes
  project_url: https://nucleo.jor.br/reportagem/2025-05-05-marca-de-anabolizantes-redshark-inunda-redes-da-meta-com-anuncios-de-bomba/
  veiculo: Núcleo Jornalismo e Ciência Suja
  autoria: Pedro Nakamura, Rodolfo Almeida e Alexandre Orrico
  data: 5/5/2025
  resumo: "Investigação do Núcleo, em parceria com o Ciência Suja, descobriu que uma\
    \ marca brasileira de anabolizantes clandestinos, a Redshark, usa anúncios nas\
    \ redes da Meta e perfis em redes como TikTok, YouTube e Instagram para impulsionar\
    \ promoções de hormônios ao estilo de “pague 3, leve 4” e promover o uso de esteroides\
    \ ilegais. A marca não está cadastrada junto à Agência Nacional de Vigilância\
    \ Sanitária (Anvisa). \nO objetivo é vender “bomba” para praticantes de musculação\
    \ e fisiculturistas amadores. O comércio de hormônios sem receita é proibido no\
    \ Brasil e sua prescrição médica para fins estéticos ou esportivos é vedada pelo\
    \ Conselho Federal de Medicina (CFM). \nA reportagem encontrou 266 anúncios ativos\
    \ no Facebook e Instagram da Redshark. Depois, coletamos cerca de 1240 anúncios\
    \ das redes da Meta por meio de palavras-chave ligadas ao uso de hormônios, como\
    \ “anabolizantes”, “paradinhas”, “maromba” ou nomes de esteroides.  Destes, apenas\
    \ 51 eram publis de bomba – de 12 anunciantes diferentes, nenhum com a escala\
    \ da Redshark. \nO  “sucesso” da Redshark nas publis está ligado a táticas que\
    \ driblam a moderação de anúncios das plataformas e deixam a operação de marketing\
    \ digital da marca resiliente a bloqueios. \nSó no Instagram, por exemplo, a Redshark\
    \ usa pelo menos três contas de propaganda, separadas de seu “perfil oficial”,\
    \ para impulsionar os anúncios. São elas: @redsharkUS1, @redsharkUS2 e @redsharkUS3.\
    \ Com isso, se uma delas ou o perfil principal caírem, é possível seguir rodando\
    \ anúncios e captando clientes."
  relevância: 'Após a investigação do Núcleo em parceria com o Ciência Suja, TikTok,
    YouTube e Google baniram os perfis da marca brasileira de anabolizantes clandestinos
    Redshark de suas plataformas.

    A reportagem mostrou que a empresa promoveu uso e comércio de hormônios ilegais
    por meio de anúncios na Meta, TikTok, YouTube e Google. Os perfis da Redshark
    possuíam mais de 113 mil seguidores no TikTok, e 86 mil no YouTube.

    Uso abusivo de anabolizantes está associado a doenças cardiovasculares, hepáticas,
    renais e psiquiátricas e a operação de marketing digital da marca pode ser a maior
    do país do segmento de esteroides clandestinos.'
  originalidade: A reportagem encontrou dados inéditos e jogou luz em uma operação
    enorme de marketing digital para venda clandestina de esteroides que estava passando
    despercebida. As informações geraram impacto imediato e fizeram as plataformas
    derrubarem os perfis antes mesmo da publicação da reportagem.
  metodologia: 'Após uma breve pesquisa entre influencers de fisiculturismo, identificamos
    que muitos eram patrocinados pela Redshark. Com isso, ao buscar pela marca na
    biblioteca de anúncios da Meta, logo notamos que a marca mantinha uma escala de
    publicidade considerável para um produto proibido.

    A partir daí, catalogamos esses anúncios na Meta, além de posts nas redes e e-mails
    enviados. Também interagimos com alguns desses materiais para entender para onde
    linkavam.

    Em seguida, por meio de acesso a uma API da biblioteca de anúncios da Meta, coletamos
    mais de 1240 publis da plataforma usando as palavras-chave “Danones”, “solicite
    a tabela”, “maromba”, “testosterona”, “primobolan”, “oxandrolona”, “esteroide”,
    “anabolizante”, “tabela atualizada” e “paradinhas”.

    A partir daí, analisamos esses 1240 anúncios para entender quantos eram de anabolizantes.
    Ao fim, apenas 51 eram, uma quantidade cinco vezes menor que a operação da Redshark.'
