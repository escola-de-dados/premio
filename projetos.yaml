- title: Feminicídio fez mais de mil vítimas por ano no Brasil desde 2015
  project_url: https://www1.folha.uol.com.br/cotidiano/2025/03/feminicidio-fez-mais-de-mil-vitimas-por-ano-no-brasil-desde-2015.shtml
  veiculo: Folha de S.Paulo
  autoria: Raquel Lopes
  data: 3/9/2025
  resumo: A reportagem revela que, dez anos após a sanção da Lei do Feminicídio, em
    2015 — marco que tipificou o crime e ampliou sua visibilidade —, mais de 11,8
    mil mulheres foram assassinadas no Brasil por razões de gênero, o que equivale
    a quase quatro mortes por dia. A apuração reuniu dados de todas as cidades e unidades
    da federação, divulgados pelo Ministério da Justiça e Segurança Pública, e mostrou
    que, apesar do endurecimento da legislação e da maior conscientização sobre o
    tema, o número de vítimas permanece elevado, sobretudo em contextos domésticos.
  relevância: A reportagem é relevante por escancarar a persistência e a gravidade
    da violência de gênero no Brasil, mesmo uma década após a criação de uma legislação
    específica para o feminicídio. Ao reunir e sistematizar dados inéditos de todas
    as cidades e estados do país, o trabalho oferece um retrato abrangente e detalhado
    da dimensão do problema, evidenciando falhas na prevenção, na proteção às mulheres.
    Além de informar, a apuração contribui para o debate público e para a formulação
    de políticas públicas, ao pressionar autoridades e mobilizar a sociedade diante
    de um crime que mata quase quatro mulheres por dia no país.
  originalidade: A originalidade da reportagem está na sistematização dos dados oficiais
    sobre feminicídios em todo o território nacional, com destaque para a apresentação,
    pela primeira vez, de números detalhados por município por meio de um infográfico.
    Ao reunir, cruzar e analisar essas informações, o trabalho construiu uma base
    sólida que permite acompanhar a evolução do crime desde a sanção da lei, escancarar
    desigualdades regionais e revelar padrões de violência que permanecem ocultos
    nas estatísticas fragmentadas. A matéria também se destaca por contextualizar
    os dados com uma análise crítica e com o histórico legislativo da Lei do Feminicídio,
    oferecendo ao leitor uma visão aprofundada, didática e inovadora sobre  os dez
    anos da Lei do Feminicídio no Brasil.
  metodologia: A reportagem trabalhou com os dados abertos do Ministério da Justiça
    e Segurança Pública. Após a coleta, os dados foram organizados e sistematizados
    em uma planilha que permitiu a análise por ano, estado e município. A partir dessa
    base, foram construídos gráfico e infográfico que mostra, os registros de feminicídio
    ao longo da última década. A apuração foi complementada por entrevistas com especialistas,
    autoridades e caso de vítima, além da análise da legislação, o que garantiu profundidade
    e contexto à apresentação dos dados.
