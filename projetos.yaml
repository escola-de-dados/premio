- title: Beneficiários do Bolsa Família superam estimativa de famílias pobres em 22%
    dos municípios
  project_url: https://www1.folha.uol.com.br/mercado/2025/02/beneficiarios-do-bolsa-familia-superam-estimativa-de-familias-pobres-em-22-dos-municipios.shtml
  veiculo: Folha de S.Paulo
  autoria: Idiana Tomazelli (reportagem) e Gustavo Queirolo (arte)
  data: 2/18/2025
  resumo: A reportagem mostra que o número de beneficiários do Bolsa Família supera
    a estimativa de famílias em situação de pobreza em 1.211 municípios brasileiros,
    ou 21,7% do total. O levantamento foi feito pela Folha a partir do cruzamento
    do número de beneficiários do programa e das estimativas de famílias em situação
    de pobreza e baixa renda, calculadas pelo Ministério do Desenvolvimento Social
    a partir do Censo de 2022. Ambos são dados oficiais do governo e estão disponíveis
    de forma aberta.
  relevância: A análise das informações de cada município fornece um importante termômetro
    da adequação da política pública. Em vez de olhar apenas números agregados, a
    reportagem e o mapa incluído nela indica onde há potenciais desvios na concessão
    de benefícios e onde há vazios de proteção social, diagnósticos essenciais para
    direcionar as ações de gestão necessárias e garantir que não haja pagamentos indevidos,
    nem exclusão de pessoas que fazem jus ao direito. A discussão ganha ainda mais
    relevância no contexto em que o governo federal trabalha para corrigir distorções
    no âmbito dos benefícios sociais.
  originalidade: Embora as duas informações (número de beneficiários e metas de pobreza/baixa
    renda por município) estejam, isoladamente, disponíveis em bases abertas de dados,
    a reportagem inova ao cruzar as duas informações e oferecer uma espécie de mapa
    de calor, facilitando ao leitor visualizar onde há indícios de excesso de benefícios
    em relação às metas e onde há vazios de proteção social. Vale ressaltar que o
    próprio governo não oferece esse mapa, tornando o trabalho da reportagem crucial
    para fazer a informação chegar à população num formato de fácil compreensão.
  metodologia: 'A reportagem cruzou dados de duas fontes de informações, disponíveis
    no repositório Vis Data, do Ministério do Desenvolvimento Social. As tabelas foram:

    1. Número de famílias beneficiárias do Bolsa Família, por município (disponível
    em: https://tinyurl.com/2evbuenb)

    2. Estimativa de famílias para o Bolsa Família, por município (disponível em:
    https://tinyurl.com/e8mm2rrd

    As estimativas contam com margens de tolerância, mas elas não estão disponíveis
    em formato aberto, nem foram disponibilizadas pelo MDS após solicitação. Por isso,
    após o cruzamento, a reportagem calculou o quanto, em percentual, cada município
    estava acima ou abaixo da estimativa e estabeleceu faixas, com intervalos de percentuais.
    Aqueles que estavam até 10% acima da estimativa foram desconsiderados do cálculo
    usado no título da reportagem, que busca indicar justamente os municípios onde
    há potencial desvio no uso da política pública. Isso foi feito porque, sem informação
    sobre o intervalo de tolerância, um percentual de até 10% poderia facilmente coincidir
    com esta margem - sendo assim, o município não estaria formalmente acima da meta.
    Desconsiderar este fator induziria o leitor a erro, superestimando o número de
    municípios com potenciais excessos de cobertura do programa. Da mesma forma, a
    mesma consideração foi feita para os que estavam até 10% abaixo da estimativa,
    já que, sem isso, haveria risco de superestimar o número de municípios em que
    há vazios de proteção social.

    Aqui, link da tabela com os dados brutos usados pela reportagem: https://docs.google.com/spreadsheets/d/1HjrMiO3WcbmUcRq88EhQPpjjyp6nlxWMOjhmxelx48I/edit?usp=sharing'
