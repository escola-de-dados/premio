- title: PcDs no ensino superior quase triplicam em dez anos, mas ainda são menos
    de 1% dos estudantes
  project_url: https://noticias.r7.com/brasilia/pcds-no-ensino-superior-quase-triplicam-em-dez-anos-mas-ainda-sao-menos-de-1-dos-estudantes-07052025/
  veiculo: Portal R7
  autoria: Edis Henrique Peres
  data: 5/7/2025
  resumo: Através da análise de dados, a reportagem descobriu que o número de estudantes
    PcDs no ensino superior cresceu muito nos últimos anos, no entanto, ainda representam
    menos de 1% da população com deficiência do Brasil. Ou seja, mesmo com o acesso
    aberto com a Lei de Cotas, os desafios do ensino superior ainda restrigem o acesso
    para estudantes com alguma deficiência. Por isso, conversamos com diversos estudantes
    que contaram a sua experiência e também com especialistas e professores que abordaram
    os caminhos para a inclusão e acessibilidade.
  relevância: O trabalho abordou como garantir o simples acesso do estudante na universidade,
    com a lei de cotas, não é suficiente para garantir a permanência desses estudantes
    e o suporte necessário para que ele produza no ambiente acadêmico e conclua o
    seu curso. O trabalho buscou levantar esse ponto para se pensar em outras questões
    de inclusão, que passam pela acessibilidade, pelo acolhimento, pela infraestrutura
    e compreensão dos professores.
  originalidade: 'O trabalho oferece uma análise singular dos dados. Em geral, escreve-se
    muito sobre ensino EaD e ensino presencial, sobre lei de cotas, mas não são apresentados
    dados que mostram a realidade dos estudantes PcDs. Creio que a reportagem levantou
    um alerta importante: ainda estamos longe de garantir a inclusão necessária. Os
    PcDs ainda não ocupam todos os espaços que poderiam ocupar.'
  metodologia: "Para a análise de dados, primeiro visitamos o portal do Censo de Educação\
    \ Superior, do Inep, para tentar encontrar a pauta possível. Depois, fomos atrás\
    \ do recorte do cenário das pessoas com deficiência no ensino superior. \n\nVimos\
    \ que houve um crescimento considerável desse público nas universidades nos últimos\
    \ dez anos, mas não sabíamos se isso era o suficiente. Por isso, buscamos uma\
    \ outra fonte de dados, Desta vez, Pesquisa Nacional de Saúde 2013 e 2019 e Pesquisa\
    \ Nacional por Amostra de Domicílio Ampliada 2022, para sabermos qual o número\
    \ da população com deficiência estimada nesse período. \n\nCom base nesses outros\
    \ dados, comparamos qual o percentual de pessoas com deficiência (do total) ingressavam\
    \ na universidade. Para garantir que a análise que estávamos fazendo era plausível,\
    \ também conversamos com um especialista em estatística, explicamos o objetivo\
    \ da pauta e o que tínhamos levantado, para termos com ele a confirmação de que\
    \ a análise estava correta."
