- title: Como o uso das redes sociais afetam o psicológico dos adolescentes
  project_url: https://www.pucsp.br/puccheck/como-o-uso-das-redes-sociais-afetam-o-psicologico-dos-adolescentes
  veiculo: PUC- CHECK
  autoria: Giulia Dadamo e Mohara Cherubin
  data: 9/9/2024
  resumo: O artigo "Como o uso das redes sociais afetam o psicológico dos adolescentes"
    discute como as plataformas digitais podem tanto promover sensações de bem‑estar
    quanto desencadear prejuízos à saúde mental dos jovens. Embora proporcionem sensação
    de conexão e momentos positivos, o uso excessivo pode gerar ansiedade, depressão,
    alterações físicas (como dores e problemas de visão), dificuldades cognitivas
    (como déficit de atenção e memória) e fomentar uma espécie de “fuga da realidade” .
    A psicóloga entrevistada, Luciana, enfatiza que o equilíbrio e a limitação do
    uso são fundamentais, e caso a dependência persista, recomenda‑se a intervenção
    de profissionais como psicólogos e psiquiatra.
  relevância: Esse trabalho é relevante por evidenciar, com base em estudos e entrevistas,
    os efeitos adversos das redes sociais na saúde psicológica dos adolescentes e
    sugerir estratégias práticas de prevenção — desde autoconhecimento e estabelecimento
    de limites até apoio profissional. Além disso, traz à tona a importância de não
    demonizar a tecnologia, mas sim promover um uso consciente, fundamental no contexto
    atual em que ambientes digitais permeiam a formação da identidade adolescente.
  originalidade: A originalidade do trabalho reside na abordagem equilibrada sobre
    o tema, ao não tratar as redes sociais apenas como vilãs, mas também reconhecer
    seus aspectos positivos na vida dos adolescentes. O texto se destaca por combinar
    dados científicos, depoimentos de profissionais da psicologia e uma linguagem
    acessível ao público jovem e educadores. Além disso, propõe soluções práticas
    para minimizar os impactos negativos, estimulando a reflexão crítica e o uso consciente
    das redes, o que o diferencia de conteúdos alarmistas ou puramente opinativos
    sobre o tema.
  metodologia: A metodologia utilizada no trabalho é mais rudimentar, característica
    comum em produções acadêmicas de ambiente universitário voltadas para o público
    geral. O texto se baseia principalmente em pesquisa bibliográfica, com referências
    a estudos já publicados, além de entrevistas com profissionais da área da psicologia
    para embasar as informações. Não há aplicação de métodos quantitativos, como questionários
    ou análises estatísticas, o que limita a profundidade dos dados, mas permite uma
    abordagem mais acessível e reflexiva, adequada ao formato de divulgação científica
    proposto pela universidade.
