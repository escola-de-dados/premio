- title: 'Exclusivo: como bancos e dinheiro público financiam o colapso da Amazônia'
  project_url: https://sumauma.com/exclusivo-como-bancos-e-dinheiro-publico-financiam-o-colapso-da-amazonia
  veiculo: SUMAÚMA JORNALISMO DO CENTRO DO MUNDO
  autoria: Catarina Barbosa, Ana Magalhães, Eliane Brum, Talita Bedinelli, Plínio
    Lopes, Viviane Zandonadi, João Laet
  data: 3/10/2025
  resumo: 'A reportagem “Como bancos e dinheiro público financiam o colapso da Amazônia”,
    publicada na Sumaúma em 10 de março de 2025, revela como o sistema financeiro
    brasileiro — incluindo bancos públicos e privados — segue liberando bilhões de
    reais em crédito rural para imóveis rurais com embargos ambientais, indícios de
    grilagem e desmatamento ilegal em áreas protegidas da Amazônia.


    A investigação analisou mais de 9 bilhões de reais em financiamentos destinados
    a imóveis rurais na AMACRO (a nova frente de desmatamento da Amazônia) localizada
    em municípios do estado do Acre, Amazonas e Rondônia, entre janeiro de 2018 e
    agosto de 2024. Cruzamos bases públicas de crédito rural, Cadastro Ambiental Rural
    (CAR), embargos do IBAMA e dados sobre Terras Indígenas e áreas de conservação.
    A análise identificou que o crédito segue chegando a áreas embargadas e que pressionam
    Terras Indígenas e unidades de conservação, evidenciando o papel do sistema financeiro
    no avanço da destruição ambiental.


    O trabalho demonstra:


    1) A falta de filtros ambientais efetivos por parte de bancos e instituições públicas;

    2) A fragilidade do controle estatal sobre o crédito rural;

    3) A relação entre financiamento e a violação de direitos de povos indígenas e
    comunidades tradicionais.


    A reportagem combina análise de dados complexos, checagem documental, entrevistas
    e o uso de mapas e visualizações geográficas para tornar os achados acessíveis
    ao público geral, fortalecendo o debate sobre a crise socioambiental na Amazônia
    e a responsabilidade do setor financeiro.'
  relevância: 'A Amazônia enfrenta uma escalada de destruição associada ao avanço
    do agronegócio, à grilagem de terras e à invasão de Terras Indígenas. Essa reportagem
    demonstra, de forma inédita, como o sistema financeiro brasileiro — incluindo
    bancos públicos, privados e fundos constitucionais — tem papel ativo nesse processo
    ao financiar propriedades rurais embargadas por crimes ambientais e imóveis sobrepostos
    a áreas protegidas.


    O trabalho é relevante por expor as falhas estruturais no controle do crédito
    rural, que deveria seguir critérios ambientais, mas tem sido concedido a quem
    desmata ilegalmente ou ocupa territórios indígenas. Além de revelar o valor total
    desses financiamentos — mais de 9 bilhões de reais entre janeiro 2018 e agosto
    de 2024 na AMACRO —, a investigação dialoga diretamente com o debate público sobre
    a responsabilização de bancos, o uso de dinheiro público e a necessidade de transparência
    nos sistemas de crédito.


    A reportagem também amplia o entendimento sobre o papel dos instrumentos financeiros
    no colapso da floresta, indo além da denúncia pontual, ao conectar dados, documentos
    oficiais e vozes de lideranças indígenas e especialistas. Por isso, contribui
    para o jornalismo de dados como ferramenta de fiscalização e defesa socioambiental.'
  originalidade: "Embora a região da Amacro (Acre, Amazonas e Rondônia) já tenha sido\
    \ tema de reportagens sobre desmatamento e grilagem, este trabalho se diferencia\
    \ por ir além na análise de dados e revelar quem são os principais beneficiados\
    \ do crédito rural em áreas críticas da Amazônia, colocando nomes e conexões políticas\
    \ no centro da narrativa. \n\nA partir do cruzamento de dados de financiamento,\
    \ embargos ambientais e sobreposição a Terras Indígenas, identificamos, pela primeira\
    \ vez, que figuras diretamente ligadas ao bolsonarismo, como o pecuarista Jorge\
    \ Moura, foram beneficiadas com milhões de reais em recursos públicos e privados,\
    \ mesmo estando envolvidos em denúncias de crimes ambientais e violações territoriais.\n\
    \nAlém disso, o trabalho expõe o papel do sistema financeiro como peça central\
    \ no avanço da destruição da floresta, tema ainda pouco explorado com esse nível\
    \ de profundidade e personalização, especialmente no contexto do uso de dados\
    \ públicos nessa área específica da AMACRO.\n\nA reportagem rompe com o padrão\
    \ de coberturas sobre desmatamento na região ao combinar investigação em bases\
    \ complexas, checagem documental e articulação política, revelando o ciclo financeiro\
    \ que alimenta o colapso da Amazônia — algo que não havia sido feito com esse\
    \ grau de detalhamento."
  metodologia: "Todos os dados utilizados na análise são públicos e podem ser acessados\
    \ nos sites do IBAMA, BACEN, CAR, MMA, FUNAI, INCRA, IBGE, Receita Federal e INPE.\
    \ O foco do estudo está no cruzamento das bases de embargo ambiental do IBAMA\
    \ com as bases de crédito rural do BACEN. Também foram realizados cruzamentos\
    \ espaciais para identificar embargos dentro de Unidades de Conservação e Terras\
    \ Indígenas.\n\nPara a execução dessa análise, foi utilizada a última versão do\
    \ PostgreSQL, um banco de dados de código aberto amplamente adotado em meios acadêmicos\
    \ e profissionais. Além disso, foi incorporada a extensão PostGIS, que permite\
    \ operações espaciais fundamentais para a localização e validação das informações\
    \ geográficas. O Python foi empregado para a carga dos dados no banco e as consultas\
    \ foram feitas com SQL. \n\nO cruzamento foi realizado entre a base espacial das\
    \ áreas (polígonos) de embargos do IBAMA (2018 a agosto de 2024) e as bases do\
    \ BACEN, do mesmo período, incluindo:\n\nSICOR_OPERACAO_BASICA_ESTADO\nSICOR_PROPRIEDADES\n\
    SICOR_LISTA_IFS\nEmpreendimento\nInstrumentoCredito\nCategoriaEmitente\nFonteRecursos\n\
    Programa\nsicor_desclassificacao\n\nApós essa etapa, a base foi enriquecida com\
    \ as variáveis dos polígonos do Cadastro Ambiental Rural (CAR), através do cruzamento\
    \ espacial com as áreas embargadas pelo IBAMA. Em seguida, os dados foram complementados\
    \ com a Razão Social das empresas listadas, obtidas a partir da base de CNPJ da\
    \ Receita Federal. Finalmente, foi realizada a sobreposição espacial para identificar\
    \ propriedades, embargos e empréstimos concedidos dentro de Unidades de Conservação\
    \ e Terras Indígenas. \n\nFontes de Dados\n\nFontes Principais\nA principal fonte\
    \ de dados foi extraída do Banco Central do Brasil (BACEN), por meio do programa\
    \ de acesso à informação de Crédito Rural. As tabelas utilizadas podem ser acessadas\
    \ no link abaixo:\n\nBACEN - Tabelas de Crédito Rural PROAGRO\n\nFontes Auxiliares\n\
    \nGeográficas: Para a realização dos cruzamentos espaciais, foram carregados os\
    \ shapefiles que delimitam Terras Indígenas (TI), Unidades de Conservação (UC)\
    \ e Cadastro Ambiental Rural (CAR).\n\nCNPJ: Para adicionar as Razões Sociais\
    \ das empresas envolvidas, foi necessário carregar a base de Pessoas Jurídicas\
    \ da Receita Federal e cruzá-la com a tabela de propriedades. Esses dados podem\
    \ ser consultados no link:\n\nCadastro Nacional da Pessoa Jurídica (CNPJ)\n\n\
    Embargos: A checagem de pessoas físicas ou jurídicas que obtiveram empréstimos\
    \ e possuem terras embargadas foi realizada através da base de embargos do IBAMA,\
    \ que contém CPFs/CNPJs dos embargados, além das coordenadas das áreas embargadas.\
    \ Essa base pode ser acessada em:\n\nConsulta Pública de Áreas Embargadas - IBAMA\n\
    \nAui está o link: https://docs.google.com/document/d/1YIDbpNyN5fWMMyB7pUUIL2IEGO_Ni_GmLKaOn_1Ulu0/edit?usp=sharing"
  uf: PA
