- title: '"Sem meu filho eu vou morrendo aos poucos"'
  project_url: https://www.rampasuerj.com.br/post/sem-meu-filho-eu-vou-morrendo-aos-poucos
  veiculo: RAMPAS Uerj
  autoria: Everton Victor
  data: 12/10/2024
  resumo: 'A matéria traz um recorde sobre um dado: o número de desaparecidos. A partir
    de casos, abordo como o desamparo a este grupo existe e sobretudo a diferença
    nos casos de desaparecidos - a partir do dado geral - e trago para essas realidades
    que encontram o mesmo problema: a falta de apoio do Estado e, ao mesmo tempo,
    as mães se unem umas as outras para continuar buscando seus filhos.'
  relevância: Tento trazer uma abordagem a partir de casos e a incerteza diárias dessas
    famílias que do "dia para a noite" se encontram em um luto diário de não saberem
    onde estão seus entes.
  originalidade: A abordagem conta com uma apuração inteiramente minha em uma reportagem
    especial na qual eu não explano só um dado, mas tento trazer uma dinâmica de aproximar
    o leitor desses casos, remontando o dia do desaparecimento. A matéria mais sensível
    que já fiz.
