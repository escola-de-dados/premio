- title: 'COP30: Pensar a América Latina com mapas abertos'
  project_url: https://outraspalavras.net/descolonizacoes/cop30-pensar-a-america-latina-com-mapas-abertos/
  veiculo: Outras Palavras
  autoria: Antônio Laranjeira
  data: 12/18/2024
  resumo: 'Em Belém, ativistas da geotecnologia trocam experiências para enfrentar
    temas como a crise climática durante a conferência State of the Map (SOTM). Participantes
    sugerem: dados abertos e cartografia são essenciais na busca de soberania popular
    nos territórios. Como podem servir aos povos amazônicos? A programação contou
    com oficinas e palestras, conversas e confraternizações. Os temas abordados no
    SOTM podem ser resumidos em três eixos: histórias de impacto social na Amazônia,
    histórias de tecnologias abertas e histórias de gestão do espaço público.'
  relevância: Cobertura exclusiva de um encontro pré-COP30 discutindo pontos estratégicos
    relacionandos com dados abertos geoespaciais para autonomia de povos e soberania
    das nações. Ao todo, o SOTM Latam 2024 contou com participantes de 18 países presentes
    em Belém do Pará, como mostra o mapa a seguir. A conferência mobilizou mapeadoras,
    mapeadores, governos e empresas interessadas em dados geoespaciais e suas aplicações
    para cidadania, com uma programação gratuita de palestras e oficinas que aconteceram
    ao longo dos dias 6, 7 e 8 de dezembro de 2024.
  originalidade: "Um resumo do estado da arte de um segmento da tecnologia estratégico\
    \ no combate às mudanças climáticas no ano que antecede a COP30.\n\nCom originalidade,\
    \ além do relato com hiperlinks para todos os projetos de mapeamento colaborativo\
    \ apresentados, foi criado um mapa da origem dos participantes com DataWrapper\
    \ e Google Sheets. Esse mapa é um demonstrativo de como essa peça visual é capaz\
    \ de atrair e engajar as audiências muito além do alcance, mas também no pertencimento\
    \ - um KPI relevante ao Outras Palavras. \n\nUma reportagem que apresenta os mapas\
    \ abertos da OpenStreetMap, plataforma pouco famosa no Brasil e que completa 20\
    \ anos em 2025. Por fim, a reportagem comprova como mapas abertos são dados abertos;\
    \ portanto servem ao jornalismo de profundidade e interessam à jornalistas de\
    \ dados."
