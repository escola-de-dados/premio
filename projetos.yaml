- title: Com IA, fóruns clandestinos transformam fotos reais de crianças em material
    pornográfico
  project_url: https://nucleo.jor.br/especiais/2025-05-09-dark-web-usa-fotos-de-criancas-reais-em-pornografia-infantil-com-ia/
  veiculo: Núcleo Jornalismo
  autoria: Sofia Schurig, Leonardo Coelho, Tatiana Azevedo, Rodolfo Almeida e Sérgio
    Spagnuolo
  data: 5/9/2025
  resumo: "Investigação do Núcleo em parceria com a AI Accountability Network do Pulitzer\
    \ Center encontrou fóruns clandestinos que usam inteligência artificial para transformar\
    \ fotos reais de crianças em material pornográfico e explicam como treinam as\
    \ IAs com as fotos reais.\n\nSão diversas fotos de meninas patinando, jogando\
    \ futebol e praticando arco e flecha que estão sendo retiradas das mídias sociais\
    \ e usadas por grupos criminosos para criar material de abuso sexual infantil\
    \ com inteligência artificial em fóruns na chamada dark web. Em alguns casos,\
    \ essas vítimas são atrizes, modelos ou influenciadoras infantis. \n\nNo Brasil,\
    \ a exploração, o abuso e a sexualização de menores de 18 anos, inclusive em mídias\
    \ artificiais, violam o Estatuto da Criança e do Adolescente.\n\nNas quase 400\
    \ páginas de conteúdo obtido pelo Núcleo em fóruns anônimos, ficou explícita a\
    \ criação de conteúdos envolvendo tanto menores de idade fictícios quanto crianças\
    \ e adolescentes reais. Esses conteúdos eram gerados a partir de modelos ajustados\
    \ especificamente para os rostos das vítimas, construídos com imagens publicamente\
    \ disponíveis na internet.\n\nA reportagem conseguiu observar e confirmar que\
    \ pelo menos 18 crianças e adolescentes tiveram suas imagens, incluindo rostos,\
    \ utilizadas para criar conteúdos de abuso sexual infantil. As criações variam\
    \ do sugestivo ao sensual e ao explícito, sempre focando em crianças e adolescentes.\n\
    \nPara produzir esse tipo de conteúdo criminoso, de realismo perturbador, usuários\
    \ recorrem a programas de inteligência artificial de código aberto — sistemas\
    \ sem licenciamento comercial, amplamente disponíveis na internet e podem ser\
    \ livremente modificados. \n\nAo alterar essas ferramentas e utilizar modelos\
    \ menores e especializados, conhecidos como LoRAs, criminosos em fóruns da dark\
    \ web conseguiram criar centenas de imagens de exploração e abuso sexual infantil\
    \ envolvendo crianças reais, muitas delas com um nível de realismo alarmante.\n\
    \nOs fóruns são utilizados para compartilhar as imagens criadas com IA e para\
    \ compartilhar informações e dicas para que outras pessoas produzam mais contéudo\
    \ ilegal do tipo."
  relevância: A ampliação do uso de inteligência artificial e dos modelos menores
    e especializados, conhecidos como LoRAs, aumenta exponencialmente os perigos do
    uso desenfreado e fora da lei de IAs. Muitas ferramentas e fóruns não são amplamente
    cobertos pela imprensa nacional e têm impacto direto na vida de milhares de pessoas,
    especialmente crianças e adolescentes, como mostrou a matéria publicada. É preciso
    investigar o assunto, explicar como funcionam as ferramentas e entender a dinâmica
    das comunidades que produzem e incentivam esse tipo de uso ilegal, para que seja
    possível tomar atitudes legais e de políticas públicas que coibam esses crimes.
  originalidade: O assunto específico de crimes com modelos menores e especializados,
    conhecidos como LoRAs, ainda não era explorado pela imprensa brasileira. O Núcleo
    trouxe o assunto à tona e levantou uma pauta importante para ser observada pela
    sociedade em geral. O assunto é tão relevante e novo que a reportagem foi procurada
    pela coordenadora de políticas de liberdade de expressão e enfrentamento à desinformação
    da Presidência da República para ter acesso ao relatório de 400 páginas produzido
    na investigação, para embasamento de nota técnica.
  metodologia: Conseguimos acesso a fóruns e fizemos capturas de tela em PDF das páginas
    com postagens geradas por IA, compilando um total de 400 páginas de capturas de
    telas. Em seguida, revisamos o material manualmente e encontramos uma menção a
    uma modelo pré-adolescente italiana. Descobrimos que existia um LoRa dessa jovem,
    assim como de outras. A partir dessa descoberta, iniciamos a investigação para
    entender a dinâmica do uso da ferramenta, como a comunicação do assunto se dá
    nos sites, quais são as especificidades técnicas dos casos encontrados, e entramos
    em contato com as empresas e sites que hospedam ferramentas mencionadas nas conversas.
  uf: SP
  tipo_inscricao: Visualização
  formato: Online
  category: Visualização
