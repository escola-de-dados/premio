  ano: '2024'
- title: 9 em cada 10 juízes ganham mais que ministros do STF
  project_url: https://drive.google.com/file/d/15hZ38XomocI8YIdFEQM57pwTVSQ_louW/view?usp=sharing
  veiculo: UOL
  autoria: Tiago Mali
  data: 2/17/2025
  resumo: 'A reportagem baixou dados de 57 milhões de contracheques de servidores
    públicos referentes ao período de 2021 a 2024 e os comparou com a remuneração
    líquida (depois de descontos) dos juízes do Supremo - cujo subsídio é o teto do
    funcionalismo.


    Entre outras descobertas, mostrou 36 mil funcionários públicos com remuneração
    média (considerando o ano inteiro) acima dos ministros do Supremo.


    O esforço de apuração constatou que a maioria dos supersalários era de juízes
    e que mais de 90% dos magistrados do país, por meio de penduricalhos, já recebem
    mais do que aqueles que a lei define que deveriam ser os funcionários públicos
    mais bem remunerados.'
  relevância: "O trabalhou ocupou durante dois dias a capa do UOL, um dos maiores\
    \ portais do país, e teve 183 mil acessos. \n\nFomentou em 2025 o debate sobre\
    \ corte de supersalários, que voltou à pauta de discussão do governo depois de\
    \ um revés sobre o tema em 2024. O tema é um dos que estão sendo debatidos no\
    \ Congresso nas discussões sobre ajuste fiscal.\n\nTer, pela primeira vez na imprensa,\
    \ um diagnóstico detalhado e abrangente do tamanho dos supersalários foi importante\
    \ para a sociedade organizada pressionar por mudanças.\n\nJuízes e o STF tiveram\
    \ de se manifestar diversas vezes sobre o tema depois da publicação do trabalho.\
    \ A reação do Judiciário foi com um jabuti aprovado pelo Congresso que permitiria\
    \ ocultar os dados sobre salários sobre juízes. Com a pressão da sociedade, o\
    \ trecho foi vetado pelo governo.\n\nO CNJ (Conselho Nacional de Justiça) pela\
    \ primeira vez, em maio, decidiu frear a concessão de penduricalhos retroativos,\
    \ numa mostra de que o debate avançou."
  originalidade: 'Há anos a imprensa mostra casos de supersalários em órgãos públicos.
    A forma de reportar esses privilégios tem sido por meio de exemplos que destoam
    do que seria esperado.


    Nosso trabalho é o primeiro da imprensa que, de forma sistemática e metódica,
    se propôs a falar mais da floresta do que da árvore.


    Juntando dados de diversas bases de dados distintas, identificamos que o problema
    está concentrado numa elite de cerca de 36 mil funcionários públicos, especialmente
    juízes e membros do MP.


    Ao tentar falar mais do problema como um todo do que de casos específicos, a reportagem
    jogou luz à discussão de política pública sobre o que fazer com os supersalários.'
  metodologia: "A reportagem se debruçou sobre dados de  57 milhões de contracheques\
    \ de\nfuncionários públicos (executivo federal, judiciário e MP) para comparar\
    \ com a remuneração média do Supremo. \n\nA reportagem calculou, a cada ano, a\
    \ média de remuneração líquida de cada um dos servidores. Foi considerado supersalário\
    \ todos os valores maiores do que a média da remuneração líquida recebida pelos\
    \ ministros do STF no mesmo ano. \n\nForam desconsiderados na comparação os contracheques\
    \ do TJ-RR, em que foram identificados erros na apresentação dos dados. \n\nTambém\
    \ foram desconsiderados os tribunais eleitorais, que \"emprestam juízes\" de outros\
    \ órgãos e fazem pagamentos eventuais.\nA identificação e classificação dos penduricalhos\
    \ seguiram critérios usados no\nAnuário de Gestão de Pessoas no Serviço Público,\
    \ obra da ONG Republica.org que faz um raio-X do funcionalismo brasileiro."
