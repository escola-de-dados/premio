- title: 'Sistema penitenciário cearense: 35 mil detentos estudaram e 25 mil trabalharam
    nos últimos 7 anos'
  project_url: https://diariodonordeste.verdesmares.com.br/seguranca/sistema-penitenciario-cearense-35-mil-detentos-estudaram-e-25-mil-trabalharam-nos-ultimos-7-anos-1.3646253
  veiculo: Diário do Nordeste
  autoria: Messias Borges
  data: 5/7/2025
  resumo: "Daniela Del Rey é uma mulher trans, que está há dois anos e seis meses\
    \ no Sistema Penitenciário cearense, sem condenação (ou seja, ainda é uma presa\
    \ provisória). Já Apolinário (como preferiu ser identificado) é um preso que está\
    \ há 7 anos e 7 meses no Sistema, onde cumpre uma pena de 21 anos de reclusão.\
    \ Os dois internos encontraram no trabalho oferecido dentro do cárcere uma oportunidade\
    \ de mudar a vida, dentro e fora do presídio.\n\nEducação e trabalho são as “vigas\
    \ mestras” do plano estadual Pena Justa, que é elaborado pelo Tribunal de Justiça\
    \ do Ceará (TJCE) e pela Secretaria da Administração Penitenciária e Ressocialização\
    \ do Ceará (SAP), com a participação de outras instituições, segundo o supervisor\
    \ do Grupo de Monitoramento e Fiscalização do Sistema Carcerário e de Execução\
    \ de Medidas Socioeducativas (GMF), do Tribunal, desembargador Henrique Jorge\
    \ Holanda Silveira. \n\nNos últimos 7 anos, mais de 35 mil presos realizaram atividades\
    \ educacionais e mais de 25 mil detentos se qualificaram profissionalmente nos\
    \ presídios cearenses, segundo a SAP. A estatística considera dados anuais (e\
    \ o mesmo interno pode se repetir em mais de um ano, se tiver realizado uma nova\
    \ atividade de educação ou trabalho)."
  relevância: A reportagem foi importante para realizar um balanço de quantos detentos
    estudaram e trabalharam no Sistema Penitenciário cearense, nos últimos 7 anos.
    Essa matéria foi publicada dentro de um especial sobre o Programa Pena Justa,
    que visa mudar as condições do Sistema Penitenciário.
  originalidade: A matéria divulgou um número exclusivo na imprensa cearense, com
    dados de quantos detentos estudaram, trabalharam e leram livros, no Estado, nos
    últimos sete anos.
  metodologia: A reportagem assistiu a uma audiência pública do programa Pena Justa,
    no qual o secretário da Administração Penitenciária do Ceará, Mauro Albuquerque,
    forneceu os dados para representantes do Tribunal de Justiça do Ceará e de outros
    órgãos envolvidos com o Programa e o Sistema Penitenciário. Os dados foram batidos
    com a assessoria de comunicação da Secretaria da Administração Penitenciária do
    Ceará.
  uf: CE
