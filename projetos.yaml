- title: 'Solidão no cárcere: 26% das mulheres presas no Brasil não recebem visitas'
  project_url: https://g1.globo.com/sp/campinas-regiao/noticia/2025/03/08/solidao-no-carcere-26percent-das-mulheres-presas-no-brasil-nao-recebem-visitas.ghtml
  veiculo: g1
  autoria: Yasmin Castro
  data: 3/8/2025
  resumo: 'A reportagem "Solidão no cárcere: 26% das mulheres presas no Brasil não
    recebem visitas", publicada pelo g1 em 8 de março de 2025, faz parte da série
    "Dia de visita: a solidão da mulher no cárcere", que revela um olhar inédito sobre
    um dado alarmante diante da realidade das mulheres privadas de liberdade no Brasil:
    mais de um quarto delas não recebe qualquer visita durante o período de encarceramento.
    A investigação, que teve como base dados do Sisdepen, painel da Secretaria Nacional
    de Políticas Penais (Senappen), expõe dados nacionais, estaduais e regionais,
    e repercute, por meio do relato de mulheres presas e da análise de especialistas,
    como a ausência de vínculos familiares e sociais afeta diretamente a dignidade,
    a saúde mental e a reintegração das detentas. A matéria é foi a primeira publicação
    do especial, que também apresentou: o encontro da reportagem, dentro do presídio,
    com mulheres sem visita há quase 3 anos;

    histórias na fila de mulheres que visitam homens em um complexo penitenciário
    de SP; o que está por trás do abandono da mulher encarcerada segundo especialistas;
    os relatos de mulheres que criaram uma rede de apoio e movimentam a economia local
    no entorno dos presídio (os links estão ao fim da reportagem).'
  relevância: 'A reportagem "Solidão no cárcere" é relevante por escancarar uma faceta
    invisibilizada do sistema prisional brasileiro: o abandono afetivo e social das
    mulheres encarceradas. O dado central (26% das mulheres presas no Brasil não recebem
    visitas) revela uma realidade que vai além da privação de liberdade física. Trata-se
    de uma exclusão emocional que agrava a vulnerabilidade dessas mulheres.

    A matéria mostra que a ausência de visitas não é um fenômeno isolado, mas sim
    um reflexo de desigualdades estruturais. Muitas dessas mulheres são mães solo,
    negras, pobres e oriundas de regiões periféricas, o que dificulta a manutenção
    de laços familiares e sociais durante o cumprimento da pena. A reportagem destaca,
    por exemplo, que a distância entre o local de origem e o presídio é um dos principais
    fatores que impedem as visitas, especialmente em estados com poucas unidades prisionais
    femininas.

    Além disso, a matéria evidencia como a falta de visitas impacta diretamente a
    saúde mental e a ressocialização das presas. Especialistas ouvidas apontam que
    o isolamento contribui para quadros de depressão, ansiedade e desesperança, além
    de dificultar o acesso a itens básicos, como produtos de higiene, que muitas vezes
    são levados por familiares.

    Por fim, a reportagem contribui para o debate público ao trazer dados inéditos,
    contextualização qualificada e histórias humanas, oferecendo recursos para a formulação
    de políticas públicas mais justas e sensíveis às especificidades das mulheres
    em situação de prisão.'
  originalidade: 'A originalidade da reportagem está na abordagem inédita dos dados
    do Infopen Mulher, com foco específico na ausência de visitas — um recorte pouco
    explorado pela imprensa. A matéria vai além da simples divulgação de estatísticas:
    ela cruza dados, contextualiza com especialistas e traz relatos de mulheres que
    vivenciam essa solidão, revelando um padrão estrutural de abandono e desigualdade.
    O trabalho também destaca disparidades regionais e o impacto da distância geográfica
    entre presas e suas famílias.'
  metodologia: A apuração partiu da análise dos microdados do Sisdepen, que são públicos,
    disponibilizados pelo Ministério da Justiça, e podem ser consultados online (neste
    link https://www.gov.br/senappen/pt-br/servicos/sisdepen). A equipe de reportagem
    tratou, organizou e cruzou os dados para identificar o percentual de mulheres
    que não recebem visitas em cada estado brasileiro. A investigação foi complementada
    por entrevistas com especialistas em sistema prisional, direitos humanos e gênero,
    além de relatos de mulheres presas e ex-presidiárias. A metodologia combinou jornalismo
    de dados, checagem documental e reportagem em campo, garantindo rigor analítico
    e sensibilidade narrativa.
