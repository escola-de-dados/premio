- title: 'Jardins, chácaras e santos: O que dizem os nomes das favelas de São Paulo'
  project_url: https://agenciamural.org.br/especiais/nomes-das-favelas-de-sao-paulo/
  veiculo: Agência Mural de Jornalismo das Periferias
  autoria: Artur Ferreira | Cleberson Santos | Matheus Oliveira | Nathália Ract da
    Silva | Paulo Talarico | Magno Borges | Léu Britto | Paulo Talarico
  data: 1/24/2025
  resumo: Os últimos dados do IBGE mostram que a cidade de São Paulo possui 1,7 milhão
    de pessoas que vivem em mais de 1.300 favelas. Entre tantas comunidades, ocupações
    e moradias que começaram improvisadas, há mais de 300 jardins, 92 vilas e 74 parques.
    A reportagem analisa os nomes para fazer um mergulho sobre a visão de moradores
    de vários desses territórios e o que há por trás dessas escolhas.
  relevância: Trata de um recorte pouco visto sobre o que são as favelas, levando
    em consideração os nomes escolhidos para batizá-las. Além disso, utilizamos outros
    dados e entrevistas para traçar as histórias de cada região abordada.
  originalidade: A reportagem usou a base de dados sobre as favelas para fazer um
    recorte inédito. Analisar quais são os nomes que mais aparecem nesses territórios.
    O levantamento feito pela Agência Mural mostra que pelos mais de 1.416 nomes,
    algumas palavras aparecem com mais ênfase. Mais de 500 favelas foram batizadas
    com nomes que remetem a bairros, como Jardins, Vilas e Parques. Por um lado, indica
    o desejo do reconhecimento do espaço, ao mesmo tempo, uma tática de sobrevivência
    ou para garantir a venda de imóveis.
  metodologia: "Foram utilizados os dados mais recentes do Censo do IBGE sobre as\
    \ favelas presentes em São Paulo. A partir da lista de nomes, utilizamos a linguagem\
    \ Python para extrair os nomes mais presentes nesses territórios. \n\nCom o resultado,\
    \ identificamos a presença grande de Jardins, Vilas e Parques, e também de outros\
    \ tipos de nomes como os de santos. Com isso, correspondentes que vivem próximo\
    \ a essas regiões foram em busca dos moradores para relatar o que há por trás\
    \ desses significados."
