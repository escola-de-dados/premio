- title: 'Interrompidas: Sem apoio, adolescentes no Maranhão abandonam a escola após
    a gravidez'
  project_url: https://www.generonumero.media/reportagens/adolescentes-gravidez-escola/
  veiculo: Gênero e Número em parceria com a Fiquem Sabendo e Embaixada Britânica
    no Brasil
  autoria: 'Repórter: Maíra Soares / Expediente da Fiquem Sabendo - Coordenação Editorial:
    Maria Vitória Ramos, Análise de dados: Igor Laltuf, Revisão textual: Taís Seibt,
    Mentoria: Marta Alencar / Expediente da Gênero e Número - Direção de conteúdo
    e edição: Vitória Régia da Silva, Edição: Vitória Régia da Silva, Design e Infografia:
    Victoria Sacagami, Revisão: Lola Ferreira, Checagem de dados: Diego Nunes da Rocha.'
  data: 3/7/2025
  resumo: A reportagem traz a perspectiva de como a gravidez na adolescência e a ausência
    de suporte familiar e de políticas públicas comprometem a educação de meninas
    no Maranhão.
  relevância: O trabalho realizado é relevante pelo aspecto de ampliar o debate, com
    base em dados obtidos via Lei de Acesso à Informação (LAI), de como meninas são
    mais afetadas em relação à gravidez precoce, dificultando a continuidade dos estudos
    ou fazendo com que estas retornem às salas de aula tardiamente para finalizar
    seu ciclo escolar básico. Além disso, a reportagem traz uma temática transversal,
    que foca o olhar no Nordeste do país através do Maranhão, e abrange as políticas
    públicas relacionadas com a saúde feminina, educação, acolhimento e rede de apoio.
  originalidade: A reportagem está focada em mostrar como a gravidez na adolescência
    ainda é um tema de impacto silencioso na vida de meninas. Com foco no eixo Nordeste,
    através do Maranhão, a reportagem destaca pontos principais entre o Brasil e a
    Região Nordeste, ampliando o debate sobre o tema, além de mostrar como o acolhimento
    e a saúde mental são temáticas essenciais para as mães adolescentes.
  metodologia: Os dados foram trabalhados seguindo a escala Brasil, Nordeste e Maranhão,
    existindo uma comparação entre essas três esferas com o intuito de compreender
    a realidade maranhense frente à realidade do país. Além disso, os dados foram
    obtidos via Lei de Acesso à Informação (LAI), com orientações específicas que
    ajudam a compreender as políticas públicas existente e como podemos estabelecer
    soluções eficazes.
