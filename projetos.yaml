- title: PM mantém sem câmeras quatro dos dez batalhões mais letais de São Paulo
  project_url: https://ponte.org/pm-mantem-sem-cameras-quatro-dos-dez-batalhoes-mais-letais-de-sao-paulo/
  veiculo: Ponte Jornalismo
  autoria: Paulo Batistella
  data: 2/6/2025
  resumo: Reportagem mostrou que, das 30 unidades mais letais da Polícia Militar do
    Estado São Paulo desde 2020, quando foram adotadas as câmeras corporais, nove
    delas eram mantidas sem os aparelhos. Entre as dez mais letais, quatro não têm
    câmeras.
  relevância: Reportagem foi produzida em um momento em que a alocação das câmeras
    corporais pela Polícia Militar do Estado de São Paulo era alvo de contestação
    em processo em tramitação no Supremo Tribunal Federal. À época, não havia clareza
    sobre os critérios de alocação dos aparelhos pelo governo de São Paulo, que era
    cobrado a disponibilizá-los em operações policiais de alta letalidade.
  originalidade: 'O trabalho expôs um cenário que não era de conhecimento público
    até então: o governo ignorava, na distribuição das câmeras, unidades policiais
    com letalidade maior do que a de outras unidades que dispunham dos aparelhos.'
  metodologia: 'A reportagem cruzou dados de letalidade policial do Ministério Público
    do Estado de São Paulo, obtidos mediante pedido via Lei de Acesso à Informação,
    com informações prestadas pela Procuradoria-Geral do Estado de São Paulo na Suspensão
    de Liminar 1.696, em tramitação no STF, sobre a unidades policiais que contavam
    com câmeras corporais. A íntegra do levantamento feito pela reportagem foi disponibilizada
    com link no texto: https://docs.google.com/spreadsheets/d/1II8oKJ1knH38L6HKTJI4LQaB4JyW4DECUYMQ-vE6dtQ/edit?gid=0#gid=0.'
