- title: Até a Última Gota
  project_url: https://infoamazonia.org/project/ate-a-ultima-gota/
  veiculo: InfoAmazonia, em parceria com GK, Ojo Público e Rutas del Conflicto
  autoria: Juliana Mori, Flávia Milhorance, Carolina Dantas, Fábio Bispo, Pilar Puentes,
    Aramís Castro, Emilia Paz Y Miño, Isabela Ponce, Victor Moriyama, Diego Lucero,
    Juan Carlos Contreras, Marco Garro, Catalina Lobo-Guerrero, Nelly Luna Amancio,
    Renata Hirota, Carolina Passos, Marilia Ferrari, Victoria Sacagami, Amanda Gedra,
    Joubert Marques, Juan Ortiz, Matt Sandy, Juliana Horta, Rafael Fagundes, Luiza
    Toledo, Oscar Parra, Stefano Wrobleski
  data: 4/1/2025
  resumo: "O especial Até a Última Gota é  uma investigação jornalística transfronteiriça\
    \ e multidisciplinar que percorreu a Amazônia ao longo de quase um ano para entender\
    \ os impactos — passados, presentes e futuros — da exploração petrolífera no maior\
    \ bioma tropical do planeta.\n\nCoordenado por InfoAmazonia em parceria com outros\
    \ veículos de países amazônicos – GK (Equador), Ojo Público (Peru) e Rutas del\
    \ Conflicto (Colômbia) - o projeto investigou extensas bases de dados, examinou\
    \ documentos inéditos de governos e empresas, realizou dezenas de entrevistas\
    \ e reportagens de campo em cinco países que concentram mais de 80% da floresta\
    \ tropical: Brasil, Colômbia, Equador, Guiana e Peru.\n\nA investigação revelou\
    \ que quase um quinto das descobertas recentes de petróleo e gás natural no mundo\
    \ está concentrado na região, consolidando a maior floresta tropical do planeta\
    \ como uma nova fronteira global para a indústria fóssil. \n\nDiante do crescente\
    \ interesse por esses recursos e da pressão do governo brasileiro para explorar\
    \ petróleo na foz do rio Amazonas, a série de seis capítulos mostra como a expansão\
    \ da atividade petrolífera transforma ecossistemas, impacta populações indígenas\
    \ e altera dinâmicas políticas e econômicas em escala transnacional. \n\nReportagens\
    \ publicadas (em português, espanhol e inglês):\n- Amazônia desponta como nova\
    \ fronteira global do petróleo\n- Petroleiras criam ‘cortina de fumaça’ para viabilizar\
    \ exploração na costa amazônica do Brasil\n- ExxonMobil consolida ‘petroestado’\
    \ em meio a denúncias ambientais na Guiana\n- Indígenas da Amazônia colombiana\
    \ denunciam poluição por petróleo e ameaças de guerrilhas\n- Petróleo gera royalties,\
    \ mas não desenvolvimento na Amazônia peruana\n- Petroleiras aproveitam disputas\
    \ entre indígenas e ocupam papel de Estado enquanto exploram territórios no Equador"
  relevância: 'A Amazônia está no centro das discussões globais sobre clima e biodiversidade
    — e o avanço da exploração de petróleo em seu território representa um paradoxo
    urgente. Por décadas, comunidades amazônicas conviveram com promessas de desenvolvimento
    econômico impulsionado pelo petróleo. No entanto, o que muitos vivenciaram foram
    vazamentos de óleo, desmatamento, deslocamentos forçados e o aprofundamento de
    desigualdades sociais.


    A série mostra como a expansão da atividade petrolífera impacta diretamente ecossistemas
    sensíveis, afeta comunidades indígenas e redesenha dinâmicas políticas e econômicas
    além das fronteiras nacionais. Com reportagens de campo em cinco países, a investigação
    revela como decisões tomadas por governos e empresas repercutem em toda a bacia
    amazônica.


    O ponto de partida da investigação foi a recente pressão do governo brasileiro
    para explorar petróleo na foz do rio Amazonas — mesmo após sucessivas negativas
    dos órgãos ambientais e alertas da comunidade científica. O tema se torna ainda
    mais relevante no momento em que o Brasil se prepara para sediar a COP30 em Belém,
    no Pará, suscitando debates fundamentais sobre os limites entre conservação e
    exploração em uma das regiões mais estratégicas para o futuro do planeta.'
  originalidade: 'O projeto se destaca pela abordagem inédita e integrada da fronteira
    petrolífera em toda a Pan-Amazônia. Pela primeira vez, um esforço jornalístico
    reuniu e analisou dados espaciais, históricos e políticos de toda a região, combinando
    investigações de campo em cinco países, com   análise documental e visualizações
    de dados em um mesmo trabalho colaborativo.


    Dessa forma, a série constrói um panorama inédito da exploração já consolidada
    em países como Equador e Peru — regiões onde a indústria petrolífera atua há décadas
    — e parte desse histórico de impactos sociais e ambientais para trazer evidências
    para o debate atual no Brasil. Essa contextualização ajuda o público brasileiro
    a compreender os riscos associados à abertura da bacia da Foz do Amazonas à exploração,
    revelando padrões de violações e impactos recorrentes em outras partes do bioma.


    Entre os destaques, estão visualizações da sobreposição de blocos petrolíferos
    com terras indígenas e áreas protegidas, a análise inéditas da população amazônida
    afetada por gas flaring, mapeamentos exclusivos de dados históricos de vazamentos
    de óleo no Equador e o rastreamento das conexões entre a pressão por novos leilões
    no Brasil e decisões políticas recentes. A  investigação também analisou a execução
    dos recursos arrecadados por municípios com impostos da atividade petrolífera
    no Peru e o cruzamento entre PIB e desemprego na Guiana, revelando que, mesmo
    com o aumento da arrecadação, a exploração de petróleo não tem se traduzido em
    melhorias concretas na vida da maior parte da população amazônica.


    O projeto combina ferramentas de geojornalismo, análise de dados, design interativo
    e colaboração entre jornalistas e cientistas, conferindo à série um caráter inovador
    tanto na forma quanto na profundidade da apuração.'
  metodologia: "A investigação combinou técnicas de jornalismo de dados, análise espacial\
    \ e visualização interativa. Desde julho de 2024, nossa equipe coletou, limpou,\
    \ investigou e mapeou, os dados disponíveis sobre a exploração de petróleo e gás\
    \ em toda a Amazônia, com foco especial na parcela do bioma que abrange Brasil,\
    \ Colômbia, Equador, Guiana e Peru.\n\nPara compreender o papel da região em relação\
    \ às reservas de óleo no planeta, a análise também incorporou dados globais sobre\
    \ descobertas recentes de petróleo e gás. Foi assim que identificamos que as reservas\
    \ encontradas na Amazônia representam quase um quinto de todos os achados recentes\
    \ — entre 2022 e 2024 — no mundo.\n\nTambém foi fundamental entender os impactos\
    \ da atividade em terras indígenas e unidades de conservação, além de observar\
    \ problemas ambientais como o desmatamento, as infrações e os registros de gas\
    \ flaring — a queima de gás natural excedente da extração de petróleo. Na maioria\
    \ dos casos, reunimos dados atualizados até 2024, com ênfase nos registros dos\
    \ últimos anos.\n\n Os principais resultados incluem a identificação de áreas\
    \ de maior sensibilidade ambiental e a sobreposição entre territórios indígenas\
    \ e unidades de conservação com blocos de petróleo em diferentes fases, em terra\
    \ (onshore) ou no mar (offshore). Também realizamos análises econômicas cruzando\
    \ dados de arrecadação, PIB e desemprego. As análises foram validadas por especialistas\
    \ locais, consultores científicos e complementadas por observação e entrevistas\
    \ em campo.\n\nUtilizamos ferramentas como QGIS para geoprocessamento, linguagem\
    \ R para tratamento e análise de dados, e plataformas como Mapbox, Flourish e\
    \ Jeo para visualizações cartográficas interativas.\n\nNa finalização do projeto,\
    \ contamos também com a parceria da equipe de design de informação do Lab Gênero\
    \ e Número, que contribuiu para a identidade visual e criou mapas estáticos e\
    \ infográficos, com desenvolvimento próprio em formato scrollytelling. Esses materiais\
    \ deram forma a dados complexos e ajudaram a comunicar visualmente padrões numéricos\
    \ e espaciais revelados pela investigação.\n\nTodos os dados e procedimentos da\
    \ análise estão descritos nestas páginas dedicadas à transparência do projeto.\n\
    \nMetodologia completa disponível em:\nhttps://infoamazonia.org/2025/04/01/como-investigamos-os-dados-de-petroleo-na-amazonia/\n\
    \nMetodologia específica da matéria da Guiana (com explicação sobre a análise\
    \ de emissões de CO2) em: \nhttps://infoamazonia.org/2025/04/08/como-investigamos-a-atuacao-da-exxonmobil-e-a-promessa-de-carbono-neutro-na-guiana/"
