- title: Observatório Nacional dos Direitos Humanos – ObservaDH
  project_url: https://observadh.mdh.gov.br/
  veiculo: Ministério dos Direitos Humanos e da Cidadania
  autoria: Pedro de Lemos MacDowell (Coordenador-Geral de Indicadores e Evidências
    em Direitos Humanos); Luciana Felix Ferreira; Bruno Gondim Barbosa Duarte; Daniela
    Fortunato Rêgo; Gabriela Catunda Peres; Júlia de Albuquerque Pacheco; Luciani
    Martins Ricardi; Ana Paula Soares Gomes; Gleidistone Rodrigues Carvalho; Nöelle
    da Silva; Sara Emanuela de Carvalho Mota; Pedro Henrique de Pina Cabral Viana;
    Roberto Rocha Coelho Pires; Március Alves Crispim; Claudiomar Matias Rolim Filho;
    Paula Regina de Oliveira Ferreira.
  data: 3/24/2025
  resumo: "No Dia Internacional da Memória e Verdade, celebrado em 24/03/2025, o Observatório\
    \ Nacional dos Direitos Humanos (ObservaDH), plataforma virtual de indicadores\
    \ e evidências do Ministério dos Direitos Humanos e da Cidadania (MDHC), publicou\
    \ uma nova seção dedicada ao resgate histórico e à justiça em casos de graves\
    \ violações de direitos humanos. A nova seção, chamada \"Memória e Verdade\",\
    \ apresenta temas como as presenças negra e africana no Brasil, o tráfico transatlântico\
    \ de pessoas escravizadas e os impactos da ditadura militar. Os conteúdos incluem\
    \ mapas interativos, gráficos e dados históricos acessíveis ao público, promovendo\
    \ conhecimento e conscientização. \n\nDesde o lançamento da plataforma virtual,\
    \ que ocorreu em evento oficial dos 75 anos da Declaração Universal dos Direitos\
    \ Humanos, em dezembro de 2023, o ObservaDH tem como objetivo de garantir o amplo\
    \ acesso a dados e indicadores sobre a situação dos direitos humanos no Brasil.\
    \ A plataforma reúne um conjunto de indicadores e índices, apresentados na forma\
    \ de narrativas de dados e painéis interativos, sobre os públicos e os temas prioritários\
    \ do MDHC, utilizando ferramentas e tecnologias interativas e com acessibilidade.\
    \ São constantemente atualizadas e publicadas narrativas de dados, com indicadores\
    \ produzidos com mais de 40 bases de dados, para temas como crianças e adolescentes;\
    \ pessoas idosas; pessoas com deficiência; pessoas Lésbicas, Gays, Bissexuais,\
    \ Travestis, Transexuais, Queers, Intersexo, Assexuais e outras; pessoas em situação\
    \ de rua; pessoas privadas de liberdade; defensores(as) de direitos humanos; Memória\
    \ e Verdade; Registro Civil de Nascimento; Enfrentamento ao Discurso de Ódio e\
    \ Violências nas Escolas."
  relevância: "A utilização de indicadores e evidências para a implementação, o monitoramento\
    \ e a avaliação de políticas públicas se consolidou nas últimas décadas em áreas\
    \ como a saúde, a educação e a assistência social, mas ainda é pouco institucionalizada\
    \ nas políticas de direitos humanos, mesmo com as diretrizes presentes no Programa\
    \ Nacional de Direitos Humanos – PNDH-3 (Decreto nº 7.037, de 21 de dezembro de\
    \ 2009).  \n\nUma das diretrizes do PNDH-3 é a “Integração e ampliação dos sistemas\
    \ de informação em Direitos Humanos e a construção de mecanismos de avaliação\
    \ e monitoramento de sua efetivação”. Para essa diretriz convergem diversas propostas\
    \ de ações programáticas, como “Instituir e manter sistema nacional de indicadores\
    \ em Direitos Humanos, de forma articulada com os órgãos públicos e a sociedade\
    \ civil”, “Integrar os sistemas nacionais de informações para elaboração de quadro\
    \ geral sobre a implementação de políticas públicas e violações aos Direitos Humanos”,\
    \ “Articular a criação de base de dados com temas relacionados aos Direitos Humanos”\
    \ e “Utilizar indicadores em Direitos Humanos para mensurar demandas, monitorar\
    \ avaliar, reformular e propor ações efetivas”.  \n\nO PNDH-3 também tem como\
    \ diretriz o “Fortalecimento dos Direitos Humanos como instrumento transversal\
    \ das políticas públicas e de interação democrática”, que propõe, desde 2009,\
    \ a ação programática de “Criar o Observatório Nacional dos Direitos Humanos para\
    \ subsidiar, com dados e informações, o trabalho de monitoramento das políticas\
    \ públicas e de gestão governamental e sistematizar a documentação e legislação,\
    \ nacionais e internacionais, sobre Direitos Humanos”.   \n\nEm que pese a importância\
    \ das políticas de direitos humanos em um país marcado pela profunda desigualdade\
    \ e pela vulnerabilidade de diversos grupos sociais a violências e violações de\
    \ direitos, assim como esforços anteriores para o monitoramento de indicadores\
    \ nesse campo e as diretrizes do Programa Nacional de Direitos Humanos, o Brasil\
    \ nunca havia instituído um Observatório Nacional dos Direitos Humanos, até a\
    \ criação do ObservaDH em 2023.  \n\nOs registros administrativos federais e as\
    \ pesquisas nacionais, principais fontes para os indicadores, estão sob gestão\
    \ de órgãos diversos, disponibilizados em formatos muito distintos e com pouca\
    \ acessibilidade, e que muitas vezes não contêm todas as desagregações necessárias\
    \ para construção de indicadores de direitos humanos dos diferentes públicos e\
    \ temas do MDHC.  \n\nO período entre 2019 e 2022 testemunhou um agravamento do\
    \ problema, com o desmonte ou a fragilização de uma série de políticas relacionadas\
    \ aos direitos humanos, com impactos sobre a coleta de dados e informações pelos\
    \ órgãos de governo e redução nos investimentos em pesquisa. Assim, tanto gestores\
    \ e técnicos das políticas de direitos humanos, quanto a sociedade civil atuante\
    \ no campo, enfrentam várias barreiras para uso de indicadores e evidências na\
    \ tomada de decisões das políticas públicas brasileiras.  \n\nPor meio do ObservaDH,\
    \ o Ministério dos Direitos Humanos e da Cidadania tem realizado um esforço inédito\
    \ de consolidação, produção e divulgação de indicadores de direitos humanos, disponibilizados\
    \ de forma acessível."
  originalidade: "O Ministério dos Direitos Humanos e da Cidadania (MDHC) institucionalizou,\
    \ de forma inédita, a cultura de Políticas Informadas por Evidências no campo\
    \ dos direitos humanos, com a criação do ObservaDH - Observatório Nacional dos\
    \ Direitos Humanos (Portaria nº 571, de 11 de setembro de 2023), integrado com\
    \ a ReneDH - Rede Nacional de Evidências em Direitos Humanos (Portaria nº 762,\
    \ de 07 de dezembro de 2023).  \nQuase 14 anos depois do PNDH-3 prever a instituição\
    \ de um observatório nacional, o MDHC lançou a plataforma virtual do ObservaDH,\
    \ com objetivo de garantir o amplo acesso a dados e indicadores sobre a situação\
    \ dos direitos humanos no Brasil. O lançamento ocorreu em evento oficial dos 75\
    \ anos da Declaração Universal dos Direitos Humanos, em dezembro de 2023. \nO\
    \ ObservaDH foi desenvolvido pela Coordenação-Geral de Indicadores e Evidências\
    \ em Direitos Humanos (CGIE), criada em janeiro de 2023 como unidade da Secretaria-Executiva\
    \ do MDHC. A criação de unidades especializadas em políticas públicas informadas\
    \ por evidências também é uma estratégia inovadora, e uma das formas recomendadas\
    \ por especialistas para melhorar o uso das evidências no setor público.  \nPor\
    \ meio do ObservaDH, o MDHC tem realizado um esforço inédito de consolidação,\
    \ produção e divulgação de indicadores de direitos humanos. A plataforma reúne\
    \ um conjunto de indicadores e índices, apresentados na forma de narrativas de\
    \ dados e painéis interativos, sobre os públicos e os temas prioritários do MDHC,\
    \ utilizando ferramentas e tecnologias interativas e com acessibilidade. São apresentadas\
    \ narrativas de dados com indicadores produzidos com mais de 40 bases de dados,\
    \ para temas como crianças e adolescentes; pessoas idosas; pessoas com deficiência;\
    \ pessoas Lésbicas, Gays, Bissexuais, Travestis, Transexuais, Queers, Intersexo,\
    \ Assexuais e outras; pessoas em situação de rua; pessoas privadas de liberdade;\
    \ defensores(as) de direitos humanos; Memória e Verdade; Registro Civil de Nascimento;\
    \ Enfrentamento ao Discurso de Ódio e Violências nas Escolas.  \nA integração\
    \ com a Rede Nacional de Evidências em Direitos Humanos institucionaliza no MDHC\
    \ o modelo conceitual-teórico de Tradução do Conhecimento, fomentando um ecossistema\
    \ de uso e difusão de evidências e informações estratégicas, tanto para subsidiar\
    \ a tomada de decisão como para superar lacunas de dados em temas prioritários\
    \ de direitos humanos e cidadania no serviço público brasileiro. Entre os públicos\
    \ diretamente afetados pela iniciativa estão as gestoras e os gestores públicos;\
    \ conselheiros de políticas públicas, em especial, dos direitos humanos; as profissionais\
    \ e os profissionais da rede de promoção, proteção e defesa dos direitos humanos;\
    \ as diversas organizações da sociedade civil que atuam no campo dos direitos\
    \ humanos; jornalistas e comunicadores sociais; pesquisadoras e pesquisadores,\
    \ docentes e demais profissionais da educação; estudantes de ensino médio e superior;\
    \ e pessoas com deficiência que procuram informações acessíveis sobre indicadores\
    \ de direitos humanos. Os públicos indiretamente afetados pela iniciativa são\
    \ os usuários da rede de promoção, proteção e defesa dos direitos humanos, além\
    \ do público geral."
  metodologia: "Os indicadores do ObservaDH foram construídos seguindo orientações\
    \ do Guia de Indicadores de Direitos Humanos das Nações Unidas e do Guia sobre\
    \ a abordagem de dados baseada em direitos humanos para a Agenda 2030 do Escritório\
    \ do Alto Comissariado das Nações Unidas para os Direitos Humanos, mas com uma\
    \ matriz de indicadores inovadora. Ao invés de serem organizados pelos direitos\
    \ da Declaração Universal, os indicadores são apresentados com centralidade nas\
    \ pessoas e grupos prioritários das políticas, colocando as pessoas no centro.\
    \ \n\nAs principais etapas da implementação da iniciativa foram: \n\nCriação da\
    \ Coordenação-Geral de Indicadores e Evidências em Direitos Humanos na Secretaria-Executiva\
    \ do MDHC, e recrutamento de servidores com perfil e competências necessários;\
    \  \n\nLevantamento, por meio de pesquisa e de entrevistas com gestores e técnicos,\
    \ de iniciativas anteriores para a construção de indicadores de direitos humanos\
    \ no Brasil e de experiências internacionais;   \n\nMapeamento das bases de dados\
    \ disponíveis, preferencialmente registros administrativos federais e pesquisas\
    \ censitárias nacionais de acesso público, com identificação de variáveis relevantes\
    \ para construir indicadores de direitos humanos;   \n\nApresentação da iniciativa\
    \ para público de especialistas, gestores, pesquisadores e representantes da sociedade\
    \ civil, com o objetivo de receber contribuições e qualificar o projeto;   \n\n\
    Definição das ferramentas tecnológicas necessárias para implementação da plataforma\
    \ e contratação do software ArcGIS;   \n\nEstabelecimento de parcerias e cooperação\
    \ com outros órgãos públicos para garantir o acesso a bases de dados e informações\
    \ necessárias e não disponibilizadas publicamente;  \n\nDefinição dos temas prioritários;\
    \  \n\nExtração e tratamento das bases de dados selecionadas para a construção\
    \ das narrativas de dados dos temas priorizados;   \n\nAnálise dos dados e produção\
    \ de indicadores e correlações relevantes e alinhadas à perspectiva de direitos\
    \ humanos;   \n\nElaboração de narrativas de dados para apresentação dos indicadores\
    \ ao público, incluindo elaboração de gráficos, mapas, infográficos, e outros\
    \ recursos;   \n\nDesenvolvimento da identidade visual do ObservaDH e elaboração\
    \ de ilustrações;  \n\nAdaptação das narrativas às necessidades de acessibilidade,\
    \ tanto em relação à simplicidade da linguagem quanto aos recursos necessários\
    \ para aprimorar a navegação por pessoas com deficiência, com desenvolvimento\
    \ de audiodescrição dos textos, imagens e recursos gráficos utilizados;   \n\n\
    Atualização das narrativas de dados do ObservaDH e produção de novas narrativas,\
    \ tanto pela equipe da CGIE quanto por meio de parcerias, como a seção Violências\
    \ nas Escolas, desenvolvida em parceria com o Ministério da Educação, o Fórum\
    \ Brasileiro de Segurança Pública (FBSP) e a Unesco.  \n\nA atualização do ObservaDH\
    \ e inclusão de novos conteúdos é um processo contínuo desde o lançamento, mas\
    \ no Dia Internacional da Memória e Verdade (24/03/2025), foi lançada a seção\
    \ chamada \"Memória e Verdade\", com narrativas de dados que abordam temas como\
    \ as presenças negra e africana no Brasil, o tráfico transatlântico de pessoas\
    \ escravizadas e os impactos da ditadura militar. A narrativa “Mortos e desaparecidos\
    \ políticos” apresenta uma análise de dados com abordagem inédita, a partir do\
    \ Relatório Final da Comissão Nacional da Verdade (CNV), que reconheceu 434 vítimas\
    \ da repressão estatal entre 1946 e 1988. Já a publicação “Anistia Política” expõe\
    \ os resultados da Comissão de Anistia, que analisou mais de 80 mil requerimentos\
    \ de vítimas perseguidas por motivos políticos. O ObservaDH também apresenta a\
    \ narrativa “Lugares de memória da ditadura militar”, que mapeia espaços históricos\
    \ relacionados à repressão, a narrativa “Lugares de Memória Negra e Africana no\
    \ Brasil”, que mapeia 100 locais marcantes dessa história, ressaltando a presença\
    \ e resistência africana no país, e a narrativa “Volume do Tráfico Transatlântico\
    \ de Pessoas Escravizadas”, que destaca que mais de 10,6 milhões de pessoas foram\
    \ levadas à força da África para as Américas entre os séculos XVI e XIX, sendo\
    \ que 3,9 milhões chegaram ao Brasil."
