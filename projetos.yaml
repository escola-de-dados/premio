- title: Massacre Invisível
  project_url: https://oeco.org.br/especial/massacre-invisivel/
  veiculo: Site O Eco
  autoria: 'Reportagem: Aldem Bourscheit; Coordenação geral: Paulo André Vieira; Coordenação
    editorial: Marcio Isensee e Sá; Edição de texto: Daniele Bragança; Artes: Gabriela
    Güllich; Redes sociais: Andressa Cabral; Assessoria para dados públicos: Fiquem
    Sabendo; Apoio: Proteção Animal Mundial no Brasil; Tradução Português – Inglês:
    Luciana Fajardo'
  data: 2/4/0025
  resumo: O especial denuncia o problema globalmente negligenciado dos animais silvestres
    que se afogam em canais de irrigação do agronegócio. Essas estruturas, muitas
    vezes artificiais e sem dispositivos de escape, podem ser armadilhas fatais para
    a fauna. Com a expansão do agronegócio, animais privados de água em seus habitats
    naturais se arriscam a buscar água nesses canais, mas acabam presos sem conseguir
    sair. O texto traz o relato impactante de um lobo‑guará que cai num canal com
    margens escorregadias, luta por sua sobrevivência mas, exausto, se afoga. Esse
    caso simboliza uma tragédia silenciosa agravada pela falta de fiscalização e regulação
    eficazes sobre o uso e manutenção desses canais. A investigação mostra também
    que, só no Brasil, já há cerca de 70 mil  km² de áreas irrigadas — o equivalente
    à metade do território do Amapá — um modelo de agricultura tende a crescer com
    a crise do clima - que eleva a dependência por irrigação artificial e os impactos
    sobre a vida selvagem. Por fim, a série ressalta que urge tornar essa tragédia
    mais visível, exigir fiscalização eficaz, responsabilizar os agentes públicos
    e privados negligentes e implantar soluções que protejam a fauna, como rampas
    de fuga em canais. O objetivo é mobilizar leitores e autoridades a defender ativamente
    o direito à sobrevivência dos animais silvestres em biomas cada vez mais pressionados,
    no Brasil e em vários outros países.
  relevância: O especial denuncia de forma mundialmente inédita as mortes silenciosas
    de animais silvestres em canais de irrigação ligados ao agronegócio e outras atividades
    humanas, um problema amplamente ignorado por autoridades e pela mídia. Por meio
    de dados, imagens e relatos, rompe com o silêncio institucional e pressiona por
    mudanças em políticas ambientais. No Brasil, grande produtor e exportador de alimentos,
    além de vários outros países, revelamos que os canais de água também podem gerar
    perdas graves de biodiversidade, o que deveria preocupar de fazendeiros a governos
    e mercados internacionais, esses cada vez mais atentos à sustentabilidade das
    cadeias produtivas. O conteúdo pode influenciar melhores legislações ambientais
    e exigir medidas como rampas de escape e maior fiscalização, servindo de modelo
    para outros países. A reportagem especial também se alinha a agendas globais,
    como a Convenção sobre Diversidade Biológica e os Objetivos de Desenvolvimento
    Sustentável das Nações Unidas, especialmente o ODS 15. O especial também destaca
    o papel do jornalismo ambiental ao unir dados, imagem e narrativa para expor um
    problema invisível. Sua relevância está em conectar impactos locais a desafios
    globais e embasar políticas públicas e regulações no Brasil e fora dele.
  originalidade: Entre os aspectos de originalidade do trabalho, se destacam a busca
    e relato de casos verídicos de afogamentos de vida selvagem em países de diferentes
    continentes e o uso da Lei de Acesso à Informação (LAI) para investigar e corroborar
    a hipótese de que o problema investigado é ignorado pelas autoridades públicas
    responsáveis. Ao questionar os órgãos ambientais nos estados de destaque na produção
    rural quanto a registros de mortes de animais em valas de irrigação, restou evidente
    a lacuna de fiscalização e de monitoramento nesse quesito. Vale ressaltar que
    as respostas obtidas via LAI são documentos oficiais, portanto, a reportagem produziu
    prova inédita de omissão, por parte das autoridades, na proteção da fauna silvestre
    nas regiões rurais irrigadas.
  metodologia: 'A investigação começou com o levantamento de dados públicos para identificar
    os principais polos de irrigação no Brasil, focando nos estados com maior concentração
    da atividade. Em seguida, foram solicitadas, via Lei de Acesso à Informação (LAI),
    informações sobre autuações e multas por afogamento de animais silvestres nos
    10 estados destacados (MT, GO, DF, MG, BA, SP, RS, TO, PE, CE e ES). Também foram
    questionados órgãos federais como Ibama, ICMBio e MMA, e de municípios com grande
    concentração de áreas irrigadas. A metodologia usou estrategicamente a LAI com
    pedidos detalhados, permitindo análise comparativa das respostas. As solicitações
    exigiam respostas separadas para facilitar o processamento, além de prever explicações
    em caso de negativa. Por exemplo, perguntou-se se os órgãos fazem controle estatístico
    de mortes de fauna em canais de irrigação; se não, solicitava-se o motivo e se
    há planos para implementar esse monitoramento. Em caso positivo, pedia-se o envio
    de planilhas abertas (.csv, .ods, .xlsx). Os dados foram posteriormente publicados
    na newsletter Don’t LAI To Me e estão disponíveis para republicação: https://news.fiquemsabendo.com.br/i/157137422/massacre-invisivel-orgaos-ambientais-nao-monitoram-mortandade-de-animais-silvestres-em-valas-de-irrigacao
    e https://fiquemsabendo.com.br/meio-ambiente/orgaos-ambientais-nao-monitoram-mortandade-de-animais-silvestres-em-valas-de-irrigacao'
  uf: DF
  tipo_inscricao: Investigação
  formato: Online
  category: Investigação
