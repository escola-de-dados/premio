- title: Violência online também atinge candidatas no interior do Brasil
  project_url: https://azmina.com.br/reportagens/violencia-online-tambem-candidatas-no-interior-do-brasil/
  veiculo: Revista AzMina
  autoria: Gabi Coelho, Ana Carolina Araújo, Giulia Santos, Kath Xapi Puri, Ana Carol
    Branco, Bárbara Libório, Clarice Tavares, Catharina Vilela, Fernanda Martins,
    Sergio Spagnuolo, Michel gomes, Henrique Rieger,
  data: 4/10/2024
  resumo: A reportagem “Violência online também atinge candidatas no interior do Brasil”
    analisa 5.988 comentários feitos em transmissões de debates regionais pelo YouTube
    de 10 de agosto a 17 de setembro de 2024, em 25 cidades das quatro principais
    regiões do Brasil. A pesquisa foi conduzida pelo MonitorA – observatório de violência
    política de gênero online, iniciativa do Instituto AzMina, InternetLab, Núcleo
    de Jornalismo e Laboratório de Humanidades Digitais da UFBA, identificando padrões
    de discurso misógino, transfóbico e desqualificador direcionado a candidatas no
    interior do país.
  relevância: A reportagem demonstra que a violência política de gênero não se concentra
    nas grandes capitais, mas também é significativa em cidades do interior e regiões
    metropolitanas no Brasil. Mostra que mulheres recebem 43,95% das mensagens ofensivas,
    enquanto homens, 23,60%, evidenciando um viés de gênero nas agressões online.
    Ao mapear esse fenômeno em múltiplas regiões (com destaque para Sudeste, Nordeste,
    Sul e o fenômeno dos "desertos de notícias" no Norte), a reportagem enquadra um
    problema estrutural que compromete a qualidade democrática, a equidade nas disputas
    eleitorais e agrava a sub-representação feminina na política.
  originalidade: 'A originalidade da reportagem reside está em aplicar o olhar e a
    expertise da equipe do MonitorA, referência na investigação de violência política
    de gênero online, aos debates regionais, usando os comentários no YouTube como
    fonte primária. Esse é um recorte inédito, já que a maioria dos estudos foca nas
    capitais e cidades maiores.

    A análise quantitativa e qualitativa desses comentários permite diferenciar entre
    insultos e ataques motivados por atributos de gênero, raça, orientação sexual,
    entre outros. Além disso, a investigação inclui um olhar comparativo entre distribuição
    geográfica (Sudeste, Nordeste, Sul e Centro‑Oeste), além de apontar os “desertos
    de notícias” no Norte, ampliando o entendimento sobre desigualdade na cobertura
    eleitoral e colonialidade midiática.'
  metodologia: 'A coleta envolveu 5.988 comentários publicados durante transmissões
    ao vivo de debates municipais e regionais entre 10/08 e 17/09/2024, em canais
    do YouTube.

    Cada comentário foi classificado manualmente ou via dicionários contendo termos
    misóginos, transfóbicos, ofensivos, etc. A distinção entre “insultos” e “ataques”
    foi feita com base no uso de marcadores sociais das candidatas (ex.: gênero, aparência,
    raça, identidade de gênero, transfobia).

    O MonitorA é um projeto colaborativo integrado ao Instituto AzMina, InternetLab,
    Núcleo Jornalismo e UFBA, empregando uma abordagem interdisciplinar que combina
    jornalismo, análise de dados e ciências humanas digitais.

    Foram analisados também aspectos regionais, como volume de participação e intensidade
    dos ataques nas diferentes regiões. Houve coleta de dados das hostilidades verbais
    mais frequentes (palavras como “vergonha”, “piada”, “lixo”, etc.), além de entrevistas
    com especialistas (como Michelle Ferreti e Samara Castro) que contextualizam os
    impactos sociais da violência política de gênero.

    Embora a reportagem não tenha divulgado código ou repositório público, o MonitorA
    segue a metodologia aberta de projetos anteriores, e disponibiliza bi anualmente
    relatórios e repositórios.'
