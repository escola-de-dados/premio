- title: Viagem ao Centro do Fogo
  project_url: https://www.amazonialatitude.com/viagem-ao-centro-do-fogo-amazonia-latitude/
  veiculo: Amazônia Latitude & Sumaúma
  autoria: 'Texto e fotos: Edmar Barros Edição: Elielson Almeida e Glauce Monteiro
    (Amazônia Latitude) e Talita Bedinelli (SUMAÚMA) Edição de fotografia: Alice Palmeira
    (Amazônia Latitude) e Lela Brandão (SUMAÚMA) Checagem: Plínio Lopes Revisão ortográfica
    (português): Valquíria Della Pozza Tradução para o inglês: Sarah J. Johnson Tradução
    para o espanhol: Julieta Sueldo Boedo Coordenação de fluxo de trabalho editorial:
    Natália Chagas Direção de Redação: Marcos Colón (Amazônia Laritude) e Eliane Brum
    (SUMAÚMA)'
  data: 9/18/2024
  resumo: O fotojornalista Edmar Barros percorre uma das regiões da Amazônia mais
    atingidas pelos incêndios para mostrar a destruição provocada pelas queimadas
    e também pela seca. Neste diário, registrado pela Amazônia Latitude em parceria
    com SUMAÚMA, ele conta as ruínas do caminho.
  relevância: A cobertura especial “Viagem ao centro do fogo” traz sobretudo um diário
    de guerra – um relato em primeira pessoa, guiado pelo olhar sensível do fotojornalista
    Edmar Barros, que mergulha nas chamas e na fumaça da Amazônia para mostrar, de
    dentro para fora, as marcas da destruição.
  originalidade: 'Em vez de um mero apanhado de dados ou de imagens espetaculares,
    ele combina:• Descrição cronológica da viagem (rota, horários, balsa, BR-319,
    Transamazônica), intercalada com informações de satélite e números oficiais de
    focos de incêndio. • Depoimentos colhidos no caminho, que apontam a ausência quase
    total do Estado e dos bombeiros na região. • Impressões sensoriais: garganta que
    queima, olhos lacrimejando, visibilidade reduzida a poucos metros pela poeira
    e fumaça. • Carga emocional – Barros não tenta se esconder: diz que “chora várias
    vezes”, que o luto pela própria cidade-natal, Lábrea, o impulsiona e o dilacera.


    Os aspectos originais deste trabalho são: A fusão de fotojornalismo e diário íntimo
    (o autor é nascido em Lábrea e coloca sua própria emoção no centro da narrativa).
    A ênfase na “invisibilidade” do sul do Amazonas para o aparato estatal — um contraponto
    radical aos telejornais que focam queimadas em outras regiões. O discurso de guerra,
    que reforça o caráter criminoso dos incêndios, a seca e o abandono pelo poder
    público. O formato colaborativo (Amazônia Latitude + SUMÁUMA), que mistura ativismo,
    jornalismo independente e arte visual para dar voz a quem quase não aparece no
    mapa político.Juntos, esses elementos fazem de “Viagem ao centro do fogo” um relato
    inédito: não apenas “ver” o desastre, mas senti-lo e humanizá-lo.'
  metodologia: 'A metodologia para trabalhar com o conjunto diário de dados (textos,
    fotos e vídeos) enviado pelo Edmar ao longo dos 1 800 km percorri­dos assentou-se
    em quatro fases interdependentes:


    Coleta e ingestão diária • Edmar produzia, ao final de cada etapa do percurso,
    uma nota de campo tipo “diário”: texto livre relatando rota, condições climáticas,
    impactos visuais e sensoriais (fumaça, calor, cheiro). • Fotografias foram feitas
    em RAW e JPEG, sempre georreferenciadas. Vídeos curtos (30–90″) documentavam fogo
    ativo, testemunhos ou logística. • Cada pacote diário era imediatamente carregado
    em pasta na nuvem acessível para ambas equipes (Amazônia Latitude & SUMÁUMA)


    Catalogação e enriquecimento • Ao receber o material, a equipe de back-office
    rodava scripts automáticos para extrair metadados EXIF/GPS e inserir registros
    em planilha-mestra (data, hora, ponto GPS, temperatura aproximada, visibilidade).
    • Jornalistas faziam uma leitura rápida do texto para identificar temas-chave
    e inseriam tags manuais. • As fotos e vídeos eram pré-selecionados em baixa resolução
    para montagem rápida de entregas diárias ao editor.


    Cruzamento e validação • Cada deslocamento e cada ponto de fogo registrado por
    Edmar era cruzado com dados oficiais do INPE (focos de calor) e imagens de satélite
    (MODIS/VIIRS) para verificar consistência espacial/temporal. • Em casos de discrepância
    (por ex., clima muito seco, mas sem foco detectado), a equipe enviava questionamento
    ao Edmar para relato complementar no dia seguinte.


    Construção narrativa e montagem final • Com o acervo catalogado, a equipe editorial
    estruturava o relato como “viagem em capítulos”, alinhando o diário de Edmar à
    cronologia de focos de calor e à rota georreferenciada. • Selecionavam-se de  5
    a 10 fotos-chave e 1 vídeo curto por capítulo, buscando representar visualmente
    o que o texto narrava. • Feito o story-board, o designer ajustava legendas, sobreposições
    cartográficas (mapas de localização) e timelines interativas. Ao final, resultou-se
    em uma reportagem que vai do granular (nota de campo) ao global (perspectiva ),
    mantendo viva a urgência dos relatos diários de Edmar.'
  uf: AM
  tipo_inscricao: Investigação
  formato: Online
  category: Investigação
