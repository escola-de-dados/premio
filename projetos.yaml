- title: Deputados estaduais carimbam R$ 12 bi dos orçamentos regionais e fazem até
    'emenda Pix'
  project_url: https://www1.folha.uol.com.br/mercado/2025/04/deputados-estaduais-carimbam-r-12-bi-dos-orcamentos-regionais-e-fazem-ate-emenda-pix.shtml
  veiculo: Folha de S.Paulo
  autoria: Idiana Tomazelli
  data: 4/9/2025
  resumo: A reportagem mostra que os deputados estaduais carimbaram R$ 11,9 bilhões
    dos orçamentos desses entes para emendas parlamentares em 2025. O valor é fruto
    de reservas fixas criadas à semelhança das regras impostas à União. Das 27 unidades
    da federação, 24 preveem destinação obrigatória para essas verbas, a maior parte
    delas garantida na Constituição estadual. Vinte deles também autorizam as transferências
    especiais, batizadas de "emendas Pix", que asseguram um aporte direto de recursos
    nos cofres municipais e estão sujeitas a menor controle e transparência.
  relevância: O debate sobre emendas parlamentares normalmente foca só nas consequências
    disso para o Orçamento Federal, que de fato é onde está a maior reserva de valores
    para essas verbas. No entanto, a prática se proliferou nos governos regionais,
    e jogar luz sobre esse fato é de extrema relevância, sobretudo diante dos números
    revelados pela reportagem. Eles evidenciam que as emendas estaduais representam
    um valor significativo, aplicado em esferas de governos sujeitas a mecanismos
    mais frágeis de fiscalização e mais expostos a pressões políticas locais.
  originalidade: Reportagens sobre emendas parlamentares costumam olhar para a verba
    federal, no agregado ou como ela é aplicada na ponta. O trabalho inova ao olhar
    para os orçamentos estaduais, trazendo evidências de que não só a prática se alastrou,
    mas também já movimenta valores vultosos e também requer maior fiscalização. A
    reportagem foi inclusive citada por participantes da audiência pública sobre emendas
    parlamentares, realizada no STF em 27 de junho.
  metodologia: A reportagem analisou 26 Constituições estaduais e a Lei Orgânica do
    Distrito Federal para mapear as regras de destinação de emendas parlamentares
    em todas as unidades da federação. Em seguida, a reportagem analisou as 27 leis
    orçamentárias estaduais para identificar os valores efetivamente destinados no
    ano de 2025. O levantamento foi feito após a reportagem procurar todos os governos
    estaduais. Muitos deles nem responderam, e entre aqueles que o fizeram, as informações
    não foram prestadas de forma completa. O trabalho foi feito ao longo de duas semanas
    e exigiu um esforço de depuração e checagem, dado que não há padronização dos
    dados nos estados. Enquanto alguns expõem de forma mais claras as emendas no Orçamento,
    outros diluem as cifras em diferentes ações, e foi preciso analisar documentos
    extensos para localizar as linhas e somá-las.
  uf: DF
  tipo_inscricao: Investigação
  formato: Impresso
  category: Investigação
