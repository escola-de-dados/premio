- title: Deputados e senadores 'reinam sozinhos' com emendas a cidades de prefeitos
    aliados
  project_url: https://www1.folha.uol.com.br/poder/2025/02/deputados-e-senadores-reinam-sozinhos-com-emendas-a-cidades-de-prefeitos-aliados.shtml
  veiculo: Folha de S. Paulo
  autoria: Natália Santos e Júlia Barbon
  data: 2/16/2025
  resumo: A Folha realizou um levantamento para investigar a influência de deputados
    e senadores em cidades onde prefeitos aliados foram reeleitos em 2024. A análise
    mostrou que 110 congressistas concentraram, sozinhos, o envio de emendas para
    municípios governados por seus aliados. Essas emendas, utilizadas como moeda de
    troca, podem representar uma vantagem estratégica para esses parlamentares nas
    eleições de 2026.
  relevância: A reportagem continua o trabalho jornalístico de compreender quais podem
    ser as consequências sociais, políticas e econômicas da concentração de cifras
    exorbitantes nas mãos dos congressistas e de que forma essas emendas estão sendo
    direcionadas a cidades favorecidas por alianças políticas.
  originalidade: 'O trabalho é original ao traçar “o caminho do dinheiro” a partir
    exclusivamente de dados públicos, com o objetivo de revelar informações novas
    sobre um fenômeno recente: o uso estratégico das emendas parlamentares. Ainda
    pouco explorado e compreendido pelo público, esse mecanismo de distribuição de
    recursos ganha destaque na matéria ao ser relacionado com a reeleição de prefeitos
    aliados em 2024 e suas possíveis implicações para 2026. Com recorte exclusivo,
    abordagem analítica e metodologia própria, a reportagem contribui para qualificar
    o debate público em torno do poder político, econômico e social das emendas parlamentares.'
  metodologia: A reportagem analisou as chamadas “notas de empenho” das emendas individuais
    disponíveis no Portal da Transparência, que indicam, por exemplo, se uma mesma
    doação foi destinada a mais de uma cidade. A análise considerou apenas os favorecidos
    classificados como administração ou fundo público, excluindo entidades como ONGs.
    Para identificar os aliados, foram utilizados os dados públicos das eleições de
    2024, divulgados pelo Tribunal Superior Eleitoral. As alianças foram determinadas
    com base nos partidos dos congressistas e prefeitos, além da presença do partido
    do congressista nas coligações dos prefeitos eleitos.
