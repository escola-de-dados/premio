- title: 'Leptospirose no RS: a íntima relação entre mudanças climáticas, desastres
    e uma ''doença negligenciada'''
  project_url: https://www.estadao.com.br/saude/no-ano-da-enchente-casos-e-mortes-por-leptospirose-no-rs-mais-que-dobraram-veja-mapas/
  veiculo: O Estado de S.Paulo
  autoria: Leon Ferrari
  data: 5/6/2025
  resumo: Série de três reportagens revela um surto de uma doença infecciosa e negligenciada
    dentro de um desastre climático. No ano em que o Rio Grande do Sul foi assolado
    pela maior enchente de sua história, os casos e as mortes por leptospirose, doença
    altamente influenciada por determinantes climáticos, mais do que dobraram e ficaram
    acima da média até agosto, revelando os efeitos duradouros da tragédia na vida
    da população gaúcha, que além de enfrentar a destruição tiveram de conviver com
    os sintomas incapacitantes da infecção.
  relevância: "Primeiro vieram as chuvas, torrenciais, por dias. Sem ter para onde\
    \ escoar, tomaram as cidades — quase dois terços (61%) dos municípios do Rio Grande\
    \ do Sul foram atingidos pelas águas. Então, a lama. E, junto com todas elas,\
    \ uma bactéria: a Leptospira, causadora da leptospirose, uma doença febril aguda\
    \ potencialmente fatal. A relação entre determinantes climáticos, especialmente\
    \ pluviométricos, é compreendida há bastante tempo. No entanto, fora alguns dados\
    \ esparsos apresentados em maio pelo governo estadual gaúcho sobre casos suspeitos,\
    \ confirmados e mortes, até a publicação desta série de reportagens, os números\
    \ exatos, de todo o ano de 2024, da leptospirose no estado eram desconhecidos.\
    \ \nTrazer a real dimensão de um surto de uma doença é de uma enorme importância\
    \ para saúde pública, é impossível traçar políticas públicas eficientes sem dados.\
    \ Por outro lado, a população gaúcha tem o direito de entender a completude da\
    \ miríade de impactos que a enchente histórica promoveu e de todos os riscos que\
    \ correram no período; assim como é dever do bom jornalismo alertar que o que\
    \ aconteceu no Rio Grande do Sul, das chuvas torrenciais ao surto de leptospirose,\
    \ não se trata de um caso isolado e, com as mudanças climáticas, pode se repetir\
    \ mais cedo do que muitos imaginam. \nPor meio da análise de dados de bases públicas\
    \ e obtidos via Lei de Acesso à Informação, foi possível revelar que:\n1 - Em\
    \ 2024, ano marcado pela maior enchente da história do estado, o Rio Grande do\
    \ Sul registrou 1.314 casos, 55 mortes e mais de 430 internações por leptospirose.\n\
    2 - O número de casos de leptospirose foi 170% maior em relação ao ano anterior,\
    \ quando foram 480. Considerando a média de casos registrados entre 2018 e 2023,\
    \ o aumento foi de 239%. \n3 - A incidência da doença no RS atingiu aproximadamente\
    \ 12,1 novos casos por 100 mil habitantes em 2024, enquanto, no Brasil, costuma\
    \ ser, em média, 1,9 caso por 100 mil por ano.\n4 - O número de vítimas da doença\
    \ em 2024 foi mais que o dobro das mortes registradas em 2023 (25) e quase o triplo\
    \ da média anual observada entre 2018 e 2023 (cerca de 19 anualmente). \n5 - Quanto\
    \ às hospitalizações, houve um aumento de 51,6% em relação a 2023.\n6 - A maioria\
    \ dos casos se concentrou nos dois primeiros meses posteriores ao início das enchentes.\
    \ De cada dez casos registrados em 2024, mais de seis (66,3%) foram notificados\
    \ em maio ou junho.\n7 - Das dez cidades com mais casos, sete estão na região\
    \ metropolitana de Porto Alegre e seus arredores imediatos, as regiões mais afetadas\
    \ pela enchente de 2024.\n8 - Em 2024, os casos de leptospirose ficaram acima\
    \ da média até agosto. \n9 - Nem o governo federal nem o estadual tem um plano\
    \ estruturado para enfrentamento da leptospirose diante de desastres climáticos.\
    \ \n10 - Especialistas e estudos apontam que, com as mudanças climáticas, desastres\
    \ climáticos estão ficando mais frequentes e intensos, logo, surtos de leptospirose\
    \ podem ficar mais frequentes e intensos.\n11 - O drama das pessoas que tiveram\
    \ a doença ou perderam familiares em meio ao cenário de destruição."
  originalidade: "Em uma conversa com o patologista Paulo Saldiva, referência nacional\
    \ e internacional do estudo das mudanças climáticas, ele defendeu que “a saúde\
    \ humana é um enorme indicador do que já está acontecendo em função do clima”.\
    \ Nesse sentido, falar sobre a saúde humana representa uma grande oportunidade\
    \ de conscientizar sobre os perigos da alteração do clima. \nCreio, porém, que\
    \ essa oportunidade não tem sido aproveitada dentro do jornalismo. Divididos sob\
    \ editorias rígidas e, num cenário de equipes enxutas e sobrecarregadas, a colaboração\
    \ entre repórteres é cada vez mais rara. Revelar essa intersecção para meus leitores\
    \ tem sido um dos meus principais objetivos profissionais. \nPor conta disso,\
    \ já havia participado de palestras e também lido artigos científicos sobre o\
    \ impacto das mudanças climáticas nas doenças infecciosas, e já tinha extensamente\
    \ escrito sobre isso, desde 2023, em relação à dengue. Quando vi o estado onde\
    \ nasci assolado pela pior enchente de sua história, sabia que a leptospirose\
    \ seria um problema grave. Veja, ela já é um problema grave, com números aterradores,\
    \ mesmo em cenários sem desastres, mas altamente negligenciada por ser marcada\
    \ também por determinantes socioeconômicos. Minha surpresa foi a pouca atenção\
    \ dada ao assunto. Fora dados esparsos divulgados pelo governo estadual gaúcho\
    \ e uma ou outra matéria sempre sobre o número de vítimas fatais da doença nas\
    \ primeiras semanas imediatas após a enchente, pouco ou nada se falava. Tentei\
    \ pautar isso no jornal várias vezes, recebi muitas negativas, até a chegada do\
    \ marco de um ano da tragédia, quando ganhei sinal verde para a apuração. \nCom\
    \ os dados que obtive, via Lei de Acesso à Informação e em bases públicas, cruzados\
    \ com os territoriais levantados pelo MapBiomas, consegui apresentar de forma\
    \ inédita um desenho de como as águas e a leptospirose afetaram o estado em 2024.\
    \ Acredito que a reportagem também seja inovadora no sentido de elevar a pauta\
    \ da saúde pública dentro da discussão sobre mudanças climáticas, mostrando como\
    \ essas duas coisas estão intimamente conectadas, e, é claro, mostrando como o\
    \ jornalismo pode, especialmente através da análise de dados, falar sobre o assunto."
  metodologia: "Como jornalista de saúde e ciência, minha apuração sempre começa em\
    \ revistas científicas. Isso me ajuda a delimitar o que já foi publicado sobre\
    \ o assunto e também quais são os principais pesquisadores do tema — eles não\
    \ só são possíveis entrevistados, como muitas vezes me auxiliam na busca de dados\
    \ em bases públicas e também a interpretar o que eles significam. De cara, já\
    \ encontrei um longo artigo publicado, em 2010, na Transactions of The Royal Society\
    \ of Tropical Medicine and Hygiene, no qual os pesquisadores descreveram os “mecanismos\
    \ pelos quais as mudanças climáticas podem afetar vários fatores ecológicos que\
    \ provavelmente impulsionarão um aumento na incidência geral, bem como na frequência\
    \ de surtos de leptospirose”. Além disso, encontrei um estudo da meteorologista\
    \ e médica Micheline Coelho que mostrou  que a cada 20 mm de chuva, as internações\
    \ por leptospirose aumentaram em média 15,6%, chegando a uma alta acumulada de\
    \ até 142% com 140 mm de precipitação. Micheline se tornou uma parceria fundamental\
    \ para entender a problemática e dar seguimento à investigação. \nO Sistema Único\
    \ de Saúde (SUS) disponibiliza uma ampla variedade de dados abertos por meio do\
    \ DataSUS, a base de dados do Ministério da Saúde. Dentro do DataSUS, há uma ferramenta\
    \ chamada TABNET, que permite ao usuário consultar e montar tabelas personalizadas\
    \ com informações sobre diferentes aspectos da saúde pública — como tipo de atendimento,\
    \ período analisado, região geográfica, faixa etária, sexo, causa das internações\
    \ ou óbitos, entre outros recortes. Utilizando essa ferramenta consegui dados\
    \ de óbitos e hospitalizações por meio, especificamente, do Sistema de Informações\
    \ Hospitalares do Sistema Único de Saúde e do Sistema de Informação sobre Mortalidade.\
    \ \nO Ministério da Saúde disponibiliza painéis de dados sobre casos confirmados\
    \ e suspeitos de várias doenças, como covid e dengue, no entanto, não é o caso\
    \ para leptospirose. \nPara obter o número de casos, assim como informações detalhadas\
    \ sobre a sazonalidade, foi necessário utilizar a Lei de Acesso à Informação (Lei\
    \ nº 12.527/2011), conhecida como LAI. Redige uma argumentação explicando por\
    \ que se tratava de informação que deveria ser pública e os detalhes das informações\
    \ que gostaria de receber à Secretaria de Saúde do Rio Grande do Sul, que concedeu\
    \ as informações. \nOs dados sobre a dimensão e impactos da enchente em cada município\
    \ são do MapBiomas, de um estudo divulgado em junho do ano passado, produzido\
    \ a partir do “processamento e análise de imagens de satélites, obtidas por sensores\
    \ óticos e de radar, em um período anterior e imediatamente após os eventos de\
    \ precipitação severa”. Os dados a nível de município foram cruzados com o número\
    \ de casos de leptospirose em cada cidade obtidos via LAI.\nPara analisar os dados\
    \ e comentar mais sobre o cenário da leptospirose no estado gaúcho, conversei\
    \ com especialistas locais, da Sociedade Gaúcha de Infectologia, uma entidade\
    \ da sociedade civil, que teve um papel fundamental durante a crise, sendo responsável\
    \ pelo desenvolvimento de um protocolo com indicações sobre a profilaxia contra\
    \ leptospirose. Eles também foram fundamentais para revelar que nem o estado gaúcho\
    \ nem o governo federal tinham um plano estruturado para enfrentar a leptospirose\
    \ diante de desastres climáticos. \nPara entender o impacto da leptospirose na\
    \ vida dos gaúchos, entrei em contato com associações com atuação local, como\
    \ o Movimento dos Atingidos por Barragens (MAB), que, além de trazerem olhares,\
    \ a partir da assistência social, para o problema, conseguiram me conectar com\
    \ pessoas que tiveram a doença ou perderam familiares para ela."
  uf: SP
  tipo_inscricao: Dados Abertos
  formato: Online
  category: Dados Abertos
