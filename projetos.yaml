  veiculo: RAMPAS Uerj
  autoria: Beatriz Araujo e Everton Victor
  data: 12/23/2024
  resumo: 'No final de 2024 me debrucei em duas grandes reportagens sobre pessoas
    desaparecidas, esta foi uma dela. Era um dado que inicialmente via como pauta,
    mas chegando lá, vi que era bem maior e preferir destrinchar estes números a partir
    de contar casos reais. No caso desta: Natal sem repostas, existe uma relação da
    efeméride da data com o dato, Acho que uma das matérias mais delicadas que fiz.'
  relevância: 'Conta um dado alarmante no Rio de Janeiro: o alto número de pessoas
    desparecidas. Mas, através de minha apuração e da Beatriz Araujo exploramos também
    as falhas presentes no processo de investigação desses casos através de relatos
    e experiências de mães e familiares.'
  originalidade: Traçamos não só um dado, mas uma série de casos de desaparecidos
    e como as falhas nas primeiras horas para encontrar essas pessoas podem ter impacto.
    Ouvimos todos os lados, um cuidado importante neste processo.
