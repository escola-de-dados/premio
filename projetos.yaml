  ano: '2024'
- title: Um terço dos medicamentos incorporados ao SUS não são distribuídos à população
    desde 2018
  project_url: https://www1.folha.uol.com.br/equilibrioesaude/2025/01/sus-nao-entrega-ao-menos-76-medicamentos-e-procedimentos-incorporados-a-rede-publica-desde-2018.shtml
  veiculo: Folha de S.Paulo
  autoria: Raquel Lopes
  data: 1/20/2025
  resumo: Reportagem da Folha de S.Paulo revelou que ao menos 76 medicamentos e procedimentos
    dos 242 incorporados ao SUS entre 2018 e 2024 ainda não são oferecidos à população,
    descumprindo o prazo legal de 180 dias para disponibilização. A apuração mostrou
    que pacientes seguem sem acesso a tratamentos essenciais para câncer, diabetes
    e outras doenças, mesmo após aprovação técnica. A investigação também expôs as
    principais causas dos atrasos — como falhas em contratos, protocolos e burocracia
    — e suas consequências, incluindo agravamento de doenças, mortes evitáveis e aumento
    da judicialização da saúde.
  relevância: 'A reportagem é relevante porque escancara um dos principais gargalos
    do sistema público de saúde no Brasil: o descompasso entre a incorporação oficial
    de medicamentos e procedimentos ao SUS e sua efetiva entrega à população. Ao revelar
    que um terço das tecnologias aprovadas desde 2018 ainda não estão disponíveis
    — muitas delas fundamentais para o tratamento de doenças graves como câncer e
    diabetes —, a apuração evidencia violações à lei, ineficiência estatal e desigualdade
    no acesso à saúde. Além disso, mostra como a morosidade administrativa alimenta
    a judicialização, sobrecarrega o orçamento público e compromete a vida de milhares
    de brasileiros que dependem do SUS.'
  originalidade: A investigação foi necessária para revelar que, embora o SUS tenha
    incorporado 242 medicamentos e procedimentos, cerca de um terço deles não estavam
    sendo efetivamente disponibilizados à população. O levantamento se fez fundamental
    diante do ocultamento desses dados pelo governo, que não forneceu informações
    completas e precisas nem por meio da Lei de Acesso à Informação. Ao expor essas
    falhas, a investigação buscou dar transparência ao problema, pressionar o Ministério
    da Saúde a agir e fortalecer o debate público sobre a gestão e cumprimento das
    políticas públicas de saúde.
  metodologia: Maior sistema público de saúde do mundo em abrangência e universalidade,
    o SUS foi o foco desta investigação, que surgiu após relatos de profissionais
    da oncologia sobre a não disponibilização de medicamentos oficialmente incorporados,
    mas não entregues à população. Diante da recusa do Ministério da Saúde em fornecer
    dados completos via Lei de Acesso à Informação, a reportagem realizou seu próprio
    levantamento. Identificou, no Diário Oficial da União, todos os medicamentos e
    procedimentos aprovados para incorporação ao SUS entre 2018 e dezembro de 2024.
    Em seguida, analisou atas e vídeos das reuniões da Comissão Intergestores Tripartite
    (CIT), etapa obrigatória para a oferta dessas tecnologias. O cruzamento dessas
    informações permitiu mapear quais itens incorporados ainda não estavam disponíveis.
    Para verificar a disponibilidade na ponta, foram consultadas associações médicas
    e secretarias de saúde dos estados de Minas Gerais, Piauí e Rio Grande do Sul.
    Além disso, a reportagem ouviu relatos de pacientes e profissionais de saúde para
    compreender o impacto real da falta desses medicamentos. O recorte a partir de
    2018 considerou a maior disponibilidade de registros públicos. A apuração durou
    cerca de três meses.
  uf: DF
  tipo_inscricao: Investigação
  formato: Online
  category: Investigação
