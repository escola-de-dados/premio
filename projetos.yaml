- title: 'Fernanda Torres no Oscar: um legado que já está aqui'
  project_url: https://mais.opovo.com.br/reportagens-especiais/2025/01/23/fernanda-torres-no-oscar-um-legado-que-ja-esta-aqui.html
  veiculo: O POVO+
  autoria: Mateus Mota
  data: 1/23/2025
  resumo: A reportagem narra a trajetória de Fernanda Torres e do filme "Ainda Estou
    Aqui" de uma forma diferente, por meio de dados e números. A biografia da atriz,
    assim como a carreira de Walter Salles, são recontadas por meio de visualizações
    interativas, e os números meteóricos do primeiro filme brasileiro a ganhar um
    Oscar dão uma nova roupagem ao jornalismo cultural.
  relevância: A reportagem busca alavancar o interesse do público pela produção audiovisual
    brasileira, ao passo que é também um registro de um evento histórico. Ao catalogar
    os números do filme Ainda Estou Aqui, buscamos contribuir para a consolidação
    da obra enquanto um marco do cinema nacional, situando-o historicamente.  A reportagem
    aborda também o impacto que o filme tem sobre a discussão de memória e democracia
    no Brasil.
  originalidade: A reportagem inova ao compilar os dados da carreira de Fernanda Torres,
    Walter Salles e listar todas as competições de cinema em que Ainda Estou Aqui
    concorreu a um prêmio. Abordar um produto cultural a partir de números é um dos
    aspectos de se destaca na reportagem. O trabalho também faz intersecções entre
    linguagens artísticas - moda e cinema - ao listar todas as roupas de alta-costura
    que Fernanda Torres usou nos eventos oficiais da Temporada de Premiações.
  metodologia: Os dados referentes aos prêmios de Fernanda Torres, Walter Salles e
    Ainda Estou Aqui foram extraídos manualmente da página do IMDB - Internet Movie
    Database, tabulados e analisados no Microsoft Excel. Já os dados sobre audiência
    vêm tanto da Bites Consultoria quanto da Nexus - Pesquisa e Inteligência de Dados,
    e foram divulgados por meio de releases. Por sua vez, os dados sobre os figurinos
    foram obtidos por meio de apurações e entrevistas e tabulados no Microsoft Excel.
