- title: Como a pistola 9mm superou o revólver 38 e a 380 como arma mais popular do
    Brasil
  project_url: https://g1.globo.com/politica/noticia/2025/05/17/armas-brasil-9mm.ghtml
  veiculo: G1/GloboNews
  autoria: Isabela Leite e Arthur Stabile
  data: 5/17/2025
  resumo: A reportagem faz um mapeamento do aumento dos registos de armas para Colecionadores,
    Atiradores e Caçadores (CACs) e civis após a liberação do acesso a armamentos
    até então de uso restrito a partir de 2019, no governo do ex-presidente Jair Bolsonaro,
    usando bases de dados abertas e dados obtidos via Lei de Acesso à Informação (LAI),
    além de entrevistas com pesquisadores e policiais. A apuração explica como a pistola
    calibre 9 mm superou o revólver 38 e a 380 como arma mais popular do Brasil e
    como isso gerou uma "modernização da arma do crime", segundo especialistas em
    segurança.
  relevância: 'O debate sobre o controle de armas no Brasil tem se intensificado nos
    últimos anos depois da flexibilização do registro de armamentos até então de uso
    excluso de forças de segurança para Colecionadores, Atiradores e Caçadores e/ou
    para defesa pessoal de cidadãos. A partir da liberação no governo do ex-presidente
    Jair Bolsonaro, houve uma explosão nos registros - o que foi acompanhado pelo
    aumento também de estatísticas sobre apreensões no mercado ilegal e casos de violência
    urbana com o uso de armas de fogo até então pouco vistos - como a pistola calibre
    9mm.


    A reportagem é relevante no sentido de apontar como a política de liberação de
    armas no Brasil trouxe efeitos não só para a segurança pública mas também colocou
    em risco a própria atividade policial, que precisou se readequar à realidade encontrada
    em abordagens e no cumprimento de mandados durante operações.


    Antes de uso restrito das Forças Armadas e das polícias federais, a pistola 9mm
    teve a venda para civis liberada em 2019 e proibida em janeiro de 2023. Esses
    quatro anos foram suficientes para ela saltar de uma arma rara para a mais popular
    do Brasil: é a mais comum nas mãos dos cidadãos autorizados a ter armas e a mais
    apreendida com criminosos.'
  originalidade: Apesar de reportagens anteriores trazerem a explosão de registros
    no período de 2019 e 2023, com a flexibilização de acesso a armas no governo Bolsonaro,
    não havia sido feita uma análise mais profunda sobre como o acesso a calibres
    até então restritos - como a pistola calibre 9 mm - se tornou uma preocupação
    para as autoridades e um risco maior para a segurança pública e a atividade policial.
  metodologia: 'A reportagem usou diferentes bases de dados para cruzamento de informações.
    Primeiramente, analisou quase 1 milhão de registros de CACs feitos em um recadastramento
    realizado pela PF em 2023, cujos detalhes foram obtidos via Lei de Acesso à Informação
    (LAI).


    Além disso, foj feito o cruzamento com a base de dados da Polícia Federal (https://dados.gov.br/dados/conjuntos-dados/sinarm)
    que concentrava os dados de registros feitos por civis, que obtiveram liberação
    para uso de armas com a alegação de defesa pessoal.


    E, por fim, fizemos a análise com especialistas e policiais para apontar realidades
    já identificadas no trabalho de campo e os efeitos do maior acesso às armas na
    segurança pública e segurança urbana.'
  uf: SP
  tipo_inscricao: Investigação
  formato: Online
