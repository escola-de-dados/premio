- title: Violência contra homens tans cresce 161% em cinco anos
  project_url: https://www.generonumero.media/violencia-homens-trans/
  veiculo: Gênero e Número
  autoria: Victória Sacagami, Bruna Diego Nunes, Vitória Régia da Silva, Marilia Ferrari
    e Lola Ferreira.
  data: 1/28/2025
  resumo: 'A reportagem revela um crescimento expressivo de 161% nas notificações
    de violência contra homens trans no Brasil entre 2019 e 2023, com base em dados
    inéditos do Sistema de Informação de Agravos de Notificação (Sinan). Só em 2023,
    foram registrados 2.354 casos, sendo dois em cada três dentro da própria residência,
    o que desafia a noção do lar como espaço seguro para pessoas trans.

    As vítimas são majoritariamente jovens: 40% têm entre 19 e 30 anos. As notificações
    mostram que essas violências são frequentemente múltiplas e combinadas, 68% dos
    registros envolvem mais de um tipo de agressão, principalmente física e psicológica.
    A violência física, isoladamente, aumentou 88% no período analisado.

    Embora os dados se concentrem em homens trans, a reportagem contextualiza essa
    realidade no panorama mais amplo da transfobia, que costuma ter maior visibilidade
    quando atinge travestis e mulheres trans. Ao evidenciar a invisibilização dos
    homens trans, inclusive dentro de políticas públicas e de parte dos próprios movimentos
    sociais, o trabalho contribui para ampliar o entendimento sobre as diversas formas
    de violência motivadas por identidade de gênero.

    Com dados desagregados por região, raça, faixa etária e local da ocorrência, a
    reportagem propõe uma leitura interseccional e crítica, e destaca a urgência de
    políticas públicas específicas e de maior reconhecimento social das violências
    enfrentadas por homens trans, uma população ainda negligenciada pelo Estado e
    pela sociedade.'
  relevância: 'A reportagem é relevante por romper com o silêncio estatístico e social
    sobre a violência contra homens trans, uma população sistematicamente invisibilizada
    no debate público, nas políticas públicas e até em parte do próprio movimento
    LGBTQIA+. Embora as travestis e mulheres trans estejam, com razão, no centro das
    discussões sobre transfobia e violência letal, este trabalho evidencia que os
    homens trans também sofrem agressões gravíssimas e recorrentes, ainda que menos
    visíveis.

    Ao identificar um aumento de 161% nas notificações de violência contra esse grupo
    em cinco anos, o trabalho não apenas revela a escalada das agressões, mas também
    expõe a precariedade da proteção estatal. Destaca-se o fato de que dois terços
    das violências acontecem dentro de casa, revelando como o espaço doméstico — que
    deveria ser seguro — pode ser fonte de risco e sofrimento.

    A reportagem oferece uma leitura interseccional e orientada por dados, ao cruzar
    marcadores como idade, raça, território e tipo de violência, contribuindo para
    a construção de políticas públicas mais precisas e eficazes. Em um país onde a
    desagregação de dados por identidade de gênero ainda é limitada, essa investigação
    se torna uma ferramenta poderosa de visibilidade, responsabilização e transformação.
    Ao humanizar os números e apresentar as falhas das estruturas de proteção, a reportagem
    amplia o entendimento da transfobia e oferece subsídios concretos para mudanças
    estruturais.

    A relevância da reportagem também está em seu esforço de enfrentamento à invisibilidade.
    Ao dar nome, rosto e números à violência contra homens trans, ela contribui para
    ampliar a compreensão da sociedade sobre os efeitos da transfobia em diferentes
    corpos e identidades. Além disso, pressiona o poder público por respostas mais
    inclusivas e eficazes, já que os dados indicam que mesmo com o aumento das notificações,
    a proteção real dessas pessoas ainda é precária. Em resumo, a reportagem é essencial
    para informar, sensibilizar e transformar a maneira como a sociedade e o Estado
    enxergam e tratam os homens trans.'
  originalidade: 'A reportagem apresenta de forma visual e acessível o aumento da
    violência contra homens trans entre 2019 e 2023, com ênfase nos tipos de violência
    mais recorrentes nas notificações oficiais. O trabalho cruza os dados para evidenciar
    como uma mesma notificação pode registrar múltiplas violências, revelando a complexidade
    dos casos.

    Além de mostrar o crescimento ao longo dos anos, a reportagem também aprofunda
    a análise ao detalhar os dados por região, raça, faixa etária e local onde a violência
    ocorreu, permitindo uma compreensão mais ampla e interseccional do cenário.'
  metodologia: Os dados da reportagem sobre violência contra homens trans foram extraídos
    da base do Sistema de Informação de Agravos de Notificação (Sinan) dos anos de
    2019 a 2023. No software R, as variáveis de interesse foram classificadas conforme
    o dicionário de dados. A categoria racial foi agrupada, com as categorias “preta”
    e “parda” consolidadas sob a classificação “negra”. Foram selecionados exclusivamente
    os casos de notificação relacionados a homens trans.
  uf: RJ
  tipo_inscricao: Visualização
