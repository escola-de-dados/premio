- title: Trump ganhou em 80% dos condados americanos de maioria latina
  project_url: https://www.estadao.com.br/internacional/trump-ganhou-em-80-dos-condados-americanos-de-maioria-latina/
  veiculo: O Estado de São Paulo
  autoria: Lucas Keske e Lucas Thaynan
  data: 11/11/2024
  resumo: A reportagem mostra que Donald Trump teve um desempenho surpreendente nas
    eleições presidenciais de 2024 ao conquistar 82 dos 101 condados norte-americanos
    com maioria da população latina; o equivalente a 81,2%. O texto destaca que essa
    guinada foi decisiva para a vitória do republicano em estados-pêndulo, onde anteriormente
    Joe Biden havia vencido. A reportagem entrevista especialistas que sugerem fatores
    como conservadorismo cultural, rejeição à política migratória democrata e apelo
    a valores tradicionais como motivos para a mudança de comportamento entre eleitores
    latinos, especialmente homens.
  relevância: O conteúdo é relevante por colocar em números a vitória de Trump e ajudar
    a entender por que a ideia de que o voto latino nos EUA é automaticamente pró-Democrata
    não se mostrou verdadeira nesta eleição. A reportagem também é significativa para
    o debate sobre identidade, integração e representação política das minorias em
    um país que tem histórica relação e importância política para o Brasil. O foco
    em condados com alta proporção de latinos permite compreender como questões locais
    e identitárias se entrelaçam com dinâmicas eleitorais nacionais.
  originalidade: 'A originalidade se dá pela abordagem precisa e segmentada da votação
    latina nas eleições americanas. A matéria se aprofunda em diversos dados, o que
    evita generalizações e oferece uma análise territorial detalhada, com foco especial
    em condados com mais de 50%  população latina; recorte pouco explorado pela imprensa
    tradicional.


    A matéria também se destaca por identificar mudanças significativas no comportamento
    eleitoral latino em redutos tradicionalmente democratas, e por relacionar esses
    dados a temas estruturais, como imigração, identidade cultural, conservadorismo
    social e o papel das big techs no debate público. Ao fazer isso, oferece ângulos
    novos sobre um fenômeno político que ganha profundidade inédita nesse recorte
    populacional e territorial.'
  metodologia: A apuração usou dados oficiais do Censo da população dos EUA (2020)
    para identificar os condados com maior presença latina e cruzou essas informações
    com os resultados oficiais das eleições presidenciais de 2024; comparando-os com
    os da eleição de 2020. A matéria ainda incorpora entrevistas com especialistas,
    como Carlos Poggio e Filipe Figueiredo, que oferecem interpretações contextualizadas
    sobre comportamento eleitoral, cultura política e identidade dos latinos. A abordagem
    quantitativa e qualitativa e com caráter interdisciplinar (dados + análise política)
    fortalece a profundidade e a confiabilidade do conteúdo.
