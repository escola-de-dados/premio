  ano: '2024'
- title: Uso de agrotóxicos cresce quase 200% em 10 anos no Maranhão e expõe moradores
    a riscos
  project_url: https://portalassobiar.com.br/uncategorized/uso-de-agrotoxicos-cresce-quase-200-em-10-anos-no-maranhao-e-expoe-moradores-a-riscos/
  veiculo: Portal Assobiar em parceria com a InfoAmazonia por meio da Rede Cidadã
  autoria: Daniela Souza e Idayane Ferreira
  data: 5/2/2025
  resumo: Está reportagem aborda o aumento alarmante de 191,5% no uso de agrotóxicos
    no Maranhão entre 2013 e 2022, impulsionado pela expansão do plantio de soja.
    Em 2022, o estado registrou um recorde de 15.649,67 toneladas de agrotóxicos comprados.
    Essa intensificação comprovada no Maranhão concentrando 85% dos casos de intoxicação
    por agrotóxicos em comunidades no Brasil no primeiro semestre de 2024, de acordo
    com a Comissão Pastoral da Terra (CPT). Moradores de assentamentos como Novo Oriente
    e Francisco Romão em Açailândia relatam viver em contato diário com os produtos
    químicos, que são pulverizados indiscriminadamente sobre casas, escolas e quintais,
    inclusive por drones, contaminando água, ar e alimentos.
  relevância: A reportagem é relevante por evidenciar uma grave crise de saúde pública
    e ambiental em curso no Maranhão, provocada pelo aumento descontrolado do uso
    de agrotóxicos, que cresceu quase 200% em uma década, impulsionado pela expansão
    da monocultura da soja. Esse avanço resultou em um cenário alarmante, com o estado
    concentrando 85% dos casos de intoxicação por agrotóxicos nas comunidades brasileiras
    no primeiro semestre de 2024. A reportagem denúncia também a devastação da agricultura
    familiar e das formas tradicionais de vida, derivadas de monoculturas tóxicas
    que empobrecem a paisagem e a cultura local.  A reportagem, produzida pela Assobiar
    em parceira com a InfoAmazonia, por meio da Rede Cidadã InfoAmazonia, dá visibilidade
    às vozes das comunidades afetadas e denuncia a resistência às medidas protetivas,
    como leis contra a sobrecarga aérea, reafirmando a urgência de ações concretas
    para enfrentar esse problema estrutural com justiça ambiental e social.
  originalidade: A originalidade da reportagem está na combinação de uma análise aprofundada
    de dados com uma abordagem humanizada e contextualizada regionalmente. Vai além
    da simples compilação de informações ao quantificar o aumento de quase 200% no
    uso de agrotóxicos no Maranhão em dez anos, correlacionando-o à expansão da soja,
    e ao cruzar dados do Ibama e do IBGE para evidenciar a relação entre agricultura
    intensiva e exposição química. Destaca o Maranhão como epicentro da intoxicação
    por agrotóxicos em 2024, e incorpora relatos impactantes de moradores de assentamentos
    como Novo Oriente e Francisco Romão, que vivem sob estresse constante. Ao documentar
    esforços frustrados de legislações protetivas e contrastar com experiências exitosas
    em municípios vizinhos, o trabalho revela encontros políticos e sociais à proteção
    ambiental. A produção em parceria amplia a circulação dessas informações sensíveis,
    oferecendo uma narrativa que conecta dados, vozes comunitárias e a urgência por
    justiça socioambiental.
  metodologia: "A metodologia adotada combina geojornalismo, análise de dados e investigação\
    \ de campo para mapear os impactos dos agrotóxicos no Maranhão. Foram utilizados\
    \ dados oficiais do Ibama (comercialização de agrotóxicos entre 2000 e 2022),\
    \ do IBGE (produção de soja de 1974 a 2023) e de organizações como a Comissão\
    \ Pastoral da Terra (intoxicações em comunidades), permitindo correlacionar o\
    \ avanço do agronegócio com o avanço do uso de pesticidas e seus efeitos sobre\
    \ o aumento da saúde pública. A investigação incluiu mapeamento de áreas afetadas\
    \ e entrevistas com moradores de comunidades impactadas, como Novo Oriente e Francisco\
    \ Romão, além de representantes de movimentos sociais, evidenciando os danos à\
    \ saúde, ao meio ambiente e ao modo de vida local. Também foram comprovadas iniciativas\
    \ legislativas, como o projeto de lei barrado em Açailândia, em contraste com\
    \ a aprovação em São Francisco do Brejão. \nDados disponíveis em: https://github.com/InfoAmazonia/unid_geojornalismo/tree/main/2025_01-agro_maranhao"
