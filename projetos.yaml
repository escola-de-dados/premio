- title: Mulheres nas Câmaras Municipais - Sete eleições e poucos avanços
  project_url: https://www.generonumero.media/eleitas-2000-2024/
  veiculo: Gênero e Número
  autoria: Aline Gatto Boueri, Victória Sacagami, Diego Nunes da Rocha, Vitória Régia
    da Silva e  Marilia Ferrari.
  data: 10/16/2024
  resumo: 'A matéria analisa a evolução da participação feminina nos cargos eletivos
    proporcionais (como vereadoras em municípios) desde a implementação da cota de
    gênero em 1997. Essa lei determinou que os partidos reservassem entre 30% e 70%
    das vagas para candidaturas femininas. No entanto, até 2008, muitas dessas vagas
    ficaram vazias, pois a lei só exigia reserva, não preenchimento efetivo. Apenas
    em 2012 essa lacuna começou a ser revertida, com exigência de que os partidos
    apresentassem candidatas nesses percentuais.

    A reportagem aponta que, mesmo após a mudança, o sistema de lista aberta, em que
    o eleitor vota individualmente, dificulta a eleição de mulheres. Isso porque,
    embora as candidatas representem cerca de 30% da oferta, os votos acabam concentrados
    em candidaturas masculinas, mantendo baixa a proporção de mulheres eleitas .

    Ainda, o texto destaca práticas como candidatas “laranja” ou distribuição desigual
    de recursos, que limitam a competitividade feminina. Em 2022, a Emenda Constitucional
    nº 117 buscou avançar ao obrigar os partidos a destinar ao mínimo 30% dos recursos
    eleitorais aos candidatas, mas a aplicação continua vulnerável a arbitrariedades.

    Especialistas citadas afirmam que a resistência à participação feminina está ligada
    à sobre-representação de homens cis brancos nas esferas de poder. Propõem reformas
    para que, se um partido obtiver X cadeiras, pelo menos 30% delas sejam atribuídas
    às mulheres mais votadas dentro da legenda , estratégia que reforçaria a efetividade
    das cotas.

    Em síntese, a reportagem mostra que as cotas foram um avanço na formalização da
    representação feminina, mas permanecem insuficientes sem estratégias robustas
    de promoção, financiamento justo e mecanismos que transformem candidaturas em
    mandatos. A lei criou oportunidades, mas é o desenho estrutural e eleitoral que
    segue exigindo aprimoramento para que a presença política das mulheres, especialmente
    em nível municipal, ultrapasse a formalidade e se torne substancial.'
  relevância: 'Essa reportagem é relevante porque analisa, com base em dados históricos
    e legislação eleitoral, as limitações e os avanços da participação de mulheres
    na política brasileira ao longo de mais de duas décadas. Ao examinar o período
    entre 2000 e 2024, ela mostra que, embora tenham sido implementadas cotas de gênero
    para candidaturas, a presença real de mulheres eleitas continua baixa, revelando
    um abismo entre a formalidade legal e a efetividade política. A reportagem evidencia
    que o sistema eleitoral brasileiro, baseado em listas abertas e em partidos com
    autonomia para distribuir recursos, continua sendo um obstáculo concreto para
    que as mulheres convertam suas candidaturas em mandatos.

    Outro aspecto fundamental abordado é a desigualdade na distribuição de recursos
    de campanha, além da prática de candidaturas fictícias (as chamadas “candidatas
    laranja”), que fragilizam a eficácia das políticas afirmativas. A matéria também
    destaca que, mesmo com avanços como a Emenda Constitucional nº 117, que obriga
    a destinação de recursos mínimos a candidaturas femininas, ainda falta fiscalização
    rigorosa e compromisso político real por parte dos partidos.

    Ao trazer análises de especialistas e propor alternativas como a adoção de cotas
    nas cadeiras eleitas, e não apenas nas candidaturas, a reportagem oferece um olhar
    crítico e propositivo para repensar as estruturas que perpetuam a sub-representação
    feminina. Em um país onde mais da metade da população é composta por mulheres,
    mas elas ocupam uma minoria dos cargos políticos, a reportagem é essencial para
    qualificar o debate público, pressionar por reformas estruturais e fortalecer
    a democracia com mais equidade de gênero.'
  originalidade: 'Esta reportagem, por meio de uma abordagem visual, desmonta a ideia
    de que a cota de 30% para candidaturas femininas é suficiente para promover mudanças
    significativas na representatividade política. Com o uso de scrollytelling, a
    narrativa conduz o público a enxergar como o avanço nas eleições municipais é
    quase imperceptível, revelando um sistema que resiste a transformações.

    O trabalho aposta em uma combinação de dados e narrativa visual para expor o desequilíbrio
    de poder nas Câmaras Municipais, onde a maior parte das cadeiras continua sob
    o controle de um grupo historicamente privilegiado: homens brancos. A reportagem
    reforça, ainda, que ampliar a presença feminina na política não é apenas uma pauta
    de gênero, mas uma demanda democrática, que representa o interesse direto da maioria
    do eleitorado brasileiro: as mulheres.'
  metodologia: 'Os dados sobre mulheres candidatas e eleitas a Câmaras Municipais
    foram retirados do site de dados Abertos do Tribunal Superior Eleitoral (TSE)
    (https://dadosabertos.tse.jus.br/organization/tse-agel). Foi realizada a soma
    das candidaturas masculinas e femininas para, posteriormente, identificar a proporção
    de mulheres candidatas e eleitas em cada eleição entre 2000 e 2024.

    Para analisar e comparar os resultados das últimas sete eleições municipais, a
    reportagem considera apenas o gênero (mulheres e homens) das pessoas candidatas
    e eleitas, já que somente a partir de 2016 o Tribunal Superior Eleitoral (TSE)
    passou a disponibilizar informações de raça e apenas em 2024 o Brasil passou a
    contar com dados de identidade de gênero e orientação sexual. Desse modo, apesar
    da relevância desses dados, a comparação longitudinal tornou-se inviável.'
  uf: RJ
  tipo_inscricao: Visualização
  formato: Online
  category: Visualização
  image: images/edicoes/2024/mulheres-camara.jpg
  ano: '2024'
- title: Violência contra mulheres indígenas mais do que triplica em uma década
  project_url: https://www.generonumero.media/violencia-contra-mulheres-indigenas/
  veiculo: Gênero e Número
  autoria: Victória Sacagami, Diego Nunes da Rocha , Bruna de Lara e Vitória Régia
    da Silva.
  data: 5/8/2025
  resumo: 'A reportagem da Gênero e Número revela que, entre 2014 e 2023, os casos
    de violência contra mulheres indígenas no Brasil mais do que triplicaram, com
    um aumento de 258%, superando o crescimento da violência contra mulheres em geral
    no mesmo período. O levantamento, baseado em dados oficiais do DataSUS e do Sistema
    de Informação de Agravos de Notificação (SINAN), mostra que a violência sexual
    foi a que mais cresceu entre as mulheres indígenas, com aumento de 297%, sendo
    a maioria das vítimas meninas e adolescentes com menos de 14 anos.

    Além da violência sexual, os dados também apontam altos índices de violência física
    e psicológica, sendo que os principais agressores são, em grande parte, companheiros
    ou ex-companheiros das vítimas, revelando o padrão de violência doméstica. A reportagem
    destaca ainda que o acesso à denúncia e a serviços de acolhimento é dificultado
    por barreiras geográficas, culturais e linguísticas, tornando as mulheres indígenas
    especialmente vulneráveis.

    A matéria reforça a ausência do Estado em garantir políticas públicas eficazes
    e culturalmente adequadas para o enfrentamento da violência de gênero nos territórios
    indígenas. Ao evidenciar o crescimento expressivo das notificações, a reportagem
    aponta a urgência de ações específicas, construídas com a participação das mulheres
    indígenas, que considerem suas realidades territoriais e socioculturais, garantindo
    prevenção, proteção e reparação diante dessas violências.'
  relevância: 'Essa reportagem é relevante porque evidencia uma realidade frequentemente
    invisibilizada: o crescimento alarmante da violência contra mulheres indígenas
    no Brasil. Ao mostrar que os casos de violência triplicaram em uma década, com
    destaque para o aumento da violência sexual contra meninas e adolescentes, a matéria
    denuncia como a ausência de políticas públicas eficazes, culturalmente sensíveis
    e territorialmente adaptadas tem colocado essas mulheres em uma situação extrema
    de vulnerabilidade.

    Ela também revela que o racismo estrutural, o colonialismo e o machismo se entrelaçam
    de forma particularmente cruel sobre os corpos das mulheres indígenas, expondo-as
    a violências que ocorrem tanto dentro das comunidades quanto como resultado da
    negligência e omissão do Estado. A falta de acesso a canais seguros de denúncia,
    barreiras linguísticas e geográficas, além da subnotificação, reforçam o silenciamento
    dessas violências.

    Ao dar visibilidade a esses dados e contextualizar as desigualdades enfrentadas
    por mulheres indígenas, a reportagem cumpre um papel essencial de denúncia e de
    pressão por justiça. Ela mostra que não basta aplicar políticas universais de
    combate à violência de gênero, é preciso reconhecer as especificidades e garantir
    respostas que dialoguem com os modos de vida, culturas e necessidades desses povos.
    Em um país com dívida histórica com os povos indígenas, essa reportagem é uma
    ferramenta importante para fortalecer a luta por direitos, proteção e reparação.'
  originalidade: 'A reportagem apresenta, de forma inédita, uma comparação visual
    entre os dados de violência contra mulheres indígenas e aqueles referentes a todas
    as mulheres, evidenciando como a violência contra o primeiro grupo tem crescido
    de maneira desproporcional.

    Por meio de gráficos claros e acessíveis, a análise permite comparar não apenas
    o aumento geral da violência, mas também o crescimento específico dos diferentes
    tipos de agressão física, sexual e psicológica. No caso da violência sexual, a
    escolha do gráfico destaca de forma contundente a vulnerabilidade de meninas e
    adolescentes indígenas.

    Além disso, a narrativa visual ressalta o perfil dos agressores e evidencia o
    avanço da violência em diferentes regiões do Brasil, oferecendo uma perspectiva
    abrangente e ao mesmo tempo detalhada sobre esse cenário.'
  metodologia: Os dados sobre as notificações de violência contra mulheres indígenas
    foram retirados do DataSUS no dia 19 de março de 2025 e são referentes ao período
    de 2014 a 2023. Foram realizados cruzamentos por sexo, raça, tipos de violência,
    idades em categorias e o agressor.
