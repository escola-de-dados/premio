    bolsas não preenchidas em 12 anos
  project_url: https://g1.globo.com/educacao/noticia/2025/05/18/prouni-tem-85percent-de-ociosidade-em-2024-e-acumula-25-milhoes-de-bolsas-nao-preenchidas-em-12-anos.ghtml
  veiculo: g1
  autoria: Emily Santos
  data: 5/18/2025
  resumo: A publicação reúne um balanço sobre a oferta, ocupação e ociosidade das
    bolsas ofertadas pelo governo federal por meio do Programa Universidade Para Todos,
    de 2013 a 2024.
  relevância: O Prouni é um dos carros-chefes do governo federal na promoção da entrada
    de pessoas de baixa renda no ensino superior. Com um público muito específico,
    o programa poderia ser mais exitoso caso a taxa e ociosidade não fosse tão alta.
    Mesmo que haja público-alvo para concorrer a bolsas do Prouni, quase 2,5 milhões
    de vagas deixaram de ser preenchidas em 12 anos.
  originalidade: A reportagem olhou para além dos números de bolsas ofertadas e matrículas
    efetivadas em cada semestre do programa nos últimos 12 anos, dando destaque para
    a alta ociosidade. Isso tudo enquanto apoiada em dados que reforçam a urgência
    de tratar o tema.
  metodologia: Os dados foram obtidos por meio da Lei de Acesso à Informação (LAI),
    junto à Secretaria de Educação Superior (Sesu) do Ministério da Educação (MEC).
    O material foi, posteriormente, organizado em planilhas e analisados em sua integridade
    até a obtenção das taxas apresentadas na reportagem.
