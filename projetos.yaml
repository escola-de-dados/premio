  project_url: https://tribunahoje.com/especial/2025/05/09/72-conhecida-mundialmente-como-paraiso-das-aguas-maceio-e-a-pior-capital-brasileira-em-saneamento-basico
  veiculo: Tribunahoje.com
  autoria: Valdete Calheiros
  data: 5/9/2025
  resumo: 'Maceió é a pior capital do Brasil quando o assunto é saneamento básico.
    A cidade ocupa a 89ª posição no Ranking Nacional do Saneamento 2024 do Instituto
    Trata Brasil, feito em parceria com a GO Associados, divulgado no mês passado.
    Entre as cidades nordestinas no ranking, Maceió se destaca com a segunda pior
    colocação. Perde apenas para Juazeiro do Norte, no Ceará. Na capital alagoana,
    apenas 28% da população é coberta pelo saneamento.


    As estatísticas conferiram à capital alagoana a nota 3,97, em uma escala cuja
    nota mais alta é 10. Esta foi a 16ª edição do Ranking Nacional do Saneamento,
    que teve como foco os 100 municípios mais populosos do país. Os indicadores têm
    como base o Sistema Nacional de Informações sobre Saneamento (SNIS), com dados
    de 2022, publicado pelo Ministério das Cidades. Naquele mesmo ano, Maceió despejou
    13.716,12 mil m³ de esgoto na natureza sem tratamento.'
  relevância: Nortear os investimentos públicos a fim de minimizar os problemas causados
    pela falta de saneamento básico
