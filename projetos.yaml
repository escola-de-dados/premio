- title: 'Asfalto, campos de futebol, drones e lancha: para onde iriam as emendas
    suspensas por Dino'
  project_url: https://g1.globo.com/politica/noticia/2025/01/14/asfalto-campos-de-futebol-drones-lancha-e-os-estados-mais-beneficiados-para-onde-iriam-as-emendas-suspensas-por-dino.ghtml
  veiculo: g1 / TV Globo
  autoria: Vinícius Cassela
  data: 1/14/2025
  resumo: Reportagem explora todas 7.894 emendas parlamentares de comissão que foram
    suspensas pelo ministro do STF, Flávio Dino, em dezembro de 2024.A proposta era
    identificar as destinações de cada uma.
  relevância: A reportagem possui relevância jornalística por se tratar de um tema
    amplamente discutido e questionado por entidades especializadas e pela população.
    Além disso, um dos motivos do processo que corre no Supremo é em função de manuseio
    indevido de alterações nas emendas de comissão pelo Congresso. Logo, analisar
    quais foram essas emendas modificadas traz uma luz sobre o que está em discussão
    e escancara para a população que à época ouvia falar sobre o entrave, mas não
    tinha uma visão do que realmente eram as emendas envolvidas.
  originalidade: Esta foi a primeira vez que um veículo jornalístico havia analisado
    tais benefícios parlamentares que estão em discussão no STF.
  metodologia: 'A partir da listagem, em pdf, das emendas parlamentares que foram
    entregues pela Câmara dos Deputados e pelo Senado Federal ao STF, editei o arquivo
    a partir do Excel e, por meio dos CNPJs presentes, fiz um cruzamento para definir
    quais os municípios que seriam atendidos pelas emendas. A partir daí, fui analisando
    item a item para criar uma análise completa da destinação que as emendas teriam.


    Posteriormente, disponibilizei no grupo de e-mail de jornalismo Abraji a listagem
    das emendas para que outras pessoas pudessem analisar os dados.'
