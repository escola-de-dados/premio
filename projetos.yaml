- title: O que paranaenses de Brasília fazem com as Emendas PIX?
  project_url: https://www.portalcomunicare.com.br/o-que-paranaenses-de-brasilia-fazem-com-as-emendas-pix/
  veiculo: Portal Comunicare
  autoria: Rafael Coelho
  data: 6/26/2025
  resumo: Um relatório sobre as transferências especiais de parlamentares do Paraná.
  relevância: Apresenta de maneira objetiva informações sobre o uso de recursos públicos
    de uma categoria conhecida pela falta de transparência. Com o destaque de representações
    visuais, instiga a análise de contradições características da distribuição de
    emendas parlamentares.
  originalidade: O trabalho expõe dados da distribuição de recursos por transferências
    especiais com perspectivas que fomentam uma análise além da superficialidade.
