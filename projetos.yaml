- title: Radar da Votação de São Paulo
  project_url: https://www.estadao.com.br/politica/eleicoes-2024-prefeitura-votacao-secao-bairro-vizinhanca/
  veiculo: Estadão
  autoria: Lucas Thaynan, Bruno Ponceano, Cindy Damasceno e Renan Cavalcante
  data: 10/11/2024
  resumo: O Radar da Votação permite que o leitor descubra como os moradores da sua
    vizinhança votaram nas eleições municipais de 2024, na cidade de São Paulo. A
    ferramenta interativa mostra qual candidato foi mais votado nas imediações de
    um endereço específico, oferecendo uma nova perspectiva sobre o comportamento
    eleitoral na capital.
  relevância: Em um cenário de crescente polarização e disputas locais intensificadas,
    entender como a população votou por bairro ou região ajuda a revelar os padrões
    políticos que moldam a cidade. A ferramenta se mostra útil e relevante ao oferecer
    uma leitura detalhada da dinâmica eleitoral em São Paulo, permitindo que eleitores,
    candidatos e pesquisadores enxerguem a capilaridade política e a dinâmica eleitoral
    na maior metrópole do país.
  originalidade: A reportagem inova ao transformar dados brutos dos boletins de urna
    em uma ferramenta interativa de fácil uso, que aproxima o eleitor da realidade
    política do seu entorno. Em vez de mostrar apenas os resultados por zonas eleitorais
    ou distritos, o Radar da Votação permite uma análise hiperlocal. Essa abordagem
    jornalística combina apuração de dados, tecnologia e visualização geográfica para
    revelar como se distribuem os votos dentro da cidade, oferecendo uma leitura mais
    profunda e acessível do comportamento eleitoral paulistano.
  metodologia: "A plataforma utiliza os dados oficiais dos boletins de urna, disponibilizados\
    \ pelo TSE, para calcular o total de votos de cada local de votação. Para isso,\
    \ somamos os votos de cada candidato em todas as seções eleitorais daquele determinado\
    \ colégio.\n\nAssim, quando um endereço é buscado no mapa, a ferramenta faz uma\
    \ nova soma, só que agora por local de votação, e informa o candidato que teve\
    \ o melhor desempenho em todos os colégios presentes dentro do círculo tracejado\
    \ no mapa. \n\nQuando a busca é realizada, a ferramenta tenta encontrar pelo menos\
    \ um local dentro do raio de 500 metros; caso não localize, o raio aumenta até\
    \ que algum colégio eleitoral seja encontrado na região.\n\nAs coordenadas geográficas\
    \ dos locais de votação são do compilado 'Eleitorado por Local de Votação', também\
    \ divulgado pelo TSE. Ao longo do desenvolvimento, foi constatado que parte dos\
    \ locais de votação estava com posicionamento divergente. Essa incongruência foi\
    \ posteriormente corrigida com o auxílio da API do Google Maps."
