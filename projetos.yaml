- title: Lente de Aumento
  project_url: https://g1.globo.com/rj/rio-de-janeiro/noticia/2024/12/07/lente-de-aumento-veja-todas-as-reportagens-da-serie.ghtml
  veiculo: TV Globo / GloboNews
  autoria: Guilherme Ramalho, Marcelo Bruzzi, Luiza Guerra
  data: 12/1/2024
  resumo: A série Lente de Aumento revelou, de forma inédita e exclusiva, por meio
    da Lei de Acesso à Informação, graves falhas no uso das câmeras corporais pela
    Polícia Militar do Rio de Janeiro. Ao longo de seis meses, a equipe analisou 774
    processos judiciais e constatou que, em 61% dos casos, as imagens captadas por
    policiais não foram entregues à Justiça, dificultando investigações e comprometendo
    a fiscalização de abusos de autoridade, crimes e irregularidades. O trabalho provocou
    a abertura de novas investigações do Ministério Público e medidas administrativas
    contra policiais envolvidos.
  relevância: "O trabalho escancarou a fragilidade dos mecanismos de controle das\
    \ forças de segurança e revelou como a omissão de imagens compromete a transparência,\
    \ a Justiça e o combate à corrupção. Por meio de imagens inéditas, revelou também\
    \ a corrupção policial em diversas formas: desde agentes flagrados pegando dinheiro\
    \ e drogas de suspeitos detidos até manipulação de câmeras para encobrir condutas\
    \ ilícitas. Por outro lado, a série também trouxe exemplos de integridade dentro\
    \ da corporação, registrando casos de policiais que recusaram propina e seguiram\
    \ protocolos éticos, reforçando a importância da transparência e do controle externo\
    \ para uma polícia mais eficiente e justa.\n\n A série teve desdobramentos institucionais\
    \ concretos, como investigações abertas pelo MP, afastamentos e prisões administrativas.\
    \ Além disso, alimentou o debate público sobre o uso de câmeras corporais no Brasil,\
    \ impulsionando discussões sobre accountability policial, direitos humanos e acesso\
    \ à informação. A série reforça o papel essencial do jornalismo na fiscalização\
    \ do poder e na proteção dos direitos fundamentais."
  originalidade: A originalidade da série está no uso inédito e sistemático de processos
    judiciais para avaliar a efetividade das câmeras corporais como instrumento de
    transparência, controle externo e combate a diversos crimes e irregularidades.
    Após a obtenção da planilha com os processos judiciais, a equipe analisou centenas
    de decisões judiciais que exigiam a entrega das imagens, além de milhares de horas
    de gravações. A investigação também inovou ao equilibrar denúncias de irregularidades
    com exemplos de boas práticas, oferecendo uma visão ampla, complexa e humanizada
    da realidade policial.
  metodologia: A equipe de reportagem analisou 774 processos judiciais nos quais a
    Polícia Militar foi intimada a fornecer imagens de câmeras corporais. O levantamento
    foi feito por meio de acompanhamento sistemático em tribunais do Rio de Janeiro,
    com apoio de advogados e especialistas em segurança pública. Os dados foram organizados
    em planilhas e cruzados com imagens obtidas junto a fontes e advogados. A equipe
    também mergulhou em dezenas de horas de vídeos, realizou entrevistas com especialistas
    e monitorou desdobramentos institucionais após a publicação. A metodologia combinou
    jornalismo de dados, investigação em campo e análise jurídica — sem uso de código
    ou repositório público de dados.
