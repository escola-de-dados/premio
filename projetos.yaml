- title: Quentinhas Invisíveis
  project_url: https://oglobo.globo.com/politica/noticia/2025/02/06/quentinha-invisivel-acao-do-governo-lula-contra-a-fome-abastece-ongs-de-petistas-que-nao-entregam-refeicoes-previstas.ghtml
  veiculo: Jornal O GLOBO
  autoria: Patrik Camporez e Guilherme Queiroz
  data: 2/6/2025
  resumo: "A série Quentinhas Invisíveis, publicada por O GLOBO, revelou o desvio\
    \ de milhões de reais em verbas públicas destinadas ao programa federal Cozinha\
    \ Solidária, criado para fornecer refeições a pessoas em situação de vulnerabilidade.\
    \ A investigação teve início com uma análise massiva da plataforma Transferegov,\
    \ que permitiu identificar convênios suspeitos com ONGs recém-criadas, sem estrutura\
    \ comprovada. Utilizando ferramentas de inteligência artificial, mais de 6 mil\
    \ páginas de prestações de contas foram digitalizadas, analisadas e planilhadas.\
    \ O cruzamento com bases públicas — como dados do CNPJ, metadados de arquivos\
    \ e registros fiscais — apontou inconsistências como documentos duplicados, imagens\
    \ manipuladas e entrega fictícia de refeições. A apuração em campo confirmou fraudes\
    \ em diversos estados. O trabalho levou à suspensão dos contratos, à abertura\
    \ de investigações pela Polícia Federal, CGU e TCU, e ao debate público sobre\
    \ o uso político de políticas sociais. \nLINKS:\nhttps://oglobo.globo.com/politica/noticia/2025/02/06/quentinha-invisivel-acao-do-governo-\n\
    lula-contra-a-fome-abastece-ongs-de-petistas-que-nao-entregam-refeicoes-previstas.ghtml​\n\
    https://oglobo.globo.com/politica/noticia/2025/02/13/quentinhas-invisiveis-governo-\n\
    suspende-convenios-de-ongs-contratadas-para-fornecer-refeicoes.ghtml\nhttps://oglobo.globo.com/politica/noticia/2025/02/07/quentinha-invisivel-ong-responsavel-\n\
    por-acao-de-ministerio-contratou-firmas-do-proprio-dono-e-de-sobrinho.ghtml\n\
    https://oglobo.globo.com/politica/noticia/2025/02/08/refeicoes-nao-entregues-pf-acionada-e-\n\
    contrato-suspenso-entenda-o-caso-das-quentinhas-invisiveis.ghtml\nhttps://oglobo.globo.com/politica/noticia/2025/02/14/quentinhas-invisiveis-ong-contratada-\n\
    em-pernambuco-informou-cpfs-inconsistentes-em-prestacao-de-contas.ghtml\nhttps://oglobo.globo.com/politica/noticia/2025/03/06/quentinhas-invisiveis-area-tecnica-do-\n\
    tcu-conclui-que-ongs-nao-comprovaram-entrega-de-comida.ghtml\nhttps://oglobo.globo.com/politica/noticia/2025/02/06/governo-aciona-policia-federal-e-inicia-\n\
    apuracao-sobre-quentinhas-invisiveis.ghtml\nhttps://oglobo.globo.com/blogs/lauro-jardim/post/2025/02/tcu-recomenda-suspender-\n\
    repasses-para-ong-das-quentinhas-invisiveis.ghtml\n\nhttps://oglobo.globo.com/blogs/lauro-jardim/post/2025/02/tcu-quer-que-ministerio-ouca-\n\
    envolvidos-no-caso-das-quentinhas-invisiveis.ghtml\nhttps://oglobo.globo.com/politica/noticia/2025/02/08/caso-das-quentinhas-invisiveis-e-\n\
    anuncio-desmentido-sobre-bolsa-familia-ameacam-wellington-dias-na-reforma-\nministerial.ghtml\n\
    https://oglobo.globo.com/blogs/lauro-jardim/post/2025/02/vereadora-de-sao-paulo-cobra-\n\
    informacoes-sobre-quentinhas-invisiveis-a-ministro-de-lula.ghtml"
  relevância: O Brasil vive uma crise de segurança alimentar, com mais de 30 milhões
    de pessoas em situação de fome ou desnutrição. O programa Cozinha Solidária foi
    anunciado como a principal política pública federal para mitigar essa realidade.
    A revelação de que esses recursos estavam sendo desviados por ONGs de fachada
    ligadas a estruturas político-partidárias representa uma grave denúncia sobre
    o mau uso de recursos públicos em um contexto social crítico. A investigação expôs
    um padrão sistêmico de fraude, impactando diretamente a população mais vulnerável
    e provocando respostas institucionais em nível federal
  originalidade: 'A originalidade do trabalho reside na combinação inédita entre mineração
    de dados públicos, uso de inteligência artificial para análise documental em larga
    escala e apuração presencial em campo. A investigação foi totalmente independente:
    nasceu do monitoramento contínuo do Transferegov, sem vazamentos ou colaborações
    externas. O cruzamento entre metadados de arquivos PDF, registros da Receita Federal
    e dados de redes políticas permitiu identificar conexões entre ONGs e ex-assessores
    de parlamentares. Foram detectados documentos idênticos enviados por diferentes
    entidades, com provas de que foram produzidos no mesmo computador. A apuração
    revelou ainda cozinhas inexistentes, fotos forjadas e declarações de distribuição
    de refeições antes mesmo do repasse dos recursos — uma violação inédita revelada
    por meio de análise temporal dos dados.'
  metodologia: 'Metodologia

    A metodologia combinou cinco frentes integradas:


    Mineração de dados públicos: Identificação de convênios suspeitos por meio do
    portal Transferegov.


    Análise documental automatizada: Processamento de mais de 6 mil páginas de prestações
    de contas com auxílio de inteligência artificial (OCR, verificação de duplicidade
    textual, extração de metadados).


    Cruzamento de bases oficiais: Verificação de CNPJs, certidões da CGU, registros
    de doações eleitorais, vínculos com assessores parlamentares e histórico de atuação
    das entidades.


    Verificação in loco: Visitas a endereços declarados, que revelaram igrejas fechadas,
    imóveis vazios e cozinhas inexistentes.


    Entrevistas estruturadas: Realizadas com moradores, funcionários públicos, ex-assessores
    e supostos beneficiários, permitindo confrontar documentos com a realidade.


    A apuração foi feita exclusivamente pelo autor, sem participação de terceiros.
    Ainda não há repositório público com os dados brutos ou scripts, pois parte da
    investigação continua em andamento e sob confidencialidade jornalística.'
