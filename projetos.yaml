- title: Com homenagem a Anísio Teixeira, Brasil chega à Lei 15.000
  project_url: https://www12.senado.leg.br/noticias/infomaterias/2024/10/com-homenagem-a-anisio-teixeira-brasil-chega-a-lei-15.000
  veiculo: Agência Senado
  autoria: Igor Brito
  data: 10/16/2024
  resumo: O Brasil chegou à sua 15.000ª lei ordinária em 2024. O número elevado de
    leis reflete, segundo senadores, a dinâmica social e a diversidade de demandas,
    embora especialistas alertem para a proliferação de normas com baixo impacto prático,
    como datas comemorativas e homenagens. O trabalho de organização e revisão desse
    extenso acervo normativo ainda enfrenta obstáculos, apesar de iniciativas como
    o portal normas.leg.br. A efeméride também levanta o debate sobre a efetividade
    das leis e a importância do controle social sobre sua produção.
  relevância: O trabalho realizado pela Agência Senado ao registrar e refletir sobre
    a promulgação da Lei 15.000 é relevante por lançar luz sobre o volume, a natureza
    e os desafios da produção legislativa no Brasil. Ao contextualizar a trajetória
    das leis ordinárias desde 1946, a reportagem contribui para uma compreensão crítica
    do papel do Congresso na formulação de normas e revela tensões entre quantidade
    e qualidade legislativa. Além disso, destaca o esforço institucional de organização
    e transparência do acervo normativo — como o portal normas.leg.br.
  originalidade: Um aspecto original é a combinação entre dados numéricos, análise
    crítica e depoimentos de parlamentares e técnicos, que ajudam a expor contradições
    do sistema, como a alta produção de normas com baixo impacto prático. Também se
    destaca a abordagem sobre a mudança no perfil dos autores das leis e a falha recorrente
    na consolidação legislativa, temas pouco debatidos fora dos círculos especializados.
  metodologia: 'Foi utilizado unicamente o painel criado pelo Congresso Nacional que
    compila todas as normas que por lá tramitaram desde o Brasil Império: https://normas.leg.br/painel.


    Foram feitas pesquisas nos seguintes temas:

    1. Leis de numeração significativa, como a Lei nº 1, a Lei nº 1.000, etc. Para
    isso, foi feito apenas a busca pela numeração;


    2. Autoria das leis por órgãos. Para isso, filtrou-se apenas leis ordinárias e,
    pelos filtros, chegou-se aos órgãos autores;


    3. Leis por década. Para isso, filtrou-se apenas leis ordinárias e, pelos filtros,
    chegou-se às datas;


    4. Normas em vigor.  Para isso, filtrou-se apenas a data e, pelos filtros, chegou-se
    aos tipos de normas (lei, emenda à Constituição, etc);'
