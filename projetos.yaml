- title: Em 5 anos, 63% das pautas da Comissão de Meio Ambiente do Amazonas são sobre
    pets; crise climática, 9%
  project_url: https://infoamazonia.org/2024/09/24/em-5-anos-63-das-pautas-da-comissao-de-meio-ambiente-do-amazonas-sao-sobre-pets-crise-climatica-9/
  veiculo: InfoAmazonia
  autoria: Steffanie Schmidt
  data: 9/24/2024
  resumo: A investigação realizada entre fevereiro de 2019 e agosto de 2024, revela
    um alarmante descompasso nas prioridades legislativas da Comissão de Proteção
    aos Animais, Meio Ambiente e Desenvolvimento Sustentável da Assembleia Legislativa
    do Estado do Amazonas (CPAMA-Aleam). Com 63% das propostas focadas na causa animal,
    especialmente em animais domésticos, apenas 9% abordam questões urgentes como
    mudanças climáticas e crimes ambientais. Em 2024, apesar da qualidade do ar "péssima"
    em Manaus, nenhuma das 11 proposituras analisadas tratou de problemas críticos
    como estiagem ou queimadas. Além disso, a comissão não enviou indicações ou denúncias
    sobre questões ambientais ao Executivo ou Judiciário, evidenciando um descompasso
    com as crises que afligem a região. A análise ainda aponta a influência predominante
    de partidos conservadores, que dominam 83% da composição da CPAMA e são considerados
    "negacionistas climáticos". Essa configuração prioriza temas "consensuais e menos
    polêmicos", como a causa animal, em detrimento de legislações ambientais essenciais.
    A flexibilização do licenciamento ambiental, exemplificada pela Lei nº 6.465/2023,
    que facilita a supressão de vegetação nativa, agrava a situação. A falta de transparência,
    com atas de reuniões inacessíveis ao público e a ausência de resposta da ALEAM
    às tentativas de contato da reportagem, reforçam a percepção de que a comissão
    está desconectada da urgência das crises ambientais no Amazonas.
  relevância: O trabalho expõe um desequilíbrio crítico e preocupante nas ações de
    um órgão público responsável pela proposição de política pública e consequente
    proteção ambiental em uma das regiões mais vitais do planeta. Os dados revelam
    um dado alarmante no estado do Amazonas, que vem enfrentando sucessivas crises
    ambientais como a qualidade do ar "péssima" em Manaus em 2024, sem que nenhuma
    das proposituras analisadas até agosto estivesse ligada à estiagem, queimadas
    ou fumaça. Além disso, secas severas e cada vez mais frequentes, sem que a comissão
    tenha enviado indicações, requerimentos, denúncias ou ofícios relacionados a problemas
    ambientais ao Executivo ou Judiciário. Essa análise aprofundada destaca que a
    CPAMA está "descolada da urgência das crises ambientais" que afligem o estado,
    priorizando pautas mais consensuais e menos polêmicas em detrimento de questões
    críticas como o desmatamento e eventos climáticos extremos. O trabalho desmascara
    como a influência política e a falta de transparência podem minar a eficácia da
    legislação ambiental. A falta de transparência, com atas de reuniões inacessíveis
    ao público, e a ausência de resposta da ALEAM à reportagem, impedem a fiscalização
    e a compreensão do debate parlamentar. Portanto, este trabalho não apenas documenta
    uma disparidade nas prioridades legislativas, mas também serve como um alerta
    e um chamado à ação para que órgãos de fiscalização e a sociedade exijam maior
    engajamento e responsabilidade na abordagem das verdadeiras crises ambientais
    do Amazonas
  originalidade: 'O trabalho traz um levantamento sistemático e exclusivo das propostas
    legislativas de uma comissão específica, com uma análise quantitativa e ilustrativa
    das temáticas e a contextualização com o cenário ambiental, político e de transparência
    utilizando, utilizando metodologias simples e acessíveis a partir da ferramenta
    pública disponível: o Sistema de Apoio ao Processo Legislativo da Assembleia Legislativa
    do Amazonas (SAPL-ALEAM), para driblar as limitações da falta de acesso público
    às atas das reuniões da comissão, da falta de retorno via Lei de Acesso à Informação,
    o que compromete a transparência e a fiscalização da atuação parlamentar. A análise
    não apenas revela as prioridades da CPAMA-Aleam, mas também aponta para a necessidade
    de maior abertura por parte do órgão legislativo. Assim, a originalidade metodológica
    reside na transformação da simples coleta de dados em uma investigação crítica
    e reflexiva sobre as prioridades legislativas e os desafios de transparência diante
    das urgências ambientais do Amazonas.'
  metodologia: Utilizou-se o Sistema de Apoio ao Processo Legislativo da Assembleia
    Legislativa do Amazonas (SAPL-ALEAM) que permite a consulta de algumas informações,
    mas as atas das reuniões da comissão, fundamentais para entender o debate entre
    parlamentares, não estão acessíveis ao público. Essa falta de transparência limita
    as análises e a fiscalização da atuação parlamentar, restringindo o acesso da
    sociedade à discussão de questões ambientais urgentes, por exemplo. Aplicou-se
    filtro. Para isso, foi utilizada categorização manual e qualitativa utilizando
    o método de tabela dinâmica no Excel. Na aba relatórios, é possível utilizar o
    filtro “Histórico de Tramitações de Matérias Legislativas”, selecionando o período
    e local de tramitação. Neste caso, optou-se em selecionar como local de origem
    e de destino a própria CPAMA para aferir as propostas feitas pela comissão, bem
    como as que foram apreciadas pela mesma por terem sido a ela destinadas.  O Sistema
    lista 12 tipos de matérias legislativas como filtros possíveis. A reportagem deixou
    sem seleção para abarcar todas as possibilidades possíveis. Foi realizada uma
    rechecagem, para garantir que os resultados coincidissem com a busca total inicial.
    A categorização das matérias legislativas analisadas seguiu a linha adotada na
    nomenclatura da própria Comissão, a partir da leitura de cada uma das propostas
    e classificação sobre em qual linha de atuação da comissão estava vinculada.
