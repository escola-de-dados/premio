- title: 'Própolis vermelha: tesouro da biodiversidade alagoana'
  project_url: https://tribunahoje.com/especial/2025/06/06/81-propolis-vermelha-tesouro-da-biodiversidade-alagoana
  veiculo: TRIBUNA HOJE
  autoria: ANA PAULA OMENA / WELLINGTON SANTOS
  data: 6/6/2025
  resumo: 'A própolis vermelha dos manguezais de Alagoas tem se destacado nacional
    e internacionalmente pelos seus benefícios à saúde e potencial econômico. Composto
    exclusivamente por isoflavonoides, o produto é considerado único no Brasil. A
    Universidade Federal de Alagoas (Ufal), em parceria com a Uniprópolis, lidera
    as pesquisas e inovações sobre a substância, sendo responsável por mais da metade
    das patentes nacionais e 12% das internacionais.


    A conquista do selo de Indicação Geográfica (IG) reforça a autenticidade e qualidade
    da própolis vermelha alagoana, diferenciando-a de outros estados e valorizando
    seu vínculo com o território e a comunidade local. O trabalho conta ainda com
    o apoio da Fapeal e do Sebrae, e já começa a gerar produtos derivados em parceria
    com empresas locais.


    Para o reitor da Ufal, Josealdo Tonholo, a própolis vermelha é “ouro nas mãos”,
    com potencial de transformar não só o setor apícola, mas também áreas como agricultura
    familiar, ciência e tecnologia.'
  relevância: 'A iniciativa de conservar o rabo-de-bugio — planta nativa dos manguezais
    alagoanos — tem se mostrado essencial para elevar a produtividade e garantir a
    sustentabilidade da cadeia da própolis vermelha em Alagoas. Segundo Carlos Henrique
    Soares, gerente de Competitividade Setorial do Sebrae Alagoas, os apicultores
    atendidos pelo programa de boas práticas do órgão são constantemente incentivados
    a preservar o ecossistema de onde extraem sua matéria-prima.


    A relevância dessa ação está na relação direta entre a saúde ambiental e o desempenho
    produtivo: quanto mais preservado o habitat, maior a qualidade e quantidade de
    própolis extraída. Além disso, o Sebrae está desenvolvendo, em articulação com
    outros parceiros, um projeto voltado ao fortalecimento dessa cadeia produtiva,
    com foco em apoio técnico, inovação e mercado.


    A atuação do Sebrae também tem sido decisiva na capacitação dos produtores, com
    foco na melhoria das técnicas de extração e na elevação do padrão de qualidade
    do produto final — fator fundamental para consolidar a própolis vermelha alagoana
    como referência no mercado nacional e internacional.'
  originalidade: 'Aspectos originais e inovações do trabalho com a própolis em Alagoas:


    O trabalho realizado pela Uniprópolis, em parceria com a Universidade Federal
    de Alagoas (Ufal), apresenta uma abordagem inovadora ao expandir o foco da pesquisa
    além da já consagrada própolis vermelha dos manguezais. O grande diferencial está
    na busca por novas variedades de própolis, oriundas de diferentes ecossistemas
    alagoanos, com potencial terapêutico e valor comercial.


    Entre os principais aspectos originais, destacam-se:


    🔬 Diversificação da pesquisa:

    Estudos sobre novas variedades de própolis, como a marrom (produzida a partir
    da Baccharis Cinerea, ou "Erva de Santa Maria") nas Serras de Alagoas, e a verde
    da Jurema Preta, típica do Agreste e Sertão.


    Investigação de suas propriedades fitoquímicas e terapêuticas, como o uso da própolis
    verde no tratamento da ansiedade, depressão e potencial aplicação futura no combate
    ao autismo infantil.


    🌱 Mapeamento territorial inédito:

    Identificação de novas regiões produtoras, como Novo Lino, Colônia Leopoldina,
    Ibateguara, União dos Palmares, Capela, Palmeira dos Índios e Quebrangulo, ampliando
    a área de atuação científica e produtiva no estado.


    🧪 Avanços em biotecnologia e inovação:

    Desenvolvimento de produtos inovadores, como:


    Cápsulas com nanopartículas cosméticas.


    Extratos lipossomais para públicos que não consomem álcool (comunidades árabes
    e pacientes oncológicos).


    Concessão de patentes nacionais e internacionais, fruto da pesquisa aplicada e
    colaborativa.


    🤝 Fomento robusto à ciência aplicada:

    Apoio estratégico da Fapeal, com:


    Subvenção econômica a projetos empreendedores;


    Financiamento direto a pesquisadores doutores em colaboração com empresas;


    Bolsas acadêmicas da iniciação científica ao pós-doutorado, voltadas à cadeia
    produtiva da própolis.


    🌍 Reconhecimento e atenção global:

    A propriedade medicinal singular da própolis vermelha alagoana, estudada desde
    2005, tem despertado interesse de instituições internacionais.


    A pesquisa alagoana se destaca como pioneira nas Américas com a primeira Indicação
    Geográfica (IG) da biodiversidade regional.


    Em síntese, o trabalho traz uma visão holística e inovadora: une conservação ambiental,
    biotecnologia, desenvolvimento regional, inclusão produtiva e internacionalização
    da ciência, posicionando Alagoas como um polo de excelência na pesquisa e na produção
    de própolis com alto valor agregado.'
  metodologia: 'O trabalho desenvolvido pela Uniprópolis, em parceria com a Universidade
    Federal de Alagoas (Ufal) e com o apoio de instituições como a Fapeal e o Sebrae,
    utiliza uma metodologia multidisciplinar e baseada em ciência aplicada, que integra
    desde o mapeamento ambiental até o desenvolvimento de produtos inovadores. A seguir,
    os principais eixos da metodologia adotada:


    1. Mapeamento botânico e geográfico

    Identificação das plantas utilizadas pelas abelhas para a produção de diferentes
    tipos de própolis, com destaque para espécies nativas como o rabo-de-bugio, Baccharis
    Cinerea (Erva de Santa Maria) e Jurema Preta.


    Levantamento de áreas potenciais de coleta, com georreferenciamento em municípios
    como Novo Lino, Colônia Leopoldina, Quebrangulo, entre outros.


    Uso de ferramentas de geotecnologia para delimitar e proteger territórios de interesse
    apícola e meliponícola.


    2. Coleta e análise fitoquímica

    Realização de coletas de amostras de própolis em diferentes regiões e estações
    do ano.


    Análise fitoquímica e cromatográfica das amostras em laboratório, para identificar
    a composição de compostos bioativos como flavonoides, isoflavonoides, ácidos fenólicos,
    entre outros.


    Comparação entre diferentes tipos de própolis (vermelha, marrom, verde) quanto
    às propriedades antioxidantes, anti-inflamatórias, antimicrobianas e imunomoduladoras.


    3. Estudos de manejo apícola

    Implantação de boas práticas de manejo com apicultores locais, com capacitação
    técnica e orientação sobre conservação ambiental.


    Monitoramento das colmeias e da produtividade das abelhas em áreas com vegetação
    preservada.


    Testes comparativos entre diferentes métodos de extração (álcool, água, seco)
    e sua influência na qualidade do produto final.


    4. Inovação tecnológica

    Desenvolvimento de novas formulações a partir dos extratos: cápsulas com nanopartículas,
    versões lipossomais e aplicações cosméticas e terapêuticas.


    Depósito e acompanhamento de pedidos de patentes nacionais e internacionais em
    parceria com a Ufal e o INPI.


    Aplicação de técnicas de biotecnologia e nanotecnologia para ampliar a eficácia
    e aceitação dos produtos em mercados diversos.


    5. Engajamento comunitário e articulação institucional

    Trabalho em conjunto com agricultores familiares, quilombolas e pequenos produtores
    para promover a inclusão produtiva.


    Parcerias com instituições de fomento como Fapeal e Sebrae para suporte financeiro,
    logístico e técnico.


    Participação em eventos científicos e de mercado para validação e divulgação dos
    resultados.


    Essa metodologia permite não apenas o avanço do conhecimento técnico e científico
    sobre a própolis alagoana, mas também gera impacto social, econômico e ambiental
    positivo em comunidades produtoras, além de fortalecer a identidade territorial
    dos produtos com alto valor agregado.'
