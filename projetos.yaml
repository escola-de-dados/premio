- title: Acusação de conflito de interesses e atropelos levam à destituição de presidente
    do Conselho Federal de Nutrição
  project_url: https://ojoioeotrigo.com.br/2025/05/acusacao-de-conflito-de-interesses-e-atropelos-levam-a-destituicao-de-presidente-do-conselho-federal-de-nutricao/
  veiculo: O Joio e O Trigo
  autoria: Flávia Schiochet
  data: 5/29/2025
  resumo: "A reportagem revela o conflito de interesses na presidência do Conselho\
    \ Federal de Nutrição (CFN) e explica como os embates entre conselheiros escalaram\
    \ até a votação pela destituição da presidente, Erika Carvalho. \n\nAo assumir\
    \ o cargo, Carvalho tomou decisões sem consulta ao plenário, desrespeitando o\
    \ regimento do órgão. Dentre as decisões tomadas à revelia do colegiado, está\
    \ a chancela ao título de especialista em nutrição oncológica dado à Sociedade\
    \ Brasileira de Nutrição Oncológica (SBNO), entidade da qual é sócia-fundadora\
    \ junto de seu companheiro, Nivaldo Pinho. O reconhecimento havia sido negado\
    \ pelos conselheiros do mandato anterior, pela falta de documentos e uma suspeita\
    \ de venda casada. Carvalho não pautou a chancela do título em plenária, como\
    \ manda o regimento do CFN. O Diário Oficial publicou a chancela como se aprovada\
    \ em plenária, o que não ocorreu.\n\nA investigação reuniu documentos, publicações\
    \ em redes sociais e entrevistas, reconstituindo a sequência de acontecimentos.\
    \ Parte dos documentos e as atas de todas as reuniões não estavam disponíveis\
    \ no site da Transparência do CFN. Foi preciso reuni-las a partir do envio feito\
    \ por fontes."
  relevância: 'A falta de transparência na gestão de Erika Carvalho agrava o conflito
    de interesses exposto. Denunciar irregularidades em conselhos de classe é essencial,
    pois esses órgãos regulam o exercício profissional de 31 profissões no Brasil.
    No caso do CFN, são quase 203 mil nutricionistas e mais de 21 mil técnicos. O
    órgão também participa de discussões de políticas públicas ligadas à alimentação
    e nutrição, cooperando com diferentes ministérios e órgãos do governo.


    Quando a presidência de um conselho utiliza o cargo para favorecer interesses
    privados, abre caminho para reserva de mercado, tráfico de influência e enfraquecimento
    da estrutura colegiada, gerando prejuízos aos profissionais e à saúde pública.'
  originalidade: 'A reportagem revelou, com exclusividade, um caso de conflito de
    interesses e desrespeito à governança dentro de um órgão federal pouco fiscalizado
    pela imprensa. Foi a primeira a expor publicamente os embates internos e as decisões
    unilaterais tomadas pela então presidente do Conselho Federal de Nutrição (CFN),
    mesmo diante da falta de transparência institucional e da resistência ativa da
    gestão em fornecer respostas.


    O trabalho organizou e deu sentido a informações fragmentadas: atas de plenárias
    não publicadas, resoluções pouco acessíveis, registros em redes sociais e documentos
    do Diário Oficial da União foram reunidos e cruzados para reconstituir uma cronologia
    precisa dos fatos. Isso permitiu identificar contradições formais entre o que
    foi decidido, o que foi publicado oficialmente e o que era omitido dos canais
    de transparência.


    Além de investigar um caso de má gestão pública, a reportagem aponta falhas sistêmicas
    de controle social em conselhos profissionais, instituições com poder normativo
    sobre categorias inteiras. O ineditismo está tanto no conteúdo revelado quanto
    no método de reconstrução da história a partir de documentos opacos, peças públicas
    dispersas e fontes humanas com conhecimento interno.'
  metodologia: A partir de uma denúncia anônima, iniciamos investigação sobre o CFN,
    seu regimento e funcionamento. Entrevistamos conselheiros da atual gestão, ex-conselheiros,
    ex-funcionários e pessoas de ministérios que dialogavam com o CFN. Além disso,
    analisamos todas as atas de plenárias, resoluções, pareceres jurídicos, cartas
    abertas e registros no Diário Oficial da União, cruzando as informações obtidas
    em documentos, dados públicos e entrevistas. Parte fundamental do material — como
    atas não publicadas — foi obtida diretamente com fontes confiáveis, diante da
    recusa da mesa-diretora em responder aos nossos questionamentos.
  uf: PR
  tipo_inscricao: Investigação
  formato: Online
