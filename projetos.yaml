- title: Um em cada 10 mineiros vive perto de barragens em risco de colapso
  project_url: https://www.em.com.br/gerais/2025/03/7091689-um-em-cada-10-mineiros-vive-perto-de-barragens-em-risco-de-colapso.html
  veiculo: Estado de Minas
  autoria: Gabriel Ronan
  data: 3/24/2025
  resumo: Reportagem orientada por dados que teve como objetivo levantar o número
    de moradores de Minas Gerais que vivem no perímetro de 10 quilômetros das 43 barragens
    em algum nível de alerta no estado, de acordo com a classificação da Agência Nacional
    de Mineração (ANM). O material também ouviu essas pessoas para humanizar o problema
    e detalhar a angústia de conviver com tal perigo.
  relevância: Sobretudo após os rompimentos das barragens de Mariana (2015) e de Brumadinho
    (2019), a vigilância jornalística voltada à mineração se tornou ainda mais necessária,
    principalmente em Minas Gerais. No material em questão, o Estado de Minas deu
    números (e vozes) reais a esse problema, que ainda tira o sono de 1,8 milhão de
    pessoas no estado, todas vizinhas do medo de um possível colapso minerário em
    suas redondezas.
  originalidade: 'Esse tipo de reportagem sempre foi feita pela imprensa profissional
    em Minas Gerais, porém o dado usado para tal levantamento sempre considerava os
    documentos cadastrados pelas próprias mineradoras junto à ANM. Nesta reportagem,
    porém, cruzamos dados populacionais do Censo de 2022 e da própria Agência Nacional
    de Mineração para ter o número exato (e muito mais confiável) de pessoas vivendo
    nos arredores dessas represas. A escolha do raio de 10 quilômetros foi técnica:
    é neste espaço que está delimitada a chamada Zona de Autossalvamento (ZAS), presente
    no Plano de Ação de Emergência de Barragens (PAEBM).'
  metodologia: "Para alcançar os dados apresentados no material, a reportagem usou\
    \ a linguagem de programação Python e bases de dados da Agência Nacional de Mineração\
    \ (ANM) e do Censo do IBGE de 2022. Os passos foram os seguintes:\n\n1.\tImportação\
    \ das bibliotecas pandas, geopandas, shapely, collections, geobr, matplotlib e\
    \ re\n2.\tMapeamento das barragens de mineração em Minas Gerais, a partir da conversão\
    \ da latitude e longitude de graus para número decimal \n3.\tSeleção daquelas\
    \ represas em risco de alerta ou de emergência\n4.\tSeleção dos setores censitários\
    \ de Minas Gerais que intersectam o raio de 10 quilômetros (buffer) das barragens\
    \ em questão\n5.\tContagem das pessoas que vivem nesses recortes espaciais, com\
    \ posterior descarte das pessoas já contadas em outras barragens para evitar a\
    \ sobreposição (algumas represas são próximas uma das outras)\n6.\tDefinição de\
    \ filtros que interessavam a reportagem, como o número de pessoas que vivem perto\
    \ de barragens em risco construídas a montante (modelo que resultou nos rompimentos\
    \ de Brumadinho e Mariana)\n7.\tElaboração de visualização de dados em matplotlib\n\
    8.\tExportação do datavis para o Canvas, onde foram feitas pistas visuais para\
    \ auxiliar a compreensão da audiência"
