- title: IBGE diz 72 mil, mas moradores questionam e relatam subnotificação no censo
    2022
  project_url: https://falaroca.com/ibge-rocinha-censo-subnotificacao-2022/
  veiculo: Organização de Comunicação Fala Roça
  autoria: Karen Fontoura, Fernanda Calé e Rodrigo Silva
  data: 6/7/2025
  resumo: Os dados do IBGE são fundamentais para a formulação de políticas públicas
    e o planejamento de serviços essenciais no Brasil. No entanto, mesmo com os avanços
    tecnológicos e metodológicos, obter dados precisos sobre a população das favelas,
    como a Rocinha, continua sendo um desafio. Mais uma vez, os resultados do Censo
    2022 apontam que a Rocinha possui cerca de 70 mil habitantes, um número que praticamente
    não se altera desde 2010. A discrepância entre a realidade vivida pelos moradores
    e os números oficiais levanta questionamentos sobre a eficácia da pesquisa e seus
    impactos no desenvolvimento do território.
  relevância: A principal proposta é evidenciar as divergências nos dados sobre a
    Rocinha. A partir da Lei de Acesso à Informação (LAI), de pesquisas populacionais
    realizadas por diferentes órgãos e dos dados oficiais, é possível mostrar como
    essas inconsistências impactam diretamente a formulação de políticas públicas
    voltadas para o território da maior favela do Brasil.
  originalidade: Os dados oficiais nacionais são fornecidos pelo IBGE, mas, no caso
    da Rocinha, a reportagem aponta fatores que podem ter interferido na contagem
    do Censo. Além disso, a comparação com outros levantamentos realizados por diferentes
    órgãos revela divergências significativas. Isso evidencia um problema estrutural
    na coleta de dados em favelas com alta densidade populacional e geografia complexa,
    como morros e casas verticais, onde muitas pessoas usam o território apenas como
    dormitório, o que pode impactar diretamente na eficácia da pesquisa.
  metodologia: A reportagem utilizou uma metodologia baseada na comparação de diferentes
    fontes de dados populacionais sobre a Rocinha. Foram consultados levantamentos
    feitos por órgãos como o Programa de Aceleração do Crescimento (PAC) e solicitadas
    informações via Lei de Acesso à Informação (LAI), incluindo dados fornecidos pelo
    Conselho Tutelar local. Também foram analisados os números oficiais do IBGE e
    comparados com estimativas realizadas pela Associação de Moradores da Rocinha.
    Além disso, a equipe entrevistou recenseadores que atuaram no território, buscando
    entender, a partir de suas experiências, os desafios enfrentados durante o processo
    de contagem. A combinação dessas fontes permitiu evidenciar as divergências entre
    os dados e questionar a precisão do Censo em favelas com características urbanas
    e sociais complexas.
