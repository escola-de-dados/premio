- title: Enchente de maio não impede alto índice de reeleição
  project_url: https://labjornalismo.pucrs.br/conteudo/enchente-de-maio-nao-impede-alto-indice-de-reeleicao/
  veiculo: Laboratório de Jornalismo da PUCRS
  autoria: Luciana de Bem Weber e Lucas Polidori Azeredo
  data: 10/17/2024
  resumo: 'A reportagem traz as Eleições Municipais de 2024 no Rio Grande do Sul a
    partir de uma indagação: as enchentes beneficiaram os candidatos à reeleição?
    A reportagem do Laboratório de Jornalismo da PUCRS (Lab J) traz, a partir de um
    levantamento exclusivo de dados, o percentual de reeleição nos municípios mais
    atingidos pelo desastre climático, que investiga como o desastre climático ocorrido
    no Rio Grande do Sul em maio de 2024 influenciou as eleições municipais realizadas
    posteriormente. O foco está no desempenho eleitoral de prefeitos que buscavam
    reeleição em cidades que decretaram emergência ou estado de calamidade pública.
    A premissa central é que eventos extremos podem alterar a forma como a população
    avalia seus gestores, mudando os critérios de julgamento político. Das 213 cidades
    que decretaram estado de emergência ou calamidade com prefeitos concorrendo, apenas
    45 não continuaram no cargo.'
  relevância: O trabalho conseguiu conectar, de uma maneira diferente, original e
    não repetida por outros veículos maiores/de maior relevância, os dois principais
    assuntos do estado do Rio Grande do Sul em 2024, Eleições e Enchentes. O trabalho
    também consegue discutir a questão das vantagens políticas de ser um líder, ou
    ao menos ocupar um cargo de liderança, em um momento de extrema sensibilidade
    o qual as pessoas tendem a procurar uma voz representativa. Foi assim que muitos
    prefeitos e prefeitas, especialmente das regiões dos vales do Taquari e do Rio
    Pardo, que já haviam sido vitimadas por enchentes em 2023.
  originalidade: O trabalho contempla a sua originalidade tanto na metodologia quanto
    na pauta. O trabalho de coleta de dados, como dito anteriormente, foi original
    (não foi inspirado em nenhuma reportagem previamente publicada) e exclusivo, portanto
    os resultados encontrados somente os autores tiveram acesso. Com a publicação
    da matéria, alguns repórteres, em especial de grandes veículos de comunicação,
    procuraram o Laboratório procurando onde estava a base de dados usada na matéria.
    Assim, como ela foi feita do zero, a originalidade se dá por ser um levantamento
    absolutamente único no meio.
  metodologia: 'Tabela utilizada disponível em: https://docs.google.com/spreadsheets/d/1GeF9dwYdIEjpS-XO0ioXSUhqMYN9KVo3lhB4oizr21A/edit?usp=sharing


    Primeiro, a equipe de repórteres procurou na Defesa Civil do RS e nos documentos
    do, agora extinto, Ministério da Reconstrução do RS quais prefeituras oficialmente
    decretaram Situação de Emergência ou Estado de Calamidade em meio às enchentes.
    Dos 497 municípios do estado, 446 oficializaram alguma das duas situações (437
    Emergências x 96 Calamidades).


    Após colocar os 446 municípios em tabela catalogados pelo tipo de decreto, a equipe
    foi atrás da situação eleitoral de cada prefeito ou prefeita, separando nas seguintes
    categorias:


    - Concorrendo (Reeleição)


    - Dois Mandatos + Vice ou Sucessor (Caso o/a prefeito/a já estivesse no segundo
    mandato, se o candidato governista seria seu/sua vice ou um/a sucessor/a do mesmo
    partido)


    - Não Concorrendo + Vice ou Sucessor (Mesma coisa de acima, porém o/a prefeito/a
    escolheu não participar do pleito)


    - Não Concorrendo ou Dois Mandatos (Não participou, ou poderia participar, nem
    colocou ninguém como sucessor político)


    Além de outros casos específicos envolvendo renúncia, morte, prisão e outras.
    Depois, com o fim do primeiro final de semana de Eleições em outubro de 2024,
    em que quase todos os municípios da tabela resolveram seu pleito, a equipe foi
    colocando os resultados:


    - Reeleito

    - Continuidade (Vice ou Sucessor eleito/a)

    - Não eleito

    - Sem candidato

    - Segundo Turno (uma vez que a reportagem saiu antes do segundo turno de Caxias
    do Sul, Santa Maria, Canoas e Porto Alegre)


    Por fim, com os resultados em mãos, a equipe contabilizou os números em que 81%
    dos "Prefeitos e Prefeitas da Calamidade" foram reeleitos(as), enquanto os "Prefeitos
    e Prefeitas da Emergência" ficaram em 78%.'
