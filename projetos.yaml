- title: Em 25 dias, Trump impõe agenda conservadora com 67 ordens executivas
  project_url: https://mais.opovo.com.br/reportagens-especiais/2025/02/18/em-25-dias-trump-impoe-agenda-conservadora-com-67-ordens-executivas.html
  veiculo: O POVO+
  autoria: Mateus Mota
  data: 2/18/2025
  resumo: 'Por meio de um levantamento exclusivo, a reportagem busca explicar o que
    muda com as primeiras 67 ordens executivas sancionadas por Donald Trump em seu
    segundo mandato. Em 25 dias, Trump assinou mais medidas que todos os presidentes,
    dos últimos 50 anos, fizeram nos primeiros 100 dias de governo.

    O presidente estadunidense  avança em sua agenda conservadora, revertendo políticas
    e impondo novas diretrizes nos EUA e na comunidade internacional.'
  relevância: A reportagem discute como as ações do governo federal dos Estados Unidos
    afetam os demais países do mundo, em especial o Brasil. Os dados mostram que a
    reforma no aparato do Estado norte-americano se concentra em medidas, sobretudo,
    populistas, que buscam demonstrar soberania e dominância no cenário geopolítico
    global.
  originalidade: A análise desses dados é inédita no Brasil. As ordens executivas
    foram agrupadas em eixos temáticos que traduzir sua intenção.  A reportagem, além
    dos números, traz também uma contextualização do tema, buscando aproximar do cenário
    brasileiro a repercussão das medidas. Trazemos também uma visualização de dados
    original, desenvolvida exclusivamente para esta pauta,
  metodologia: "Na construção desta reportagem, O POVO+ consultou arquivos públicos\
    \ do governo federal dos Estados Unidos da América. Para contabilizar as ordens\
    \ executivas de cada presidente, utilizamos os registros do Federal Register,\
    \ uma espécie de Diário Oficial do Governo Federal dos Estados Unidos da América.\
    \ \nO periódico existe desde 14 de março de 1936, e contém publicações rotineiras\
    \ e notificações públicas das agências do governo americano. A partir de dados\
    \ públicos, verificamos desde o presidente Gerald R. Ford, que assumiu o mandato\
    \ em 1974, compreendendo um ciclo de 50 anos.\nPara chegar aos documentos originais\
    \ de todas as ordens executivas assinadas pelo presidente Donald Trump no período\
    \ de 20 de janeiro a 12 de fevereiro de 2025, utilizamos registros do Federal\
    \ Register e do Escritório de Publicações do Governo dos Estados Unidos.\nAlgumas\
    \ ordens executivas ainda não estavam registradas nas plataformas, e foram coletadas\
    \ diretamente do site oficial da Casa Branca, que mantém uma página chamada \"\
    Atos Presidenciais\", que indexa - dentre outros assuntos - todos os decretos\
    \ assinados pelo presidente.\nA partir dos documentos originais, traduzimos os\
    \ títulos e categorizamos cada ordem executiva dentro de cinco eixos, estabelecidos\
    \ a partir de uma análise dos temas mais comuns.\nPara chegar aos eixos temáticos,\
    \ esta reportagem também contou com o auxílio de ferramentas de Inteligência Artificial.\
    \ Na ferramenta Notebook LM, do Google, fizemos o upload das tabelas retiradas\
    \ dos registros públicos e a partir de comandos (prompts) específicos, chegamos\
    \ aos resultados apresentados.\nNa mesma ferramenta, outro conjunto de prompts\
    \ nos ajudou a contabilizar a quantidade de ordens executivas assinadas nos primeiros\
    \ 100 dias de governo dos outros presidentes.\nO Notebook LM trabalha exclusivamente\
    \ com a base de dados fornecida pelo usuário e não extrai dados da internet ou\
    \ outras fontes. Não foram usadas quaisquer ferramentas de IA generativas para\
    \ texto, áudio ou imagens.\nPara garantir transparência e reprodutibilidade, uma\
    \ versão pública dos dados coletados está disponível ao leitor no link:\nhttps://docs.google.com/spreadsheets/d/e/2PACX-1vTttc4f0Di4c0QlJofW00TyCSdXRPjp3OFSVzdjUACzQn1GBtpLR3o24Zud22zklCKXNJrHPGzqnVzn/pubhtml"
