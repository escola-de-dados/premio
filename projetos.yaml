- title: ‘Como eu vou olhar para o futuro diante de tudo isso?’; Maré totaliza 39
    operações policiais em 10 meses
  project_url: https://vozdascomunidades.com.br/destaques/como-eu-vou-olhar-para-o-futuro-diante-de-tudo-isso-mare-totaliza-39-operacoes-policiais-em-10-meses/#google_vignette
  veiculo: Voz das Comunidades
  autoria: Samantha Millan
  data: 10/17/2024
  resumo: 39 operações policiais, 90 invasões de domicílios,17 mortes em ações policiais,13
    casos de tortura e mais de 30 dias sem aulas nas escolas...  Dados recolhidos
    da Redes da Maré apontam excesso de violência e direitos negados a população do
    Complexo de Favelas da Maré, no subúrbio do Rio de Janeiro.
  relevância: A matéria jornalística visa apontar os excessos de violência cometidos
    em operações policiais no Complexo da Maré, no Rio de Janeiro. Sua relevância
    visa apontar os direitos negados a população e como essas operações mudam o cotidiano
    do morador de favela.
  originalidade: O trabalho traz dados únicos sobre moradores de favela que o senso
    não cobre e que são importantes para entendermos as mazelas da nossa sociedade.
  metodologia: A metodologia utilizada foi a de pesquisa de dados através da Redes
    da Maré, juntamente com entrevistas de moradores e especialistas.
