- title: Segurança pública é ignorada por 15 bancadas estaduais no envio de emendas
    em 2025
  project_url: https://www1.folha.uol.com.br/cotidiano/2025/05/seguranca-publica-e-ignorada-por-15-bancadas-estaduais-no-envio-de-emendas-em-2025.shtml
  veiculo: Folha de S.Paulo
  autoria: Raquel Lopes e Mateus Vargas
  data: 5/25/2025
  resumo: A reportagem revelou que, em 2025, quinze bancadas estaduais — incluindo
    sete dos dez estados mais violentos do país — não destinaram nenhum recurso para
    a segurança pública por meio de emendas parlamentares, apesar de discursos frequentes
    sobre a importância do tema. A apuração também mostrou que quase metade dos parlamentares
    que integram as comissões de segurança da Câmara e do Senado também não indicaram
    verbas para a área.
  relevância: 'A relevância da reportagem está em expor a contradição entre o discurso
    político e a alocação real de recursos públicos em uma das áreas mais sensíveis
    para a população: a segurança pública. Ao revelar que bancadas de estados com
    altos índices de violência ignoraram completamente o tema no envio de emendas
    parlamentares, o trabalho joga luz sobre a falta de prioridade política no enfrentamento
    da criminalidade. Além de cobrar coerência dos parlamentares, a reportagem contribui
    para o debate público ao mostrar como a distribuição desigual e politicamente
    orientada dos recursos compromete a efetividade das políticas de segurança no
    país.'
  originalidade: A originalidade da reportagem está na análise inédita das emendas
    parlamentares destinadas à segurança pública a partir do recorte das bancadas
    estaduais, algo até então pouco explorado. O trabalho cruzou dados oficiais de
    execução orçamentária com a composição das comissões de segurança da Câmara e
    do Senado, revelando incoerências entre o posicionamento público dos parlamentares
    e suas ações orçamentárias.
  metodologia: A metodologia da reportagem envolveu o levantamento e a análise de
    dados públicos sobre a destinação de emendas parlamentares ao Ministério da Justiça
    e Segurança Pública em 2025. A equipe acessou informações detalhadas por meio
    do sistema Siga Brasil, identificando os valores indicados por bancadas estaduais
    e parlamentares individuais. Esses dados foram cruzados com os índices de violência
    por estado por meio de dados do Fórum Brasileiro de Segurança Pública e com a
    composição das comissões de segurança pública da Câmara e do Senado, permitindo
    identificar incoerências entre os discursos dos parlamentares e suas práticas
    orçamentárias. A apuração foi complementada com entrevistas a especialistas, integrantes
    do governo federal e representantes das bancadas estaduais, garantindo contextualização
    e aprofundamento da análise.
