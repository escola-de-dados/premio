- title: Fumaça de queimadas aumenta casos de síndrome gripal na região metropolitana
    de Manaus
  project_url: https://infoamazonia.org/2025/02/27/fumaca-de-queimadas-aumenta-casos-de-sindrome-gripal-na-regiao-metropolitana-de-manaus/
  veiculo: InfoAmazônia
  autoria: Ana Kelly Franco
  data: 2/27/2025
  resumo: 'Os atendimentos por Síndrome Gripal (SG) nos 13 municípios da região Metropolitana
    de Manaus (RMM) tiveram alta de 23,4% durante julho de 2024, comparado ao mês
    anterior, revela análise da InfoAmazonia. A alta coincide com o fim do inverno
    amazônico em junho, e início da temporada mais seca e das queimadas na Amazônia,
    que tradicionalmente se intensificam a partir de julho.


    A análise, feita com base em dados do Ministério da Saúde, revelam que as notificações
    aumentaram de 3.971 para 4.900 registros, o que também evidencia o padrão sazonal
    que persiste na região.'
  relevância: A Matéria mostra como a fumaça das queimadas tem agravado problemas
    de saúde na Região Metropolitana de Manaus.
  originalidade: Traz dados sobre a Região Metropolitana de Manaus, que muitas vezes
    é esquecido em matérias e pelo poder público.
  metodologia: Análise dos dados abertos do Ministério da Saúde e das queimadas no
    Inpe.
  uf: AM
  tipo_inscricao: Visualização
  formato: Online
  category: Visualização
