- title: Mulheres foram maioria entre candidatos que não receberam votos na última
    eleição municipal
  project_url: https://noticias.r7.com/eleicoes-2024/mulheres-foram-maioria-entre-candidatos-que-nao-receberam-votos-na-ultima-eleicao-municipal-21092024/
  veiculo: Portal R7
  autoria: Edis Henrique Peres
  data: 9/21/2024
  resumo: Com o banco de dados abertos do TSE, levantamos o número de candidatas mulheres
    que receberam 0 votos na última eleição municipal. O levantamento é importante
    porque demonstra que mesmo com a Lei de Cotas, que obriga 30% de vagas para o
    público feminino, alguns partidos encontram formas de driblar a legislação. Isso
    porque, a ausência de votos é um dos indicativos de fraude na cota. Claro que
    também há outros motivos, como desistência da candidatura, número errado e afins.
  relevância: O tema aborda como a Lei de Cotas pode ser driblada e dificultar a presença
    feminina em posições de poder e criação de políticas públicas. O objetivo é mostrar
    como a presença feminina na política ainda é um desafio, já que muitas chegam
    a ser usadas como candidatas laranja
  originalidade: É prática vista quase como comum entre os políticos o uso de candidatas
    mulheres laranjas, para atender a cota. No entanto, ainda não havia sido possível
    analisar esse tipo de dado com base númericas. A reportagem faz um extenso levantamento
    para conseguir mensurar essa realidade.
  metodologia: A coleta de dados foi feita no Portal do TSE, analisando todos os candidatos
    e municípios que tinham recebido zero votos. No entanto, não havia o gênero dos
    candidatos informado nessa tabela, ou seja, após filtrar os candidatos sem votos,
    foi necessário conferir cada um deles e identificá-los como candidatos do sexo
    masculino ou do sexo feminino. No caso de nomes unissex, foi necessário consultas
    em diversas reportagens e bancos para encontrar o candidato.
