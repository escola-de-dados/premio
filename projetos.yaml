- title: '"Vivíamos no esgoto": invasões no Parque do Cocó expõem problemas de habitação
    em Fortaleza'
  project_url: https://mais.opovo.com.br/reportagens-especiais/rio-coco-parque-do-coco-tensoes/2025/05/26/viviamos-no-esgoto-invasoes-no-parque-do-coco-expoem-problemas-de-habitacao-em-fortaleza.html?collection=reportagens_de_dados
  veiculo: O POVO+
  autoria: Ludmyla Barros e Ayuri Reis
  data: 5/26/2025
  resumo: 'A partir de um "passeio" pelo Google Maps, a equipe de reportagem percebeu
    que um enorme corpo d''água dentro dos limites do Parque Estadual do Cocó havia
    sumido, aterrado. O PEC é um território protegido. Após investigações, descobriu-se
    que a água era uma lagoa de resíduos da Cagece, abandonada, e transformada em
    conjunto habitacional, construído pelas mãos da própria população, com pouco ou
    nenhum apoio governamental.

    Com isso, a equipe produziu um levantamento que revelou diversas "violações" no
    curso do Parque do Cocó: de Norte a Sul. A maior parte, não tratando de empreendimentos,
    mas de pequenas moradias e comércios em comunidades. Entre interesses ambientais
    e comunitários, há o abandono em comum'
  relevância: 'O levantamento de dados inédito dá noção prática do problema de habitação
    em Fortaleza. Comunidades estão invadindo áreas protegidas devido ao abandono
    do Estado e da Prefeitura, com os mais diversos órgãos. A reportagem cursou um
    caminho diferente do jornalismo de dados: os dados partiram após o caso concreto
    e, com a junção da visita à comunidade, ao trabalho científico incrementa a cobrança
    quanto aos sérios problemas de habitação em Fortaleza.'
  originalidade: 'O levantamento é inédito. Nunca antes foram mapeadas as áreas violadas
    no curso do Cocó. Pelo menos 25 pontos de invasão foram identificados e apontados
    no material por meio de uma visualização interativa, na ferramenta Flourish. Ou
    seja, não apenas o leitor tem acesso aos dados nunca antes coletados, como pode
    conferir de forma interativa, além de estar embasado por fotos do conjunto, gifs
    do sumiço da Lagoa ao longo dos anos e cards interativos com outras iniciativas
    da própria população.

    Um caso inacreditável traz á tona algo nunca antes apurado: as feridas do Cocó
    que, por sua vez, revelam feridas urbanas.'
  metodologia: "O aterramento da Lagoa foi identificado pelo O POVO, após um habitual\
    \ passeio, pelo Google Maps, através dos anos. As imagens foram compiladas e analisadas\
    \ por Ayuri Reis, estagiário de Ciências de Dados do O POVO+.\n\nAyuri também\
    \ foi responsável por cruzar as informações da pesquisa “Tão Verde Quanto Possível”,\
    \ e dos recursos hídricos de Fortaleza, com as delimitações oficias do Parque\
    \ Estadual do Cocó. No estudo da UFC, a pesquisadora Laymara Xavier-Sampaio catalogou\
    \ desde copas de árvores até grandes manguezais e florestas.\n\nAs informações\
    \ foram incluídas na plataforma Flourish, de visualização de dados. Levantamento\
    \ deu origem ao mapa 01 da reportagem.\n\nMetodologia de dados: \n\nPara esta\
    \ análise, foram utilizados arquivos shapefile contendo os limites geográficos\
    \ de diferentes unidades de conservação e zonas de interesse na bacia do Rio Cocó.\
    \ As principais bibliotecas Python empregadas incluem geopandas para manipulação\
    \ de dados geoespaciais, pandas para análise de dados tabulares associados, matplotlib.pyplot\
    \ para visualização estática de mapas, fiona para leitura e escrita de arquivos\
    \ vetoriais, e shapely.ops para operações geométricas.\n\nAs análises consideraram\
    \ operações como:\n\nLeitura e inspeção de múltiplos arquivos shapefile (ex: DECRETO_Estadual_UC_Parque_do_Coco.shp,\
    \ APA_do_Rio_Coco.shp, ZD_Fortaleza_Decreto_2006.shp, Parque_Natural_Marinho_PBSS.shp).\n\
    Transformação de sistemas de referência de coordenadas (CRS) para garantir a consistência\
    \ nas análises espaciais.\nCálculo de áreas das geometrias (em km² ou hectares).\n\
    Dissolução de geometrias para unificar polígonos de uma mesma categoria.\nRealização\
    \ de uniões geométricas (unary_union) para criar geometrias compostas.\nIdentificação\
    \ e cálculo de áreas de interseção entre diferentes camadas geoespaciais (ex:\
    \ sobreposição entre o Parque do Cocó e a APA do Rio Cocó).\nVisualização das\
    \ camadas geoespaciais e suas sobreposições através de plots.\nPara garantir a\
    \ transparência e a reprodutibilidade desta e de outras reportagens guiadas por\
    \ dados, O POVO+ mantém uma página no Github na qual periodicamente são publicados\
    \ códigos, metodologias, visualizações e bases de dados desenvolvidas.\n\n\U0001F4D1\
    \ Fonte dos Dados\nArquivos de dados geoespaciais (Shapefiles):\nDECRETO_Estadual_UC_Parque_do_Coco.shp\
    \ (Delimitação do Parque Estadual do Cocó conforme decreto estadual)\nAPA_do_Rio_Coco.shp\
    \ (Delimitação da Área de Proteção Ambiental do Rio Cocó)\nZD_Fortaleza_Decreto_2006.shp\
    \ (Delimitação das Zonas de Dunas de Fortaleza conforme decreto de 2006)\nParque_Natural_Marinho_PBSS.shp\
    \ (Delimitação do Parque Natural Marinho da Pedra da Risca do Meio ou similar,\
    \ se \"PBSS\" for um acrônimo para tal)\n(Outros shapefiles que possam ter sido\
    \ mencionados ou inferidos pela análise no notebook, como limites municipais ou\
    \ outras camadas de zoneamento.)\nInformações analisadas incluem: Geometrias dos\
    \ polígonos, atributos associados (como nome da unidade, tipo, legislação), cálculo\
    \ de áreas e áreas de sobreposição.\n\n\nLink para Github: https://github.com/opovo-mais/jornalismodedados/blob/main/README.md"
