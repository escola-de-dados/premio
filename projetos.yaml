- title: Como produto de trabalho escravo vai parar na sua calçada
  project_url: https://www.bbc.com/portuguese/articles/c20xkrxny32o
  veiculo: BBC News Brasil
  autoria: Luiz Fernando Toledo, Vitor Serrano, Caroline Souza
  data: 4/9/2025
  resumo: '1. Ao menos oito estados brasileiros tiveram obras públicas para pavimentação
    com uso de pedras produzidas por trabalhadores em situação análoga à escravidão,
    segundo levantamento de dados feito pelo repórter


    2. Cerca de 200 contratos públicos foram firmados com essas empresas segundo levantamento
    feito pelo repórter


    3. Boa parte desses contratos possui verba pública da Caixa, por meio de emendas
    parlamentares


    4. Em alguns casos, o prefeito da cidade está diretamente envolvido, como sócio
    oculto da empresa que faz as obras; revelamos, em uma cidade, que o prefeito fazia
    os pagamentos aos trabalhadores da pedreira em dinheiro vivo, em sua casa;


    5. Algumas das maiores construtoras do nordeste estão envolvidas no escândalo


    6. Uma dessas construtoras é de parentes de um senador; seu sócio virou réu por
    empregar trabalho escravo


    7. Disputa por obras de pavimentação virou principal arma política de prefeitos
    em municípios menores no Brasil;


    8. Prefeitos não fiscalizam cadeia produtiva e permitem que casos de trabalho
    escravo aconteçam; nos casos revelados pela reportagem eles dizem nunca ter ouvido
    falar dos abusos até que fossem entrevistados


    9. No caso das emendas parlamentares, descobrimos que o dinheiro vinha de forma
    oculta para o município, pelo chamado orçamento secreto


    10. Conseguimos rastrear a origem do dinheiro de uma das obras. Veio do presidente
    da Câmara dos Deputados do Brasil, que também foi homenageado na cidade, pessoalmente,
    por sua contribuição à construção das calçadas. A votação dele na região disparou
    depois que começou o apoio'
  relevância: 'É a primeira reportagem a revelar o uso de mão de obra escrava em obras
    de pavimentação em escala, com levantamento extenso de dados e documentos, investigação
    em campo e rastreamento da origem de recursos. A reportagem levou a Caixa a pedir
    esclarecimentos aos municípios e a diversas prefeituras abrirem sindicâncias para
    apurar os contratos. A CGU também disse que irá apurar os contratos de repasse
    a essas cidades. A reportagem teve uma segunda parte, desdobramento da apuração,
    que explica especificamente o uso de emendas parlamentares: https://www.bbc.com/portuguese/articles/c1drv0wkr9ro

    A reportagem expõe também fragilidades da própria fiscalização, pois é mostrado
    que o autuado é um mero intermediário da cadeia produtiva, sem qualquer poder
    político ou financeiro. Já o dono da empresa de um dos casos explorados na reportagem
    continua com contratos públicos na mesma prefeitura.'
  originalidade: 'Nunca foi feita qualquer reportagem sobre o tema que tenha explicado
    o problema de maneira complexa, relacionando emendas parlamentares, apoio político
    local, terceirização de mão de obra. Como explicado anteriormente, a reportagem
    identificou padrões de irregularidades que agora são apurados pelos órgãos envolvidos
    - prefeituras, secretarias estaduais (no caso do Piauí) e governo federal (Caixa
    e CGU).

    A reportagem também subsidiou um documentário que ainda está sendo produzido.

    Outro ponto que destaco é o de como a reportagem relacionado esses fatos descobertos
    a uma das obras mais adoradas dos brasileiros no cinema, O Auto da Compadecida.
    A reportagem demonstra que boa parte dos elementos mostrados na ficção se repete
    na realidade. No segundo filme um dos vilões e candidato a prefeito aparece em
    cena com a promessa de asfaltar a cidade, exatamente como na vida real.'
  metodologia: "A apuração parte da raspagem, por meio de Python, de 3 mil relatórios\
    \ de infração por trabalho escravo que estão hospedados no site do Ministério\
    \ de Trabalho e Emprego (vale ressaltar que esses documentos só estão lá depois\
    \ de insistentes pedidos de informação via LAI para que o governo os abrisse em\
    \ transparência ativa, por meses).\nEsses relatórios são então arquivados na ferramenta\
    \ Google Pinpoint para categorização. São definidas palavras-chave relacionadas\
    \ a pedreiras e depois a pesquisa é incrementada com termos relacionados à licitações,\
    \ poder público, prefeituras, obras de pavimentação. Com isso chegamos a cerca\
    \ de 100 relatórios, que são analisados individualmente. \nPor fim é montada uma\
    \ planilha com cada caso de trabalho escravo e a reportagem parte então em busca\
    \ de todos os contratos públicos que aquela empresa possui ou possuiu. Buscas\
    \ em diários oficiais, ferramenta Querido Diário (Open Knowledge), portais de\
    \ transparência. Com todos os resultados em mão escolhemos um caso exemplar, da\
    \ Paraíba, e vamos a campo para acompanhar uma semana de operações de resgate\
    \ de trabalhadores.\nA partir da publicação da primeira matéria nós percebemos\
    \ mais um padrão: o de que boa parte das obras tinha como origem uma emenda parlamentar\
    \ do orçamento secreto, sem atribuição definida. Lançamos então uma segunda apuração\
    \ para descobrir de onde estava vindo o dinheiro e quem se beneficiou politicamente\
    \ de tais obras. https://www.bbc.com/portuguese/articles/c1drv0wkr9ro\nNessa segunda\
    \ parte foi usada uma ferramenta de inteligência artificial, o Google Notebook\
    \ LM, para destrinchar todas as entrevistas em vídeo dadas pela prefeita de uma\
    \ das cidades analisadas, Juazeirinho, em busca de evidências de que ela e o deputado\
    \ federal Hugo Motta foram beneficiados politicamente pelas emendas. A ferramenta\
    \ foi crucial para ajudar na apuração, pois agilizou a pesquisa nos vídeos - que\
    \ depois foram checados manualmente. \nDestaco ainda outro elemento de uso de\
    \ dados na investigação: nós raspamos os dados das contas de Instagram da prefeita\
    \ e do deputado federal por meio do Apify (uma API paga) e então filtramos todas\
    \ as menções a pavimentação. Com isso conseguimos encontrar um vídeo antigo em\
    \ que o próprio Hugo Motta é homenageado em uma sessão solene na Câmara de uma\
    \ das cidades que empregaram trabalho escravo. Há até mesmo a inserção do nome\
    \ dele em uma placa com o nome das ruas pavimentadas, as mesmas do contrato com\
    \ a empresa que usou trabalho escravo."
