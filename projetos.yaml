- title: 'Do acolhimento à adoção: Mais de 600 crianças e adolescentes vivem em lares
    na Bahia'
  project_url: https://www.bahianoticias.com.br/noticia/300270-do-acolhimento-a-adocao-mais-de-600-criancas-e-adolescentes-vivem-em-lares-na-bahia
  veiculo: Bahia Notícias
  autoria: Eduarda Pinto
  data: 1/14/2025
  resumo: Esta reportagem utiliza dados sobre o número de crianças em unidades de
    acolhimento na Bahia, seja aquelas que esperam a adoação ou não. Por meio dos
    dados do IBGE (Instituto Brasileiro de Geografia e Estatística) sobre moradores
    de residências coletivas e a entrevista com uma defensora pública é possível compreender
    a realidade dessas crianças e jovens e o funcionamento da máquina pública nesse
    processo.
  relevância: O tema da vulnerabilidade de crianças e jovens na sociedade baiana é,
    por si só, relevante, mas pouco explorado pelo jornalismo cotidiano. Além disso,
    a reportagem possui um posicionamento educativo e até sensibilizador sobre o tema.
  originalidade: O texto aborda um novo lado do tema da adoção/abandono infantojuvenil,
    que é a vivência, convivência e realidade vivida por crianças e jovens nas unidades
    de acolhimento. Nesta reportagem, o dados dão margem para analise mais aprofundada
    do cenário social e os números são corroborados pela entrevista com uma especialista,
    que contextualiza o material.
  metodologia: Foram utilizados dados encontrados na plataforma do IBGE, Sidra (https://sidra.ibge.gov.br/home/ipp/brasil),
    por meio da Tabela 9869, sobre moradores de domicílios coletivos
