- title: Em luta pela educação indígena, etnias ocupam secretaria em Belém
  project_url: https://www.amazonialatitude.com/2025/01/23/luta-educacao-indigena-ocupam-secretaria-belem/
  veiculo: Revista Amazônia Latitude
  autoria: Elielson Almeida - repórter / Glauce Monteiro - editora de texto / Alice
    Palmeira - Montagem de página / Marcos Colón - supervisão
  data: 1/23/2025
  resumo: 'Entre janeiro e fevereiro de 2025, povos indígenas de diversas etnias protagonizaram
    uma das mais marcantes mobilizações por direitos educacionais no estado do Pará:
    a ocupação da sede da Secretaria de Estado de Educação (Seduc), em Belém, que
    durou mais de dez dias. A reportagem inscrita acompanhou e documentou, em tempo
    real, os desdobramentos desse ato histórico de resistência, revelando violações
    de direitos, repressão institucional e o impacto direto da nova legislação educacional
    sobre as comunidades indígenas.


    A motivação central do protesto foi a aprovação da Lei nº 10.820, conhecida como
    Nova Lei do Magistério, que foi sancionada no fim de 2024 sem qualquer consulta
    prévia aos povos indígenas, desrespeitando a Convenção 169 da OIT. A nova legislação
    extinguiu o Sistema Modular de Ensino Indígena (Somei) – uma política pública
    criada em 1982 que havia garantido educação presencial e contextualizada em aldeias
    remotas – e a substituiu por um modelo centrado no ensino à distância, mesmo em
    territórios sem internet, energia elétrica ou infraestrutura básica.


    A reportagem mostrou como a nova lei afetou diretamente as condições de trabalho
    dos professores indígenas, que passaram a perder gratificações e apoio logístico,
    resultando em salas de aula vazias e no retorno de muitas crianças à exclusão
    escolar. Além disso, revelou as estratégias de resistência adotadas pelas lideranças
    indígenas, como a montagem de espaços de cuidado para crianças durante a ocupação,
    a realização de assembleias democráticas e a articulação com movimentos quilombolas,
    organizações da sociedade civil e a sociedade urbana para ampliar a mobilização.


    Durante a cobertura, foram registradas tentativas de repressão por parte do governo,
    incluindo o corte de luz e o uso de spray de pimenta contra os manifestantes.
    Mesmo assim, os indígenas mantiveram a ocupação de forma pacífica, limpa e organizada,
    demonstrando maturidade política e força coletiva.


    A reportagem também expôs as manobras de setores alinhados ao governo para esvaziar
    o movimento, como a convocação de lideranças sem representatividade e a divulgação
    de ações simbólicas vazias de compromisso concreto. Diante disso, os manifestantes
    reafirmaram que não deixariam o local sem a revogação da lei e a exoneração do
    secretário de educação Rossieli Soares, acusado de promover retrocessos e desrespeitar
    os povos originários.


    O trabalho jornalístico inscrito destacou-se pela apuração em campo, pela escuta
    qualificada de vozes indígenas, pela contextualização histórica do Somei e pela
    abordagem crítica e sensível às violências institucionais denunciadas. Ao acompanhar
    a ocupação dia a dia, o material registrou um momento emblemático da luta indígena
    por educação de qualidade, protagonismo político e respeito aos seus modos de
    vida.'
  relevância: 'A reportagem teve papel fundamental ao registrar, com profundidade
    e sensibilidade, uma mobilização histórica dos povos indígenas do Pará em defesa
    de seus direitos educacionais. Ao acompanhar in loco a ocupação da Secretaria
    de Estado de Educação, o trabalho deu visibilidade a uma pauta silenciada nos
    grandes meios de comunicação: os impactos da revogação do Sistema Modular de Ensino
    Indígena (Somei) e a imposição de uma nova lei que desconsiderou o direito à consulta
    prévia, previsto na Convenção 169 da OIT.


    O material jornalístico revelou violações graves de direitos humanos, como o corte
    do acesso à educação presencial em aldeias, a precarização do trabalho docente
    indígena e a tentativa de desmobilização do movimento por vias institucionais
    e coercitivas. Ao mesmo tempo, destacou a força política dos povos originários,
    sua capacidade de articulação e os modos autônomos de organização durante o protesto.


    A relevância da reportagem está na combinação entre cobertura em tempo real, escuta
    direta de lideranças indígenas, contextualização histórica das políticas públicas
    envolvidas e denúncia fundamentada de retrocessos. Em um cenário de avanço de
    políticas anti-indígenas, o trabalho contribuiu para informar a sociedade, pressionar
    autoridades e fortalecer o debate público sobre o direito à educação indígena
    diferenciada, inclusiva e territorializada.


    Mais do que informar, a reportagem cumpriu sua função social ao dar voz a quem
    historicamente foi silenciado e ao documentar um momento decisivo na luta por
    justiça e dignidade dos povos originários no Brasil.'
  originalidade: "A reportagem se destacou pela abordagem inédita e pelo acesso direto\
    \ a uma mobilização indígena que não havia sido coberta por veículos da grande\
    \ imprensa. A equipe acompanhou presencialmente toda a ocupação da Secretaria\
    \ de Educação do Pará, registrando em tempo real as falas, estratégias e reivindicações\
    \ dos próprios indígenas, não por mediação institucional, mas a partir da escuta\
    \ direta nas assembleias, rodas de conversa e rituais. \n\nOutro aspecto original\
    \ foi a abordagem nos impactos da política educacional sobre a vida cotidiana\
    \ nas aldeias, com a coleta de depoimentos exclusivos de professores e lideranças\
    \ de etnias diversas, e a discussão de como a revogação do Somei afetou seus modos\
    \ de vida e seus direitos. \n\nAlém disso, a reportagem articulada em múltiplos\
    \ formatos narrativos  (texto, fotografia e vídeos) para construir uma narrativa\
    \ sensível, respeitosa e politicamente potente. Em vez de uma cobertura convencional\
    \ centrada no conflito, o trabalho priorizou a pedagogia da escuta, registrando\
    \ os sujeitos indígenas como protagonistas e fontes de conhecimento. \n\nEssa\
    \ combinação de presença no território, escuta ativa e abordagem decolonial confere\
    \ ao material um caráter original, tanto do ponto de vista temático quanto da\
    \ metodologia jornalística empregada."
  metodologia: A reportagem foi realizada com presença no território, acompanhando
    presencialmente a ocupação da Secretaria de Educação pelos indígenas. A escuta
    direta, sem mediação institucional, foi central. A equipe registrou assembleias,
    rituais e falas das lideranças, combinando anotações, entrevistas, fotos e vídeos
    para construir uma narrativa sensível, centrada nos protagonistas indígenas.
