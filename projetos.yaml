- title: Vereadores pelo país tentam barrar o acesso ao aborto legal
  project_url: https://azmina.com.br/reportagens/vereadores-pelo-pais-tentam-barrar-o-acesso-ao-aborto-legal/
  veiculo: Revista AzMina
  autoria: Maria Paula Monteiro
  data: 3/13/2025
  resumo: "A reportagem \"Vereadores pelo país tentam barrar o acesso ao aborto legal”\
    \ traça um panorama das frentes contrárias aos direitos reprodutivos nas câmaras\
    \ municipais das capitais do país a partir de dados abertos. Entre 2017 e 2025,\
    \ foram protocolados 103 projetos de lei que mencionam “aborto” ou “nascituro”,\
    \ cerca de 67% têm o objetivo de restringir o acesso ao aborto legal, e muitos\
    \ são considerados inconstitucionais. \nVereadores propuseram medidas que dificultam\
    \ o acesso ao aborto legal, como: obrigar a ouvir batimentos cardíacos do feto\
    \ e notificações compulsórias dos abortos à Secretaria de Saúde ou à polícia,\
    \ exigências classificadas como violação dos direitos humanos, conforme precedentes\
    \ do Comitê de Direitos Humanos da ONU. Entre as capitais mais ativas na pauta,\
    \ o Rio de Janeiro lidera com 15 propostas, depois Fortaleza com 13 e São Paulo\
    \ com 11. A capital paulista é a única onde há mais projetos em defesa do aborto\
    \ legal do que restritivos. Para a apuração foi utilizada a Lei de Acesso à Informação\
    \ (LAI) e os sites oficiais das Câmaras."
  relevância: "A matéria aborda um tema super atual: o impacto direto da atuação de\
    \ políticos contrários aos direitos reprodutivos na vida de mulheres e meninas.\
    \ O aborto legal é um direito garantido por lei que frequentemente sofre ameaças,\
    \ com projetos de lei e tentativas de obstrução de acesso.  As situações nas quais\
    \ a interrupção voluntária da gravidez é descriminalizada foram instituídas em\
    \ âmbito federal, portanto são válidas para todos os municípios do Brasil e todas\
    \ as brasileiras, mas isso não impede que vereadores tentem aprovar leis que estabelecem\
    \ obstáculos e ampliam estigmas. Expor esse cenário é evidenciar como essas propostas\
    \ impactam especialmente mulheres em situação de vulnerabilidade, como meninas\
    \ vítimas de estupro, mulheres negras e indígenas. \nO texto mostra ainda que\
    \ o aborto legal também enfrenta barreiras na prática, como a falta de estrutura\
    \ em cidades do interior e o medo dos profissionais em atender os casos.\nA reportagem\
    \ revela que em muitas cidades o aborto virou palco de disputa política, sem considerar\
    \ as mulheres e meninas que precisam do procedimento. A partir desse entendimento\
    \ é possível pensar em políticas públicas para amparar as pessoas que precisam,\
    \ garantir os direitos reprodutivos e constitucionais dos cidadãos."
  originalidade: "A matéria traz uma abordagem original porque cobre o problema regionalmente\
    \ com base em dados exclusivos, além de apontar as estratégias utilizadas por\
    \ vereadores antidireitos.  \nO acesso ao aborto legal é geralmente trazido em\
    \ coberturas nacionais, mas essa matéria cobre as articulações para dificultarem\
    \ o acesso de forma sistemática. Vereadores estão tentando interferir em um tema\
    \ que não é de sua competência legal, produzindo como resultado a estigmatização\
    \ de quem busca acessar o aborto legal.\nAlém disso, a equipe do AzMina fez um\
    \ mapeamento exclusivo de mais de 100 projetos de lei sobre aborto em Câmaras\
    \ Municipais desde 2017. A reportagem ainda aponta cidades, nomes de parlamentares,\
    \ partidos e o teor exato de algumas propostas, muitas delas baseados em suposições\
    \ que já foram desmentidos pela ciência e pela Organização das Nações Unidas.\
    \  Dar nome e “endereço”, evita a generalização e contribui para a responsabilização\
    \ política."
  metodologia: A reportagem coletou todos os projetos de lei das capitais do país
    que mencionassem e tratassem diretamente sobre “aborto” ou “nascituro”, entre
    os anos de 2017 e 2024. A coleta aconteceu em janeiro de 2025, por meio dos sites
    oficiais das Câmaras Municipais e via Lei de Acesso à Informação. Todos os projetos
    foram tabulados para identificar a cidade, o autor da matéria, ano e tramitação.
    Além disso, foram classificados também se são projetos que buscam garantir ou
    restringir o acesso à interrupção legal da gestação, seja com a promoção de uma
    alteração legal ou em busca de movimentar o debate público. Pode haver projetos
    que tratam de direitos sexuais e reprodutivos que não foram mapeados na reportagem
    por não mencionarem os termos “aborto” ou “nascituro”, filtro inicial da coleta
    de dados.
