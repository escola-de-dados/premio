- title: Justiça expõe nomes de mulheres e crianças vítimas de estupro e violência
    doméstica em mandados de prisão
  project_url: https://g1.globo.com/politica/noticia/2025/06/01/contra-a-lei-justica-expoe-nomes-e-enderecos-de-criancas-e-mulheres-vitimas-de-estupro-e-violencia-domestica.ghtml
  veiculo: Portal g1
  autoria: Judite Cypreste
  data: 6/1/2025
  resumo: 'A reportagem revelou que 120 mulheres e crianças vítimas de estupro, violência
    doméstica e tentativas de feminicídio tiveram seus nomes expostos ilegalmente
    pela Justiça brasileira em mandados de prisão disponíveis publicamente no Banco
    Nacional de Mandados de Prisão (BNMP). Em alguns casos, além do nome, a Justiça
    também estava expondo os detalhes de abusos sexuais e agressões sofridos por essas
    vítimas. O g1 analisou 123 mil documentos e identificou graves violações ao sigilo
    previsto em lei, com vítimas citadas nominalmente em ordens expedidas por 19 tribunais
    de Justiça. Além de revelar a exposição, a investigação mostrou uma incongruência
    do principal órgão do Judiciário brasileiro: enquanto o CNJ expõe nomes de vítimas,
    nega o acesso público a informações fundamentais para identificar procurados pela
    Justiça, como o número do CPF dos foragidos.


    Para realizar o levantamento, foi necessário aplicar técnicas de programação para
    extrair dados não estruturados, utilizar inteligência artificial na triagem automatizada
    dos casos e, em seguida, fazer uma checagem manual dos documentos para comprovar
    as violações. A metodologia foi publicada em um material à parte, com transparência
    para o leitor.


    Após a publicação, diversos tribunais anunciaram investigações, correções de mandados
    e revisões de seus fluxos internos. O CNJ também se manifestou oficialmente, afirmando
    que reforçará as orientações às cortes estaduais para evitar novos casos de exposição
    de vítimas.'
  relevância: 'A reportagem denuncia uma violação institucional dos direitos de vítimas
    de crimes sexuais e de violência doméstica, cujos dados deveriam estar sob sigilo
    segundo a legislação. Para especialistas ouvidos, o erro dos tribunais representa
    uma forma de revitimização promovida pelo próprio Estado, que deveria zelar pela
    proteção dessas pessoas após os crimes sofridos.


    Além de revelar a exposição, o trabalho também evidenciou uma grave incoerência
    nas práticas de transparência adotadas pelo Conselho Nacional de Justiça: ao mesmo
    tempo em que o CNJ nega acesso à totalidade dos dados contidos nos mandados, como
    o número de CPF de pessoas procuradas, o mesmo órgão expõe informações sensíveis
    de vítimas protegidas por lei.'
  originalidade: 'Embora casos pontuais de exposição de vítimas já tenham sido abordados
    anteriormente pela imprensa, inclusive por esta repórter, esta investigação se
    diferencia por revelar a extensão sistêmica do problema com base em uma análise
    de grande escala. Pela primeira vez, foram aplicadas técnicas de inteligência
    artificial para rastrear nomes de vítimas em 123 mil mandados de prisão públicos,
    com foco em crimes que exigem sigilo legal. O uso de IA permitiu uma primeira
    triagem que foi posteriormente validada por checagem manual caso a caso, o que
    resultou na identificação de 120 mandados com exposição indevida. A investigação
    também ampliou o escopo da denúncia: não se restringe a casos envolvendo crianças,
    mas abrange diversas formas de violência de gênero, como estupro, violência doméstica
    e tentativas de feminicídio.'
  metodologia: "Durante três meses, o g1 coletou e analisou dados do Banco Nacional\
    \ de Mandados de Prisão (BNMP), mantido pelo Conselho Nacional de Justiça (CNJ).\
    \ A plataforma oficial oferece apenas dois modos de acesso: o primeiro, por meio\
    \ de consultas individuais de cada mandado em formato PDF, que contém informações\
    \ relevantes como o número do CPF e a Síntese da Decisão (campo onde se encontravam\
    \ as violações encontradas); o segundo, por meio de download em lote de planilhas,\
    \ que não incluem esses campos. \n\nPara viabilizar a análise em larga escala,\
    \ foi criado um raspador em Python que acessava uma API não documentada publicamente,\
    \ permitindo a extração automatizada dos documentos completos.\n\nCom o avanço\
    \ da apuração, o CNJ reformulou o sistema e impôs novas barreiras de acesso, o\
    \ que inviabilizou a continuidade da raspagem e impediu a obtenção dos dados dos\
    \ estados de São Paulo e Tocantins. Ainda assim, a coleta conseguiu reunir cerca\
    \ de 123 mil mandados, dos quais 7 mil estavam relacionados a crimes que exigem\
    \ sigilo legal, como estupro, estupro de vulnerável, importunação sexual e violência\
    \ doméstica.\n\nPara identificar exposições ilegais de vítimas, foi utilizado\
    \ o ChatGPT com prompts e exemplos de linguagem que treinaram a ferramenta a reconhecer\
    \ padrões de violação, como a menção a nomes próprios e trechos com relatos sensíveis.\
    \ Essa etapa de triagem com inteligência artificial indicou os documentos com\
    \ maior potencial de violação, que foram então verificados manualmente, um a um.\
    \ O processo resultou na identificação de 120 mandados com exposição indevida\
    \ de mulheres, crianças e adolescentes.\n\nTodos os tribunais envolvidos e o próprio\
    \ CNJ foram acionados pela reportagem antes da publicação. Alguns órgãos negaram\
    \ inicialmente a possibilidade de erro, o que revela o desconhecimento institucional\
    \ sobre as falhas. Após o envio de cópias dos documentos, vários tribunais admitiram\
    \ o problema, anunciaram medidas corretivas e reforço de orientações internas.\
    \ O CNJ também se manifestou oficialmente sobre o caso. As respostas dos tribunais\
    \ foram publicados a parte: https://g1.globo.com/politica/noticia/2025/06/02/tribunais-apuram-exposicao-de-nomes-de-vitimas-cnj-diz-que-erros-podem-ser-levados-a-corregedoria-nacional.ghtml\n\
    \nA metodologia completa também foi publicada em uma reportagem complementar:\
    \ https://g1.globo.com/politica/noticia/2025/06/01/vitimas-expostas-como-o-g1-descobriu-que-justica-divulgou-nomes-de-criancas-e-mulheres-vitimas-de-estupro-e-violencia-domestica.ghtml"
